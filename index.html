フロー計算書に類似するといえる。"],"k":["総額表示","純額表示","直接法","間接法"],"kg":[{"l":"","w":["総額表示","純額表示","直接法","間接法"]}],"e":["次の〔資料〕はＡ社の当期の財務データの要約である。これを用いて，キャッシュ・フロー計算書，資金移動表，資金運用表を作成すると，次頁以降の図表７-11～７-13のようになる。営業活動によるキャッシュ・フローに相当する金額の表示方法について，資金移動表が直接法によるキャッシュ・フロー計算書に，資金運用表が間接法によるキャッシュ・フロー計算書に類似することが確認できよう。〔資料〕","販売費及び一般管理費600棚卸資産68072040","受取利息・配当金120有形固定資産1,3501,36010","投資有価証券売却損50資産計3,6504,200550","支払配当金180負債・純資産計3,6504,200550","有形固定資産410税引前当期純利益600","投資有価証券150減価償却費240","固定資金の余剰70","合計1,050合計1,050","棚卸資産の増加40運転資金の不足120","運転資金の不足120固定資金の余剰70","合計400合計400","図表７-14Ｃ/Ｓ(間接法)と資金運用法の表示区分の比較"],"f":"p2_7-9.webp","p":""},{"id":"7-10","b":"p2","c":7,"n":10,"t":"事業の発展ステージとキャッシュ・フローの関係","i":"B","y":"A","q":["一般的な状況を想定した場合，事業の①創生期と②成長期において，キャッシュ・フロー計算書における各計算区分の正負はどうなると考えられるか。正負の別を示した上で，その理由を簡潔に説明しなさい。"],"a":["①創生期","・営業活動によるキャッシュ・フロー（負）","事業開始当初は製品やサービスの売上高があまり大きくなく，人件費やそ","の他の経常的費用の支出を賄えないためである。","・投資活動によるキャッシュ・フロー（負）","事業の開始に当たって，設備投資等によるインフラの整備が必要になるた","めである。","・財務活動によるキャッシュ・フロー（正）","営業キャッシュ・フローのマイナスを補填するための資金やインフラ整備","のための支出を借入等で賄うためである。","②成長期","・営業活動によるキャッシュ・フロー（正）","事業が軌道に乗り，製品やサービスの売上高が伸び，人件費やその他の経","常的費用の支出を賄えるようになるためである。","・投資活動によるキャッシュ・フロー（負）","さらなる事業の拡大，成長を目指し，旺盛な投資需要があるためである。","・財務活動によるキャッシュ・フロー（正）","営業活動によるキャッシュ・フローがプラスであっても，それ以上に投資","のための資金需要が多く，これを賄う必要があるためである。"],"k":["売上高","経常的支出","インフラ整備","投資需要","借入"],"kg":[{"l":"","w":["売上高","経常的支出","インフラ整備","投資需要","借入"]}],"e":["キャッシュ・フロー計算書には３つの計算区分があり，それぞれのキャッシュ・フローについて正負の２つのパターンが考えられる。したがって，各計算区分におけるキャッシュ・フローの正負のパターンの組合せは，以下の図表７-16に示すように２＝８通りということになる。","また，本問では企業の創生期と成長期について検討したが，成熟期と衰退期についても触れておく。成熟期においては，「営業面の成長は緩やかに継続するが，投資活動の規模は縮小し，豊富な資金を配当金の拡充や負債の圧縮に充てる」という状況が想定され，表中のＣのパターン(営業活動：＋，投資活動：＋，財務活動：－)が該当する。また，衰退期においては，「営業活動が縮小する一方，引き続き設備等の縮小を進め，負債の圧縮や株主への利益還元を更に進める」という状況が想定され，表中のＤのパターン(営業活動：－，投資活動：＋，財務活動：－)が該当する。","以上より，事業の発展ステージとキャッシュ・フローの関係を図示すると，図表７-17のようになる。"],"f":"p2_7-10.webp","p":""},{"id":"8-1","b":"p2","c":8,"n":1,"t":"差額原価と埋没原価","i":"A","y":"B","q":["意思決定のための差額原価収益分析においては，差額原価と埋没原価の分類が重要となるが，それぞれどのような原価であるかを説明しなさい。"],"a":["差額原価とは，特定の代替案を選択する結果として追加的に生じる貨幣犠牲額をいい，現実のキャッシュ・アウトフローを伴う現金支出原価と，これを伴わない機会原価から構成される。","一方，埋没原価とは，特定の代替案を選択する結果として，その発生額が全く影響を受けない原価であり，意思決定上考慮外とすべき原価をいう。"],"k":["貨幣犠牲額","キャッシュ・アウトフロー","現金支出原価","機会原価"],"kg":[{"l":"","w":["貨幣犠牲額","キャッシュ・アウトフロー","現金支出原価","機会原価"]}],"e":["差額原価収益分析とは意思決定のための原価計算であり，意思決定に役立つ会計情報を提供する役割を担っている。ここで，意思決定のプロセスとは問題解決のプロセスであり，次のようなステップからなる。","このうち，差額原価収益分析を行うのは③のステップであり，出来るだけ多くの要因を数量的に測定・評価すべきである。ただし，現実の意思決定問題においては定量化できない要因も少なくないため，④のステップが必要となる。すなわち，差額原価収益分析に基づく会計情報は，意思決定を行うための情報の１つに過ぎず，その他の定性的な要因をも考慮して代替案の選択が行われるということに注意しなければならない。","ここで，差額原価収益分析においては，差額原価(differentialcosts)と埋没原価(sunkcosts)の分類が重要となる。意思決定に関連しない埋没原価を含めて分析を行えば，誤った意思決定を導く恐れがあるからである。ここで，差額原価の本質は未来原価であり，将来において現実のキャッシュ・アウトフローを伴う現金支出原価と，ある代替案を採用することによって断念した機会から得られたはずのキャッシュ・インフローを測定した機会原価から構成される。一方，埋没原価の本質は支出済みの過去原価であり，発生額が代替案選択の影響を受けないという特徴がある。","なお，差額原価・埋没原価とよく似た概念に，関連原価(relevantcosts)・無関連原価(irrelevantcosts)がある。厳密には，前者の区別が測定概念であり，後者の区別が認識概念であるとされるが，ほぼ同義で用いられることが多い(図表８-１)。また，意思決定の結果増加する差額原価を増分原価，減少する差額原価を減分原価といい，活動量などの１単位の変化に対しての原価の変化額を限界原価という。これらは，差額原価の下位概念である。一方，差額原価の構成要素である機会原価に類似の概念として，付加原価がある。"],"f":"p2_8-1.webp","p":""},{"id":"8-2","b":"p2","c":8,"n":2,"t":"機会原価と機会損失の相違","i":"B","y":"B","q":["機会原価と機会損失をそれぞれ定義した上で，両者の相違について説明しなさい。"],"a":["機会原価とは，特定の代替案を選択する結果として断念した機会から得られたはずの最大の利益額(キャッシュ・インフロー)をいう。","一方，機会損失とは，本来選択すべきでない代替案を選択してしまった場合に，本来選択すべきであった代替案との比較において被る逸失利益をいう。","つまり，機会原価が必要不可避のコストであるのに対し，機会損失は回避すべきロスであるという点において相違する"],"k":["最大の利益額","必要不可避","誤った選択","逸失利益","回避すべき"],"kg":[{"l":"","w":["最大の利益額","必要不可避","誤った選択","逸失利益","回避すべき"]}],"e":["機会原価(opportunitycosts)と機会損失(opportunityloss)は混同されがちであるが，厳密には両者は全く異なる概念である。","いま，相互排他的なＡ，Ｂ，Ｃの３つの代替案があり，それぞれの利益額を120万円，100万円，80万円と仮定する。この場合，最も有利な代替案がＡ案であることは明らかであるが，Ａ案の選択は，Ｂ案およびＣ案の断念を意味する。そこで，Ａ案を選択する結果として断念した機会から得られたはずの最大の利益額，すなわち，Ｂ案の利益額100万円を機会原価という。一方，本来Ａ案を選択すべきであるにもかかわらず，次善のＢ案を選択した場合，Ａ案を選択した場合と比べて利益額が20万円だけ減少することになる。これを機会損失という。つまり，Ｂ案の利益額100万円の断念は最善のＡ案を選択するために必要なコストであるが，Ａ案とＢ案の利益額の差額20万円の逸失は，誤った選択の結果として被る回避すべきロスであり，両者は明確に区別されなければならない(図表８-２)。","なお，機会原価は貢献利益で評価することが多いが，これは，ある代替案を断念する場合に，売上高(ＣＩＦ)を失う一方で，変動費(ＣＯＦ)を回避しうるためである。つまり，貢献利益で評価することにより，逸失したキャッシュ・インフローを純額で計算しているのである。","Ａ案を選択した場合の機会原価：100(Ｂ案：次善)","Ｂ案を選択した場合の機会損失：100(Ｂ案：次善)－120(Ａ案：最善)＝△20"],"f":"p2_8-2.webp","p":""},{"id":"8-3","b":"p2","c":8,"n":3,"t":"総額法と差額法","i":"B","y":"B","q":["意思決定のための差額原価収益分析の方法には総額法と差額法がある。そこで，差額法のメリットとデメリットを説明した上で，その利用方法について提案しなさい。"],"a":["差額法では代替案間の差額のみを把握するため，総額法よりも分析に必要な情報が少なくてすみ，総額法が要求するだけのデータがない場合にも適用可能であるというメリットがある。また，代替案間で相違する部分に焦点を当てるため，経営管理者に理解されやすいというメリットもある。ただし，差額のみを把握しようとする結果として，重要なキャッシュ・フローを見落としやすいというデメリットがある。","以上より，分析自体は総額法，経営管理者への報告は差額法によるのがよいといえる。"],"k":["経営管理者","理解","重要なキャッシュ・フロー","分析","報告"],"kg":[{"l":"","w":["経営管理者","理解","重要なキャッシュ・フロー","分析","報告"]}],"e":["いま，Ａ地点からＣ地点への移動を予定しており，移動手段について甲案と乙案の２案があるものとする(図表８-４)。より安価な移動手段が甲案であることは明らかであるが，その結論を導く方法には総額法と差額法がある。","総額法とは，各代替案でＡ地点からＣ地点までにかかる料金の総額を比較する方法であり，差額法とは，共通するＡ地点からＢ地点までの料金を分析から除外して，Ｂ地点からＣ地点までの料金のみを比較する方法をいう。差額法によるならば，Ａ地点からＢ地点までにかかる料金を調べる必要はないし，Ｂ地点からＣ地点までバスで行くかタクシーで行くかという相違点のみに焦点を当てるため，代替案間の優劣が理解しやすいというメリットがある。ただし，差額の抽出に執心するあまり，重要なキャッシュ・フローを見落とす可能性があることには注意>しなければならない。ここでは極めて単純な例を用いているが，現実の意思決定M問題は複雑であり，重要なキャッシュ・フローを見落とせば，誤った結論を導く恐れがある。したがって，分析自体は総額法によるのが無難であり，分析結果の報告に際してのみ差額法のフォーマットを利用するのがよいと考えられる。"],"f":"p2_8-3.webp","p":""},{"id":"8-4","b":"p2","c":8,"n":4,"t":"差額原価収益分析と原価計算制度の関係","i":"B","y":"A","q":["差額原価収益分析と原価計算制度の関係について説明しなさい。"],"a":["差額原価収益分析は，意思決定のための原価計算であるから，特殊原価調査として行われる。","ここで，特殊原価調査とは，財務会計機構のらち外において，随時断片的に行われる原価の統計的，技術的計算ないし調査をいう。一方，原価計算制度とは，財務会計機構と有機的に結合して常時継続的に行われる計算体系をいう。","以上より，特殊原価調査としての差額原価収益分析は，原価計算制度の範囲外に属するといえる。"],"k":["特殊原価調査","財務会計機構","らち外","有機的結合","随時断片的","常時継続的"],"kg":[{"l":"","w":["特殊原価調査","財務会計機構","らち外","有機的結合","随時断片的","常時継続的"]}],"e":["差額原価収益分析は，原価計算制度上の実績記録情報からは入手できない未来原価としての差額原価の測定を要するため，「特殊原価調査」として行われる。ここで，特殊原価調査は原価計算一般の目的の中には含まれるが，「財務会計機構との有機的結合」と「常時継続性」という要件を満たさないことから，原価計算制度の範囲外に属するものとされる。","ここで，原価計算制度から得られる原価情報は支出済みの過去原価であり，それ自体は特殊原価調査としての差額原価収益分析においては埋没原価として取り扱われるが，未来原価としての差額原価を予測する基礎としてはしばしば有用である。","なお，原価計算一般の目的と原価計算制度の目的の関係を図示すれば，以下の図表８-６のようになる。広い意味での原価計算(原価計算一般)は，原価計算制度と特殊原価調査からなり，原価計算一般の目的のうち，意思決定に関連する目的を除いたものが原価計算制度の目的となる。","原価計算技法実際原価計算，標準原価計算差額原価収益分析"],"f":"p2_8-4.webp","p":""},{"id":"8-5","b":"p2","c":8,"n":5,"t":"差額原価収益分析と貨幣の時間価値の関係","i":"B","y":"B","q":["意思決定のための差額原価収益分析を２つに分類し，両者における貨幣の時間価値の取り扱いについて説明しなさい。"],"a":["意思決定には業務執行上の意思決定と設備投資に代表される戦略的な意思決定があるため，これに照応して，差額原価収益分析も業務的意思決定のための差額原価収益分析と戦略的意思決定のための差額原価収益分析とに分類される。","ここで，業務的意思決定は，現状の経営構造を前提とすることから，投資額は少額にとどまるのが通常であり，意思決定の効果が及ぶ期間も比較的短期にとどまる。そのため，犠牲になる利子の重要性が低く，差額原価収益分析においてはこれを考慮外とするのが一般的である。","一方，戦略的意思決定は，経営の基本構造の変革を目的とすることから，巨額の投資を必要とし，意思決定の効果が及ぶ期間も長期に渡る。そのため，犠牲になる利子の重要性が高く，差額原価収益分析においては，一般に貨幣の時間価値を考慮する必要がある。"],"k":["経営構造","投資額","意思決定の効果","犠牲になる利子の重要性"],"kg":[{"l":"","w":["経営構造","投資額","意思決定の効果","犠牲になる利子の重要性"]}],"e":["個別計画としての意思決定は，自製か外注か，特別注文引受可否などに代表される個別業務計画としての業務的意思決定と，設備投資に代表される個別構造計画としての戦略的意思決定とに分類される。これに照応して，意思決定のための差額原価収益分析もまた，業務的意思決定のための差額原価収益分析と戦略的意思決定のための差額原価収益分析とに分類される。一般に，前者では貨幣の時間価値を考慮外とするのに対し，後者ではこれを考慮することが必須となる。そこで，意思決定のための差額原価収益分析の方法を，貨幣の時間価値を考慮するか否かによって分類する場合もある。","なお，既述の通り，業務的意思決定のための差額原価収益分析においては，貨幣の時間価値を考慮外とするのが通常である。ただし，それは，理論的には貨幣の時間価値を考慮すべきところ，投資額少なく，なおかつ短期であるがゆえに犠牲となる利子の重要性が低いことから，これを便宜上無視しているに過ぎないことに注意する。","意思決定主体ミドル・マネジメントトップ・マネジメント"],"f":"p2_8-5.webp","p":""},{"id":"8-6","b":"p2","c":8,"n":6,"t":"差額原価収益分析と余剰生産能力の関係","i":"B","y":"B","q":["業務執行上の意思決定のための差額原価収益分析の特徴について，余剰生産能力(遊休生産能力)との関係で説明しなさい。"],"a":["業務執行上の意思決定は現状の経営構造を基礎とするものであるから，余剰生産能力の有無やその枠内で代替案の実行が可能であるかが問題となる。","ここで，余剰生産能力がある場合には，特定の代替案の選択が他の代替案に影響を及ぼすことはないが，余剰生産能力がない場合には，特定の代替案を選択する結果として他の代替案を断念せざるをえない。したがって，業務執行上の意思決定のための差額原価収益分析は，余剰生産能力がある場合には現金支出原価の測定が中心となり，余剰生産能力がない場合には，機会原価の測定が中心となる。"],"k":["現状の経営構造","他の代替案","差額原価","現金支出原価","機会原価"],"kg":[{"l":"","w":["現状の経営構造","他の代替案","差額原価","現金支出原価","機会原価"]}],"e":["余剰生産能力の有無は，業務的意思決定の問題を解決するに当たって，最も大きな問題の１つである。余剰生産能力がなければそもそも代替案の実行が不可能であるし，これを可能にするために何らかの代替的機会を放棄すれば，機会原価が発生するからである。差額原価は現金支出原価と機会原価から構成されるが，余剰生産能力がない場合には，差額原価収益分析は機会原価測定の問題と換言しうる。","上記の考え方は，分権組織の管理会計における内部振替価格の論点(供給事業部が完全操業状態にある場合に市場価格が差額原価に等しくなる理由)にも応用できる。供給事業部が不完全操業である場合，内部振替という代替案の選択は，外部販売という代替案には影響しない。したがって，内部振替によって追加的に生>じる貨幣犠牲額(差額原価)は現金支出原価としての変動費のみということになる。M一方，供給事業部が完全操業である場合，内部振替という代替案の選択は，同量の外部販売機会の断念を意味する。したがって，内部振替によって追加的に生じる貨幣犠牲額(差額原価)は，現金支出原価としての変動費と，外部に販売していれば得られたはずの機会原価としての貢献利益からなり，両者の合計は市場価格に一致するのである(図表８-８)。","なお，余剰生産能力がない場合に生産能力の拡張という選択を採る場合には，もはや業務的意思決定の領域を超え，設備投資の経済性計算の問題となる。"],"f":"p2_8-6.webp","p":""},{"id":"8-7","b":"p2","c":8,"n":7,"t":"自製か外注かの意思決定に際しての留意点","i":"A","y":"B","q":["部品の外注化による問題点を長期的な視点から説明した上で，自製か外注かの意思決定に際しての留意点を説明しなさい。"],"a":["製造企業が競争優位を保つためには技術戦略が重要であるが，部品を外注化すれば，サプライヤーへの技術供与の結果として当社の技術が社外に流出したり，生産の空洞化を通じて技術力の維持，育成に問題が生じる恐れがあり，その技術の重要性が高ければ高いほど，長期的には競争優位を失いかねないという問題がある。また，部品を外注化する場合にはサプライヤーの選択が必要となるが，自製する場合と比べて品質の維持や納期の厳守といった点で不確実な要素が多いため，長期的には大きなリスクを伴うという問題もある。","以上より，自製か外注かの意思決定に際しては，短期的な差額原価収益分析の結果にとらわれることなく，戦略的な視点から判断を下す必要があることに留意すべきである。"],"k":["技術の流出","技術力の維持・育成","競争優位","品質","納期","戦略的視点"],"kg":[{"l":"","w":["技術の流出","技術力の維持・育成","競争優位","品質","納期","戦略的視点"]}],"e":["業務執行上の意思決定は，上位の事業戦略と離れて存在するわけではなく，これに沿った意思決定が行われるべきことはいうまでもないが，とりわけ自製か外注かの意思決定については，戦略的視点が重要であるといわれる。部品を外注化すれば，技術の流出や技術力の減退を通じて競争優位の低下を招く恐れがあるし，サプライヤーの選択という価値連鎖の変更に伴い，品質，納期面で新たなリスク要因を抱えることになるからである。また，生産の空洞化が従業員のモラール(士気)に与える影響も考慮する必要性があるだろう。したがって，差額原価収益分析の結果として，部品の外注化が経済的に有利と判断されたとしても，また，それがＣＶＰ分析の観点から短期的な損益分岐点の引き下げに有効な施策であるとしても，安易な外注への切り替えは厳に慎まれるべきであるといえる(図表８-９)。","なお，ここでは部品の外注化について検討しているが，外注から自製への切り替えを検討する場合においても，短期的な差額原価収益分析の結果のみでなく，種々の定性的要因(操業度の増加について現場作業員の理解は得られるか，自製部品について外注部品と同等の品質を確保することができるか，外注先であるサプライヤーとの今後の取引関係に支障は出ないかなど)を考慮すべきことはいうまでもない。"],"f":"p2_8-7.webp","p":"p2_8-7_past.webp"},{"id":"8-8","b":"p2","c":8,"n":8,"t":"特別注文引受可否の意思決定に際しての留意点","i":"B","y":"B","q":["通常価格より安価での特別注文があった場合，これを引き受けることによる問題点を説明し，注文を引き受けるか否かの意思決定に際しての判断基準を示しなさい。"],"a":["通常価格より安価での特別注文を引き受けた場合，他の顧客からも値引き要請が生じる結果として，かえって収益構造が圧迫されてしまう恐れがあるという問題がある。","したがって，注文を引き受けるか否かの意思決定に際しては，短期的な差額原価収益分析の結果にとらわれるのではなく，他の顧客への影響を考慮して判断を行うべきである。具体的には，他の顧客からの注文のロットが特別注文のロットよりもはるかに小さい場合には引き受けても問題はないと考えられるが，特別注文のロットがそれほど大きくない場合には，他の顧客への影響を考慮し，これを引き受けるべきではないと判断すべきである。"],"k":["他の顧客","値引き","収益構造","ロットサイズ"],"kg":[{"l":"","w":["他の顧客","値引き","収益構造","ロットサイズ"]}],"e":["特別注文を引き受けるか否かの意思決定は，通常価格よりも安価での引き合いに応じるべきか否かの問題であることが多い。この場合，その特別注文自体の差額利益がプラスであったとしても，それを引き受ける結果として他の顧客との取引価格について値崩れが生じれば，かえって当該製品や会社全体の収益構造に悪影響を与えることになる。","したがって，特別注文を引き受けるか否かの判断に際しては，他の顧客からの注文のロットと特別注文のロットのサイズ比較が問題となる。すなわち，他の顧客からの注文のロットの方がはるかに小さければ(特別注文のロットの方がはる>かに大きければ)，大きなロットの特別注文に対して通常価格より安価での販売をM行ったとしても，他の顧客との取引価格には影響しないと考えられる。逆に，他の顧客からの注文のロットの方がはるかに大きければ(特別注文のロットの方がはるかに小さければ)，小さなロットの特別注文に対して通常価格より安価での販売を行えば，他の顧客の取引価格に影響することは確実であり(図表８-10)，その場合には，特別注文を引き受けるべきでないという判断が下されるべきである。現実問題としては後者のケースが一般的であり，取引がスポットでなく継続していく可能性が高い場合，自社のレピュテーションにとって何らかのプラスを引き起こす場合などの条件がない限りは，特別注文の引き受けには慎重になるべきである。"],"f":"p2_8-8.webp","p":""},{"id":"8-9","b":"p2","c":8,"n":9,"t":"追加加工の可否の意思決定に際しての留意点","i":"B","y":"B","q":["中間製品としての連産品に外部市場がある場合，これをそのまま販売すべきか，追加加工して販売すべきかの意思決定に際しての留意点を２つあげなさい。"],"a":["第１に，連産品の分離点までに生じる連結原価を差額原価収益分析から除外する必要があることに留意すべきである。個々の連産品に対する連結原価の按分額は追加加工するか否かによって変動するが，連結原価は追加加工するか否かにかかわらず総額で発生するのであって，それは追加加工の可否の意思決定に無関連な埋没原価だからである。","第２に，連産品全体ではなく，個々の連産品について追加加工の可否を検討することに留意すべきである。連産品は同時不可避的に産出されるものであるが，それらを追加加工するか否かの選択は個々に行うことが可能なのであって，これを無視すれば，機会損失を被る恐れがあるからである"],"k":["連結原価","埋没原価","個々の連産品","機会損失"],"kg":[{"l":"","w":["連結原価","埋没原価","個々の連産品","機会損失"]}],"e":["いま，連産品Ｘ，Ｙ及びＺを産出し，それぞれをそのまま販売している企業において，各連産品を分離後さらに追加加工を行ってから販売してはどうかという提案がなされているものとする。また，連結原価の按分には正常市価基準を採用しており，以下の〔資料〕が入手されたものとする。〔資料〕","上記〔資料〕によれば，追加加工を行ってから販売した方が各連産品の売上総利益は大きくなっているため，一見するといずれも追加加工した方が有利であるかのように思える。しかしながら，各連産品の売上総利益は，連結原価按分後の金額であることに注意しなければならない。市価法を前提とすれば，追加加工の有無によって，個々の連産品への連結原価の按分額は変動するが，それは，等価係数算定の基礎としての正常市価(正味実現可能価額：ＮＲＶ)が変動するからであって，追加加工の有無との間に何ら因果関係は認められないのである。正しくは，売上高の増加額(差額収益)と追加加工費(差額原価)を比較すべきであり，連結原価は意思決定に無関連な埋没原価として分析から除外しなければならない。以上を踏まえて分析を行えば，連産品ＹとＺについては追加加工してから販売した方が有利であるが，連産品Ｘについてはそのまま販売した方が有利であるとの結論を得る。","なお，連結原価が各連産品に共通的に発生するからといって，連産品全体で追加加工の可否を検討してはならない。追加加工の可否は各連産品で個別的に選択できるからである。上記の数値例において，仮に工場全体で追加加工の可否を検討すれば，本来そのまま販売すべき連産品Ｘが追加加工される結果として，その差額利益の分だけ機会損失が生じることになる。"],"f":"p2_8-9.webp","p":""},{"id":"8-10","b":"p2","c":8,"n":10,"t":"材料在庫がある場合の差額原価収益分析","i":"B","y":"C","q":["ある代替案の実行に際して，過去に大量に購入していた材料αの在庫を使用する場合，差額原価収益分析において，材料αの購入原価がどのように取り扱われるかを説明しなさい。ただし，材料αは常備材料であり，今後も継続して使用される。"],"a":["材料αの在庫の購入原価は支出済みの過去原価であり，ある代替案の実行に際して在庫を消費したとしても，新たに現金支出は生じない。したがって，在庫消費によって生じる直接材料費は，意思決定に無関連な埋没原価として取り扱われる。ただし，材料αは今後も継続使用される常備材料であるため，代替案の実行に際して在庫を消費すれば，同量の材料αを再調達しなければならず，これについては現金支出を伴う。したがって，その再調達原価については差額原価として取り扱われる。"],"k":["現金支出","支出済みの過去原価","埋没原価","再調達原価","差額原価"],"kg":[{"l":"","w":["現金支出","支出済みの過去原価","埋没原価","再調達原価","差額原価"]}],"e":["いま，材料αを使用して製品Ａを生産・販売する当社に対して，Ｂ社から「製品Ａを１個当たり1,000円で100個販売して欲しい」という特別注文があったものとする。関連する〔資料〕は以下の通りである。〔資料〕","この場合，材料αの在庫を消費することで，その購入原価(＠800円)と同額の直接材料費が発生する。ただし，在庫の購入原価は支出済みの過去原価であり，Ｂ社の特別注文を引き受ける場合に100個分の在庫を消費したとしても，それによって新たな現金支出が生じるわけではない。したがって，材料αの在庫の購入原価(在庫消費に伴う直接材料費)は，意思決定に無関連な埋没原価となる。一方，材料αは製品Ａの製造に継続使用される常備材料であるため，Ｂ社の特別注文を引き受ける場合には，これによって消費される100個分の材料αを＠1,100円で再調達する必要がある。その結果，Ｂ社の特別注文を引き受けない場合と比べて，現金支出が増加するため，これについては差額原価として取り扱う必要がある。以上より，Ｂ社の特別注文を引き受けることによる差額利益はマイナスの10,000円となるため，これを引き受けるべきでないという結論に至る(図表８-11)。"],"f":"p2_8-10.webp","p":""},{"id":"8-11","b":"p2","c":8,"n":11,"t":"ＥＯＱモデルの一般的仮定","i":"B","y":"B","q":["ＥＯＱモデルに基づく最適発注量の分析において，調達する部材の購入原価がどのように扱われるかを，ＥＯＱモデルに内在する仮定を踏まえた上で説明しなさい。"],"a":["ＥＯＱモデルにおいては，調達する部材の必要量は既知であり，その購入価格は１回当たりの発注量にかかわらず一定であるという仮定が内在する。","この場合，１回当たりの発注量にかかわらず，購入原価の総額は一定となる。したがって，調達する部材の購入原価は，最適発注量の分析に無関連な埋没原価として取り扱われる。"],"k":["必要量","購入価格","発注量","購入原価の総額","埋没原価"],"kg":[{"l":"","w":["必要量","購入価格","発注量","購入原価の総額","埋没原価"]}],"e":["ＥＯＱ(EconomicOrderQuantity；経済的発注量)モデルにおける一般的仮定をまとめると，以下の図表８-12のようになる。このうち②と③の仮定から，部材の購入原価の総額は１回当たりの発注量にかかわらず一定となるため，ＥＯＱ分析に無関連な埋没原価として取り扱われる。","ここで，在庫に関連するコストとしては，発注費，購入原価，保管費，品切れ費，品質コストがあるが，ＥＯＱモデルとは，このうち関連原価が発注費と保管費からなると考え，両者の合計を最小化する最適発注量を特定するモデルをいう。ここで，発注費は発注回数に比例し，１回当たりの発注量が増加(減少)すれば減少(増加)するのに対し，保管費は発注量(平均在庫量)に比例して増減する。すなわち，発注費と保管費はトレードオフの関係にあるため，両者が等しくなる場合の発注量がＥＯＱとなる(図表８-13)。>","②部材の必要量，発注費，保管費，発注のリードタイムが既知である。"],"f":"p2_8-11.webp","p":""},{"id":"8-12","b":"p2","c":8,"n":12,"t":"価格決定のアプローチ","i":"B","y":"B","q":["価格決定のアプローチは，コストベースとマーケットベースの２つに大別されるが，それぞれの特徴を説明しなさい。"],"a":["コストベースの価格決定とは，製品単位当たりの原価にマークアップを加算して価格を決定する方法であり，製品に集計される原価の範囲やマークアップの計算方法によって，種々の方法がある。この方法は，供給側のコストを重視する内部志向の価格決定であり，価格は期待価格としての性質を有する。","一方，マーケットベースの価格決定とは，潜在的顧客が当該製品に対して支払うであろう価格を見積もることによって価格を設定する方法である。この方法は，自社のコストよりも，顧客満足や競争企業の反応を重視する外部志向ないし市場・顧客志向の価格決定であり，価格は目標価格としての性質を有する。また，目標価格から目標利益を控除して市場・顧客主導型の目標原価を算定し，その実現を図ることが必要となる。"],"k":["供給側のコスト","内部志向","期待価格","顧客満足","外部志向","目標価格"],"kg":[{"l":"","w":["供給側のコスト","内部志向","期待価格","顧客満足","外部志向","目標価格"]}],"e":["伝統的に，価格決定といえば暗黙裡にコストベースの価格決定を指し，原価をM所与として一定の利益を加算するという「原価主導型の価格決定」が前提であった。この方法では，価格決定のベースとなった原価水準を維持するために，標準原価計算による原価管理が強調されてきた。しかし，現代的には，マーケットベースの価格決定がより重視されている。","マーケットベースの価格決定では，コストベースアプローチとは逆に，顧客が喜んで支払うであろう価格を所与として一定の利益を控除し，製品の目標原価を算定するという「価格主導型の原価計算」が行われる。この方法では，目標原価の実現に向けて，標準原価計算に代わる新たな原価管理ないし利益管理の手法が必要となる。その典型的な例が原価企画(目標原価計算)の適用である。","なお，コストベースの価格決定は勿論のこと，マーケットベースの価格決定においても，正確な製品原価情報が不可欠であることに変わりはない。これに対する近年の提案としては，活動基準原価計算(ＡＢＣ)の採用を挙げることができる。"],"f":"p2_8-12.webp","p":""},{"id":"8-13","b":"p2","c":8,"n":13,"t":"コストベースの価格決定の特徴","i":"B","y":"B","q":["コストベースの価格決定の方法は全部原価法と直接原価法に大別されるが，それぞれを簡潔に定義した上で，そのメリットとデメリットを説明しなさい。"],"a":["全部原価法とは，製品単位当たりの総原価をコストベースとして，これに一定のマークアップを加算して販売価格を決定する方法をいう。この方法は，長期的見地からの価格決定としての特徴をもち，安全性に優れているなどのメリットがある反面，全部原価の回収にとらわれるあまり価格の引き下げ対して硬直的になり，短期的には機会損失を被る恐れがあるなどのデメリットもある。","一方，直接原価法とは，製品単位当たりの変動費をコストベースとして，これに一定のマークアップを加算して販売価格を決定する方法をいう。この方法は，変動費の回収を優先する短期的・弾力的な価格決定が可能であるなどのメリットがある反面，長期的には価格競争を激化させたり，全部原価の回収が疎かになりがちになるなどのデメリットもある。"],"k":["安全性","全部原価の回収","硬直的","機会損失","弾力的","価格競争"],"kg":[{"l":"","w":["安全性","全部原価の回収","硬直的","機会損失","弾力的","価格競争"]}],"e":["大まかに言えば，全部原価法は長期的見地からの価格決定，直接原価法は短期的見地からの価格決定ということになる。したがって，一般に，安全性という点では全部原価法が，弾力性という点では直接原価法が優れているといわれる。","ただし，全部原価法が安全性に富むといっても，全部原価法で価格決定を行えば必ず利益が出るというわけではない。コストベースの算定に当たって予定した生産・販売量を実現できなければ，製品単位当たりの固定費負担が増加し，総額としての固定費を回収できないケースもあるからである。一方，直接原価法によれば，安全性が損なわれるという考えもまた誤りである。変動費をコストベースとする結果，それさえ回収しさえすればよいという錯覚に陥りやすいことは確かであるが，全部原価を上回るような十分なマークアップを加算すれば，安全性という面で全部原価法に劣ることはないからである。そもそも，コストベースが異なれば，マークアップの内容も異なるのであって，全部原価法によった場合と直接原価法によった場合とで，マークアップ後の価格の大小関係は問題とならないことに注意しなければならない(図表８-15)。","なお，コストベースの価格決定(とりわけ，全部原価法による価格決定)に際しては，上述のとおり，生産・販売量を予め仮定する必要があるが，一方で，販売量は価格によって左右されるという側面を持つ。すなわち，価格を決定する前に，価格の影響を受けて増減するはずの販売量を仮定するという矛盾があり，これは，コストベースの価格決定の致命的な欠陥といえる(図表８-16)。"],"f":"p2_8-13.webp","p":"p2_8-13_past.webp"},{"id":"9-1","b":"p2","c":9,"n":1,"t":"キャッシュ・フロー計算における減価償却費の取り扱い","i":"A","y":"A","q":["キャッシュ・フローの計算における減価償却費の取り扱いについて，法人税等への影響を考慮しない場合と考慮する場合とに分けて説明しなさい。"],"a":["減価償却費は支出済みの過去原価であり，キャッシュ・アウトフローを伴わない。したがって，法人税等への影響を考慮しない場合には，意思決定に無関連な埋没原価として取り扱う。","ただし，法人税等への影響を考慮する場合には，減価償却費の損金算入によってキャッシュ・アウトフローとしての法人税等の金額が減少するため，その税効果については差額原価(差額キャッシュ・フロー)として取り扱う。"],"k":["支出済みの過去原価","キャッシュ・アウトフロー","埋没原価損金算入","法人税等の減少額","差額原価(差額キャッシュ・フロー)"],"kg":[{"l":"","w":["支出済みの過去原価","キャッシュ・アウトフロー","埋没原価損金算入","法人税等の減少額","差額原価(差額キャッシュ・フロー)"]}],"e":["法人税等への影響を考慮する場合，各年度の営業キャッシュ・フロー(税引後正味キャッシュ・フロー)の計算においては，営業利益を課税ベースとする方法と税引前正味キャッシュ・フローを課税ベースとする方法の２つがあり，課税ベースの相違に照応して，減価償却費に関する調整計算も相違する(図表９-１)。","なお，法人税等への影響を考慮する場合には，減価償却費の損金算入による税効果(タックス・シールド)がキャッシュ・インフローとして認識されるため，他の条件を一定とすれば，近い将来に減価償却費が多く計上されるほど正味現在価値は大きくなる。したがって，減価償却方法としての加速償却法(定率法)の採用は，設備投資を積極的に喚起する効果があるといわれる。","現金支出営業費用80,000現金支出営業費用80,000","税引後営業利益6,000減価償却費の税効果4,000"],"f":"p2_9-1.webp","p":"p2_9-1_past.webp"},{"id":"9-2","b":"p2","c":9,"n":2,"t":"回収期間法の問題点","i":"A","y":"A","q":["伝統的な設備投資の経済性計算の方法として回収期間法があるが，その理論的問題点を３つあげて説明しなさい。"],"a":["第１に，貨幣の時間価値が考慮外となっているため，キャッシュ・フローのタイミングの相違を評価結果に適切に反映することができないという問題がある。","第２に，投資回収後のキャッシュ・フローが考慮外となっているため，回収期間後の収益性の良否を評価結果に反映することができないという問題がある。","第３に，明確な基準回収期間(目標回収期間)が存在しないため，投資案の採否を客観的に判断できないという問題がある。"],"k":["貨幣の時間価値","投資回収後のキャッシュ・フロー","基準回収期間"],"kg":[{"l":"","w":["貨幣の時間価値","投資回収後のキャッシュ・フロー","基準回収期間"]}],"e":["回収期間法の問題点は，図表９-２に示すような例を用いて理解することができる。いま，当社では，資本コスト率10％のもとで，Ａ～Ｃの３つの相互排他的な投資案の中からいずれを選択すべきかを検討しているものとする。初期投資額はいずれも10,000万円，経済命数は４年とする。","各投資案の回収期間を計算すると，それらはいずれも３年となり，回収期間法によれば，投資案の選択は無差別ということになる。しかし，Ａ案とＢ案を比較すれば，近い将来にキャッシュ・フローが相対的に多く分布しているＡ案の方が正味現在価値は大きくなるため，本来，Ａ案はＢ案よりも優位のはずである。また，Ａ案とＣ案を比較すれば，投資額を回収するまでの３年間のキャッシュ・フローは全く同じであるものの，投資回収後の第４年度のキャッシュ・フローはＣ案の方が大きいため，その分だけ正味現在価値も大きくなり，本来は，Ｃ案が最も有利な投資案として選択されるべきである。このように，回収期間法におい>ては貨幣の時間価値や投資回収後のキャッシュ・フローが考慮外となっている結M果，投資案の収益性の評価を適切に行うことができないという問題がある。","また，仮に，当社が基準回収期間(目標回収期間)を２年に設定していた場合には，いずれの投資案も投資不適格という判断になり，プラスの正味現在価値を持つ有利な投資案が見送られることになるが，２年というカットライン自体に理論的，客観的な根拠はない。このように，独立投資案の採否の判定について明確な意思決定ルールがないという点も，回収期間法の問題点の１つとしてあげられることになる(図表９-３)。"],"f":"p2_9-2.webp","p":"p2_9-2_past.webp"},{"id":"9-3","b":"p2","c":9,"n":3,"t":"割引回収期間法と正味現在価値法の関係","i":"C","y":"A","q":["貨幣の時間価値を考慮する場合の回収期間法(割引回収期間法)と正味現在価値法の関係を明らかにしなさい。"],"a":["割引回収期間とは，各年度のキャッシュ・フローの現在価値で投資額を回収するまでに要する期間をいう。したがって，キャッシュ・フローの現在価値総額が投資額を上回り(下回り)，投資額を回収可能(回収不能)である場合には，正味現在価値もプラス(マイナス)となる。","以上より，割引回収期間法による判定と正味現在価値法による判定は整合的であるといえる。"],"k":["キャッシュ・フローの現在価値総額","回収可能","回収不能"],"kg":[{"l":"","w":["キャッシュ・フローの現在価値総額","回収可能","回収不能"]}],"e":["既に見た通り，回収期間法の問題点としては，貨幣の時間価値が考慮外となっている点がまず挙げられる。ただし，回収期間法においても，貨幣の時間価値を考慮する方法がある(割引回収期間法)。割引回収期間法とは，各年度のキャッシュ・フローをそのまま使用するのではなく，割引計算によって現在価値に修正し，その現在価値でもって投資額の回収に要する期間を算定する方法である。したがって，キャッシュ・フローの現在価値総額が投資額を上回り，投資額を回収可能である場合(割引回収期間＜経済命数となる場合)には，正味現在価値もプラスとなり，キャッシュ・フローの現在価値総額が投資額を下回り，投資額を回収不能である場合(割引回収期間が存在しない場合)には，正味現在価値もマイナスとな>る。M","以上のように，割引回収期間法による判定と正味現在価値による判定には整合性が認められ，割引回収期間法も広義には割引キャッシュ・フロー法の１つと見ることができる。"],"f":"p2_9-3.webp","p":""},{"id":"9-4","b":"p2","c":9,"n":4,"t":"投資利益率法の問題点","i":"B","y":"B","q":["いま，ＡとＢの２つの投資案があり，いずれの投資案も初期投資額は1,000万円，耐用年数５年，残存価額をゼロとする定額法により減価償却を実施するものとする。Ａ案は今後５年間に渡って，毎年300万円の増分キャッシュ・フローが見込まれるが，Ｂ案は第５年度末にまとめて1,500万円の増分キャッシュ・フローが見込まれる。以上を前提として，伝統的な設備投資の経済性計算の方法としての投資利益率法の問題点を説明しなさい。"],"a":["両案の増分キャッシュ・フローの総額は同じであるが，キャッシュ・フローの分布を考慮すれば，毎年コンスタントにキャッシュ・フローが得られるＡ案の方が正味現在価値は大きくなり，Ｂ案よりも望ましい投資案であることは明らかである。しかし，投資利益率を平均投資額を用いて計算すると，会計上の年平均利益を分子とする結果，いずれの案も20％と計算され選択は無差別となる。","このように，投資利益率法においては，貨幣の時間価値が考慮外となっているため，キャッシュ・フローのタイミングの相違を評価結果に反映することができないという問題がある。"],"k":["会計上の年平均利益","貨幣の時間価値","キャッシュ・フローのタイミング"],"kg":[{"l":"","w":["会計上の年平均利益","貨幣の時間価値","キャッシュ・フローのタイミング"]}],"e":["・キャッシュ・フローで計算する・貨幣の時間価値が考慮外・キャッシュ・フローで計算する・将来キャッシュ・フローの予測に不確・貨幣の時間価値を考慮する実性を伴う・金額のため加法性が成立し，資本予算・計算に資本コスト率の測定が必要","への運用上有効・金額のため，投資案の規模の相違を均・相互排他的投資案について正しい順位した効率性の判断ができない・キャッシュ・フローで計算する・将来キャッシュ・フローの予測に不確・貨幣の時間価値を考慮する実性を伴う・比率のため，投資案の規模の相違を均・計算に資本コスト率の測定が必要","した効率性の判断が可能・比率のため加法性が成立せず，資本予・キャッシュ・フローで計算する・将来キャッシュ・フローの予測に不確・貨幣の時間価値を考慮する実性を伴う・計算に資本コスト率の測定が不要・決定に資本コスト率の測定が必要・比率のため，投資案の規模の相違を均・複数の内部利益率が計算される可能性","した効率性の判断が可能・比率のため加法性が成立せず，資本予"],"f":"p2_9-4.webp","p":""},{"id":"9-5","b":"p2","c":9,"n":5,"t":"正味現在価値と内部利益率の関係","i":"A","y":"A","q":["キャッシュ・フローの正負の符号の変化が１回だけ生じる典型的な独立投資案の採否について，正味現在価値法による判定と内部利益率法による判定の整合性について検討しなさい。"],"a":["キャッシュ・フローの正負の符号の変化が１回だけ生じる典型的な投資案については，算定される内部利益率も１つであり，正味現在価値は割引率の増加に応じて単調に減少する。この場合，正味現在価値がプラス(マイナス)であるということは，内部利益率が資本コスト率よりも大きい(小さい)ことと等価である。","以上より，典型的な独立投資案の採否について，正味現在価値法による判定と内部利益率法による判定は必ず整合する。"],"k":["正味現在価値","単調に減少","内部利益率","資本コスト率"],"kg":[{"l":"","w":["正味現在価値","単調に減少","内部利益率","資本コスト率"]}],"e":["ここでは，キャッシュ・フローの正負の符号の変化が「－＋＋＋」のように１回しか生じない通常パターンのキャッシュ・フローを持つ投資案のことを典型的投資案と呼ぶことにしよう。このような典型的投資案については，算定される内部利益率も１つなので，その正味現在価値線は単調な右下がりの曲線となる(図表９-６)。そのため，典型的な独立投資案の採否を前提とすれば，正味現在価値法と内部利益率法の意思決定ルールは全くの等価ということになる。","ただし，キャッシュ・フローの正負の符号の変化が「－＋＋－」のように複数回生じるキャッシュ・フローをもつ非典型的な投資案については，複数個の内部利益率が算定される可能性がある。この場合，正味現在価値線は横軸と複数回交わることになるため，割引率に対する正味現在価値の変化は単調でない。そのため，正味現在価値がプラス(マイナス)であるからといって，内部利益率が資本コスト率よりも大きい(小さい)とは限らないということになる(図表９-６)。"],"f":"p2_9-5.webp","p":""},{"id":"9-6","b":"p2","c":9,"n":6,"t":"キャッシュ・フローのタイミングと正味現在価値の関係","i":"A","y":"B","q":["以下の条件において，Ａ案とＢ案の正味現在価値及び内部利益率の優劣関係を明らかにしなさい。","条件：①Ａ案とＢ案は相互排他的な投資案である","②Ａ案とＢ案の投資額及び各年度のキャッシュ・フローの総額","は等しい。","③投資期間中のＡ案のキャッシュ・フローは全てプラスであり，","投資期間の前半に多く分布している。","④投資期間中のＢ案のキャッシュ・フローは全てプラスであり，","投資期間の後半に多く分布している。"],"a":["Ａ案とＢ案の投資額及び各年度のキャッシュ・フローの総額は等しいことから，両案の正味価値は等しい。ここで，両案は毎年のキャッシュ・フローがプラスとなる典型的な投資案であることから，正味現在価値は割引率の増加に応じて単調に減少するが，Ａ案のキャッシュ・フローは投資期間の前半に，Ｂ案のキャッシュ・フローは投資期間の後半に多く分布しているため，その平均減少割合はＢ案の方が大きい。したがって，正味現在価値やそれがゼロになる際の割引率である内部利益率は，Ａ案の方が大きくなる。"],"k":["正味価値","単調に減少","キャッシュ・フローの分布","平均減少割合"],"kg":[{"l":"","w":["正味価値","単調に減少","キャッシュ・フローの分布","平均減少割合"]}],"e":["正味現在価値法や内部利益率法に代表される割引キャッシュ・フロー法の最大の特徴は，貨幣の時間価値を考慮する点にある。ここで，「貨幣の時間価値を考慮する」とは，キャッシュ・フローのタイミングを考慮するということであり，それは，近い将来のキャッシュ・フローを重視する(遠い将来のキャッシュ・フローを低く評価する)ということを意味する。すなわち，他の条件を一定とすれば，本問のＢ案のように，投資期間の後半にキャッシュ・フローが多く分布している投資案ほど，割引計算の影響を強く受けるため，割引率の増加に対する正味現在価値の平均減少割合が相対的に大きくなり，正味現在価値は相対的に小さく評価されるのである(図表９-７)。","なお，後述する通り，正味現在価値法には各年度のキャッシュ・フローを資本コスト率で他の投資機会に再投資・運用できるという仮定が内在する。したがって，投資期間の前半にキャッシュ・フローが多く分布している投資案ほど，より多くのキャッシュ・フローを他の投資機会への再投資・運用することが可能となるため，正味現在価値が相対的に大きく評価されると理解することもできる。"],"f":"p2_9-6.webp","p":""},{"id":"9-7","b":"p2","c":9,"n":7,"t":"価値加法性","i":"A","y":"B","q":["資本予算の編成に当たって，内部利益率法と収益性指数法が抱える共通の問題点について，正味現在価値法と比較して説明しなさい。"],"a":["資本予算においては，資金制約をはじめとする各種の制約条件下において最大の利益が得られるように投資案の組合せを決定するため，加法性が成立することが望ましい。","ここで，正味現在価値法によれば，金額による収益性の評価を行うため加法性が成立するが，内部利益率法や収益性指数法によれば，比率による収益性の評価を行うため加法性が成立しない。そこで，収益性指数や内部利益率の高い順に投資案を選択すると，誤った資本配分を導く恐れがあるという問題がある。"],"k":["資金制約","投資案の組合せ","加法性","金額","比率","資本配分"],"kg":[{"l":"","w":["資金制約","投資案の組合せ","加法性","金額","比率","資本配分"]}],"e":["正味現在価値は金額であるため，Ａ案の正味現在価値とＢ案の正味現在価値を単純に足せば，両案を合わせて選択した場合の正味現在価値を計算することができる。一方，内部利益率や収益性指数は比率であるため，Ａ案の内部利益率(収益性指数)とＢ案の内部利益率(収益性指数)を単純に足すことはできない。その結果，個々の投資案の評価結果をもとに投資案の組合せを検討するということができず，投資案の組合せを検討する資本予算への運用に限界が生じることになる。","具体的には，内部利益率法や収益性指数法を資本予算に利用すれば，資本配分(規模の異なる相互排他的投資案の順位付け)を誤る恐れがある。いま，資金制約１億円のもとで，最適な投資案の組合せを検討しているものとしよう。検討対象>の投資案はＸ，Ｙ，Ｚの３つであり，Ｘ案とＹ案は相互排他的投資案，Ｚ案は独M立投資案とする。各投資案について，以下の図表９-８に示すデータが得られたものとする。","この場合，正味現在価値法によれば，Ｘ案の正味現在価値(2,000)＞Ｙ＋Ｚ案の正味現在価値(1,500＋300＝1,800)より，Ｘ案のみが選択されることになる。それが正味現在価値ひいては企業価値の最大化をもたらすからである。一方，内部利益率法や収益性指数法を利用する場合には，既述の通り，個々の投資案の評価結果をもとに投資案の組合せを検討することはできない。そこで，％の高い投資案を上から順に選択したとすると，Ｙ案とＺ案の組合せが選択されることになる。それが誤った資本配分(規模の異なる相互排他的投資案の順位付け)であることは言うまでもない。正味現在価値ひいては企業価値に機会損失が生じることになるからである。","なお，図表９-８の例において，正味現在価値法のもとでＸ案が選択されたのは，Ｘ案が最大の正味現在価値を持つ投資案だからではないことに注意する。正味現在価値法とは，最大の正味現在価値を実現する投資案の「組合せ」を選択する方法であり，最大の正味現在価値を持つ投資案が必ず選択されるというわけではない。例えば，Ｚ案の正味現在価値が600万円であったとすれば，正味現在価値法においてもＹ案とＺ案の組合せが選択されることになる。なぜなら，それが最大の正味現在価値を実現する組合せ(1,500＋600＞2,000)だからである。"],"f":"p2_9-7.webp","p":"p2_9-7_past.webp"},{"id":"9-8","b":"p2","c":9,"n":8,"t":"再投資の仮定","i":"A","y":"B","q":["投資案から得られる各年度のキャッシュ・フローを投資終了時点まで金庫に保管しておくという仮定を明示的において計算を行った場合，その正味現在価値は，通常通りに計算した正味現在価値よりも小さくなるが，その理由を正味現在価値法に内在する仮定を踏まえた上で説明しなさい。"],"a":["正味現在価値法には，各年度のキャッシュ・フローを資本コスト率で他の投資機会に再投資・運用できるという仮定が内在する。この点，各年度のキャッシュ・フローを投資終了時点まで金庫に保管しておくという仮定を明示的において計算を行った場合には，資本コスト率による利回りが無視されることになる。したがって，通常通りに計算した正味現在価値よりも小さくなるのである。"],"k":["他の投資機会","資本コスト率","再投資・運用","利回り"],"kg":[{"l":"","w":["他の投資機会","資本コスト率","再投資・運用","利回り"]}],"e":["いま，初期投資額が2,000万円，経済命数３年の投資案を仮定する。各年度のキャッシュ・フローは，第１年度が1,100万円，第２年度が1,210万円，第３年度が1,331万円である。この場合，資本コスト率を10％とすると，再投資を明示的に考慮しない通常の計算方法による正味現在価値は1,000万円と計算される(図表９-９)。","一方，各年度のキャッシュ・フローを投資終了時点まで資本コスト率で他の投資機会に再投資・運用した仮定とすると，その終価は3,993万円，終価に基づく正味現在価値は1,000万円となり，再投資を明示的に考慮しない通常の計算方法による正味現在価値と一致する(図表９-10)。つまり，通常の計算方法は，再投資を明示的に考慮する場合の終価計算と割引計算を相殺したものと捉えることが可能であり，上記の仮定が構造的に内在することが理解できる。","それでは，各年度のキャッシュ・フローを投資終了時点まで金庫に保管しておくという仮定を明示的においた場合にはどうなるであろうか。この場合，正味現在価値は736万円に減少する(図表９-11)。これは，他の投資機会への再投資・運用を無視した結果として，計算上機会原価が生じたためである。現実の企業経営において，各投資案から得られるキャッシュ・フローは，不測の支払に備えるための現金資金を除き，企業内に眠っているわけではない。裏を返せば，正味現在価値法においては，企業経営における現実の資金の流れに即した評価が行われているということである。","なお，内部利益率法では，各年度のキャッシュ・フローを他の投資機会に内部利益率で再投資・運用できるという仮定が内在する。この点，内部利益率は当該投資案固有の収益率であるし，資本コスト率よりも高いのが通常であり，他の投資機会の収益率として仮定するのは非現実的である。したがって，再投資収益率の仮定としては，資本コスト率レベルの平均的な投資機会を想定する正味現在価値法の方が妥当であるといえる。"],"f":"p2_9-8.webp","p":"p2_9-8_past.webp"},{"id":"9-9","b":"p2","c":9,"n":9,"t":"クロスオーバー・ポイントを持つ相互排他的投資案の順位付け","i":"B","y":"B","q":["クロスオーバー・ポイントを持つ相互排他的な投資案として，Ａ案とＢ案があるものとする。ただし，正味価値はＡ案の方が大きく，いずれの正味現在価値線も右下がりであるものとする。この場合に，内部利益率法だけを使用して，正味現在価値法と同じ結論が得られるようにするにはどのように計算したらよいかを説明しなさい。"],"a":["Ａ案とＢ案の正味現在価値が交差する地点の割引率は，Ａ案とＢ案の差額投資案(Ａ－Ｂ案)の内部利益率に等しい。そこで，内部利益率法だけを使用して，正味現在価値法と同じ結論が得られるようにするには，Ａ－Ｂ案の内部利益率を計算し，「内部利益率＞資本コスト率」が成立するならばＡ案を，「内部利益率＜資本コスト率」であればＢ案を選択すればよい。"],"k":["差額投資案","内部利益率","資本コスト率"],"kg":[{"l":"","w":["差額投資案","内部利益率","資本コスト率"]}],"e":["右下がりの正味現在価値線を持つ典型的投資案であれば，独立投資案の採否について正味現在価値法と内部利益率法の判定は必ず整合するが，相互排他的な投資案の順位付けについては，両者で異なる判定が下される場合がある。これは，内部利益率はキャッシュ・フローから直接計算するため，その優劣関係は資本コスト率にかかわらず一定であるが，正味現在価値は資本コスト率の影響を受けて増減するため，ある地点を境としてその優劣関係が逆転する可能性があるためである。図表９-12は，本問が前提とするクロスオーバー・ポイントを持つ相互排他的投資案の正味現在価値線を描写したものである。クロスオーバー・ポイントの左側のゾーンではＡ案，右側のゾーンではＢ案というように，資本コスト率の変化にしたがって正味現在価値の優劣関係が逆転しており，資本コスト率がクロスオーバー・ポイントの左側のゾーンにある場合には，正味現在価値法と内部利益率法の判定に不整合が生じることが確認できる。","この場合，内部利益率法による判定にしたがい，Ｂ案を選択することにしたとすると，より大きな正味現在価値を持つＡ案ないしＡ案を含む投資案の組合せを放棄するという会計的に誤った意思決定が導かれてしまう。したがって，理論的には，投資案の評価法として内部利益率法を使用するのは望ましくないということになる。ただし，本問で見たように，内部利益率法だけを使用して，正味現在価値法と同じ結論が得られるようにすることはできる。"],"f":"p2_9-9.webp","p":""},{"id":"9-10","b":"p2","c":9,"n":10,"t":"割引キャッシュ・フロー法の問題点","i":"A","y":"B","q":["正味現在価値法や内部利益率法に代表される割引キャッシュ・フロー法に共通の問題点を説明しなさい。"],"a":["割引キャッシュ・フロー法とは，将来キャッシュ・フローを割り引く方法であるから，計算ないし決定要素として，将来キャッシュ・フローと資本コスト率の測定が必須となる。しかし，企業環境の変化の激しい現代においては，将来キャッシュ・フローの予測にかなりの不確実性を伴うし，資本コスト率の測定には困難性を伴う。すなわち，計算ないし決定要素そのものの測定自体が困難であり，予測の正確性が低ければ，評価結果の信頼性も減退してしまうという問題がある。"],"k":["将来キャッシュ・フローの予測","不確実性","資本コスト率の測定","困難性"],"kg":[{"l":"","w":["将来キャッシュ・フローの予測","不確実性","資本コスト率の測定","困難性"]}],"e":["最も理論的な方法とされる割引キャッシュ・フロー法ではあるが，将来キャッシュ・フローや資本コスト率の測定が必要となるため，現実的にはその利用に困難性を伴うことになる。実態調査によれば，日本企業では割引キャッシュ・フロー法はあまり利用されていない。これは，上記２つの問題点の他に，割引計算や資本コスト率といった概念が理解しづらいこと，回収期間の短い投資案を優先したり，投資案の採否の判定に短い基準回収期間(目標回収期間)を設定すれば，近い将来のキャッシュ・フローを重視するという割引キャッシュ・フロー法と同じような分析が可能であることなどの要因が関連しているものと考えられる。","なお，企業価値評価のツールとしては，継続価値の算定に関連して，評価額の大半が極めて信頼性の低い予測値によって構成されてしまうという問題が指摘される。"],"f":"p2_9-10.webp","p":"p2_9-10_past.webp"},{"id":"9-11","b":"p2","c":9,"n":11,"t":"日本企業が回収期間法を選好する理由","i":"B","y":"B","q":["実態調査によれば，日本企業においては，設備投資の経済性計算に際して回収期間法が広く採用されているという。そこで，その理由について，現代の企業環境を踏まえて検討しなさい。"],"a":["現代の企業環境は変化が早く，不確実性の程度が高いため，これに備えるには早期に資金を回収する必要がある。ここで，投資案の回収期間が短いということは，資金回収後の変化に耐えうるということであるから，その意味では，回収期間の短い投資案を優先することに合理性が認められる。以上より，日本企業においては，不確実性に対処する意図をもって，回収期間法が広く採用されているものと考えられる。"],"k":["不確実性","早期に資金を回収","資金回収後の変化"],"kg":[{"l":"","w":["不確実性","早期に資金を回収","資金回収後の変化"]}],"e":["実態調査によれば，日本企業における回収期間法の採用比率は，一般に理論的とされる割引キャッシュ・フロー法よりも高くなっている(図表９-13)。その理由>としては，計算が簡単で理解しやすいという点もあげられようが，現代の企業環M境を考慮すれば，不確実性への対処能力の高い投資案を優先するという企業マインドの表れであると考えられる。","なお，既に見たとおり，回収期間の短い投資案を優先したり，投資案の採否の判定に当たって短い基準回収期間(目標回収期間)を設定したりすれば，結果的には，近い将来のキャッシュ・フローを重視するという割引キャッシュ・フロー法と同様の分析が可能となるし，回収期間の短い投資案は正味現在価値も大きくなるのが通常である。つまり，回収期間法は，安全性に関する情報を明示する一方で，黙示的に収益性に関する情報もアウトプットしていると見ることができる。以上の点もまた，日本企業において回収期間法が選好される要因の１つと考えられる。"],"f":"p2_9-11.webp","p":""},{"id":"9-12","b":"p2","c":9,"n":12,"t":"米国企業が内部利益率法を選好する理由","i":"B","y":"B","q":["実態調査によれば，米国企業における内部利益率法の採用比率は，最も理論的とされる正味現在価値法のそれを上回るといわれる。その背景には，両方法における資本コスト率の機能の相違があると考えられる。以上の点を踏まえ，米国企業が内部利益率法を広く採用する理由を推測しなさい。"],"a":["正味現在価値法においては，資本コスト率は将来キャッシュ・フローの割引率として機能するため，正味現在価値の計算に当たっては，資本コスト率の測定が必須となる。","一方，内部利益率法においては，資本コスト率は投資案の採否を決定するための切捨率として機能するため，決定に当たっては資本コスト率の測定を要するものの，その計算自体には，資本コスト率の測定を要さない。そこで，内部利益率が資本コスト率を上回る一般的な状況を前提とすれば，内部利益率法を採用することによって，資本コスト率の測定という困難な問題を回避することが可能であり，利便性が高い。以上より，米国企業は内部利益率法を広く採用しているものと推測される。"],"k":["割引率","切捨率","資本コスト率の測定","利便性"],"kg":[{"l":"","w":["割引率","切捨率","資本コスト率の測定","利便性"]}],"e":["正味現在価値法と内部利益率法では，資本コスト率の機能が異なる。割引率として機能する正味現在価値法においては計算に当たって資本コスト率の測定が不可欠であるが，切捨率として機能する内部利益率法においては決定に当たって資本コスト率が必要となるのみで，内部利益率自体は資本コスト率とは無関係に将来キャッシュ・フローから直接的に計算される。ここで，資本コスト率の測定には困難性を伴うため，計算に当たってその問題を回避しうるという点は，内部利益率法のメリットと見ることができる。米国企業においては，正味現在価値法よりも内部利益率法の採用比率の方が高いという報告があるが(図表９-14)，その背景には，実質的には資本コスト率の測定を要さないという内部利益率法の利便性が関連しているものと考えられる。すなわち，内部利益率が資本コスト率を上回る一般的な状況を前提とすれば，内部利益率の高い投資案を上から順番に選択していけば，正味現在価値法を採用していた場合と同じ合理的な意思決定が可能と考えられるからである。","なお，正味現在価値法と内部利益率法における資本コスト率の機能の相違は，相互排他的な投資案の順位付けの相違として表れる場合がある。"],"f":"p2_9-12.webp","p":""},{"id":"9-13","b":"p2","c":9,"n":13,"t":"総額法による取替投資の意思決定","i":"B","y":"B","q":["取替投資の正味現在価値計算においては，現有設備案と新規設備案の差額を直接計算する差額法と，現有設備案と新規設備案を別個に計算する総額法とがある。後者による場合，現有設備の現在時点の売却に関連するキャッシュ・フローについては，①現有設備案の正味現在価値計算に計上する方法と，②新規設備案の正味現在価値計算に計上する方法とがある。そこで，それぞれの方法の論拠を説明しなさい。"],"a":["①現有設備案の正味現在価値計算に計上する方法の論拠","ここでの新規設備案とは，新規設備を購入する案であって，現有設備を取り替える案ではない。すなわち，新規設備の購入と現有設備の売却は別問題であるから，現有設備の現在時点の売却に関連するキャッシュ・フローは，現有設備を継続使用することによる機会原価として，現有設備案の正味現在価値計算に計上すべきである。","②新規設備案の正味現在価値計算に計上する方法の論拠","ここでの新規設備案とは，現有設備を新規設備に取り替える案を意味する。すなわち，新規設備の購入は現有設備の売却を前提とすることから，現有設備の現在時点の売却に関連するキャッシュ・フローは，新規設備を購入するための資金の一部として，新規設備案の正味現在価値計算に計上すべきである。"],"k":["新規設備の購入","現有設備の売却","機会原価","購入資金"],"kg":[{"l":"","w":["新規設備の購入","現有設備の売却","機会原価","購入資金"]}],"e":["取替投資の意思決定においては，現有設備案(現有設備を継続使用する現状維持案)と新規設備案という２つの代替案があるが，これを現在時点に限定してより細かく見れば，⑴現有設備を維持する，⑵現有設備を売却する，⑶新規設備を購入するという３つの行動代替案がある。本問は，⑵に関連するキャッシュ・フローを⑴と⑶のいずれに含めるべきかという議論である(図表９-15)。","いま，新規設備の購入と現有設備の売却を紐付きで捉えず，両者を別問題として捉えれば，現有設備の売却による収入は，現有設備案のキャッシュ・アウトフローとして計上される。これは，現在時点で売却していれば得られたはずのキャッシュ・インフローを，現有設備を継続使用することによる機会原価として捉えることを意味する。一方，新規設備の購入と現有設備の売却を紐付きで捉えれば，現有設備の売却による収入は，新規設備案のキャッシュ・インフローとして計上される。これは，現有設備の売却による収入を新規設備の購入資金の一部として捉えることを意味する。"],"f":"p2_9-13.webp","p":""},{"id":"9-14","b":"p2","c":9,"n":14,"t":"取替投資における未償却残高の取り扱い","i":"B","y":"B","q":["取替投資の正味現在価値計算において，現有設備の取替時点の未償却残高がどのように取り扱われるかを，法人税等への影響を考慮しない場合と法人税等への影響を考慮する場合に分けて説明しなさい。"],"a":["現有設備の未償却残高は，設備取替の影響を受けない支出済みの過去原価であり，キャッシュ・アウトフローを伴わない。したがって，法人税等への影響を考慮しない場合には，意思決定に無関連な埋没原価である。","ただし，法人税等への影響を考慮する場合には，取替時点の見積売却価額が未償却残高を下回れば，売却損の損金算入によってキャッシュ・アウトフローとしての法人税等の金額が減少するため，その税効果については差額原価(差額キャッシュ・フロー)として取り扱う必要がある。"],"k":["支出済みの過去原価","キャッシュ・アウトフロー","埋没原価損金算入","法人税等の減少額","差額原価(差額キャッシュ・フロー)"],"kg":[{"l":"","w":["支出済みの過去原価","キャッシュ・アウトフロー","埋没原価損金算入","法人税等の減少額","差額原価(差額キャッシュ・フロー)"]}],"e":["取替投資の正味現在価値計算において，現有設備の未償却残高は支出済みの過去原価の一部(未回収分)であり，本来は，埋没原価として無視されなければならない。ただし，法人税等への影響を考慮する場合には，見積売却価額が未償却残高(帳簿価額)を下回れば，売却損に税率を掛けた分だけキャッシュ・アウトフローとしての法人税等の金額が減少するため，これをキャッシュ・インフローとして認識する必要がある(図表９-16)。","なお，設備取替によって売却損益が生じる場合，その税効果を計上するタイミングが問題となるが，通常は法人税等の支払を含む期間のキャッシュ・フローが年度末にまとめて発生するという仮定がおかれるため，売却時点が会計期末か会計期首かによって判断すればよい(図表９-17)。すなわち，売却時点が会計期末(20X1年３月期末)であれば，売却損益は20X1年３月期の課税所得の計算に算入され，現在時点(20X1年３月期末)で税効果が生じると考えるのに対し，売却時点が会計期首(20X1年４月１日)であれば，売却損益は20X2年３月期の課税所得の計算に算入され，１年後(20X2年３月期末)に税効果が生じると考えるのである。"],"f":"p2_9-14.webp","p":""},{"id":"9-15","b":"p2","c":9,"n":15,"t":"金融キャッシュ・フローの取り扱い①","i":"B","y":"B","q":["プロジェクト自体のキャッシュ・フロー以外に，金融キャッシュ・フローを投資案の正味現在価値計算に含めることの是非について，支払利息のみを含めることを前提として検討しなさい。"],"a":["正味現在価値の計算においては，割引計算の中で既に利子要素を考慮していることから，金融キャッシュ・フローのうち支払利息のみを含めて計算すれば，利子要素が二重に計算される結果として，正味現在価値が過小に評価されてしまう。","以上より，金融キャッシュ・フローのうち，支払利息のみを含めて投資案の正味現在価値計算を行うのは妥当でない。"],"k":["割引計算","利子要素","二重計算","過小評価"],"kg":[{"l":"","w":["割引計算","利子要素","二重計算","過小評価"]}],"e":["いま，ある投資プロジェクトの採否を検討しており，以下の〔資料〕が得られたものとする。〔資料〕","この場合，プロジェクト自体のキャッシュ・フローのみで正味現在価値を計算すると，資本コスト率に借入利率を使用する場合にはプラスとなるが，資本コスト率に加重平均資本コスト率を使用する場合にはマイナスとなり，後者においては投資不適格と判断される(図表９-18)。","一方，毎年の支払利息を各年度のキャッシュ・フローに含めて計算すると，資本コスト率に借入利率と加重平均資本コスト率のどちらを使用しても正味現在価値はマイナスとなり，プロジェクト自体のキャッシュ・フローのみで計算する場合と比べて，過小に評価される(図表９-18)。これは，割引計算において利子要素が考慮するにもかかわらず，キャッシュ・フロー計算において支払利息を控除すれば，利子要素が二重に計算されるためである。","以上より，金融キャッシュ・フローのうち支払利息のみを含めて計算すれば，意思決定を誤る恐れがあるため，これを含めるべきでないという結論に至る。"],"f":"p2_9-15.webp","p":""},{"id":"9-16","b":"p2","c":9,"n":16,"t":"金融キャッシュ・フローの取り扱い②","i":"C","y":"C","q":["プロジェクト自体のキャッシュ・フロー以外に，金融キャッシュ・フローを投資案の正味現在価値計算に含めることの是非について，借入，返済を含む全ての金融キャッシュ・フローを含めることを前提として検討しなさい。ただし，資本コスト率として，借入利率と加重平均資本コスト率の双方を想定すること。"],"a":["資本コスト率に借入金利を用いる場合には，全ての金融キャッシュ・フローの正味現在価値がゼロになることから，これらを含めて計算しても，プロジェクト・キャッシュ・フローのみを考慮する場合と同一の計算結果が得られるので問題はない。","しかし，資本コスト率に加重平均資本コスト率を用いる場合には，低利で借り入れた資金を高利で運用できると仮定することになり，金融キャッシュ・フローの正味現在価値がプラスになる結果として，プロジェクト・キャッシュ・フローのみを考慮する場合と比べて正味現在価値が過大に評価されてしまう。","したがって，金融キャッシュ・フローを正味現在価値計算に含めるべきか否かという問題は，資本コスト率として借入金利と加重平均資本コスト率のいずれを用いるのが妥当であるかという問題に帰着する","ここで，資金の調達と運用は別問題であるし，設備投資が長期的見地からなされる以上，投資資金も長期的見地から調達した資金プールの中から使用されると考えるべきであり，特定の投資案の評価に際して借入による資金調達を前提とすることは妥当でない。","以上より，資本コスト率としては加重平均資本コスト率を用いるのが妥当であり，この場合に，金融キャッシュ・フローを含めて正味現在価値計算を行うのは妥当でない。"],"k":["金融キャッシュ・フローの正味現在価値","資金の調達と運用","長期的見地"],"kg":[{"l":"","w":["金融キャッシュ・フローの正味現在価値","資金の調達と運用","長期的見地"]}],"e":["問題９-15の数値例において，借入と返済を含む全ての金融キャッシュ・フローを含めた場合の計算を検討してみよう。まず，資本コスト率に借入利率を使用する場合，全ての金融キャッシュ・フローを含めて計算した場合の正味現在価値は，プロジェクト自体のキャッシュ・フローのみで計算した場合の正味現在価値とほ>ぼ同じになる。これは，資本コスト率に借入利率を使用する場合には，金融キMャッシュ・フローの正味現在価値がゼロになるからである。したがって，資本コスト率に借入利率を使用することを前提とすれば，金融キャッシュ・フローを計算に含めることに問題はないということになる(図表９-19)。","一方，資本コスト率に加重平均資本コスト率を使用する場合，全ての金融キャッシュ・フローを含めて計算した場合の正味現在価値は，プロジェクト自体のキャッシュ・フローのみで計算した場合の正味現在価値よりも大きくなり，プラスに転じることで投資適格という誤った評価になる。これは，低利で借り入れた資金を高利で運用できると仮定する結果，金融キャッシュ・フローの正味現在価値がプラスとなるからである。したがって，資本コスト率に加重平均資本コスト率を使用する場合には，金融キャッシュ・フローを計算に含めることは妥当でないということになる(図表９-20)。","以上より，議論は「資本コスト率として，借入利率と加重平均資本コスト率のいずれが妥当であるか」という問題に帰着する。この点，長期的な設備投資の性質からすれば，理論的には加重平均資本コスト率を用いるのが妥当であるから，金融キャッシュ・フローは正味現在価値の計算に含めるべきでないという結論に至る。","参考：現価係数を使用した場合の正味現在価値(網掛部分の計算)","資本コスト率に借入利率を使用する場合の正味現在価値","＝267.6(金融ＣＦを含めない場合のＮＰＶ)－0.45","＝267.15","参考：現価係数を使用した場合の正味現在価値（網掛部分の計算）","資本コスト率にＷＡＣＣを使用する場合の正味現在価値","＝△16.8(金融ＣＦを含めない場合のＮＰＶ)＋374.1","＝357.3→投資適格？"],"f":"p2_9-16.webp","p":""},{"id":"9-17","b":"p2","c":9,"n":17,"t":"割引キャッシュ・フロー法にリスクを取り込む方法","i":"B","y":"B","q":["不確実性等のリスクを割引キャッシュ・フロー法に取り込むための方法について，計算要素であるキャッシュ・フローと資本コスト率に着目してそれぞれ説明しなさい。"],"a":["１つは，資本コスト率ではなくキャッシュ・フローを調整する方法であり，将来の不確実なキャッシュ・フローを確実性等価に変換し，これを安全利子率で割り引くものである。","もう１つは，キャッシュ・フローではなく資本コスト率を調整する方法であり，将来の不確実なキャッシュ・フローをリスク調整割引率(＝安全利子率＋リスク・プレミアム)で割り引くものである。"],"k":["確実性等価","安全利子率","リスク調整割引率"],"kg":[{"l":"","w":["確実性等価","安全利子率","リスク調整割引率"]}],"e":["割引キャッシュ・フロー法(正味現在価値法)はキャッシュ・フローと資本コスト率を計算要素とするものであるから，その中にリスクを取り込むには，キャッ>シュ・フローと資本コスト率のいずれかを調整する必要がある。一般に，キャッMシュ・フローを調整する方法を①確実性等価法，資本コスト率を調整する方法を②リスク調整割引率法という。これらの方法を直感的に理解するためには，それぞれの簡便法を押さえるのがよい。つまり，①確実性等価法は，簡便的にはキャッシュ・フローの見積りを保守的に行うことによって代替されるし，②リスク調整割引率法は，簡便的には資本コスト率を高く見積もることによって代替される(図表９-21)。"],"f":"p2_9-17.webp","p":""},{"id":"9-18","b":"p2","c":9,"n":18,"t":"割引キャッシュ・フロー法による企業価値評価の方法","i":"B","y":"B","q":["割引キャッシュ・フロー法による企業価値評価の方法には，企業全体へのフリー・キャッシュ・フロー(freecashflowtofirm；ＦＣＦＦ)を用いる方法と，株主持分へのフリー・キャッシュ・フロー(freecashflowtoequity；ＦＣＦＥ)を用いる方法とがある。そこで，２つの方法の相違点を説明しなさい。"],"a":["ＦＣＦＦは債権者持分と株主持分の双方に帰属する利払前，配当前のキャッシュ・フローであるから，これを用いる方法では，割引率として加重平均資本コスト率を使用し，その現在価値総額は有利子負債を含む企業全体の価値を示す。","一方，ＦＣＦＥは株主持分に帰属する利払後，配当前のキャッシュ・フローであるから，これを用いる方法では，割引率として株主資本コスト率を使用し，その現在価値総額は株主持分の評価額(株主価値)を示すという点で相違する。"],"k":["利払前","利払後","配当前","加重平均資本コスト率","株主資本コスト率企業価値","株主価値"],"kg":[{"l":"","w":["利払前","利払後","配当前","加重平均資本コスト率","株主資本コスト率企業価値","株主価値"]}],"e":["企業価値評価のアプローチには，①インカム・アプローチ，②マーケット・アプローチ，③ネット・アセット・アプローチがある(図表９-22)。","①は，企業の将来の予想利益や予想キャッシュ・フローを用いて企業価値を評価するアプローチ，②は，同業他社や類似取引事例などと比較することによって企業価値を相対的に評価するアプローチ，③は，貸借対照表の純資産の部に着目して，株式の評価を行うアプローチをいう。","ここで，インカム・アプローチによる企業価値評価は割引キャッシュ・フロー法に代表されるが，割引キャッシュ・フロー法による企業価値評価の方法にはＦＣＦＦを用いる方法とＦＣＦＥを用いる方法とがある。前者は利払前のキャッシュ・フロー(債権者と株主の双方に帰属)，後者は利払後のキャッシュ・フロー(株主のみに帰属)であるから，割引計算に当たって有利子負債の資本コスト率を含めるか否か，評価額が債権者持分を含むか否かという相違が生じることになる。(図表９-23)。","なお，厳密には，将来のＦＣＦＦの現在価値総額は事業用資産を利用して行う事業活動の対価としての「事業価値」であり，これに非事業用資産(金融資産や遊休資産など)を加えたものが企業価値，企業価値から有利子負債の時価評価額を控除した残りが株主価値となる(図表９-24)。"],"f":"p2_9-18.webp","p":""},{"id":"9-19","b":"p2","c":9,"n":19,"t":"割引キャッシュ・フロー法による企業価値評価の問題点","i":"B","y":"B","q":["割引キャッシュ・フロー法による企業価値評価の最大の問題点を明らかにしなさい。"],"a":["割引キャッシュ・フロー法による企業価値評価においては，予測期間を超える期間について，キャッシュ・フローが一定率で永久に成長し続けるという非現実的な仮定を設けている。また，同期間のキャッシュ・フローの継続価値は成長率の見積如何によって大きく変動する上に，企業価値評価額に占める割合も極めて高い。すなわち，企業価値評価額の大半が，極めて信頼性の低い予測値によって構成されてしまうという点が最大の問題であるといえる。"],"k":["予測期間を超える期間","永久成長","成長率","継続価値","信頼性"],"kg":[{"l":"","w":["予測期間を超える期間","永久成長","成長率","継続価値","信頼性"]}],"e":["割引キャッシュ・フロー法による企業価値評価の手順を示せば，次の通りである(図表９-25参照)。","①予測可能な期間(３～５年程度)についてＦＣＦを見積もる。","②予測期間を超える期間のＦＣＦの発生パターンを仮定する。","③予測期間を超える期間のＦＣＦの予測期間最終年度における継続価値を","ここでまず問題となるのは，将来の全てのキャッシュ・フローを予測することが不可能である以上，②の段階で，キャッシュ・フローが一定率で永久に成長し続けるという非現実的な仮定を設けざるをえないという点である。したがって，予測期間を超える期間のキャッシュ・フローの予測の精度は極めて低い。次に，③の段階で予測期間を超える期間の継続価値を算定するが，その金額は②の成長率の見積如何で大きく変動する上に，⑥で計算される企業価値評価額の大半を構成することになる。つまり，企業価値評価額の大半が極めて信頼性の低い予測値によって構成されてしまうのであって，モデルとしての理論的妥当性はさておき，その信頼性には問題があるといわざるをえないのである。","なお，②の段階の成長率の見積りに当たっては，資本コスト率＞成長率という条件が必要となる。資本コスト率よりも高い成長率を予定すれば，③の継続価値の計算に不備が生じるためである。"],"f":"p2_9-19.webp","p":""},{"id":"10-1","b":"p2","c":10,"n":1,"t":"標準原価計算の現代的意義","i":"A","y":"A","q":["近年，「標準原価計算の役割は終わった」とする見解があるが，①その意味を説明し，②見解の妥当性について検討しなさい。"],"a":["①見解の意味","近年は，工場自動化の進展により生産の担い手が直接工から機械・設備へと移行したため，標準原価計算による能率管理の対象が失われ，その管理になじまない機械・設備関連の製造間接費(固定費)が増加している。また，製品仕様が頻繁に変更される上に，製品のライフサイクルが短いため，標準原価の設定自体が困難なものとなっている。","このように，標準原価計算による原価管理の前提条件が大きく崩れ去ったため，その意味で，役割は終わったといわれるのである。","②見解の妥当性","標準原価計算による原価管理機能が従来よりも低下したことは確かであるが，標準原価を用いた原価維持活動は，原価企画や原価改善といった原価低減活動をサポートする上で不可欠である。また，計算・記帳の簡略化・迅速化という観点では，標準原価計算は依然として有効な計算技法である。","以上より，標準原価計算の役割は終わったとする見解は妥当でない。"],"k":["工場自動化","生産の担い手","能率管理","間接費","製品仕様の変更","ライフサイクルの短縮化","標準の設定","原価維持","計算・記帳の簡略化・迅速化"],"kg":[{"l":"","w":["工場自動化","生産の担い手","能率管理","間接費","製品仕様の変更","ライフサイクルの短縮化","標準の設定","原価維持","計算・記帳の簡略化・迅速化"]}],"e":["標準原価計算による原価管理機能が有効に機能するためには，①生産条件が安定した状態にあること(標準の設定自体が容易であること)，②生産が直接工の反復的作業に依存していること(能率管理の対象が存在すること)が前提条件となる。したがって，従来の少品種大量生産方式の下では，標準原価計算は直接工の能率管理の手段として有効な手法であった。","しかしながら，顧客ニーズの多様化に伴い，加工組立型産業では多品種少量生産方式への移行を迫られた。その結果，ＦＭＳやＣＩＭの導入などの製造環境の変化が進展し，それは，直接労務費の減少と，機械・設備関連の製造間接費(固定費)の増加という原価構造の変化をもたらした。これは，標準原価計算による主たる管理対象の喪失と管理になじまない項目の増加を意味し，その原価管理機能の有効性を低下させることになった。また，製品仕様が頻繁に変更される結果，標準原価の改訂が生産開始に間に合わなかったり，さらには標準原価が安定しかけた頃には生産が打ち切りになったりするケースがあるなど，標準原価の設定自体が困難であるという点も，標準原価計算の原価管理上の現代的意義を希薄なものにしている１つの要因である。","ただし，標準規格製品を量産するような旧来型の生産方式を採る工場においては，標準原価計算は依然として能率管理の手段として有効であるし，多種類の製品を混合生産する自動化が進展した工場においても，原価維持活動が原価管理システムの一端を担うことには変わりない。そして何より，標準原価計算制度の基本目的である計算・記帳の簡略化・迅速化への役立ちは，上記の企業環境の変化に影響されるものではない。","以上より，加工組立型産業を中心に標準原価計算による原価管理の有効性が従来よりも低下したことは事実であるが，それをもって標準原価計算の役割は終わったとするのは妥当でないことに注意する。"],"f":"p2_10-1.webp","p":""},{"id":"10-2","b":"p2","c":10,"n":2,"t":"原価低減と源流管理の重要性","i":"A","y":"B","q":["現代企業においては，原価低減の重要性が従来よりも高くなっているとされる。その理由を説明し，劇的な原価低減を実現するためには，製品化プロセスのどの段階で原価低減を実施する必要があるかを明らかにしなさい。"],"a":["従来の少品種大量生産方式のもとでは，生産量が累積するにつれ，量産効果によって製品の原価は惰性で低減し，これを標準原価管理を用いて維持していけばよかった。しかし，製品ライフサイクルの短縮化と多品種少量生産方式の導入により，今日ではこの量産効果を享受することができないため，企業自らが原価低減を行う重要性が従来よりも高くなっているのである。","ここで，原価の多くは量産段階で発生はするものの，その大部分は，製品の企画・設計段階で発生額が決定してしまう。すなわち，量産段階での原価低減の余地は殆どないため，劇的な原価低減を実現するためには，企画，設計といった製品開発の源流において原価低減を実施する必要がある。"],"k":["量産効果","原価の発生","量産段階","原価の決定","企画・設計段階"],"kg":[{"l":"","w":["量産効果","原価の発生","量産段階","原価の決定","企画・設計段階"]}],"e":["従来の少品種大量生産方式のもとでは，製品の原価曲線は生産量が累積するにつれて惰性で低減したため，そもそも原価低減の重要性が認識されることはなく，原価管理といえば実際原価が標準原価から逸脱することのないようにコントロールする原価維持ないし原価統制が主流であった。しかしながら，現代の企業環境においては，もはや従来のような量産効果を享受することは困難であるため，企業自らが原価曲線を下方にシフトさせる必要がある(図表10-２)。これは，「原価を一定水準に維持する」という思考から「原価そのものを引き下げる」という思考へのパラダイムシフトを意味する。","そこで，原価低減の重点をどこに置くかが問題となるが，原価の大半は製品の企画・設計段階で決定してしまうため，量産段階での原価低減の余地は非常に少なく，限界がある(図表10-３)。そこで，劇的な原価低減を実現するためには，量産開始前の製品化プロセスの上流に原価引き下げの視点を移し，源流管理を行うことが重要となる。"],"f":"p2_10-2.webp","p":"p2_10-2_past.webp"},{"id":"10-3","b":"p2","c":10,"n":3,"t":"原価管理の体系","i":"A","y":"B","q":["現代的な意味での原価管理(コスト・マネジメント)の体系を明らかにしなさい。"],"a":["現代的な意味での原価管理とは，利益管理の一環としての原価管理を意味し，原価低減と原価維持(原価統制)からなる。","原価低減とは，利益目的から原価自体を計画的に引き下げる活動であり，新製品の企画・設計段階で見積原価を目標原価まで引き下げる原価企画と，現行製品の量産段階で実際原価を標準原価以下に引き下げる原価改善とからなる。","一方，原価維持(原価統制)とは，現行製品の量産段階で，標準原価管理や予算管理によって実際原価を標準原価に合致させる活動をいい，「原価計算基準」が規定する狭義の原価管理に相当する。"],"k":["利益管理","原価低減","原価企画","原価改善","原価維持","新製品","企画・設計段階","現行製品","量産段階","目標原価","見積原価","標準原価","実際原価"],"kg":[{"l":"","w":["利益管理","原価低減","原価企画","原価改善","原価維持","新製品","企画・設計段階","現行製品","量産段階","目標原価","見積原価","標準原価","実際原価"]}],"e":["現代的な意味での原価管理とは，利益管理の一環としての広義の原価管理(コスト・マネジメント)であり，原価自体を計画的に引き下げる原価低減ないし原価計画を含む概念として定義される(図表10-４)。","ここで，原価企画，原価改善，原価維持は，相互にリンクしてはじめてコスト・マネジメントとしての効果を発揮することに注意しなければならない。すなわち，原価企画活動において作り込まれた目標原価は，量産開始後は標準原価として製造現場に指示されるが，量産段階においては，原価維持活動によって実際原価を標準原価に合致させる努力を行う一方で，原価改善活動によって実際原価を標準原価以下に引き下げ，それをまた次期以降の原価維持活動に反映させるのである"],"f":"p2_10-3.webp","p":"p2_10-3_past.webp"},{"id":"10-4","b":"p2","c":10,"n":4,"t":"日米で異なるコスト・マネジメントが台頭した理由","i":"B","y":"B","q":["1980年代の後半，日本と米国でほぼ時を同じくして，その後のコスト・マネジメントの方向性を決定付けるような，全く異なるツールが台頭したといわれている。そこで，日米で台頭したツールをそれぞれ指摘し，なぜ全く異なるツールが台頭したのかを，両国の自動車産業の製造環境の相違を念頭において説明しなさい。"],"a":["日本では原価企画が，米国では活動基準原価計算(ＡＢＣ)と活動基準原価管理(ＡＢＭ)が台頭したといわれる。このように異なるツールが台頭した背景には，外注依存度の相違がある。すなわち，日本のメーカーは外注比率が極端に高かったため，買入部品費を中心とする直接費の削減に目が向けられたのに対し，米国のメーカーは内製比率が相対的に高かったため，設備等に相当の資金が必要となり，間接費の削減に目が向けられたものと考えられる。"],"k":["外注比率","直接費","原価企画","内製比率","間接費","ＡＢＣ／ＡＢＭ"],"kg":[{"l":"","w":["外注比率","直接費","原価企画","内製比率","間接費","ＡＢＣ／ＡＢＭ"]}],"e":["トヨタ自動車が開発した原価企画の起源は1960年代に遡るが，他の企業や他の加工組立型産業に本格的に浸透したのは1980年代の後半であるといわれる。同じ頃，米国では間接費の計算システムとしてのＡＢＣが提唱され，ＡＢＣ情報に基づく原価管理手法としてのＡＢＭとともに，米国産業の斜陽を回復させるための管理会計の切り札として台頭を見せた。このような相違が生じた原因は，自動車産業を中心とする日米の外注依存度と，それに基づく原価構造の相違にあると見ることができる。","ここで，日本企業においても，多品種少量生産を実現するための工場自動化の>結果として，機械・設備関連のコストや，段取，マテハン，設計など製造活動のM複雑化・多様化に伴う活動コストが増加したことは事実である。ただし，日本の自動車メーカー(完成品メーカー)は，サプライヤーが納入した部品を組み立てるアセンブラー(アセンブリー・メーカー，最終組立メーカー)であり，その製造原価の80％近くは直接材料費であるといわれる(図表10-６)。そのような業種においては，間接費配賦の精緻化やその低減が工場経営に与える影響は，米国企業に比べると圧倒的に小さかったはずである。したがって，日本の加工組立型産業においてＡＢＣが殆ど浸透せず，むしろ原価企画による直接費の削減に焦点が当てられたのは，至極当然の流れであったといえる。","１石油88.7％ゴム22.2％その他製造業62.4％","３精密機器70.6％医薬品18.0％その他輸送機器35.2％","５電機機器63.4％その他輸送機器14.6％鉄鋼33.8％"],"f":"p2_10-4.webp","p":""},{"id":"10-5","b":"p2","c":10,"n":5,"t":"原価企画の目的","i":"A","y":"B","q":["原価企画は原価低減のためのシステムであると同時に，戦略的利益管理のためのシステムであるともいわれる。そこで，原価企画の目的について説明しなさい。"],"a":["原価企画の目的は，マーケット・イン，開発リードタイムの短縮，高品質の維持といった諸要素を勘案した上で新製品の原価を引き下げることによって，魅力的な新製品を低価格でタイムリーに市場に投入し，全社的な中期利益計画の達成に貢献しうる目標利益を確保することにある。すなわち，コスト・リーダーシップ戦略と差別化戦略の両者を同時的に追求することを目的とする。"],"k":["マーケット・イン","開発リードタイム","高品質","原価低減","競争優位中期利益計画","目標利益","コスト・リーダーシップ戦略","差別化戦略"],"kg":[{"l":"","w":["マーケット・イン","開発リードタイム","高品質","原価低減","競争優位中期利益計画","目標利益","コスト・リーダーシップ戦略","差別化戦略"]}],"e":["原価企画のコアは見積原価を目標原価まで引き下げる活動にあることから，原価企画＝原価低減手法としての評価が一般的である。しかし，単なる原価の引き下げであれば，製品に必要な機能を切り捨てるなどの安易な手法でも実現できる。原価企画では，あくまでも市場ないし顧客志向を念頭におき，魅力的な製品を低価格でタイムリーに市場に投入することを目的とする。すなわち，コスト・リーダーシップ戦略と差別化戦略の同時的な実現に寄与することが期待されており，競争優位(目標利益)の獲得に真の狙いがあるといえる。","ここで，原価企画のプロセスを大まかに示せば，図表10-７のようになる。"],"f":"p2_10-5.webp","p":""},{"id":"10-6","b":"p2","c":10,"n":6,"t":"目標原価の設定方法","i":"A","y":"B","q":["原価企画における目標原価の設定方法は，控除法(割付法，販売価格基準法)と積上げ法(見積原価基準法)に大別されるが，それぞれを簡潔に定義した上で，そのメリット・デメリットを説明しなさい。"],"a":["控除法とは，販売価格から目標利益を控除して算定した許容原価を目標原価とする方法をいう。したがって，市場の意向とトップの意向の双方を勘案した目標原価を算定することが可能であり，戦略的に目標利益を確保するという原価企画の目的に最も適うというメリットがある。反面，現状の技術水準が考慮外となっているため，達成可能性の観点で問題があり，設計担当エンジニアの挑戦意欲を減退させる可能性があるというデメリットがある。","一方，積上げ法とは，現状の技術水準に基づく成行原価を積み上げ，これに原価低減目標額を加味して目標原価を設定する方法をいう。したがって，目標原価に技術的な裏付けがあり，設計担当エンジニアの理解や同意を得やすいというメリットがある。反面，目標原価の設定に当たって，市場やトップの意向が考慮されないため，戦略的に目標利益を確保するという目的に原価企画を活用することは困難になるというデメリットがある。"],"k":["許容原価","市場やトップの意向","成行原価","現状の技術水準戦略的利益管理","設計担当エンジニア"],"kg":[{"l":"","w":["許容原価","市場やトップの意向","成行原価","現状の技術水準戦略的利益管理","設計担当エンジニア"]}],"e":["潜在的顧客が喜んで支払ってくれるであろう目標販売価格から，中期利益計画Mから導かれた目標利益を控除して算定した原価を許容原価といい，許容原価をもって目標原価とする方法を控除法という(図表10-８)。この方法は，市場の意向(価格)とトップの意向(利益)の双方を勘案していることから，「魅力的な新製品を低価格で市場に投入し，中期利益計画の達成に貢献する目標利益を確保する」という原価企画の目的には最も適っている。しかしながら，目標原価に設計担当エンジニアの意向が反映されていないため，厳格度からすると最も厳しい目標となり，それが斬新なアイデアをもたらす誘因となることもあるが，むしろ設計担当エンジニアの挑戦意欲を減退させるリスクの方が高いという問題がある。","一方，現状の技術水準を基礎として，既存製品の原価に新規に追加する機能の原価を加算し，省略する機能の原価を控除することによって見積もった原価を成行原価といい，これに原価低減目標を加味して目標原価とする方法を積上げ法という(図表10-９)。この方法は，目標原価に技術的な裏付けがあるという意味で技術志向の設定方法であり，設計担当エンジニアの理解や同意を得やすい反面，市場の意向(価格)とトップの意向(利益)が考慮外となっているため，上記の原価企画の目的に対する適合性という観点からすれば，不十分といわざるをえない。","以上のように，控除法と積上げ法には一長一短があるため，我が国の原価企画の実務では，両者の折衷法が広く採用されている(図表10-11）。すなわち，市場や>トップの意向と設計担当エンジニアの意向の双方を勘案した上で，許容原価と成M行原価の間に位置する水準に目標原価を設定するのである(図表10-10)。","なお，折衷法を採る場合でも，目標原価は許容原価寄りに設定することが多いといわれる。これは，達成可能ではあるが，かなり困難なレベルに目標原価を設定することによって，設計担当エンジニアの挑戦意欲を掻き立て，斬新なアイデアの創出を期待するという意識の表れであると考えられる。①目標売上から目標利益を控除して設定2417.4５8.11318.3②目標売上に目標利益率を乗じて設定1410.1６9.71521.1③許容原価と成行原価を擦り合わせて設定6547.13556.52636.6④成行原価に原価低減率を加味して設定1712.3５8.1７9.9⑤類似製品の実績を参考にして設定1510.91117.6８11.3⑥その他３2.2０0.0２2.8"],"f":"p2_10-6.webp","p":""},{"id":"10-7","b":"p2","c":10,"n":7,"t":"ライフサイクル・コストと原価企画の関係","i":"C","y":"B","q":["原価企画対象には，理想的にはライフサイクル・コスト(ＬＣＣ)の全てを含めるべきであるといわれるが，その理由を説明しなさい。"],"a":["近年，使用・維持コストや廃棄・処分コストなど，ユーザー側で発生するコストが増加しており，ユーザーは，購入原価ではなくライフサイクル・コスト全体の経済性を望む傾向にある。","ここで，ライフサイクル・コストの大半は製品の企画・設計段階で決定してしまうため，メーカーが製品競争力を高めるためには，自らが支出するコストとユーザー側で発生するコストとのトレードオフ関係に配慮しつつ，市場が要求する仕様を商品構想や製品設計にどれだけ反映させるのが最も有利かという判断が重要となる。したがって，原価企画対象には，理想的にはライフサイクル・コストの全てを含めるべきなのである。"],"k":["ＬＣＣ全体の経済性","企画・設計段階","メーカーコスト","ユーザーコストトレードオフ","信頼性","製品設計"],"kg":[{"l":"","w":["ＬＣＣ全体の経済性","企画・設計段階","メーカーコスト","ユーザーコストトレードオフ","信頼性","製品設計"]}],"e":["ライフサイクル・コストは，①研究開発費や製造原価のように，顧客が購入する前に企業で発生し，支出も企業が行うが，負担を価格に転嫁する部分，②使用・維持コストや廃棄・処分コストのように，購入後に発生し，ユーザーが支出・負担する部分，③水質汚濁や空気汚染のような外部不経済となっており，コミュニティーに負担を転嫁した社会コストに区分できる。","ここで，企業で発生する社会コストを除くコストは価格に転嫁されるため，ライフサイクル・コストの最終負担者はユーザーである。したがって，ユーザー側で発生するコストが増加傾向にある近年においては，ユーザーはライフサイクル・コスト全体の経済性に優れた製品を選択するようになってきている。","この場合，メーカーが競争優位を確保するためには，ライフサイクル・コスト全体の経済性を考慮した製品設計が重要となる。ライフサイクル・コストの大半は，メーカー側の製品の企画・設計段階で決定してしまうからである。具体的には，自らが支出するコストとユーザー側で発生するコストのトレードオフ分析を通じて，最低のライフサイクル・コストを実現する最適な信頼性を設計仕様に落とし込んでいく必要がある(図表10-12)。その意味においては，原価企画対象には，ライフサイクル・コストの全てを含めるのが理想的ということになる。","しかしながら，原価企画の実務においては，多くの企業が製造原価のみを原価企画対象としており，研究開発費や物流費を対象とする企業は少数にとどまっている。また，ユーザー側で発生する使用・維持コストなどを原価企画対象とする企業はさらに少数であるといわれる。"],"f":"p2_10-7.webp","p":""},{"id":"10-8","b":"p2","c":10,"n":8,"t":"ラグビー方式の製品開発","i":"A","y":"A","q":["原価企画における製品開発方式は，一般に，ラグビー方式といわれるが，その特徴を説明しなさい。"],"a":["ラグビー方式とは，職能横断的なチーム活動を中心として，異職種担当者がオーバーラップしながら同時並行的に製品開発を進める方式をいう。","ラグビー方式の製品開発のもとでは，設計担当エンジニアだけでなく関連部署の担当者が様々なアイデアを出し合うことになるため，大きな原価低減効果を期待できる。また，企画，設計，生産準備といった製品開発の各ステップが相互に重複して製品開発を進めることになるため，開発リードタイムの短縮を図ることができる。"],"k":["職能横断的","同時並行的","斬新なアイデア","原価低減効果","開発リードタイム"],"kg":[{"l":"","w":["職能横断的","同時並行的","斬新なアイデア","原価低減効果","開発リードタイム"]}],"e":["ラグビー方式とは，オーバーラップ方式ともいわれ，企業内の各職能部門が組織の壁を越えて共通の目標の実現に向けて一丸となって進むことを意味する。実務では，サイマルテニアス・エンジニアリング(simultaneousengineering)と呼ばれることが多い。このような方式が採られるのは，効果的な原価低減を実現するためには，設計部門だけでなく関連部署の担当者が様々なアイデアを出し合ってその英知を結集する必要があり，企画，設計，生産準備といった製品開発の各ステップが相互に重複して製品開発を進めることによって，開発リードタイムの短縮を図ることができるからである。例えば，製造に配慮した設計(designformanufacture；ＤＦＭ)や開発購買などは，ラグビー方式の製品開発の最たる例であるといえる。","一方，我が国のラグビー方式に対峙する製品開発方式として，欧米企業が伝統的に採用してきた「バトンタッチ方式」がある。バトンタッチ方式では，製品企画→製品設計→生産準備というプロセスにおいて各職能が連携することはなく，逐次的な製品開発が行われる。したがって，職能横断的な意見交流がないので原価低減効果は減退するし，何より開発リードタイムが長期化してしまうという問題がある。生産準備段階で設計上の問題が表面化し，もう一度図面を作り直すといった無駄が生じうるからである。","ここで，ラグビー方式の製品開発を基礎とする原価企画は，①部門間の垣根が低く社内的に協力関係を築きやすい，②系列文化を背景として，完成品メーカーと部品メーカーであるサプライヤーの協働が可能である，という日本企業の組織的文化を土壌として生まれたものであるといえる。一方で，欧米企業では，①分業化と専門化の結果として部門間の垣根が伝統的に高く，②完成品メーカーと部品メーカーは対立関係にあることが少なくなかった。したがって，伝統的に，原価企画の海外移転は困難であるとされてきた。しかしながら，近年では，コンセプト主導で日本企業の海外現地法人への導入が成功したという報告があるし，マニュアル化した原価企画ともいえるコンカレント・エンジニアリングが海外企業においても浸透しており，原価企画の海外移転の可能性は高まっている。"],"f":"p2_10-8.webp","p":""},{"id":"10-9","b":"p2","c":10,"n":9,"t":"原価企画におけるサプライヤー関係","i":"A","y":"B","q":["完成品メーカーの部品調達方法には，承認図方式と貸与図方式があるが，それぞれを簡潔に定義した上で，そのメリット・デメリットを説明しなさい。"],"a":["承認図方式とは，部品の基本設計は完成品メーカーが行うが，詳細設計はサプライヤーに委ねる方式をいう。したがって，設計コストの低減や革新的アイデアによる原価低減効果が期待できるとともに，開発リードタイムの短縮にも役立つというメリットがある。反面，承認図はサプライヤーに帰属するため，複社購買は困難となり，調達不能に陥るリスクが高くなるというデメリットがある。","一方，貸与図方式とは，完成品メーカーが詳細設計まで行い，その仕様にしたがってサプライヤーに製造させる方式をいう。この場合，貸与図は完成品メーカーに帰属するため，複社購買が可能となり，調達不能に陥るリスクを抑えることができるというメリットがある。反面，完成品メーカーが詳細設計まで行うため，設計コストがかさむとともに，革新的アイデアも生まれにくく，開発リードタイムも長期化するというデメリットがある。"],"k":["詳細設計","設計コスト","原価低減効果","開発リードタイム","承認図","貸与図複社購買","調達不能リスク"],"kg":[{"l":"","w":["詳細設計","設計コスト","原価低減効果","開発リードタイム","承認図","貸与図複社購買","調達不能リスク"]}],"e":["我が国の自動車メーカーや家電メーカーは外注比率が極端に高く，製造原価の大半を買入部品費や外注加工賃が構成するため，原価企画においてはその低減が中心課題となる。したがって，部品を供給するサプライヤーとの協働が不可欠であり，サプライヤーである部品メーカーが完成品メーカーの研究開発に設計の段階から加わることも少なくない。このように，部品等の開発の初期段階から，完成品メーカーと部品メーカーであるサプライヤーが共同(協働)で開発・設計作業を行うことを「デザイン・イン」という。","ここで，サプライヤーである部品メーカーは，承認図メーカーと貸与図メーカーとに大別される。このうち，承認図メーカーとは，完成品メーカーによる承認を前提に，自らが設計した図面に沿って部品を製造・納入するサプライヤーをいう。一方，貸与図メーカーとは，完成品メーカーから支給された図面にしたがって部品を製造・納入するサプライヤーをいう。また，これらのサプライヤーの分類に対応して，完成品メーカーの部品調達方法は，承認図方式と貸与図方式とに区別される(図表10-14)。","長所新的アイデアによる原価低減効り，調達不能に陥るリスクを抑","短所調達不能に陥るリスクが高くなとともに，革新的アイデアも生","なお，完成品メーカーの部品調達方法は，サプライヤーが設計コストを負担し","た上で詳細設計を行う承認図方式と完成品メーカーが設計コストを負担した上で","詳細設計を行う貸与図方式に大別されるが，両者の間に位置する方法として委託","図方式がある。委託図方式とは，承認図方式と同様，サプライヤーに詳細設計を","委ねるが，完成品メーカーがその設計コストを負担する方式をいう。この場合，","図面(委託図)の所有権は完成品メーカーに帰属するため，品質保証責任も完成品","メーカーが負うことになる。","設計コストサプライヤー完成品メーカー完成品メーカー","図面所有権サプライヤー完成品メーカー完成品メーカー","品質保証責任サプライヤー完成品メーカー完成品メーカー"],"f":"p2_10-9.webp","p":"p2_10-9_past.webp"},{"id":"10-10","b":"p2","c":10,"n":10,"t":"ＶＥの適用方法","i":"B","y":"B","q":["ＶＥ(valueengineering)とは，機能と原価の関係から製品やその構成部品の価値を分析する技法をいうが，この場合の「価値」を機能と原価の関係式を用いて具体的に定義し，「価値」を高めるアプローチを具体的に４つあげなさい。"],"a":["ＶＥでは，機能を原価で除すことによって価値を定義する。また，この場合の価値とは，顧客にとっての価値(顧客満足)を意味する。","ここで，価値を高める方法としては，以下の４つがあげられる。","①機能を一定として原価を引き下げる。","②機能を上げる一方で原価を一定とする。","③機能を上げる一方で原価の増加をそれ以下におさえる。","④機能を上げる一方で原価を引き下げる。"],"k":["価値","顧客満足","機能","原価"],"kg":[{"l":"","w":["価値","顧客満足","機能","原価"]}],"e":["原価企画が標準原価管理などの伝統的な原価管理手法と異なる点の１つは，目M標原価の実現プロセス，とりわけ，詳細設計後の見積原価と目標原価のギャップを埋める段階において，ＶＥ(valueengineering)という工学的手法を活用する点にある。","ＶＥでは，機能を原価で除すことによって価値を定義する。ここで，機能を上げようとすれば原価が上昇し，原価を下げれば機能が低下するというように，一般に，機能と原価はトレードオフの関係にある。しかし，ＶＥでは，製品あるいはその構成部品の設計仕様に変更を加えた場合に，機能と原価の双方にどのような変化が生ずるかを分析し，結果において価値が高まるような設計のあり方を工夫する。","既述の通り，ＶＥにおいて，製品ないしその構成部品の価値の向上を図るアプローチとしては，図表10-16に示す４つが考えられる。このうち，最も典型的なアプローチは，①機能を一定として原価を引き下げるというものである。なお，(＊)機能を下げる一方で，それ以上に原価を引き下げるというアプローチが実務では多く見られるが，概念上は，機能を下げると別製品になるため，そのようなアプローチは厳密にはＶＥの採る考え方ではないとされる。","ここで，ＶＥを支援するツールとしては，テアダウン(teardown)がよく知られている。テアダウンとは，競合他社の製品を構成する部品の１つ１つを切り離し，機能性や構造を探り，なおかつその製造プロセスを推定することで長所・短所を詳細に把握し，原価低減の機会を見出す技法をいう。欧米では，リバース・エンジニアリング(reverseengineering)と呼ばれ，ベンチマーキングの主要な手続の１つとして位置付けられている。","なお，原価企画プロセスとの関係でＶＥを見れば，その実施段階により，ゼロルックＶＥ(0lookＶＥ)，ファーストルックＶＥ(1stlookＶＥ)，セカンドルックＶＥ(2ndlookＶＥ)に区分できる(図表10-17)。"],"f":"p2_10-10.webp","p":""},{"id":"10-11","b":"p2","c":10,"n":11,"t":"目標原価が未達成でも量産体制に移行する理由","i":"B","y":"B","q":["原価企画の実務においては，目標原価が達成されていないにもかかわらず，量産体制に移行することが少なくないが，その理由を説明しなさい。"],"a":["企業実務においては，競合他社との関係や発売日を事前に公表してあるなどの理由により，新製品を上市する日程が予め定められていることが少なくない。そのような状況では，デッドラインまでの製品開発の終了が目標原価の達成よりも優先される可能性が高くなる。以上のような理由から，目標原価が達成されていない場合であっても，量産体制に移行するものと考えられる。"],"k":["競合他社","発売日","上市する日程","目標原価の達成","製品開発の終了"],"kg":[{"l":"","w":["競合他社","発売日","上市する日程","目標原価の達成","製品開発の終了"]}],"e":["原価企画においては，節目節目で目標を段階的に設定し，それをクリアしなければ次のプロセスには進まないというマイルストーン管理が行われる。したがって，目標原価は原則的には必達のものであり，原価見積の結果，目標原価が未達成であれば，さらにＶＥ改善を実施するのが通常である(図表10-18)。あるいは，原価見積は採算性の判断を兼ねるので，目標原価の達成自体が困難ないし不可能と判断されたならば，製品開発自体を断念するケースもある。いずれにしても，目標原価の達成を量産体制に移行するための条件とするのが原則であるが，見切り発車の形で量産体制に移行する原価企画実務が少なくないことからすれば，あくまでも理論上の原則に過ぎないということができる。","なお，目標原価が未達成のまま量産体制に移行した場合には，そのフォローは量産開始後の原価改善活動に委ねられることになる。"],"f":"p2_10-11.webp","p":"p2_10-11_past.webp"},{"id":"10-12","b":"p2","c":10,"n":12,"t":"原価企画における販売活動の重要性","i":"B","y":"B","q":["設計段階や量産段階において目標原価を達成した場合，原価企画は成功を収めたといえるか。理由を付して説明しなさい。"],"a":["原価企画活動において，設計段階や量産段階において目標原価を達成したとしても，それによって目標利益が実現するわけではない。目標利益の総額は，その算定ベースである目標販売量を達成することによってはじめて実現する。すなわち，目標原価の達成自体は潜在的なコスト優位に過ぎないのであって，原価企画の目的が中期利益計画において設定された目標利益総額の確保にある以上，目標原価の達成をもって原価企画が成功を収めたとはいえない。"],"k":["目標利益","目標販売量","潜在的コスト優位"],"kg":[{"l":"","w":["目標利益","目標販売量","潜在的コスト優位"]}],"e":["原価企画の効果は新製品の累積販売量の関数であり(図表10-19)，中期利益計画の達成に貢献しうる目標利益総額を確保できるか否かは，目標販売量の達成にかかっている。その意味では，原価企画における販売活動は非常に重要な役割を担っているといえる。製品が売れなければ，せっかくのコスト優位も「絵に描いた餅」で終わってしまうからである。","なお，製品が売れるためには，製品それ自体が顧客ニーズを反映した魅力的な製品である必要があるが，魅力的な製品でも簡単に売れるものではなく，十分な販売体制や広告宣伝，アフターサービスなどに力を注ぐ必要がある。"],"f":"p2_10-12.webp","p":""},{"id":"10-13","b":"p2","c":10,"n":13,"t":"原価企画の逆機能","i":"A","y":"B","q":["原価企画の逆機能として「サプライヤーの疲弊」が問題視されることがあるが，その意味を簡潔に説明しなさい。"],"a":["完成品メーカーの製造原価の大半は，買入部品費や外注加工賃によって構成される。したがって，完成品メーカーの原価企画の成功のためには，サプライヤーの協力が不可欠となるが，サプライヤーは完成品メーカーに対して従属的立場にあることが多い。そのため，完成品メーカーからの度重なる原価低減圧力や，納期，品質の面においても厳しい要求にさらされることが多く，組織疲労が蓄積し，疲弊度が高い。この点を捉え，「サプライヤーの疲弊」が原価企画の逆機能としてしばしば問題視される。"],"k":["完成品メーカー","買入部品費","サプライヤー","従属的","組織疲労"],"kg":[{"l":"","w":["完成品メーカー","買入部品費","サプライヤー","従属的","組織疲労"]}],"e":["我が国のサプライヤーシステムは，系列文化を背景としている。系列という用語の意味は多岐にわたるが，大雑把にいえば，１つの主要な企業を中心として，その企業と取引業者は長期的，排他的，閉鎖的な関係にあり，取引業者はその企業に対して従属的な立場にあるということになる(図表10-20)。>","一方で，我が国の自動車産業においては，系列の垣根を超えた複社発注，複社M納入というシステムがとられている。同様の関係は，１次サプライヤーと２次サプライヤーの間にも見られるが(図表10-21)，最終組立メーカーに対して強い発言力を持つのは，一部の１次ないし２次サプライヤーに過ぎず，大半のサプライヤーが最終組立メーカーに対して従属的であることに変わりはない。そのため，最終組立メーカーが原価企画活動を強力に実施する場合には，サプライヤーに対する原価低減，納期短縮，在庫縮減などのプレッシャーが高まり，「サプライヤーの疲弊」という逆機能をもたらす可能性がある。","デザイン・インはサプライヤーとメーカーの双方にメリットがあるが，","サプライヤーはメーカーよりも厳しい経営環境にあるだけでなく，様々","な負担を背負っているため，組織疲労が蓄積し，疲弊度が高い。","設計担当エンジニアは，作りやすさについての製造部門からの要請，","顧客満足の立場からのコスト・品質・信頼性・納期目標の同時達成に関","する要請，プロダクト・マネージャーからのコスト低減要請など，多様","で多数のプレッシャーの下に置かれているため，疲弊度が高い。","原価企画が商品企画段階から適用されている場合，顧客満足を誤って","定義すれば，過剰品質や過剰仕様を生み出し，結果として，顧客が余計","なコスト負担を強いられる可能性がある。","オーバーラップ方式の製品開発体制は，異なる価値観の衝突や，原価","企画チームとしての成功よりも部門利益の代弁者としての役割を優先す","るといった組織内コンフリクトを生み出す可能性を秘めている。また，","原価企画関連部門と非関連部門の間の対立も生じやすい。"],"f":"p2_10-13.webp","p":"p2_10-13_past.webp"},{"id":"10-14","b":"p2","c":10,"n":14,"t":"原価改善の種類","i":"A","y":"B","q":["量産開始後の原価低減活動である原価改善には２つの種類があるが，それぞれを定義して説明しなさい。"],"a":["原価改善には，特別プロジェクトとして実施される製品別の原価改善と，毎期の予算管理を通じて継続的に実施される期別・部門別の原価改善がある。","このうち製品別の原価改善は，原価企画による製品開発プロジェクトの一環として，量産段階で目標原価の未達成分をフォローする役割を担っている。","一方，期別・部門別の原価改善とは，短期利益計画上の目標利益(予算利益)と予想利益のギャップを解消する目的で実施されるものであり，原価改善目標額が予算として各責任単位に割り当てられ，年度中に目標低減額の達成が図られる。"],"k":["特別プロジェクト","製品別","原価企画","目標原価の未達成分予算管理","期別・部門別","短期利益計画","目標利益","予想利益"],"kg":[{"l":"","w":["特別プロジェクト","製品別","原価企画","目標原価の未達成分予算管理","期別・部門別","短期利益計画","目標利益","予想利益"]}],"e":["設計段階で目標原価を達成できたからといって，現実に目標原価通りに製造できるとは限らない。そこで，新製品の立ち上がり３か月後において，原価企画の実績評価が行われる。その結果，実際原価が目標原価(標準原価)を達成していないことが分かれば，両者の差額としての目標未達成額が目標改善額として定められ，特別プロジェクトとしての製品別の原価改善が実施される。他にも製品別原価改善を実施するケースがあり，それらをまとめると図表10-23のようになる。","一方，期別・部門別の原価改善は，責任単位別の予算管理と結合して毎期継続的に実施されるものであり，一般に，原価改善といえば，現行製品を対象として経常的に行われる期別・部門別の原価改善を指す。その目的は，短期利益計画上の目標利益(予算利益)と前期実績をベースとする予想利益のギャップを解消することにあり，利益改善目標額を製造部門と営業部門に割り当てた後，製造部門割当額がさらに工場別に原価改善目標額として割り当てられる(図表10-24)。","・量産開始から３か月後の実績評価において目標原価(標準原価)と実際原価","・許容原価と成行原価の間に目標原価を設定した場合に，目標原価と許容原","・目標原価の達成よりも製品開発の終了を優先した場合に，目標原価の未達"],"f":"p2_10-14.webp","p":""},{"id":"10-15","b":"p2","c":10,"n":15,"t":"原価維持と期別原価改善の関係","i":"A","y":"B","q":["原価維持と期別原価改善の概念上の共通点と相違点を説明しなさい。"],"a":["原価維持と期別原価改善は，現行製品を対象として，製造段階で実施される原価管理活動であるという点において共通する。","ただし，原価維持が，現行の製造条件を前提として，実際原価を標準原価に合致させることを目的とするのに対し，期別原価改善は，製造条件を不断に変更することにより，実際原価を標準原価以下に引き下げることを目的とするという点において相違する。"],"k":["現行製品","製造段階","現行の製造条件","実際原価","標準原価"],"kg":[{"l":"","w":["現行製品","製造段階","現行の製造条件","実際原価","標準原価"]}],"e":["原価維持の目的は，現行の製造条件を前提として，そのもとでの基準値である標準原価と実際原価との間に生ずる原価差異を出来る限りゼロに近付けることにある。一方，期別原価改善の目的は，現行の製造条件を不断に変更することで，実際原価を標準原価以下に引き下げる活動であるから，製造条件と実際原価へのアプローチという点において，原価維持と期別原価改善は明確に区別されなければならない。","また，両者には，手法上の相違もある。原価維持の場合は，標準原価は毎年１回あるいは半年に１回設定され，標準原価と実際原価との間で原価差異分析を行い，標準原価が達成されなかった場合に原因を調査し，是正措置を講じる。一方，原価改善の場合は，原価の目標低減額が毎月設定され，原価の目標低減額と実際低減額との間で差異分析を行い，目標低減額が達成されなかった場合に原因を調査し，是正措置を講じる(図表10-25)。","ただし，原価維持と期別原価改善は，製造段階(量産段階)という同じタイミングで実施され，密接不可分の関係にある。具体的には，期別原価改善の成果を直ちに標準化し，次期以降の原価維持活動に組み込むのである(図表10-26)。","実際原価標準原価に合致させる標準原価以下に引き下げる","目標標準原価(半年又は年に１度設定)目標低減額(毎月設定)","差異分析標準原価と実際原価の比較目標低減額と実際低減額の比較"],"f":"p2_10-15.webp","p":""},{"id":"10-16","b":"p2","c":10,"n":16,"t":"品質コストの分類","i":"B","y":"B","q":["品質コストは，一般に，ＰＡＦアプローチにより，予防コスト，評価コスト，内部失敗コスト，外部失敗コストに分類されるが，予防・評価コストと失敗コストの相違を説明しなさい。。"],"a":["予防・評価コストは，品質上の欠陥を防止したり，品質水準を維持するために支出するコストであり，経営管理者がその支出額を任意に選択することができる自由裁量コストとしての性質を有する。一方，失敗コストは，品質上の欠陥が発生した結果として負担せざるをえないものであり，予防・評価コストに対する投資によって回避可能ではあるが，経営管理者がその支出額を任意に選択することはできないという点で相違する。","また，予防・評価コストは，原価性(利益に対する犠牲としての貢献性)を有するという意味において必要な支出であるのに対し，失敗コストは原価性を持たない損失(ロス)であり，何ら付加価値を生むことのないムダであるという点において相違する。"],"k":["支出額を任意に選択","利益に対する貢献性","必要な支出","ムダ"],"kg":[{"l":"","w":["支出額を任意に選択","利益に対する貢献性","必要な支出","ムダ"]}],"e":["品質コストは，その性格の違いに基づき，予防コスト，評価コスト，失敗コストに分類され，失敗コストはさらに，内部失敗コストと外部失敗コストに分類される(図表10-27)。この分類法は，それぞれの頭文字をとって，ＰＡＦアプローチ(prevention-appraisal-failureapproach)と呼ばれている。","品質コストの分類で最も重要なことは，失敗コストとは本来，失敗ロスと呼ぶべきものであり，本来的なコストとしての予防・評価コストとは明確に区別されなければならないということである。「原価(コスト)」とは本来，何らかの利益を生み出すために犠牲となった経営資源を意味するが，失敗コストは利益の獲得に何ら貢献しないムダであり，利益に対する犠牲としての貢献性(原価性)を有さず，むしろマイナスに作用するからである。","そこで，当然のことながら，予防・評価コストと失敗コストでは，管理方法に相違が生じることになる。具体的には，予防・評価コストは利益を生み出すために「必要な支出」であるから，効率的，効果的に資源を配分する必要がある。一方，失敗コストは単なる「ムダ」であり，その削減は同額の利益業績の改善をもたらすことから，ゼロを目指すべきである。つまり，予防・評価コストと失敗コストを同列で管理することはできないのであって，「トータル品質コストの管理」や「トータル品質コストの最小化」という考え方は，少なくとも短期的には誤っ>た品質管理思考であるといえる。M","敗(internalfailurecosts)手直費","ト(externalfailurecosts)返品廃棄処分費"],"f":"p2_10-16.webp","p":"p2_10-16_past.webp"},{"id":"10-17","b":"p2","c":10,"n":17,"t":"品質コストの相互関係","i":"B","y":"B","q":["予防・評価コストと失敗コストの一般的な関係を明らかにした上で，予防・評価コストに対する投資が短期的にトータル品質コストに与える影響について説明しなさい。"],"a":["予防・評価コストと失敗コストは，予防・評価コストに積極的に投資すれば失敗コストが減少し，逆に，予防・評価コストに対する投資を怠れば失敗コストが増加するというように，一般に，トレードオフの関係にある。","ただし，予防・評価コスト，とりわけ予防コストに対する投資の成果は，即座に発現するわけではない。したがって，短期的には，予防・評価コストに対する投資額が失敗コストの減少額を上回るのが通常であり，結果的に，トータル品質コストは増加する傾向にある。"],"k":["トレードオフ","予防・評価コストに対する投資額","失敗コストの減少額"],"kg":[{"l":"","w":["トレードオフ","予防・評価コストに対する投資額","失敗コストの減少額"]}],"e":["予防コストに対する投資は，品質上の欠陥の減少を通じて失敗コストの減少をもたらす。また，評価コストに対する投資は，他の条件を一定とすれば，工程内不良の増加によって内部失敗コストの増加をもたらすことになるが，出荷不良の減少によってそれ以上に外部失敗コストの減少をもたらす。このように，予防・評価コストと失敗コストの間にはトレードオフの関係が成立し，品質コストは，この関係を基礎として，品質改善活動に投下された資源の効率的，効果的な運用の成果を，利益業績の改善効果として判定するための具体的なスケール(物差し)を提供する。","ただし，予防・評価コスト，とりわけ，予防コストに対する投資の成果が，失敗コストの減少として発現するまでにはタイムラグがあり，短期的には失敗コストを合わせたトータル品質コストがかえって増加傾向にあることに注意しなければならない(図表10-28)。そこで，品質コスト・マネジメントにおいては，このタイムラグの存在を理解した上で，長期的視点から失敗コストの最小化を志向していくことが求められる。"],"f":"p2_10-17.webp","p":"p2_10-17_past.webp"},{"id":"10-18","b":"p2","c":10,"n":18,"t":"品質コスト・マネジメントのあり方","i":"B","y":"B","q":["品質コストの管理に当たって，短期的にトータル品質コストの最小化を志向することの問題点を説明し，正しい考え方を示しなさい。"],"a":["予防・評価コストは短期的に削減することが可能であるが，失敗コストの削減にはある程度の期間を要する。したがって，短期的にトータル品質コストの最小化を志向すれば，予防・評価コストに削減の矛先が向く結果として，長期的には失敗コストが大きく増加し，トータル品質コストも増加するという悪循環に陥る可能性が高い。","そこで，正しくは，トータル品質コストではなく失敗コストの最小化を志向すべきであり，長期的な視点から，予防・評価コストへの投資を行うことによって欠陥品ゼロを追求し，失敗コストの最小化を通じてトータル品質コストの最小化を図るべきである。"],"k":["予防・評価コストの削減","失敗コストの増加","失敗コストの最小化"],"kg":[{"l":"","w":["予防・評価コストの削減","失敗コストの増加","失敗コストの最小化"]}],"e":["品質管理会計は，究極的にはトータル品質コストの最小化を標榜しているが，","それは，後述する「修正された品質コスト・ビヘイビア・モデル」が示唆する通","り，失敗コストの最小化を長期的に志向する結果としてもたらされると理解すべ","きである。そもそも，損失(ロス)としての失敗コストは少なければ少ないほどよ","いのであって，その減少は，同額の利益業績の改善をもたらす。したがって，当","然のことながら，品質コスト・マネジメントの主眼は，トータル品質コストでは","なく失敗コストの最小化に置かれなければならない。近視眼的にトータル品質","コストの最小化を追求し，品質不良を放置すれば，そのツケは将来，巨額の機会","損失となって返ってくることになる。言い換えれば，失敗コスト削減の効果はそ","れだけ大きいということであり，長期的な視点から，欠陥品ゼロを追求すること","が重要となる。","なお，適合品質との関係で品質コストの推移を示した品質コスト・ビヘイビ","ア・モデルには，伝統的モデルと修正モデルがある。このうち伝統的モデルは，","短期的視点に立脚しており，予防・評価コストと失敗コストが均衡する適合品質","水準を探索することにより，トータル品質コストが最小化されることを示してい","る(図表10-29)。すなわち，短期的には，ある程度の欠陥品の存在を前提とせざる","をえないことを示唆している。一方，修正モデルは，長期的視点に立脚してお","り，失敗コストの最小化が結果としてトータル品質コストの最小化をもたらすこ","とを示している(図表10-30)。すなわち，長期的には，欠陥品ゼロを追求すべきこ","とを示唆している。","ここで，伝統的モデルと修正モデルの基本的な差異は，短期的視点に立脚する","か，長期的視点に立脚するかという点にある。すなわち，欠陥品を限りなくゼロ","に抑えることができれば，間違いなく品質コストは最小となるが，それにはかな","りの時間を要することは否めない。したがって，短期的には，予防・評価コスト","と失敗コストの関係は，伝統的モデルに描かれている形に近いものとなるだろう","し，全ての企業には資金制約があることから，欠陥品ゼロが最終目標であると","しても，投資決定の個々の場面では，その時々で最適(経済的)と考えられる品質","レベルを設定していかざるをえない。いずれにしても，立脚する視点が異なる以","上，２つのモデルを単純に比較することはできないのであって，「いずれがより適","切に品質コスト・ビヘイビアを捉えているか」という問に対する解答は存在しな","い。ただし，品質管理活動は，長期的なスパンのもとで対策が練られ，なおかつ","実行される必要がある。したがって，品質コスト・マネジメントのあり方に対す","る基本的な視座を提供するという意味では，修正モデルの方が望ましいといえる。","図表10-29伝統的な品質コスト・ビヘイビア・モデル","図表10-30修正された品質コスト・ビヘイビア・モデル問題11-１伝統的原価計算の問題点ＡＢ11-２問題11-２ＡＢＣの特徴ＡＢ11-６問題11-３伝統的原価計算とＡＢＣの計算構造の比較ＡＡ11-８問題11-４活動及び活動原価の階層性ＡＢ11-10問題11-５伝統的原価計算とＡＢＣの計算結果が相違する原因ＡＢ11-12問題11-６長期変動費ＡＣ11-14問題11-７活動ドライバーの種類と適用ＢＢ11-18問題11-８ＡＢＣの限界ＢＢ11-22問題11-９ＡＢＣとＡＢＭの相違ＢＢ11-26"],"f":"p2_10-18.webp","p":""},{"id":"11-1","b":"p2","c":11,"n":1,"t":"伝統的原価計算の問題点","i":"A","y":"B","q":["多品種少量生産方式への移行が，企業の原価構造と伝統的原価計算に与えた影響について説明しなさい。"],"a":["多品種少量生産方式への移行は，製造活動の複雑化・多様化をもたらし，段取，設計，検査，マテハンといった複雑性・多様性関連の活動(生産支援活動)に関する製造間接費の増大をもたらした。","これらの製造間接費は，操業度とは無関係に発生する固定費としての性質を有するが，伝統的原価計算では製造間接費を生産量や操業度を基準として製品に配賦する。その結果，少量生産品が本来負担すべき原価を大量生産品が余計に負担することになり，歪んだ製品原価が計算されることになった。"],"k":["複雑性・多様性関連の活動","生産量","操業度","固定費。大量生産品少量生産品","歪んだ製品原価"],"kg":[{"l":"","w":["複雑性・多様性関連の活動","生産量","操業度","固定費。大量生産品少量生産品","歪んだ製品原価"]}],"e":["顧客ニーズの多様化，製品ライフサイクルの短縮化に伴い，企業の生産システムは従来の少品種大量生産方式から，ＦＭＳやＣＩＭの導入を伴う多品種少量生産方式へと移行し，そのような企業環境の変化は，製造活動の複雑化，多様化に伴う製造間接費(生産支援活動コスト)の増加をもたらすことになった。また，そのような原価構造の変化は，伝統的原価計算による操業度基準の配賦計算を通じて製品原価に歪みをもたらし，価格決定や製品戦略をミスリードすることになった。1980年代の米国企業の不振は，本当は製品原価の低い大量生産品に高価格を付けたり，本当は手間のかかる少量生産品を低価格で販売したりしため，利益がでなかったためであると指摘されている。その後，企業の製品戦略を支援する新たな会計システムの構築によって米国産業の斜陽を回復させるという意図を背景として，活動基準原価計算(Activity-BasedCosting；ＡＢＣ)が開発されることになる。","ここでは，簡単な数値例を使用して，伝統的原価計算による製品原価情報の問題点と，ＡＢＣによる製品原価情報の特徴を確認する。いま，標準製品Ｘと特殊製品Ｙを混合生産する工場において，次の〔資料〕が得られたものとする。〔資料〕","この場合，伝統的原価計算によれば，各製品の生産量や直接作業時間を配賦基準として段取コストを配賦することになる。その結果，各製品の単位当たりの段取コストは等しくなるが，これは明らかにおかしい。段取コストは１回当たりの生産量(バッチサイズ)に対して固定的に発生するため，本来は，バッチサイズの小さい製品Ｙの方が，単位当たりの負担額は大きくなるはずだからである。このように，伝統的原価計算によれば，「少量生産品は大量生産品よりも手間がかかっている」という事実ないし製造現場の感覚を製品原価に反映することができないという問題がある(図表11-１)。","一方，こうした伝統的原価計算の問題点を克服するために提案されたのがＡＢＣであり，上記の数値例にこれを適用すれば，段取コストは段取回数をコスト・ドライバー(配賦基準)として各製品に集計されることになる。その結果，バッチサイズの小さい製品Ｙの単位当たりの段取コストは，バッチサイズの大きい製品Ｘのそれの10倍となり，「少量生産品は大量生産品よりも手間がかかっている」という事実ないし製造現場の感覚を製品原価に反映することができる(図表11-２)。"],"f":"p2_11-1.webp","p":"p2_11-1_past.webp"},{"id":"11-2","b":"p2","c":11,"n":2,"t":"ＡＢＣの特徴","i":"A","y":"B","q":["ＡＢＣとはどのような計算方法であるかを説明し，その目的を明らかにしなさい。"],"a":["ＡＢＣとは，「原価計算対象が活動を消費し，活動が資源を消費する」という基本思考のもとに，まず資源の消費状況に応じて間接費資源の価値を活動に割り当て，次に活動の消費状況に応じて活動の原価を原価計算対象に割り当てることによって，間接費資源の価値を因果関係に基づいて出来るだけ正確に原価計算対象に集計する計算方法である。","ＡＢＣの目的は，製造間接費の配賦計算を精緻化することによって正確な製品原価情報を提供し，もって適切な収益性分析や価格決定，製品戦略の意思決定に資することにある。"],"k":["原価計算対象","活動","資源","消費状況","間接費","因果関係正確な製品原価情報","収益性分析","価格決定","製品戦略"],"kg":[{"l":"","w":["原価計算対象","活動","資源","消費状況","間接費","因果関係正確な製品原価情報","収益性分析","価格決定","製品戦略"]}],"e":["ＡＢＣの本質的な特徴は，製造間接費の集計を正確に行いうるという点にあるわけではなく，それは「原価計算対象が活動を消費し，活動が資源を消費する」という基本思考のもとに，活動及び資源の消費状況に応じて原価を集計するという点にある(図表11-３)。したがって，製造原価(製造間接費)だけでなく，小売業などにおける販管費の集計にも利用可能であるという点に，ＡＢＣという計算モ>デルの優れた点を見出すことができる。また，製造間接費や販管費の集計を正M確に行うというのはあくまでも手段であり，その目的は，製品ないし商品種類別の真の収益性を明らかにすることで，製品ないし商品戦略の意思決定に資する情報を提供するという点にある。したがって，ＡＢＣの長所としては，上記の意思決定に対する有用性を指摘することが求められる。","なお，製造業におけるＡＢＣは，複数の製品種類間で製造間接費を配分する計算方法であって，製品別計算を内包するものではない。つまり，製品種類別に製造間接費を集計した後に，製造直接費と合わせて製品別計算が実施されるのであって，そこでは，生産形態に応じて単純総合原価計算や個別原価計算が適用される。"],"f":"p2_11-2.webp","p":"p2_11-2_past.webp"},{"id":"11-3","b":"p2","c":11,"n":3,"t":"伝統的原価計算とＡＢＣの計算構造の比較","i":"A","y":"A","q":["製造間接費の集計に当たって，伝統的原価計算とＡＢＣの計算構造の共通点と相違点を説明しなさい。"],"a":["伝統的原価計算とＡＢＣは，製造間接費の集計に当たって，中間的原価計算対象を経由するという点で共通する。","ただし，伝統的原価計算では原価部門を中間的原価計算対象とするのに対し，ＡＢＣでは活動を中間的原価計算対象とするという点において相違する。その結果，伝統的原価計算では補助部門費を製造部門に配賦する必要が生じるが，ＡＢＣでは補助部門費の配賦自体が排除される。","また，中間的原価計算対象から製品への集計に当たって，伝統的原価計算では操業度関連の配賦基準を使用するのに対し，ＡＢＣでは活動基準のコスト・ドライバーを使用するという点で相違する。"],"k":["中間的原価計算対象","原価部門","活動","補助部門費の配賦操業度関連の配賦基準","活動基準のコスト・ドライバー"],"kg":[{"l":"","w":["中間的原価計算対象","原価部門","活動","補助部門費の配賦操業度関連の配賦基準","活動基準のコスト・ドライバー"]}],"e":["伝統的原価計算とＡＢＣは，計算モデルの中に中間的原価計算対象を組み込んMでいるという点において共通する。ただし，中間的原価計算対象として何を設定するか，中間的原価計算対象から原価計算対象(製品)への集計に当たって，どのような配賦基準(コスト・ドライバー)を使用するかという点において，両者は大きく相違する(図表11-４)。","ここで，両者の計算構造の相違は，原価計算に当たっての基本思考の相違に由来する。すなわち，ＡＢＣでは「製品が活動を消費し，活動が資源を消費する」と考えるため，活動を中間的原価計算対象として設定する。一方，伝統的原価計算では「製品が資源を消費する」と考えており，製品との直接的な因果関係を持たない製造間接費は，製品が通過する製造部門を経由させることによってその価値移転を図るのが合理的ということになる。しかしながら，現代的には，設計部門や検査部門など製品に対して直接用役を提供していると考えられる補助部門の費用や，製造部門の操業度とは無関係に発生する補助部門の費用が増加している。したがって，補助部門費を製造部門経由で，なおかつ操業度を基準に製品に配賦するという伝統的な部門別原価計算では，もはや原価集計の正確性を確保することは困難であると考えられている。","なお，ＡＢＣでは，製造間接費を製品に集計するための配賦基準をコスト・ドライバーと総称しており，製造間接費を活動に集計するためのコスト・ドライバーを資源ドライバー，活動に集計された製造間接費を製品に集計するためのコスト・ドライバーを活動ドライバーと呼んでいる。すなわち，資源ドライバーとは活動による資源の消費状況を表す変数，活動ドライバーとは製品による活動の消費状況を表す変数ということになる。"],"f":"p2_11-3.webp","p":""},{"id":"11-4","b":"p2","c":11,"n":4,"t":"活動及び活動原価の階層性","i":"A","y":"B","q":["工場内の活動を製品との因果関係のレベルによって４つに分類し，ＡＢＣにおける活動原価の理論的な集計方法について説明しなさい。"],"a":["工場内の活動は，製品との因果関係のレベルによって，製品単位レベルの活動，バッチレベルの活動，製品支援レベルの活動，工場支援レベルの活動に分類される。","それぞれの活動原価の集計は，製品との因果関係を認識できるレベルで行うのが理論的である。すなわち，製品単位レベルの活動原価は製品単位当たりに，バッチレベルの活動原価はバッチ単位に，製品支援レベルの活動原価は製品種類全体に集計し，製品との因果関係を見出すことが困難な工場支援レベルの活動原価は，期間費用として処理すべきである。"],"k":["因果関係","製品単位","バッチ","製品支援","工場支援"],"kg":[{"l":"","w":["因果関係","製品単位","バッチ","製品支援","工場支援"]}],"e":["ＡＢＣにおいて，活動は，①製品単位レベルの活動，②バッチレベルの活動，③製品支援ないし製品維持レベルの活動，④工場支援ないし施設維持レベルの活動の４つに分類される。また，これらの活動に製造間接費が集計された場合，その原価のことを①製品単位レベルの原価，②バッチレベルの原価，③製品支援レベルの原価，④工場支援レベルの原価という。","このうち，①製品単位レベルの活動とは，組立活動など，製品単位当たりで行われる活動であり，その活動原価は主に変動費である。したがって，製品への集計に当たっては，直接作業時間などの操業度関連のコスト・ドライバーが該当する。また，②バッチレベルの活動とは段取，発注，運搬などバッチないし生産１回当たりで行われる活動を，③製品支援レベルの活動とは生産計画，設計など特定の製品全体に対して跡付けることができる支援活動を，④工場支援レベルの活動とは特定の製品に対して跡付けることは不可能であるが，工場全体を維持するために必要な管理活動をいう。これら３つの活動階層の原価は固定費であるが，後述する通り，ＡＢＣではその多くを長期変動費として定義する。","ここで重要なことは，ＡＢＣにおける製造間接費の集計が「因果関係」をキーワードとして成立しているということである。逆に言えば，因果関係を識別できない計算は行うべきでなく，理論的には，下位の階層の活動原価を上位の階層に集計することは認められない(図表11-５)。一方で，ＡＢＣの実務では，製品単位レベルの原価以外の３つの活動原価も製品単位当たりに集計することが少なくないという。ただし，それは価格決定上の回収方針(単位当たり総原価を知りたいというニーズ)に基づくものであり，因果関係のレベルを認識している以上，工場内の全ての活動や原価を同質的に扱っているわけではないことに注意すべきである。すなわち，ＡＢＣの実務が全部原価計算を前提とすることが一般的であるとしても，ＡＢＣを全部原価計算の一形態であると解することは妥当ではない。"],"f":"p2_11-4.webp","p":"p2_11-4_past.webp"},{"id":"11-5","b":"p2","c":11,"n":5,"t":"伝統的原価計算とＡＢＣの計算結果が相違する原因","i":"A","y":"B","q":["伝統的原価計算とＡＢＣの計算結果が相違する主たる原因について説明しなさい。"],"a":["伝統的原価計算とＡＢＣの計算結果が相違する主たる原因は，段取，設計，検査，マテハンといった工場内の複雑性・多様性関連の活動の原価の集計方法の相違にある。これらは操業度とは無関係に発生する固定費であるが，伝統的原価計算では，他の製造間接費と同様に操業度関連の配賦基準を用いて集計するのに対し，ＡＢＣでは活動の消費状況に応じてこれを集計する。その結果，伝統的原価計算によれば，少量生産品が本来負担すべき原価を大量生産品が余計に負担することになり，両者の計算結果が相違するのである。"],"k":["複雑性・多様性関連の活動","操業度","固定費","操業度関連の配賦基準活動の消費状況","大量生産品","少量生産品"],"kg":[{"l":"","w":["複雑性・多様性関連の活動","操業度","固定費","操業度関連の配賦基準活動の消費状況","大量生産品","少量生産品"]}],"e":["伝統的原価計算とＡＢＣでは計算構造が異なるため，両者の計算結果が相違するのは当然であるが，その主たる原因は，複雑性・多様性関連の活動の原価の集計方法の相違にあることに注意しなければならない。逆に言えば，その他の製造間接費の集計方法については，伝統的原価計算とＡＢＣで大差はないということになる。したがって，ＡＢＣの導入が効果を発揮する企業とは，原価構造に占める製造間接費の割合が大きく，その中でも，複雑性・多様性関連の活動の原価の割合が大きい企業ということになる。","また，本問は，問題11-４で見た「活動及び活動原価の階層性」の観点からも説明することが可能である。この場合，伝統的原価計算とＡＢＣの計算結果の相違をもたらす主たる原因は，バッチレベルと製品支援レベルの活動原価の集計方法にあり，ＡＢＣは，それらの活動原価が原価構造に占める割合の大きい企業において効果を発揮すると説明できる。以下を参照のこと。"],"f":"p2_11-5.webp","p":"p2_11-5_past.webp"},{"id":"11-6","b":"p2","c":11,"n":6,"t":"長期変動費","i":"A","y":"C","q":["本来，コスト・ドライバーとは，「一定のタイムスパンにわたってコストに因果的な影響を与える要素」をいう。そこで，検査コストなどの固定費がコスト・ドライバーを有するか否かを検討しなさい。"],"a":["検査コストのような固定費は，短期的には製品の生産量とは無関係に発生するため，その意味ではコスト・ドライバーを持たないといえる。","しかしながら，将来的に生産量が増加(減少)する場合には，必要な活動量が増減するため，検査人員や設備を増強(削減)する結果として，検査コストの発生額が変化することになる。したがって，固定費といえども，長期的にはコスト・ドライバーを持つといえる。"],"k":["短期的","長期的","生産量","人員","設備","コスト・ドライバー"],"kg":[{"l":"","w":["短期的","長期的","生産量","人員","設備","コスト・ドライバー"]}],"e":["ＡＢＣの特徴は，活動及び資源の消費状況を反映しうる適切なコスト・ドライバーを選択することにより，製造間接費中の固定費の配賦をより正確に行うという点にある。しかしながら，「製品が活動を消費し，活動が資源を消費する」といっても，資源自体が固定費資源である以上，その発生額(支出額)は，短期的には製品の生産量はもちろんのこと，当該資源が供される活動の量にも影響されることなく一定である。そこで，固定費を製品に集計するためには，その発生額(支出>額)と活動量，さらには製品との因果関係を説明する必要が生じる。M","この点，ＡＢＣでは，操業度や固定費という概念を全く排除するわけではないが，より長いタイムスパンで原価の推移を展望する。すなわち，将来製品の生産量が増減するとすれば，必要とされる活動量が増減し，そのために固定費資源を増減させる必要が生じるのであって，固定費といえども，長期で見ればその発生額(支出額)は変化する。このように，短期的に発生額(支出額)は一定であるが，長期的な消費額の変動に応じて発生額(支出額)が変動する費用概念を長期変動費と呼ぶ。この概念を投入することによって，固定費について活動量をコスト・ドライバーとして認識し，製品に集計することに合理性が生じることになる。固定費は短期的には製品との因果関係をもたないが，長期的には活動量の変化を通じて製品との因果関係を有すると考えられるからである(図表11-６)。","なお，変動費は消費(必要)の都度供給される資源に関連するコストであるのに対し，長期変動費としての固定費は，消費に先立って供給される資源に関連するコストであるといえる。したがって，変動費から未利用キャパシティのコストは生じないが，長期変動費としての固定費からは未利用キャパシティのコストが生じるのが通常である。"],"f":"p2_11-6.webp","p":"p2_11-6_past.webp"},{"id":"11-7","b":"p2","c":11,"n":7,"t":"活動ドライバーの種類と適用","i":"B","y":"B","q":["活動ドライバーの種類には，①業務処理ドライバー(取引ドライバー)，②時間ドライバー(所要時間ドライバー)，③強度ドライバー(インテンシティ・ドライバー)があるが，それぞれの特徴を踏まえ，どのようなケースにおいて適用されるかを説明しなさい。"],"a":["①業務処理ドライバー（取引ドライバー）","業務処理ドライバーとは，実行された活動の回数を意味する。このドライバーは，全ての製品やサービスが特定の活動に対して要求するアウトプットの量(時間)が同じ場合に適用される。","②時間ドライバー（所要時間ドライバー）","時間ドライバーとは，特定の製品やサービスが要求する活動の時間を意味する。このドライバーは，製品やサービスによって，特定の活動に対して要求するアウトプットの量(時間)が異なる場合に適用されるべきものであるが，その測定にはかなりの手間とコストを要する。","③強度ドライバー（インテンシティ・ドライバー）","強度ドライバーとは，所要時間に加え，活動の強度ないし密度の違いに着目するものであり，活動が行われる度ごとに使用される資源の大小が異なる場合に，それらの活動の特殊性を原価計算対象に反映させるためのコスト・ドライバーである。正確性は高いが，その測定には所要時間ドライバーを上回る手間とコストを要する。したがって，その適用は極めて高価な活動に限定される。"],"k":["活動の実行回数","活動の所要時間","活動の強度","手間とコスト","費用対効果"],"kg":[{"l":"","w":["活動の実行回数","活動の所要時間","活動の強度","手間とコスト","費用対効果"]}],"e":["活動ドライバーのうち，業務処理ドライバーは，活動が何回行われたかという回数に着目するが，時間ドライバーは，同種の活動でも複雑性等により作業完了に要する時間が異なる事実に着目する。したがって，計算の正確性という観点からすれば，時間ドライバーが業務処理ドライバーに勝ることは言うまでもない。>ただし，その測定にかかる手間とコストは，業務処理ドライバーのそれをはるかMに上回ることから従来型のＡＢＣシステムの設計者は，業務処理ドライバーが時間ドライバーに合理的に近似する場合には，費用対効果を考慮し，業務処理ドライバーを使用するのが通常であったといわれる。","一方，強度ドライバーは，同じ所要時間であっても，時間当たりの資源消費量ないし消費額が異なるという事実に着目する。したがって，測定の度に活動コストを原価対象に直課できる状況，すなわち，活動が行われる度ごとに使用される資源の大小が異なり，それを測定するためのプロセスが既に整備されている状況において，効果を発揮する。逆に言えば，強度ドライバーの適用は，極めて高価な，つまりは，測定プロセスの構築に費用対効果の観点から合理性が認められるような活動に限定されることになる。","なお，計算問題において，活動ドライバーの選択を求められる場合があるが，その判断基準をまとめれば，図表11-８のようになる。"],"f":"p2_11-7.webp","p":"p2_11-7_past.webp"},{"id":"11-8","b":"p2","c":11,"n":8,"t":"ＡＢＣの限界","i":"B","y":"B","q":["ＡＢＣを実施する場合には，原価集計に関する限界があるといわれるが，その意味を説明しなさい。"],"a":["ＡＢＣでは，計算の前提となる活動及び資源の消費状況に関するデータを収集できれば，価値移転的原価計算を徹底して追求することができる。しかしながら，データの収集や測定プロセスの構築に多くの手間とコストがかかるため，それは，ＡＢＣを実施することによって得られる追加的情報の価値を上回ることが多い。したがって，原価集計に関する限界があるといわれるのである。"],"k":["データの収集","測定プロセスの構築","手間とコスト","追加的情報の価値"],"kg":[{"l":"","w":["データの収集","測定プロセスの構築","手間とコスト","追加的情報の価値"]}],"e":["原価計算は，前提となるデータを収集できれば，どこまでも価値移転的計算を追求することができる。しかしながら，現実にはデータの収集に手間とコストが>かかり，ＡＢＣを実施する場合には，特にそれが大きなものとなる。M","例えば，ＡＢＣでは動力部門や修繕部門などの補助部門費を製品に直接配賦する必要があるが，この場合の活動ドライバーとしては，製品別の消費電力やメンテナンス時間ということになるだろう。この点，各製造部門における消費電力やメンテナンス時間を測定することは比較的容易であるが，それらがどの製品と結び付いているのかを認識するためには，そのための測定プロセスを新たに構築する必要がある。すなわち，ＡＢＣの導入や更新に当たっては，システムの正確性と経済性のトレードオフ関係に直面し，意図していた効果が得られないという限界がある(図表11-９)。","このようなＡＢＣの限界に対する批判を受けて近年提唱されたのが，時間という単一のコスト・ドライバーを使用する時間主導型ＡＢＣ(time-drivenＡＢＣ；ＴＤＡＢＣ)である。ＴＤＡＢＣでは，キャパシティ費用率と時間方程式という概念を導入することで，手間とコストをかけることなく，資源費用を原価計算対象に直接配賦することが可能となる。したがって，伝統的なＡＢＣの実装上の問題点を克服することが期待される。なお，従来型のＡＢＣとＴＤＡＢＣの相違は，図表11-10と図表11-11のようにまとめられる。","・第１段階の計算に必要な資源消費割合に関する関するインタビューと調査","・インタビューには個人の主観が入り，正確性，有効性に疑問が生じる。","・費用対効果の観点から，第２段階の計算に業務処理ドライバーを使用せざ","るをえない結果として，計算結果が資源の消費状況を正確に反映しない。","・活動が複雑化した場合，その分だけ活動を追加する必要があり，データ処","・インタビューと調査において，フルキャパシティでの操業を報告される例","・キャパシティ費用率と時間方程式という概念を用いて，資源費用を原価計","算対象に直接配賦するため，ＡＢＣの第１段階の計算を排除できる。","・簡単かつ迅速に精緻なモデルを設計できる。","・活動が複雑化した場合でも，時間方程式を修正することにより，容易にモ","・業務プロセスの効率性とキャパシティの利用度を可視化できる。","・注文量と注文の複雑性の予測に基づいた資源キャパシティに関する予算の","編成が可能となり，資源必要量を予測できる(ＡＢＢへの利用)"],"f":"p2_11-8.webp","p":""},{"id":"11-9","b":"p2","c":11,"n":9,"t":"ＡＢＣとＡＢＭの相違","i":"B","y":"B","q":["ＡＢＭ(Activity-BasedManagement)とはどのような手法であるかを説明し，ＡＢＣとの本質的な相違を明らかにしなさい。"],"a":["ＡＢＭとは，ＡＢＣを導入する際に必要な活動分析を顧客の視点から見直し，その根本的改革によって原価低減を実現する手法である。具体的には，企業内の諸活動を顧客にとっての付加価値活動と非付加価値活動に分類した上で，前者は効率化，後者は排除することによって最適な価値連鎖として再構築し，原価低減につなげる。","すなわち，ＡＢＣが間接費の計算システムとして「原価割当の視点」を重視するのに対し，ＡＢＭは原価低減のために「プロセス改善の視点」を重視するという点において，両者は本質的に相違する。"],"k":["顧客の視点","付加価値活動","非付加価値活動","原価割当","プロセス改善"],"kg":[{"l":"","w":["顧客の視点","付加価値活動","非付加価値活動","原価割当","プロセス改善"]}],"e":["製造活動の複雑化・多様化に伴う間接費(固定費)の増加は，伝統的原価計算の|製品原価情報の有効性を減退させる一方で，原価管理の観点からは，間接費(固定費)を削減するシステムの重要性を増加させることになった。そこで，間接費の計算システムであるＡＢＣの情報を利用した間接費の管理システムとして，ＡＢＭが提唱されることになる。ＡＢＭでは，企業内の諸活動を顧客の視点から見直し，それらに潜むムダを排除することでプロセスを再構築し，原価低減が図られる(図表11-12)。","ここで，ＡＢＭによるプロセス改善は，①活動分析，②コスト・ドライバー分析，③業績分析の３つのステップからなる。まず，①活動分析とは，企業内の価値連鎖を構成する諸活動を識別し，原価低減の機会を探索することをいう。次に，②コスト・ドライバー分析とは，活動及びその原価に影響を与える要因としてのコスト・ドライバーを探索することをいう。ムダは単にその所在を理解するだけで自動的に除去されるわけではなく，ムダを引き起こす原因であるコスト・ドライバーを理解することが重視される。最後に，③業績分析とは，活動業績の改善の成果を継続的に評価することをいい，諸活動の業績を測定するための適切な業績尺度が選択される。業績尺度には，財務的な尺度と非財務的な尺度の双方が利用される。","ここで，ＡＢＣは，間接費の配賦計算を精緻化することによって，製品戦略の意思決定を支援するためのシステムであった。一方，ＡＢＭは，企業内の諸活動に潜むムダを排除することによって，原価低減と利益改善を実現するための手法である。すなわち，ＡＢＣが原価割当の視点を重視し，事業再構築(リストラクチャリング)を目的とするものであったのに対し，ＡＢＭはプロセス改善の視点を重視し，プロセスの再構築(リエンジニアリング)を目的とするという点で相違するといえる(図表11-13)。","コスト・ドライバー活動業績尺度コスト・ドライバー分析"],"f":"p2_11-9.webp","p":"p2_11-9_past.webp"},{"id":"12-1","b":"p2","c":12,"n":1,"t":"集権と分権","i":"B","y":"A","q":["現代企業の組織構造は職能別組織と事業部制組織に大別され，一般に，前者は集権的組織，後者は分権的組織と説明される。そこで，職能別組織と集権的組織，事業部制組織と分権的組織の関係について説明しなさい。"],"a":["集権的であるか分権的であるかは程度問題であり，二者択一ではない。つまり，職能別組織は，事業部制組織と比べて集権的，事業部制組織は職能別組織と比べて分権的というだけであり，職能別組織と事業部制組織のそれぞれにおいて相対的に集権的なものと分権的なものがある。","以上より，職能別組織と集権的組織，事業部制組織と分権的組織がそれぞれ１対１で対応するわけではない。"],"k":["集権的","分権的","程度問題","二者択一","１対１"],"kg":[{"l":"","w":["集権的","分権的","程度問題","二者択一","１対１"]}],"e":["企業における組織を第一次的に製造部門，販売部門，人事部門，経理部門というように職能部門別に分類し，これらを基礎として形成する組織を職能別組織という。これに対して，企業における組織を第一次的に製品分野別，顧客別あるいは地域別に分類し，それぞれの組織単位(事業部)があたかも独立の企業であるかのように製造，販売活動を行うような組織を事業部制組織という(図表12-１)。","一方，意思決定などの権限・責任が集中している組織を集権的組織，それらが組織内に分散している組織を分権的組織といい，職能別組織は集権的組織，事業部制組織は分権的組織と説明されることが多い。ただし，集権的であるか分権的であるかは程度問題であるため，職能別組織と集権的組織，事業部制組織と分権的組織をそれぞれ同義で捉えることはできない。","なお，企業規模が大きくなると組織は分権化を進める傾向にあるが，分権化には一長一短があるため，それらを理解した上で組織設計を行う必要がある(図表12-２)。","①製品，地域，市場など現場に近い人間の方が現場に精通しているため，","②環境変化に対応した迅速な意思決定，行動をとることができる。","③権限・責任を与えることにより，モラールが向上する。>","④分権化された組織の長に，将来，より上級の経営管理者となるための貴M","①部分最適に陥り，全体最適との整合性を失う可能性がある。","②職能，経営資源の重複によるムダが生じる可能性がある。"],"f":"p2_12-1.webp","p":""},{"id":"12-2","b":"p2","c":12,"n":2,"t":"事業部の責任会計上の位置付け⑴","i":"A","y":"A","q":["事業部制組織において，各事業部は責任会計上どのように位置付けられるか。事業部長に対する権限委譲のパターンに関連させて説明しなさい。"],"a":["事業部制において，各事業部は業務執行にかかわる包括的な意思決定権限を有することから，収益と原価の双方に責任を負う独立採算単位という意味で，広義には利益センターとして位置付けられる。","ここで，事業部長に対する権限委譲のパターンには，業務執行権限のみを委譲し，投資決裁権は本部がこれを留保するパターンと，業務執行権限に加えて投資決裁権をも委譲するパターンとがある。前者の場合，各事業部は利益責任のみを負う狭義の利益センターとして位置付けられるが，後者の場合は投資額との関連で利益責任を負う投資センターとして位置付けられる。"],"k":["業務執行権限","投資決裁権","本社","利益センター","投資センター"],"kg":[{"l":"","w":["業務執行権限","投資決裁権","本社","利益センター","投資センター"]}],"e":["事業部を利益センター(プロフィット・センター)と呼ぶか投資センター(インベストメント・センター)と呼ぶかについては，実務上は曖昧な部分が多い。実務では，独立採算単位としての事業部の別称として，利益センターという用語を広義>で使用することが少なくないからである。ただし，責任会計の見地からすれば，M事業部長に委譲された権限と責任の範囲によってこれを明確に区別すべきであり，投資決裁権が委譲されていれば投資センター，委譲されていなければ狭義の利益センターとして位置付けられることになる(図表12-３)。","なお，米国企業では，事業部を投資センターとして位置付けるのが通常であるが，日本企業では，伝統的にこれを狭義の利益センターとして位置付けてきたといわれる。しかし，日本企業においても，90年代以降にカンパニー制と呼ばれる組織形態が積極的に導入され，近年では，事業部を投資センターと位置付ける企業が増加している。"],"f":"p2_12-2.webp","p":"p2_12-2_past.webp"},{"id":"12-3","b":"p2","c":12,"n":3,"t":"事業部の責任会計上の位置付け⑵","i":"A","y":"B","q":["事業部制の実務においては，事業部長が投資決裁権を完全にもたない場合であっても，事業部の固定資産を管理可能資産とし，事業部を投資センターとして扱うことが少なくないという。その理由を推測して説明しなさい。"],"a":["一般に，投資は事業部長の提案によって行われることが多く，少なくとも事業部長の賛同を得て行われる。つまり，事業部長が投資決裁権を完全にもたない場合であっても，他の事業部長と比べれば，当該事業部の投資に対して相対的に影響力をもつと考えられる。","その意味において，事業部長にとって投資額は管理可能とみなしうるため，事業部の固定資産を管理可能資産とし，事業部を投資センターとして扱うものと推測される。"],"k":["投資決裁権","事業部長の提案","事業部長の賛同","相対的な影響力","管理可能"],"kg":[{"l":"","w":["投資決裁権","事業部長の提案","事業部長の賛同","相対的な影響力","管理可能"]}],"e":["事業部は，利益センター(プロフィット・センター)又は投資センター(インベストメント・センター)と定義されるが，これは，事業部長にとって利益(収益と費用)や投資額が管理可能とみなされていることを意味する。","ここで，管理可能性は①管理階層，②業績測定期間，③影響力の程度との関係で相対的な概念であり，③について管理可能とは，完全な影響力をもつことではなく，実質的な影響力，つまり，他の管理者と比べて相対的に影響力をもつことを意味する。したがって，事業部長が投資決裁権を完全にもたない場合であっても，他の事業部長と比べて相対的に影響力をもつことを根拠に，事業部の固定資産を管理可能資産とみなし，事業部を投資センターとして位置付けるのである。","なお，事業部の保有する遊休固定資産は，その効果的な利用ないし処分を促進するために，管理可能資産に含めるのが通常である。ただし，事業部長の意思に反して，本社の意向で保有させられている遊休固定資産は，事業部長にとって管理不能なので，管理可能資産から除外すべきである。","また，事業部長が仕入債務の支払を早くするか遅くするかについて決定権をもつ場合には，それは管理可能負債であるので，これを管理可能資産から控除するのが良いといわれる(図表12-４)。"],"f":"p2_12-3.webp","p":"p2_12-3_past.webp"},{"id":"12-4","b":"p2","c":12,"n":4,"t":"カンパニー制の特徴","i":"C","y":"B","q":["我が国において90年代以降積極的に導入されたカンパニー制の特徴について，「日本型事業部制」といわれる我が国の伝統的な事業部制や米国型の事業部制との比較において説明しなさい。"],"a":["「日本型事業部制」と呼ばれる我が国の伝統的な事業部制は，各事業部に投資決裁権を委譲しないで，業績測定において利益責任のみを問う利益センターとして発展してきたといわれる。","この点，カンパニー制においては，各事業部に対して投資決裁権を委譲し，投資センターとしての業績測定を行うため，米国型の事業部制に類似するといえる。ただし，カンパニー制においては，事業部ごとに貸借対照表を作成し，これを業績管理の中心に据えるという特徴があり，その点においては米国型の事業部制と相違する。"],"k":["投資決裁権","利益センター","投資センター","事業部貸借対照表"],"kg":[{"l":"","w":["投資決裁権","利益センター","投資センター","事業部貸借対照表"]}],"e":["我が国の事業部制は，特定の職能分野を事業単位とみなす分権管理(職能別事業部制)や，各事業部に投資決裁権を委譲しないで，売上高や利益額をもって業績測定を行う利益センター方式で発展してきたといわれる。その背景には，「企業の所有者である株主から資本運用を委託されている」という意識が経営者において希薄であったことが関連しているといわれる。","しかし，株主重視の経営というアメリカン・スタンダードの流入に関連して，90年代以降，大手企業は相次いでカンパニー制という組織形態を導入するに至った。カンパニー制とは，社内分社制ともいわれ，企業内に製品別あるいは顧客別といった特定の市場に対して一元的に責任を有する独立性の高い事業単位(カンパニー)を設ける管理方式である。","カンパニー制では，カンパニー長に設備投資や人事権のような経営の基本資源の配分に関する権限が大幅に委譲され，投資効率を加味した業績測定が行われる。つまり，伝統的な「日本型事業部制」が職能管理の分権化と利益責任中心の管理方式であったのに対し，近年のカンパニー制の特徴は，資本運用の分権化と投資効率を重視した投資センター方式の事業部制である点に特徴がある。その意味では，従来の日本企業特有の事業部制を，本来の特徴を備えた米国型のそれに修正することを企図したものであるといえるが，事業部ごとに貸借対照表を作成(社内資本金制度を採用)し，これを業績管理の中心に据えるという特徴があるため，その点においては米国型の事業部制と相違する(図表12-５)。","なお，カンパニー制は，従来本社権限であった投資権限や人事権を大幅に委譲することによって，カンパニーの自立性を強化し，意思決定の迅速化，管理階層の短縮，独立採算の徹底といった持株会社経営と同等の効果を享受することを意図して導入された組織形態である。したがって，純粋持株会社を解禁する独占禁>止法の改正(1997)以降，持株会社経営を支える様々な法整備が進んだ現代においMては，擬似会社制度に過ぎないカンパニー制の組織形態としての存在意義は低下したといわざるをえない。","ただし，将来の分社化を見据えたシミュレーションとしてカンパニー制を導入する意義はあり，カンパニーという社内の事業単位での独立的な業績測定が，その後の分社化を容易にしたという報告もある。"],"f":"p2_12-4.webp","p":""},{"id":"12-5","b":"p2","c":12,"n":5,"t":"投資利益率と残余利益の比較⑴","i":"A","y":"B","q":["投資センターの代表的な業績測定尺度としては，投資利益率(ＲＯＩ)と残余利益(ＲＩ)が挙げられるが，一般に，ＲＩを使用する場合には，投資センターの管理者の投資判断について目標整合性を確保できるといわれる。その理由について，業績測定尺度にＲＯＩを使用する場合と比較して説明しなさい。"],"a":["業績測定尺度としてＲＯＩを使用する場合には，管理者にとって現在のＲＯＩが投資判断に際してのハードルレートとなるため，資本コスト率を上回る本来実行すべき投資案が見送られたり，資本コスト率を下回る本来見送るべき投資案が実行されたりする可能性がある。","一方，業績測定尺度としてＲＩを使用する場合には，管理者にとって資本コスト率が投資判断に際してのハードルレートとなるため，ＲＯＩが資本コスト率を上回る投資案は実行され，ＲＯＩが資本コスト率を下回る投資案は見送られる可能性が高い。したがって，投資判断について目標整合性を確保できるのである。"],"k":["ハードルレート","現在のＲＯＩ","資本コスト率"],"kg":[{"l":"","w":["ハードルレート","現在のＲＯＩ","資本コスト率"]}],"e":["投資センターの業績測定に当たっては，投資効率を加味するべく，利益と投資額を関連付けた業績測定尺度を使用する必要がある。そこで，利益と投資額の関連付け方の相違に基づき，投資利益率(ＲＯＩ)と残余利益(ＲＩ)という２つの尺度が提案されることになる(図表12-６)。","このうち，ＲＯＩを投資センターの業績測定に使用する場合には，管理者に短期的な比率の改善を促すことになるため，投資判断に際してのハードルレートは現在のＲＯＩとなる。したがって，たとえＲＯＩが資本コスト率を上回る有利な投資案(資本コスト率を下回る不利な投資案)であったとしても，現在のＲＯＩを下回る(上回る)場合には，その投資案は見送られる(実行される)可能性が高い。その結果，投資判断について目標整合性が失われる恐れがある(図表12-７)。","これに対してＲＩの特徴は，利益計算の中に資本コスト(率)を組み込む点にある。すなわち，ＲＩを投資センターの業績測定に使用する場合には，管理者に資本コスト(率)を上回る利益(率)をあげることを促すことになるため，投資判断に際してのハードルレートは現在のＲＯＩではなく資本コスト率となる。その結果，ＲＯＩが資本コスト率を上回る有利な投資案(ＲＯＩが資本コスト率を下回る不利な投資案)は，採用される(見送られる)可能性が高くなるため，投資判断について目標整合性を確保することができるのである(図表12-７)。"],"f":"p2_12-5.webp","p":"p2_12-5_past.webp"},{"id":"12-6","b":"p2","c":12,"n":6,"t":"投資利益率と残余利益の比較⑵","i":"B","y":"B","q":["投資センターの代表的な業績測定尺度としては，投資利益率(ＲＯＩ)と残余利益(ＲＩ)が挙げられるが，ＲＩを使用する場合には，投資センターとしての事業部業績の優劣についてより適切な判断が可能になるといわれる。その理由について，業績測定にＲＯＩを使用する場合と比較して説明しなさい。"],"a":["ＲＯＩを使用する場合には，資本コスト率が計算上考慮外となっているため，事業部業績の優劣について一律な判断を下すことしかできない。","一方，ＲＩを使用する場合には，資本コスト率を計算上考慮するため，そのレベルに応じて優劣を判断することができる。したがって，より適切な判断が可能になるのである。"],"k":["資本コスト率のレベル","事業部業績の優劣"],"kg":[{"l":"","w":["資本コスト率のレベル","事業部業績の優劣"]}],"e":["事業部業績の優劣について，投資利益率(ＲＯＩ)による評価と残余利益(ＲＩ)Mによる評価は必ずしも整合しない。ＲＯＩによる評価は資本コスト率にかかわらず一定であるが，ＲＩによる評価は資本コスト率の水準如何によって変動するからである(図表12-８)。ここで，資本コスト率が変動すれば，総額としての資本コストの負担も変動するのが当然であるから，これを業績測定に反映することが望ましい。その意味では，事業部業績の優劣の判断に際しては，ＲＩによる評価が適切ということになる。","ただし，規模の異なる事業部間の比較に際しては，ＲＩよりもＲＯＩによる業績測定が望ましいともいえる。金額ではなく比率による評価を行うことで，規模の相違を均した効率性の判断が可能となるからである。","以上より，ＲＯＩとＲＩの長所と短所をまとめれば，図表12-９のようになる。","図表12-８事業部業績の優劣の判断に関する投資利益率と残余利益の比較"],"f":"p2_12-6.webp","p":"p2_12-6_past.webp"},{"id":"12-7","b":"p2","c":12,"n":7,"t":"残余利益と投資意思決定の関係","i":"A","y":"B","q":["投資センターの業績測定尺度として残余利益(ＲＩ)を使用する場合，管理者の投資意思決定について目標整合性を確保するという観点から，①単年度ベースのＲＩの弊害と，②複数期間ベースのＲＩの利点を述べなさい。"],"a":["①単年度ベースのＲＩの弊害","資本コストの負担が大きい投資期間の初期においては，単年度のＲＩがマイナスとなる可能性がある。そのため，単年度ベースのＲＩを用いて業績測定を行えば，正味現在価値がプラスの投資案の実行が見送られるという目標不整合の危険がある。","②複数期間ベースのＲＩの利点","投資期間のＲＩの現在価値総額は，正味現在価値に一致するという関係にある。そのため，複数期間(投資期間)ベースのＲＩを用いて業績測定を行うことで，正味現在価値がプラスの投資案の実行を促し，投資判断について目標整合性を確保することができる。"],"k":["投資期間の初期","資本コスト","現在価値総額","正味現在価値"],"kg":[{"l":"","w":["投資期間の初期","資本コスト","現在価値総額","正味現在価値"]}],"e":["投資センターの管理者の投資判断に関する残余利益(ＲＩ)の有効性は，単年度の投資案を前提として説明され
