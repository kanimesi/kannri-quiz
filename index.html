較したところで，各期の能率の良否を純粋に判断することはできないという限界がある。","この点，標準原価計算では，達成されるべき原価の目標としての標準原価を基準値として，実際原価との差異を分析する。ここで，標準原価は科学的，統計的調査に基づいて能率の尺度となるように予定されるため，基準値としての規範性を有している。したがって，これと実際原価との差異を分析することにより，各期の能率の良否を純粋に判断することが可能となり，原価管理に有用な情報を提供することができるのである。"],"k":["実際原価","偶然性","標準原価","科学的・統計的調査","基準値","規範性各期の能率の良否"],"kg":[{"l":"","w":["実際原価","偶然性","標準原価","科学的・統計的調査","基準値","規範性各期の能率の良否"]}],"e":["歴史的には，実際原価計算の枠内でも，偶然性の混入という問題点を克服するために様々な方策がとられてきた。すなわち，予定価格や予定配賦率の導入といった試みであり，これらは価格や操業度の偶然的な変動を排除するという意味では一定の効果を有していた。しかし，実際消費量に基づいて計算する以上，実際原価に作業能率に関する偶然性が混入することは不可避なのであって，そのような偶然的原価を基準値とするやり方では，各期の原価業績を適切に判断することはできない。これを適切に判断するためには，達成すべき原価の目標としての標準原価を基準値としなければならないのである(図表４-３)。","ただし，標準原価計算が原価管理に役立つといっても，それは，基準値としての標準原価が科学的，統計的調査に基づいて適切に設定されていることを前提とする。この点の重要性は強調してもし過ぎることはないのであって，仮に標準原価自体に規範性がなければ，標準原価管理の存在意義は根底から覆されることに注意しなければならない。","なお，「原価計算基準」では，標準原価算定の目的として４つの目的をあげているが，最も重要な目的は原価管理であるとしている(図表４-４)。"],"f":"p1_4-2.webp","p":"p1_4-2_past.webp"},{"id":"4-3","b":"p1","c":4,"n":3,"t":"標準原価計算制度と計算・記帳の簡略化・迅速化","i":"A","y":"B","q":["標準原価計算制度において計算・記帳が簡略化・迅速化される理由について，パーシャル・プランを前提として，実際原価計算制度との比較において説明しなさい。"],"a":["実際原価計算制度では，実際原価を費目別，部門別，製品別の順にころがして計算する。この点，標準原価計算制度では，費目別，部門別に実際原価を計算するという点は実際原価計算制度と共通するが，製品別計算自体は事前に設定した原価標準を用いて行うため，実際原価を製品別に集計する必要がない。したがって，実際原価計算制度と比べて，計算・記帳手続が著しく簡略化・迅速化されるのである。"],"k":["実際原価","ころがし計算","標準原価","並行計算","製品別集計"],"kg":[{"l":"","w":["実際原価","ころがし計算","標準原価","並行計算","製品別集計"]}],"e":["歴史的には，実際原価計算制度の枠内でも，予定価格や予定配賦率の導入によって計算の迅速化が図られてきた。しかし，実際原価計算制度の領域にとどまる限りは，計算が遅延するという問題を根本的に解決することはできない。実際消費量に基づいて計算した実際原価を費目別，部門別の順にころがし計算し，最終的に製品別に集計しなければならないからである。本当の意味で計算・記帳手続を簡略化・迅速化するためには，最も複雑で手間のかかる実際原価の製品別集計(原価配分手続)を省略する必要があり，それは製品単位当たりの標準原価(原価標準)を事前に設定し，これを複式簿記機構の中に組み入れる(つまり，標準原価計算制度を採用する)ことよってはじめて達成されるのである。","ここで，標準原価計算制度においては，標準原価のみならず，実際原価をも計算するため，実際原価のみを計算する実際原価計算制度と比べて２倍の手間がかかると考えがちであるが，それは全くの誤解である。標準原価計算制度において実際原価を計算するといっても，それは費目別，部門別の実際原価であって，製品別に実際原価を計算するわけではないからである(図表４-５)。確かに，原価標準の設定と改訂には相当の手間を要するが，いったん新標準が設定されると，その後の計算・記帳手続は，実際原価計算制度と比べて著しく簡略化・迅速化されることになる。","なお，標準原価計算の方法には，実際原価計算制度を採用する場合に勘定組織の枠外の統計的補助記録の中で行う統計的標準原価計算と，複式簿記機構と有機的に結合して常時継続的に行う標準原価計算制度とがある。この点，記帳の簡略化・迅速化というメリットは，複式簿記と結合してはじめて生まれるものであるから，標準原価計算制度の採用が前提となる。"],"f":"p1_4-3.webp","p":""},{"id":"4-4","b":"p1","c":4,"n":4,"t":"標準原価管理のサイクル","i":"B","y":"B","q":["標準原価計算による原価管理のサイクルは，事前原価管理，日常的原価管理，事後原価管理に分類されるが，それぞれを簡潔に説明しなさい。"],"a":["まず，事前原価管理とは，原価標準を設定(改訂)してこれを指示し，現場管理者や作業員を原価目標の達成に向けて動機づける活動をいう。","次に，日常的原価管理とは，日々の作業について，主として物量データによる標準と実績及びその差異を把握する活動をいう。","最後に，事後原価管理とは，月末において，標準原価と実際原価及びその差異を算定把握し，その発生原因を分析することにより，原価能率を増進するための是正措置を講じる活動をいう。"],"k":["原価標準","動機づけ","物量データ","指導規制","原因分析","是正措置"],"kg":[{"l":"","w":["原価標準","動機づけ","物量データ","指導規制","原因分析","是正措置"]}],"e":["標準原価管理(原価統制)のサイクルは，事前原価管理(事前統制)と事後原価管理(事後統制)に大別されるが，両局面におけるポイントは次の通りである。","まず，事前原価管理(事前統制)においては，現場管理者を含めて，科学的方法>により原価標準の設定を行うことが重要となる。そうすることによって，現場管M理者にとって納得のいく形で原価目標についての合意を形成し，その達成意欲を喚起することができるからである。また，標準原価は，原価管理のためにも，棚卸資産価額及び売上原価算定のためにも，現状に即した標準でなければならないから，常にその適否を吟味し，機械設備，生産方式等生産の基本条件が変化した場合は勿論のこと，価格水準や能率水準に重大な変化が生じた場合にも，現状に即するように適宜これを改訂することを考慮すべきである。","次に，事後原価管理(事後統制)においては，例外管理の考え方が重要となる。つまり，全ての差異について原因を調査するのではなく，差異が多く出た箇所に注目し，その原因が管理可能なものであれば改善策を考えるべきであり，差異が少ない箇所には注意を向ける必要はないということである。なお，原価差異分析の結果，標準そのものが不適当であると判明すれば，標準を見直さなければならない。これは，翌期の事前原価管理(事前統制)において，原価標準の改訂として反映されることになる。","＇原因分析事後原価管理日常的原価管理標準実績比較＇"],"f":"p1_4-4.webp","p":"p1_4-4_past.webp"},{"id":"4-5","b":"p1","c":4,"n":5,"t":"理想標準原価が制度上認められない理由","i":"A","y":"A","q":["我が国の「原価計算基準」によれば，理想標準原価は制度としての標準原価ではないとされている。そこで，理想標準原価が原価計算制度上の標準原価として認められない理由を説明しなさい。"],"a":["理想標準原価は仕損や減損の消費余裕を一切許容しない標準原価であるから，これを達成することは現実には不可能である。したがって，財務諸表作成の観点からすれば，多額の原価差異(不利差異)の発生が自明であるため，もはやそれは棚卸資産価額の算定に資する真実の原価とはいえない。また，原価管理の観点からすれば，目標が厳しすぎる結果として，現場管理者や現場作業員の動機づけを損なう危険性があり，望ましくない。","以上より，理想標準原価は原価計算制度上の標準原価としては認められないのである。"],"k":["消費余裕","達成不可能","多額の原価差異","真実の原価","動機づけ"],"kg":[{"l":"","w":["消費余裕","達成不可能","多額の原価差異","真実の原価","動機づけ"]}],"e":["原価標準を設定する際には，これを構成する価格，能率及び操業度に関する基礎水準を仮定しなければならない。標準原価は，この基礎水準の組合せによって，一般に，理想標準原価，現実的標準原価，正常原価(正常標準原価)に分類される。また，本来の標準原価とは区別されるが，標準原価として実務上見積原価(予定原価)が意味される場合があり，「原価計算基準」ではこの４つを標準原価として説明している(図表４-７)。","このうち，標準原価計算制度において用いられる標準原価は現実的標準原価又は正常原価であり，理想標準原価は原価計算制度上の標準原価としては認められていない。その理由は，財務諸表作成と原価管理の双方の見地から説明されるが，多額の原価差異が生じるとしても，これを財務会計上適正に処理しさえすれば，財務諸表の作成に当たっての不備は生じないのであって，理想標準原価が原価管>理に役立つのであれば，これを原価計算制度に組み込んでも問題はないはずであMる。したがって，「原価計算基準」では，むしろ短期的な動機づけという部分での原価管理上の問題点を深刻に捉えていたと見ることができる。","ただし，近年では，原価管理用の標準原価として理想標準原価を使用する企業が増加しており，「原価計算基準」設定当時と比べて，その位置付けは大きく変化していることに注意する。"],"f":"p1_4-5.webp","p":"p1_4-5_past.webp"},{"id":"4-6","b":"p1","c":4,"n":6,"t":"現実的標準原価が原価管理に役立つ理由","i":"A","y":"B","q":["標準原価は，価格，能率，操業度といった基礎水準の組合せにより，理想標準原価，現実的標準原価，正常原価，予定原価に区別される。「原価計算基準」によれば，このうち，現実的標準原価が原価管理に最も役立つとされるが，その理由を説明しなさい。"],"a":["現実的標準原価では，努力すれば短期的に達成可能な高い能率水準が予定されているため，現場管理者や現場作業員の動機づけ効果に優れている。その結果，短期的に最も良い原価業績を引き出すことができると考えられるため，原価管理に役立つとされるのである。"],"k":["達成可能高能率","動機づけ","短期的","原価業績"],"kg":[{"l":"","w":["達成可能高能率","動機づけ","短期的","原価業績"]}],"e":["理想標準原価が仕損や減損の消費余裕を一切許容しないのに対し，現実的標準原価は，高いレベルではあるがこれを許容する。つまり，理想標準原価に通常生ずると認められる程度の減損，仕損等の消費余裕を加味したものが現実的標準原価であり(図表４-８)，それは，短期的に達成可能な(現場管理者や現場作業員が短期的に受容しうる)範囲において，最も厳しい標準に相当する。そのため，現場管理者や現場作業員の動機づけを効果的に行うことが可能であり，結果として最も良い原価業績を短期的に引き出すことができるといわれる。","なお，事前統制段階の動機づけ目的で厳しい能率水準を予定すると，事後統制段階の標準実績差異は不利差異ばかりになる可能性が高い(図表４-８)。したがって，業績評価の方法如何によっては，次期以降の現場管理者や現場作業員の動機づけをかえって損なう危険性があることに注意しなければならない。そこで，原価業績の評価に際しては，不利差異を全く否定するのではなく，標準の＋５％までの不利差異は不問に付すなど，不利差異を前提とした評価を行うことが求められる。"],"f":"p1_4-6.webp","p":"p1_4-6_past.webp"},{"id":"4-7","b":"p1","c":4,"n":7,"t":"理想標準原価を原価管理に使用する意義","i":"A","y":"A","q":["仕損ゼロを志向する現代企業において，原価管理用の標準原価として理想標準原価を使用する意義について，現実的標準原価を使用する場合と比較して説明しなさい。"],"a":["現実的標準原価は正常仕損費を含むため，これを原価管理に使用したところで，正常仕損費は良品の原価に埋没し，将来的に回避すべき無駄を完全に明示することができない。その結果，仕損ゼロの達成に向けた動機づけが弱く，長期的な原価改善に限界が生じることになる。","この点，理想標準原価は正常仕損費を含まないため，これを原価管理に使用することにより，将来的に回避すべき無駄を完全に明示することが可能となる。その結果，仕損ゼロの達成に向けた動機づけをより効果的に行うことができるという意義がある。"],"k":["正常仕損費","回避すべき無駄","仕損ゼロ","動機づけ","原価改善"],"kg":[{"l":"","w":["正常仕損費","回避すべき無駄","仕損ゼロ","動機づけ","原価改善"]}],"e":["仕損ゼロ(zerodefect：ＺＤ)というのは製造企業における究極的な目標であり，それ自体はスローガンの域を出るものではない。ただし，仕損の発生を出来る限り少なく抑えることが望ましいことはいうまでもないのであって，そのためには，仕損の発生に対する問題意識やこれを削減しようとするモチベーションを喚起する必要がある。そこで，仕損費の可視化の程度が問題となるが，正常仕損費をも明示しうるという点において，現実的標準原価を使用する場合よりも，理想標準原価を使用する場合の方が優れているといえる。確かに，正常仕損費は現状の製造プロセスに固有の無駄であり，短期的にはその発生を回避することは不可能であるが，ＺＤを追求する限りは将来的に回避すべき無駄であり，そのような将来の原価低減目標を経常的に把握することに大きな意義が認められるのである。","ただし，理想標準原価を使用する場合には，現実的標準原価を併用することが望ましいと考えられる。これにより，事前統制段階の現場管理者や作業員の動機づけにも配慮することができるし，事後統制段階では，現実的標準原価を媒介として全ての無駄を回避可能差異と回避不能差異とに分解し，短期的な原価責任を明確にすることができるからである(図表４-９)。"],"f":"p1_4-7.webp","p":"p1_4-7_past.webp"},{"id":"4-8","b":"p1","c":4,"n":8,"t":"原価標準に正常仕損費を組み込む方法","i":"B","y":"A","q":["原価標準に正常仕損費を組み込む方法としては，原価要素別の標準消費量に正常仕損の余裕分を組み込んで補正する方法(第１法)と，正味標準原価に正常仕損費を特別費として加算する方法(第２法)の２つがある。そこで，①月末仕掛品の評価と②原価差異の分析のそれぞれの観点から，第１法と第２法の相違点を説明しなさい。"],"a":["①月末仕掛品の評価の観点","第１法では，原価要素別の標準消費量の中に正常仕損の余裕分を含めているため，仕損の発生時点にかかわらず，月末仕掛品は自動的に正常仕損費を負担することになる。この点，第２法では，正常仕損費を特別費として加算するため，これを分離把握し，関係する良品のみに負担させることができる。","②原価差異の分析の観点","第１法では，原価差異の分析に際して仕損を度外視するため，異常仕損費が原価差異に混入する上に，標準消費量の計算も不正確になる。この点，第２法では，原価差異の分析に際して仕損を度外視しないため，異常仕損費を分離することができる上に，標準消費量も正確に計算することができる。"],"k":["正常仕損費","負担関係","負担割合","度外視","異常仕損費","標準消費量"],"kg":[{"l":"","w":["正常仕損費","負担関係","負担割合","度外視","異常仕損費","標準消費量"]}],"e":["①月末仕掛品の評価における相違点は，実際総合原価計算における度外視法(第１法に対応)と非度外視法(第２法に対応)の相違点と同じように考えればよい。第１法では，原価要素別の標準消費量の中に正常仕損の余裕分を含むため，直接材料費と加工費の各計算区分において正常仕損費を自動的に負担させることになり，第２法と比べて計算が不正確になる。具体的には，月末仕掛品の加工費進捗度＜仕損の発生時点の加工費進捗度の場合は，負担関係を無視する結果として計算が不正確になるし，仕損の発生時点の加工費進捗度＜月末仕掛品の加工費進捗度の場合は，負担割合を無視する結果として計算が不正確になる。","一方，②原価差異の分析における相違点は，生産データ上の仕損の取り扱いに関連する(図表４-10)。第１法における原価要素別の標準消費量は，正常仕損の余裕分を含む総標準消費量であるため，原価差異の分析に際しては，仕損度外視後の当月投入量を基礎とする。その結果，異常仕損費を分離することができず，それは原価差異の中に混入する。この点，第２法における原価要素別の標準消費量は，正常仕損の余裕分を含まない正味標準消費量であるため，原価差異の分析に際しては，仕損品を含む当月投入量を基礎とし，標準仕損ベースの当月投入量に対する標準消費量と実際仕損ベースの当月投入量に対する標準消費量の差として，異常仕損費(仕損差異)を分離することができる。","なお，第１法における原価差異の分析に際して，標準消費量が不正確になるのは，仕損度外視後の当月投入量に正常仕損の余裕分を含む製品単位当たりの総標準消費量を乗じる結果，月初・月末の仕掛品からも仕損が発生済みと仮定することになるからである(図表４-10)。"],"f":"p1_4-8.webp","p":"p1_4-8_past.webp"},{"id":"4-9","b":"p1","c":4,"n":9,"t":"標準原価の製造予算への利用","i":"A","y":"B","q":["我が国の「原価計算基準」によれば，現実的標準原価は，「原価管理に最も適するのみでなく，たな卸資産価額の算定および予算の編成のためにも用いられる」としている。そこで，現実的標準原価を予算編成に利用するに当たっての留意点について説明しなさい。"],"a":["現実的標準原価では，努力すれば短期的に達成可能な高い能率水準を予定するため，一定の不利差異の発生が見込まれる。したがって，これを単純に積み上げてそのまま製造予算とすれば，資金予算の統制に不備が生じる危険性がある。","以上より，予算編成に現実的標準原価を利用する場合には，これに一定の期待差異を加味し，実際原価に近似するように修正する必要があることに留意すべきである。"],"k":["達成可能高能率","不利差異","製造予算","資金予算","期待差異"],"kg":[{"l":"","w":["達成可能高能率","不利差異","製造予算","資金予算","期待差異"]}],"e":["標準原価は，科学的，統計的調査に基づいて設定されるため，これをもとに製造予算を作成することによって，予算に信頼性を付与することができるというメリットがある。ただし，標準原価はあくまでも「信頼しうる基礎」を提供するのみであって，製造予算の作成に当たってこれをそのまま使用することには問題がある。","ここで，標準原価といえば，現実的標準原価を指すのが通常であるが，現実的標準原価では，事前統制段階の動機づけ目的から，努力すれば短期的に達成可能な高い能率水準(達成可能高能率)が予定されている。つまり，事後統制段階では，不利差異の発生が予定されているといってよい。したがって，仮に，これを単純に積み上げて算定した製造予算に基づいて資金予算を編成すれば，現実にはより多くの現金支出が必要になる結果として，資金繰りに大きな問題が生じることになる。そのため，現実的標準原価を予算編成に利用する場合には，これに一定の期待差異を加味しなければならないのである。","なお，「原価計算基準」では，予算編成に適する標準原価として，予定原価(理論上の表現では見積原価ないし原価見積)を挙げている。予定原価は実際原価に近似するように設定されるものであるから，予め期待差異を含んでいると考えられるからである(図表４-11)。"],"f":"p1_4-9.webp","p":"p1_4-9_past.webp"},{"id":"4-10","b":"p1","c":4,"n":10,"t":"改訂頻度に基づく標準原価の分類","i":"B","y":"B","q":["標準原価をその改訂頻度の観点から２つに分類し，それぞれのメリット・デメリットを説明しなさい。"],"a":["標準原価は，その改訂頻度の観点から当座標準原価と基準標準原価に分類される。","当座標準原価とは，生産の基本条件が変化した場合は勿論のこと，価格水準や能率水準が変化した場合でも，標準が適用される製品の製造環境の現状に即するように適宜改訂される標準原価をいう。したがって，現状に即した原価管理や棚卸資産評価を行いうるというメリットがある反面，標準の改訂に手間とコストを要するというデメリットがある。","他方，基準標準原価とは，生産の基本条件が変化しない限り，価格水準や能率水準が変化しても改訂しない標準原価をいう。したがって，改訂の手間を要さず，実際原価の変動傾向を知りうるというメリットがある反面，現状に即した原価管理や棚卸資産評価を行うことができないというデメリットがある。"],"k":["生産の基本条件","価格水準","能率水準","原価管理","棚卸資産評価改訂の手間とコスト","実際原価の変動傾向"],"kg":[{"l":"","w":["生産の基本条件","価格水準","能率水準","原価管理","棚卸資産評価改訂の手間とコスト","実際原価の変動傾向"]}],"e":["標準原価は，設定後これをしばしば改訂するのか，あるいは改訂せずに固定しておくのか，すなわち，その改訂事由と改訂頻度の観点から，当座標準原価と基準標準原価に分類される(図表４-12)。","ここで，機械設備，生産方式等，生産の基本条件が変化した場合に標準原価を改訂するのは当然であり，当座標準原価と基準標準原価の相違は，価格水準や能率水準の変化を改訂事由とするか，という点にある。この点，原価管理や棚卸資産評価の観点からすれば，現状に即するように適宜改訂を行う当座標準原価の方が望ましいことは言うまでもない。したがって，標準原価といえば当座標準原価を指すのが通常であり，「原価計算基準」においても当座標準原価の採用を前提としている。","なお，基準標準原価は，原価管理や棚卸資産評価という観点からすると問題があるが，長期に渡って固定されるため，実際原価の変動傾向を知る尺度ないし指数の役割を果たすという貢献があることに注意する。"],"f":"p1_4-10.webp","p":"p1_4-10_past.webp"},{"id":"4-11","b":"p1","c":4,"n":11,"t":"直接費と間接費の標準の相違","i":"A","y":"B","q":["製造直接費と製造間接費のそれぞれについて，製品原価計算用の標準と原価管理用の標準の関係を説明しなさい。"],"a":["製造直接費は通常製品単位当たりで発生する変動費であるため，製品単位当たりで設定した原価標準に実際生産量を掛ければ，それがそのまま達成すべき原価の目標(予算許容額)を表す。したがって，製品原価計算用の標準と原価管理用の標準を区別する必要はない。","一方，製造間接費は総額で発生する固定費を含むため，製品単位当たりで設定した原価標準に実際生産量を掛けたところで，それがそのまま達成すべき原価の目標(予算許容額)を表すわけではない。したがって，製品原価計算用の標準と原価管理用の標準を区別する必要がある。"],"k":["変動費","固定費","原価標準","実際生産量","達成すべき原価の目標"],"kg":[{"l":"","w":["変動費","固定費","原価標準","実際生産量","達成すべき原価の目標"]}],"e":["「原価計算基準」によれば，製造直接費の標準は，価格標準と物量標準の積として製品単位当たりで算定することになっているのに対し，製造間接費の標準については，部門間接費予算として総額で算定することになっている。これは，原価管理目的を重視した規定であるといわれる。なぜなら，製造間接費に限っては，製品単位当たりで算定した製品原価計算用の標準(原価標準)とは別に，原価管理用の標準(目標)を責任区分別の間接費予算という形で別個に算定する必要があり，２つの標準のうち，原価管理用の標準について規定しているからである。","ここで，製造間接費の中には固定費を多く含むため，製品単位当たりで算定した製品原価計算用の標準(原価標準)に実際生産量を掛けたところで，標準配賦率の算定に際して固定費を変動費と擬制している以上，当該実際生産量における製造間接費の発生目標額を示すことはできない。そこで，製造間接費の管理においては，総額としての間接費予算を管理標準として使用することになるが，これは，製造間接費の管理方法が，実際原価計算と標準原価計算の領域で殆ど差がないこと，標準原価管理といえば通常は製造直接費(変動費)の管理を指し，製造間接費(固定費)の管理には標準原価管理が馴染まないことを意味している。","管理方法単位当たり標準に基づく物量管理責任区分別の予算に基づく金額管理"],"f":"p1_4-11.webp","p":"p1_4-11_past.webp"},{"id":"4-12","b":"p1","c":4,"n":12,"t":"標準原価計算制度における勘定記入法","i":"A","y":"A","q":["標準原価計算制度を簡潔に定義した上で，勘定記入の観点からこれを２つに分類して説明しなさい。"],"a":["標準原価計算制度とは，標準原価計算を複式簿記機構と結合させ，これを常時継続的に行う方法であり，さらに，標準原価をどの計算段階で複式簿記機構の中に組み入れるかにより，シングル・プランとパーシャル・プランに大別される。","このうち，シングル・プランとは，原価財の投入高を標準原価で計算し，仕掛品勘定の借方に標準原価で記入する方法をいう。一方，パーシャル・プランとは，標準原価の組み入れを原価計算期末まで待ち，実際生産量に原価標準を乗じて標準原価を計算する一方で，原価財の投入高は実際原価で計算し，仕掛品勘定の借方には実際原価を記入する方法をいう。"],"k":["複式簿記機構","標準原価","タイミング","原価財の投入(投入高)","実際生産量仕掛品勘定の借方","実際原価"],"kg":[{"l":"","w":["複式簿記機構","標準原価","タイミング","原価財の投入(投入高)","実際生産量仕掛品勘定の借方","実際原価"]}],"e":["実際原価計算制度では，製品別に実際原価を計算することから，仕掛品勘定は借方・貸方ともに実際原価で記入される。この点，標準原価計算制度では，実際原価の製品別集計を行わず，標準原価で製品原価を計算することから，少なくとも仕掛品勘定の貸方は標準原価で記入される。すなわち，シングル・プランとパーシャル・プランの相違は，仕掛品勘定の借方を標準原価で記入するか実際原価で記入するかという点に求められる。","シングル・プランでは，原価財の投入高を標準原価で計算し，仕掛品勘定の借方に標準原価で記入する。したがって，原価差異は材料勘定や賃金勘定において認識され，仕掛品勘定は借方・貸方ともに標準原価という単一種類(single)の原価で記入される(図表４-14)。","一方，パーシャル・プランでは，その期間の実際生産量(完成品数量と月末仕掛品完成品換算量)が確定する原価計算期末まで標準原価の複式簿記機構への組み入れを待ち，仕掛品勘定の借方には原価財の投入高を実際原価で記入する。したがって，仕掛品勘定には標準原価が部分的(partial)に記入され，借方記入された実際原価との差において原価差異が認識される(図表４-14)。","なお，これらは厳密に言えば製造直接費の勘定記入法であり，製造間接費の記帳は別問題と捉えられる。ただし，製造直接費の場合に準じ，シングル・プランにおいては標準配賦額を，パーシャル・プランにおいては実際発生額を仕掛品勘定の借方に記入するのが通常である。"],"f":"p1_4-12.webp","p":"p1_4-12_past.webp"},{"id":"4-13","b":"p1","c":4,"n":13,"t":"修正パーシャル・プランのメリット","i":"B","y":"A","q":["修正パーシャル・プランは，責任会計の見地においてパーシャル・プランよりも優れているといえるが，その理由を説明しなさい。"],"a":["修正パーシャル・プランとは，直接材料費や直接労務費の各仕掛品勘定の借方に，標準価格(標準賃率)で計算した実際原価を記入する方法をいう。","この方法によれば，仕掛品勘定において認識されるのは数量差異や作業時間差異のみであり，価格差異や賃率差異は認識されない。つまり，工程管理者にとって管理不能な差異を原価業績報告書に含めることがないため，責任会計の見地においてパーシャル・プランよりも優れているといえるのである。"],"k":["標準価格","実際原価","仕掛品勘定の借方","工程管理者","管理不能","価格差異原価業績報告書"],"kg":[{"l":"","w":["標準価格","実際原価","仕掛品勘定の借方","工程管理者","管理不能","価格差異原価業績報告書"]}],"e":["ここで，修正パーシャル・プランについて改めて定義するならば，「直接材料費Mについては標準価格と実際消費量の積を，直接労務費については標準賃率と実際作業時間の積を，それぞれ仕掛品勘定の借方に記入する方法」ということになる(図表４-15・図表４-16)。したがって，原価差異のうち，価格差異(賃率差異)は材料勘定(賃金勘定)において，数量差異(作業時間差異)は仕掛品勘定において認識される。","ここで，工程管理者の原価業績報告書の作成は当該工程の仕掛品勘定がベースとなるため，仕掛品勘定は，工程管理者の管理可能性に準じて記入されていることが望ましい。すなわち，責任会計の見地からすれば，一般に管理不能とされる価格差異や賃率差異は仕掛品勘定から予め排除されていることが望ましいのであって，その意味において，修正パーシャル・プランはパーシャル・プランよりも優れた方法であるといえる。"],"f":"p1_4-13.webp","p":""},{"id":"4-14","b":"p1","c":4,"n":14,"t":"パーシャル・プランの問題点","i":"C","y":"C","q":["間接材料費や間接労務費の記帳に関連してパーシャル・プランの問題点を説明し，解決法を示しなさい。"],"a":["パーシャル・プランでは，仕掛品勘定ではじめて標準価格や標準賃率を使用するため，間接材料としての消費額や間接作業・手待時間に関する消費賃金は，直接材料費や直接労務費と同様に，実際価格や実際賃率で計算・記帳することになる。その結果，間接材料の価格差異や間接作業・手待時間に関する賃率差異が製造間接費の実際発生額の中に混入し，予算差異を純粋に把握することができないという問題がある。","この問題点を解決するためには，修正パーシャル・プランを採用し，間接材料費や間接労務費を標準価格や標準賃率で計算・記帳すればよい。"],"k":["実際価格","実際賃率","間接材料の価格差異","間接作業の賃率差異","予算差異修正パーシャル・プラン"],"kg":[{"l":"","w":["実際価格","実際賃率","間接材料の価格差異","間接作業の賃率差異","予算差異修正パーシャル・プラン"]}],"e":["標準原価計算の計算問題では，間接材料消費量や間接作業・手待時間といったデータは通常出てこない。ただし，それは資料上与えられないというだけであって，現実には勿論存在する。そこで，それら間接材料費や間接労務費が，どのように計算・記帳されるのかが問題となる。","この点，パーシャル・プランのもとでは，材料勘定や賃金勘定で標準価格や標準賃率を使用することはないから，直接材料費や直接労務費と同様に，間接材料費や間接労務費も実際価格や実際賃率で計算・記帳するのが通常である。その結果，間接材料の価格差異や間接作業の賃率差異が製造間接費の実際発生額の中に混入し，予算差異の発生原因が不明確になるという問題がある(図表４-17)。これに対して，修正パーシャル・プランのもとでは，材料勘定や賃金勘定で標準価格や標準賃率を使用することから，間接材料費や間接労務費も標準価格や標準賃率で計算・記帳するのが通常である。その結果，間接材料の価格差異や間接作業の賃率差異を分離することが可能となり，パーシャル・プランの問題点を解決しうるのである(図表４-18)。"],"f":"p1_4-14.webp","p":""},{"id":"4-15","b":"p1","c":4,"n":15,"t":"原価差異の把握方法","i":"A","y":"A","q":["原価差異の把握方法にはインプット法とアウトプット法があるが，それぞれを簡潔に定義した上で，そのメリットとデメリットを説明しなさい。"],"a":["インプット法とは，原価財の製造現場への投入時点で標準実績比較を行い，その都度原価差異(不利差異)を把握する方法をいう。この方法のメリットは，早期に詳細な差異情報を入手可能であり，原価管理への役立ちが大きいという点であり，デメリットは，計算・記帳事務が煩雑になるという点である。","一方，アウトプット法とは，一期間の実際生産量が確定した後，これに原価標準を乗じて計算した標準原価と実際発生額とを比較することにより，一括的に原価差異を把握する方法をいう。この方法のメリットは，計算・記帳事務が僅少で済むという点であり，デメリットは，原価差異情報が詳細でなく，またその入手が遅延することから，原価管理への役立ちが制限されるという点である。"],"k":["原価財の投入時点","その都度","生産量の確定時点","一括的原価管理への役立ち","計算・記帳事務"],"kg":[{"l":"","w":["原価財の投入時点","その都度","生産量の確定時点","一括的原価管理への役立ち","計算・記帳事務"]}],"e":["インプット法とアウトプット法は，原価差異を把握するタイミングが相違するが，原価管理のためには，原価差異を出来るだけ早期に把握するのが望ましい。したがって，インプット法は，原価管理を重視し，早期に詳細な差異情報を必要とする企業に適するのに対し，アウトプット法は，原価計算に要する計算事務量を最小限におさえながら標準原価計算を実施しようとする企業に適するといえる。","原価管理に関連して，把握した原価差異の発生原因を調査することを技術的分析というが，インプット法とアウトプット法ではその性質が異なる。すなわち，インプット法では，差異が生じたその度に発生原因を明らかにしつつ，差異総額を積み上げて計算するため，技術的分析は経常的調査としての性質を有する。一方，アウトプット法では，原価計算期末にまず差異総額を把握し，必要に応じてその発生原因の調査にとりかかるため，技術的分析は特別調査としての性質を有する(図表４-19)。","なお，インプット法を採用する場合でも，直接労務費の賃率差異と製造間接費の予算差異及び操業度差異の把握については，アウトプット法によらざるをえない。これらの差異を把握するためには，実際賃率や実際発生額，実際操業度を知る必要があり，それらが確定するのは月末以降となるからである(図表４-20)。","差異の把握時点原価財の投入時点一期間の生産量の確定時点","メリット早期に詳細な差異情報を入手可能計算・記帳事務が僅少","デメリット計算・記帳事務が煩雑差異情報が概括的，入手が遅延","勘定記入法シングル・プランに対応パーシャル・プランに対応"],"f":"p1_4-15.webp","p":"p1_4-15_past.webp"},{"id":"4-16","b":"p1","c":4,"n":16,"t":"原価差異の把握方法と生産形態の関係","i":"B","y":"B","q":["インプット法は，個別生産やロット生産には適合するが，連続生産には適合しないといわれる。インプット法を採用するために必要な条件を踏まえた上で，なぜ，個別生産やロット生産には適合するが，連続生産には適合しないのかを説明しなさい。"],"a":["インプット法を採用するためには，その生産活動において許容される原価財の標準投入量が事前に判明していることが必要条件となる。","この点，個別生産やロット生産の場合は生産量が事前に確定しているため，原価財の標準投入量についても事前に算定することができるが，連続生産の場合は生産量は事後的に確定するため，原価財の標準投入量を事前に算定することは不可能ではなくとも困難である。","以上より，インプット法は個別生産やロット生産には適合するが，連続生産には適合しないのである。"],"k":["原価財の標準投入量","判明","生産量","事前","事後","確定"],"kg":[{"l":"","w":["原価財の標準投入量","判明","生産量","事前","事後","確定"]}],"e":["原価管理を重視するならば，原価差異の把握方法としてはインプット法を採用するのが望ましい。ただし，原価財の標準投入量(標準直接材料消費量や標準直接作業時間の総量)が事前に判明していなければ，投入時点で不利差異を把握することはできない。つまり，インプット法で原価差異を把握するためには，標準投入量算定の基礎となる生産量が事前に決まっている必要があり，生産形態としては個別生産やロット生産が前提となる。連続生産のもとでは，数量ではなく期間を区切って生産を行うため，生産量が事後的に確定する結果として，原価差異の把握はアウトプット法によるのが通常だからである(図表４-21)。したがって，見込生産を行う企業がインプット法を採用するためには，期間生産量を平準化するか，連続生産からロット生産への移行が必要になるといえる。","なお，ここでは生産形態との関係でインプット法の適用可能性について検討したが，現実にインプット法を採用するためには，超過材料庫出請求票，貸方票といった証憑類の整備が必要となる。"],"f":"p1_4-16.webp","p":"p1_4-16_past.webp"},{"id":"4-17","b":"p1","c":4,"n":17,"t":"原価差異の把握方法と勘定記入法の関係","i":"B","y":"B","q":["インプット法とアウトプット法の分類と，シングル・プランとパーシャル・プランの分類は密接な関係にあるが，分類基準は異なる。両者の分類基準の違いを明らかにした上で，対応関係を説明しなさい。"],"a":["インプット法とアウトプット法の分類が原価差異を把握するタイミングの相違に基づくのに対し，シングル・プランとパーシャル・プランの分類は，複式簿記機構の中に標準原価を組み入れるタイミングの相違に基づく。","ここで，原価差異を把握するタイミングと標準原価を複式簿記機構に組み入れるタイミングは一致するのが通常であり，インプット法はシングル・プランに，アウトプット法はパーシャル・プランに対応する。ただし，分類基準は異なるため，必ずしも１対１で対応するわけではない。"],"k":["原価差異","標準原価","複式簿記機構","タイミング","１対１"],"kg":[{"l":"","w":["原価差異","標準原価","複式簿記機構","タイミング","１対１"]}],"e":["インプット法はシングル・プランに対応するが，例えば，インプット法で直接材料費の数量差異を把握するのは，その消費量をコントロールするという原価管理目的に基づくものであって，仕掛品勘定の借方に標準直接材料費を記入するためではない。正確に言えば，インプット法を採用する場合には，原価財の投入時点で標準原価が明らかであることから，シングル・プランで記帳するのが通常であるに過ぎない。","同様に，アウトプット法はパーシャル・プランに対応するが，正確に言えば，アウトプット法を採用する場合には，一期間の実際生産量が確定した時点ではじめて標準原価が明らかになるのが通常であることから，結果としてパーシャル・>プランで記帳するに過ぎない。M","このように，原価差異をどのタイミングで把握するかというインプット法とアウトプット法の区別と，標準原価をどのタイミングで複式簿記機構に組み入れるかというシングル・プランとパーシャル・プランの区別は全くの別概念であり，両者は密接な関係にはあるものの，必ずしも１対１で対応するわけではないし，対応する必要もない(図表４-22)。","ただし，現実問題として，両者が密接な関係にあることは確かであり，本問のような直接的な問題を除いては，インプット法とシングル・プラン，アウトプット法とパーシャル・プランはそれぞれほぼ同義と捉えてよい。"],"f":"p1_4-17.webp","p":"p1_4-17_past.webp"},{"id":"4-18","b":"p1","c":4,"n":18,"t":"原価差異の相互依存性","i":"A","y":"B","q":["①直接材料費の価格差異と数量差異(歩留差異)，②直接労務費の賃率差異と作業時間差異(労働能率差異)の間に見られる一般的な関係を明らかにしなさい。"],"a":["①価格差異と数量差異の関係","高品質で高価な材料を多く使用すれば，不利な価格差異を発生させる一方で，歩留率の改善を通じて不利な数量差異の減少をもたらす。また，低品質で安価な材料を多く使用すれば，有利な価格差異を発生させる一方で，歩留率の悪化を通じて不利な数量差異の増加をもたらす。","以上より，直接材料費の価格差異と数量差異の間には，一般に，トレードオフの関係が見られる。","②賃率差異と作業時間差異の関係","高い賃率の熟練工を多く使用すれば，不利な賃率差異が発生する一方で，作業能率の改善を通じて不利な作業時間差異の減少をもたらす。また，低い賃率の未熟練工を多く使用すれば，有利な賃率差異が発生する一方で，作業能率の悪化を通じて不利な作業時間差異の増加をもたらす。","以上より，直接労務費の賃率差異と作業時間差異の間には，一般に，トレードオフの関係が見られる。"],"k":["材料価格","品質","歩留率","トレードオフ","賃率","熟練度","作業能率"],"kg":[{"l":"①","w":["材料価格","品質","歩留率","トレードオフ"]},{"l":"②","w":["賃率","熟練度","作業能率","トレードオフ"]}],"e":["一般に，材料価格(品質)と歩留率の間には密接な関係があるため，直接材料費の価格差異と数量差異(歩留差異)は相互に独立して発生するわけではなく，有利(不利)な価格差異の発生が不利な数量差異の増加(減少)をもたらすという具合に，両者の間にはトレードオフの関係が見られる。同じように，賃率(熟練度)と作業能率の間には密接な関係があるため，直接労務費の賃率差異と作業時間差異(労働能率差異)もまた相互に独立して発生するわけではなく，有利(不利)な賃率差異の発生が不利な作業時間差異の増加(減少)をもたらすというトレードオフ関係が認められる(図表４-23)。","また，直接材料費差異と直接労務費差異のそれぞれにおいてみられる相互依存性は，直接材料費差異と直接労務費差異の間にもみられる。例えば，低品質で安価な材料の使用は，有利な価格差異を発生させる一方で不利な数量差異を増加させるが，歩留率の悪化は作業時間の増加をもたらし，不利な作業時間差異の増加に帰着する。また，賃率の低い未熟練工の使用は有利な賃率差異を発生させるが，技能が劣る作業員の使用は仕損率の悪化をもたらし，不利な数量差異に帰着する(図表４-23)。","以上のように，このように，原価差異の間には相互依存性が認められるため，それを念頭に置いて原価差異の解釈を行うべきである。"],"f":"p1_4-18.webp","p":"p1_4-18_past.webp"},{"id":"4-19","b":"p1","c":4,"n":19,"t":"混合差異の取り扱い","i":"A","y":"A","q":["直接材料費差異の分析において，原価管理の見地からすれば，混合差異は価格差異と数量差異のいずれに含めるべきであるかを説明しなさい。"],"a":["一般に，価格差異は管理不能な企業外部の要因によって発生することが多いのに対し，数量差異は管理可能な企業内部の要因によって発生することが多い。したがって，原価管理の見地からすれば，原価責任を問いうる数量差異をより純粋に把握する必要がある。つまり，数量差異はこれを標準価格で評価するのが適切であることから，混合差異は価格差異に含めるべきであるといえる。"],"k":["管理可能","管理不能","原価責任","標準価格"],"kg":[{"l":"","w":["管理可能","管理不能","原価責任","標準価格"]}],"e":["直接材料費差異は，理論的には純粋価格差異，純粋数量差異，混合差異に三分されるが，一般的には価格差異と数量差異に二分する方法を採る。この場合，混合差異を価格差異と数量差異のいずれに含めるべきかが問題となるが，原価管理の見地から，これを価格差異に含めて計算するのが通常である(図表４-24)。原価管理を効果的に実施するためには，責任会計と結合し，管理可能性原則に則って会計処理を行う必要があり，一般に管理可能とされる数量差異の評価に当たっては，管理不能な価格変動の影響を排除すべきと考えられるからである。","ただし，数量差異を標準価格で評価する場合には，歩留の良否によって，直接材料費が現実にどれだけ増減したのかを知ることはできない。そこで，歩留の良否が与えた現実の経済的影響を把握するために，数量差異を実際価格で評価すべき(混合差異を数量差異に含めるべき)であるとする見解もある。また，価格差異と数量差異はそれぞれが独立的に発生するわけではなく，相互依存性が認められることから，純粋価格差異と純粋数量差異の金額比に基づき，混合差異を価格差異と数量差異とに配分すべきであるとする見解もある。"],"f":"p1_4-19.webp","p":"p1_4-19_past.webp"},{"id":"4-20","b":"p1","c":4,"n":20,"t":"価格差異の管理可能性","i":"B","y":"C","q":["今日の製造業においては，材料の必要量について固定価格契約を付していることが少なくない。そこで，この場合に生じる不利な価格差異の製造部門における管理可能性について検討しなさい。ただし，標準消費量は適切に設定されており，製品需要に変動はないものとする。"],"a":["材料の必要量について固定価格契約を付している場合，実際消費量がその範囲内で推移する限りは，価格差異が生じる余地はない。したがって，不利な価格差異が生じるということは，歩留が予想以上に悪化した結果として，価格契約が付された量を超える材料が必要となり，市場から固定価格を上回るスポット価格で購入せざるをえなかったためであると考えられる。","以上より，固定価格契約を付している場合に生じる不利な価格差異は，製造部門の管理者にとって管理可能と判断すべきである。"],"k":["歩留悪化","固定価格","スポット価格","発生原因"],"kg":[{"l":"","w":["歩留悪化","固定価格","スポット価格","発生原因"]}],"e":["直接材料費の価格差異は，市価の変動など企業外部の要因によって生じるのが通常であり，少なくとも製造部門においては管理不能と解するのが一般的であるが，本問のように，製造部門において管理可能と判断されるケースもある。重要なことは，原価差異の管理可能性はその発生原因に依存し，全ての原価差異について，管理可能な原因と管理不能な原因があるということである(図表４-25)。"],"f":"p1_4-20.webp","p":"p1_4-20_past.webp"},{"id":"4-21","b":"p1","c":4,"n":21,"t":"配合差異の分析方法の検討","i":"B","y":"B","q":["複数種類の原料を配合投入する場合，直接材料費の数量差異は，配合差異と歩留差異に分析することができる。この場合，原料別の配合差異の分析は，各原料の標準価格を用いて行うのが通常であるが，この伝統的分析法に対しては，分析結果の利用に限界があるとの批判がある。その意味を説明しなさい。"],"a":["伝統的な分析方法では，原料別の配合差異の分析に当たって，歩留差異分析の思考が混入している。すなわち，歩留差異の分析と同様に，各原料の標準消費量よりも実際消費量が少なければ有利，多ければ不利という分析を行うため，各原料の価格の相対性が考慮外となる結果，相対的に安価な原料の配合差異の有利・不利の別が，現実の経済的影響と逆の方向を示すことになる。そのため，分析結果の利用に限界があるとの批判がある。"],"k":["歩留差異分析の思考","相対的に安価な原料","現実の経済的影響"],"kg":[{"l":"","w":["歩留差異分析の思考","相対的に安価な原料","現実の経済的影響"]}],"e":["いま，パーシャル・プランの標準原価計算制度を採用する工場について，以下の〔資料〕が与えられたものとする。〔資料〕","この場合，伝統的方法により，原料別に当月の直接材料費差異を分析すれば，図表４-26のようになる。当月は，相対的に高価なＸ原料の配合割合を抑える一方で，相対的に安価なＹ原料の配合割合を高める意思決定行動を採っており，この配合割合の変化は，直接材料費全体に対してプラスの影響を与えたはずである。ところが，標準消費量と実際消費量の大小関係のみに着目する伝統的分析法によれば，各原料の価格の相対性が考慮外となるため，Ｙ原料の配合差異は不利差異として算定されてしまう。つまり，現実の経済的影響と逆の方向を示すことになるのである。","そこで，原料別の配合差異の分析に当たって，各原料の加重平均標準価格を媒介とする方法が提案される。この場合，原料別の配合差異は，各原料の標準消費量と実際消費量の差に，各原料の標準価格と加重平均標準価格の差を乗じることにより算定される。すなわち，各原料の価格の相対性を考慮した分析を行うことから，原料別の配合差異の分析結果は，現実の経済的影響を正しく示すことになる(図表４-27)。","それでは，伝統的分析法よりも，加重平均標準価格を媒介とする方法の方が優れているといえるのだろうか。答えは否である。確かに，伝統的方法の分析結果には一部問題があるが，それをもって分析結果の利用に限界があるとする批判は，原料別の配合差異の分析結果の利用を前提としている。しかしながら，ある原料の配合割合を高めれば他の原料の配合割合が低下するという原料間の相互依存性を考慮すれば，大事なことは，配合割合の変化が全体として直接材料費にどのような影響を与えたかということであり，原料別の配合差異の分析結果には殆ど意味がない。すなわち，正しくは，原料別の配合差異ではなく配合差異の和(合計)を問題とすべきなのであって，２つの分析方法の相違が原料別の配合差異と歩留差異の分析結果においてのみ認められることからすれば，伝統的分析法に対する批判は，的外れなものと言わざるをえない(図表４-28)。","なお，配合差異と歩留差異の間にはトレードオフの関係が見られるため，有利な配合差異の増加が不利な歩留差異の増加をもたらすといった相互依存性を踏まえた上で，原価差異の解釈を行うことに注意する。","原料価格差異配合差異歩留差異合計","合計0(―)1,200,000(有利)1,600,000(不利)400,000(不利)","原料価格差異配合差異歩留差異合計","合計0(―)1,200,000(有利)1,600,000(不利)400,000(不利)"],"f":"p1_4-21.webp","p":""},{"id":"4-22","b":"p1","c":4,"n":22,"t":"労働歩留差異分析の必要性","i":"B","y":"B","q":["直接材料費について原料歩留差異が生じている場合，直接労務費の作業時間差異の分析について原価管理上特に留意すべき点を説明しなさい。"],"a":["原料投入量と直接作業時間の間には，一般に，比例関係が見られる。すなわち，歩留が悪化(改善)して原料投入量が増加(減少)すれば，これに比例して作業時間も増加(減少)すると考えられるため，不利(有利)な原料歩留差異が生じている場合には，これに対応して，不利(有利)な労働歩留差異が生じているはずである。","以上より，直接材料費について原料歩留差異が生じている場合には，労働歩留差異を作業時間差異から分離しなければ，作業能率の良否を純粋に把握することができないという点に留意すべきである。"],"k":["原料投入量","直接作業時間","歩留の良否","作業能率の良否"],"kg":[{"l":"","w":["原料投入量","直接作業時間","歩留の良否","作業能率の良否"]}],"e":["いま，パーシャル・プランの標準原価計算制度を採用する工場について，以下の〔資料〕が与えられたものとする。〔資料〕","この場合，当月の直接労務費差異を分析すれば，図表４-29のようになる。作業時間差異は，全体で見れば500時間，500,000円の不利差異であり，一見すると当月の作業能率は芳しくなかったように思える。しかしながら，当月は歩留が標準と比べて2,000㎏悪化していることから，原料投入量と直接作業時間の比例関係を考慮すれば，2,000㎏×３時間／10㎏＝600時間の作業時間の増加はやむをえなかったはずである。そこで，歩留の良否の影響を労働歩留差異として分離し，実際歩留を前提として労働能率差異の分析を行えば，100時間，100,000円の有利差異となる。つまり，作業能率はむしろ良好であったと判断されるのであって，労働歩留差異を分離しなければ，作業能率の良否を純粋に把握できないということが理解できよう。","て，原価管理上特に留意すべきと思われる事柄を述べなさい。","(原料歩留差異が発生している一方で，直接労務費については１個当たりの標","準に基づく作業時間差異の分析を行っており，差異分析上，減損が度外視され"],"f":"p1_4-22.webp","p":""},{"id":"4-23","b":"p1","c":4,"n":23,"t":"固定給制のもとでの直接労務費の管理","i":"B","y":"B","q":["固定給制を採用する場合に，直接労務費を変動費として取り扱う理由を，原価管理の見地から説明しなさい。また，その場合の賃率差異の特徴を説明しなさい。"],"a":["固定給制を採用する場合，直接労務費は，支払形態からすれば固定費としての性格を強く有している。ただし，直接工の労働力は作業時間とともに消費され，製品生産量の増減とともに変動することから，消費形態からすれば，変動費としての性格を強く有している。そこで，直接工の作業能率の良否を会計的に評価するために，これを変動費として取り扱うのである。","この場合，直接労務費の賃率差異は，本来固定的に発生するものを変動費と擬制する結果として，未利用キャパシティの存在を原因として発生するため，操業度差異としての性質を有している。"],"k":["支払形態","消費形態","作業能率の良否","会計的評価変動費と擬制","未利用キャパシティ","操業度差異"],"kg":[{"l":"","w":["支払形態","消費形態","作業能率の良否","会計的評価変動費と擬制","未利用キャパシティ","操業度差異"]}],"e":["直接工の給与は，時間給や出来高給ではなく月給制ないし日給月給制によって支払われるのがむしろ一般的である。したがって，原価計算目的が短期利益計画や利益管理(予算管理)にある場合には，直接労務費を固定費としなければ，適切なＣＶＰ分析や予算実績差異分析を行うことができない。ただし，支払自体が固定的に行われるからといって，直接工の労働力を管理不能として放置するわけにはいかない。支払形態にかかわらず，直接工の労働力は作業時間とともに消費され，製品の生産量とともに変動するからである。そこで，原価管理の見地から，直接工の作業能率の良否(作業時間差異)を評価するために，直接労務費を変動費と擬制する必要が生じる。具体的には，直接工に対する給与支給予定額をその実際的生産能力等で除すことによって，計算上の標準賃率を算定するのである。","この場合，たとえ直接工に対する給与が予算通り支給されたとしても，未利用キャパシティがあれば，賃率差異が発生する(図表４-30)。本来固定的に発生するものを変動費と擬制している以上，実際作業時間が標準賃率算定の基礎となった実際的生産能力等に満たなければ，支出額と消費額にズレが生じるからである。すなわち，固定給制のもとでの賃率差異は，製造間接費差異の操業度差異と同じ性質を有しており，これを製造部門の責任とすることには問題がある。"],"f":"p1_4-23.webp","p":""},{"id":"4-24","b":"p1","c":4,"n":24,"t":"固定費能率差異の取り扱い","i":"B","y":"B","q":["変動予算と三分法を用いて製造間接費差異を分析する場合，固定費能率差異は，これを能率差異と操業度差異のいずれに含めて分析するのが適切であるか。現代の企業環境を踏まえて検討しなさい。"],"a":["現代の企業環境を考慮すれば，工場の機械設備は不完全操業の状態にあるのが通常である。したがって，不能率がコスト面に与える影響は，固定費の増加ではなく変動費の増加という形をとるはずである。すなわち，能率差異は変動費のみから生じると考えられることから，固定費能率差異は操業度差異に含めて分析するのが適切といえる。"],"k":["不完全操業","不能率","変動費","固定費","増加"],"kg":[{"l":"","w":["不完全操業","不能率","変動費","固定費","増加"]}],"e":["公式法変動予算による製造間接費差異の分析方法には，五分法，四分法，三分法，二分法があり，さらに，三分法には，固定費能率差異を能率差異に含める方法(実際操業度と基準操業度の差に基づいて操業度差異を算定する方法)と，固定費能率差異を操業度差異に含める方法(標準操業度と基準操業度の差に基づいて操業度差異を算定する方法)の２つがある(図表４-31)。そこで，三分法の２つの方法について，能率差異の算定という観点から，いずれが理論的に妥当といえるかが問題となる。","ここで，工場の機械設備が完全操業の状態にあるならば，不能率の発生は固定費の増加をもたらす場合がある。ただし，不働能力の存在を前提とすれば，固定費は操業度の増減にかかわらず一定額発生するのであって，固定費能率差異は固定費の増加を示すものではない(図表４-32)。したがって，能率差異を純粋な能率の良否の影響として把握するためには，これを変動費のみから算定し，固定費能率差異は操業度差異に含めるのが適切と考えられる。","ただし，操業度差異を不働能力差異と捉えるのであれば，実際操業度と基準操業度の差に基づいてこれを算定する必要がある。したがって，操業度管理の観点から，固定費能率差異を能率差異に含めるのがよいとする見解もある。"],"f":"p1_4-24.webp","p":"p1_4-24_past.webp"},{"id":"4-25","b":"p1","c":4,"n":25,"t":"操業度差異を製造部門の責任とすることの問題点","i":"B","y":"B","q":["一般に，操業度差異を製造部門の責任とすることには問題があるといわれるが，その理由を説明しなさい。"],"a":["操業度差異は，実際生産量が予定生産量を下回る結果として生じるが，その主たる原因は，実際販売量が予定販売量を下回ったことにあるのが通常である。すなわち，操業度差異は製造部門においては一般に管理不能と考えられるため，これを製造部門の責任とすることには問題があるのである。","また，操業度差異を製造部門の責任とすれば，不利な操業度差異の発生を回避する誘因が働く結果として，需要とは無関係に無駄な在庫を積み増す過剰生産行動を誘発する恐れがある。すなわち，製造部門の部分最適行動を誘発する恐れがあるため，操業度差異を製造部門の責任とすることには問題があるのである。"],"k":["生産量","販売量","管理不能","過剰生産","部分最適行動"],"kg":[{"l":"","w":["生産量","販売量","管理不能","過剰生産","部分最適行動"]}],"e":["第１の理由は，操業度差異の管理可能性を考慮したものであるが，原価差異の管理可能性は，その発生原因に依存する。そこで，操業度差異の発生原因を検討してみると，生産量は販売量に依存するのが通常であるから，①実際販売量が予定販売量を下回れば，②実際生産量もまた予定生産量を下回るのが通常であり，一般的な操業度差異の発生原因は，製造活動ではなくむしろ販売活動にあるといえる(図表４-33)。したがって，操業度差異は製造部門においては一般に管理不能と考えられるのである。","第２の理由は，原価差異の解釈に関連する。すなわち，業績評価上，不利差異が全く否定されるとすれば，製造部門としてはその発生を回避したいと考えるのが通常であり，そうした固定的な解釈が，過剰生産という部分最適行動につながると考えられるのである。"],"f":"p1_4-25.webp","p":"p1_4-25_past.webp"},{"id":"4-26","b":"p1","c":4,"n":26,"t":"工程別標準総合原価計算","i":"B","y":"A","q":["非累加法による工程別総合原価計算では，各工程に自工程費のみが集計されるため，責任会計の見地において，累加法よりも優れているとする見解がある。そこで，この見解の妥当性について，標準原価計算制度の採用を前提として検討しなさい。"],"a":["累加法による工程別総合原価計算を実施する場合，各工程の完成品原価を次工程に振り替えるが，実際原価計算制度においては原則として実際原価で振り替えるのに対し，標準原価計算制度においては必ず標準原価で振り替える。すなわち，実際原価計算制度においては，管理不能な前工程の能率の良否の影響が自工程に混入するという問題が生じるが，標準原価計算制度においてはそのような問題が生じる余地はない。","以上より，標準原価計算制度の採用を前提とすれば，責任会計の見地において，累加法と非累加法の間に優劣関係は存在せず，非累加法が累加法よりも優れているとする見解は妥当でない。"],"k":["完成品原価","実際原価","標準原価","管理不能","前工程の能率の良否の影響"],"kg":[{"l":"","w":["完成品原価","実際原価","標準原価","管理不能","前工程の能率の良否の影響"]}],"e":["パーシャル・プランの標準原価計算(標準総合原価計算)は，単一工程ではなく工程別総合原価計算として実施する場合により効果を発揮するといわれる。原価管理を効果的に実施するためには責任会計との結合が必要不可欠であり，責任センターとしての工程別に標準実績比較を行うのが有効と考えられるからである。そこで，工程別標準総合原価計算の採用を前提として，責任会計の見地から累加法と非累加法の優劣が問題となる。","ここで，累加法による工程別標準総合原価計算においては，工程間の振替製品を必ず標準原価で評価するため，前工程の能率の良否の影響が自工程に混入するという問題は生来的に生じない。別言すれば，前工程費から差異は生じないのであって，各工程仕掛品勘定において把握される標準原価差異は累加法と非累加法で相違はなく，いずれにおいても自工程の原価能率のみを示す。すなわち，責任会計の見地において，非累加法が累加法よりも優れているとする見解は，あくまでも実際原価計算制度の採用を前提としており，標準原価計算制度の採用を前提とする限り，累加法と非累加法の間に優劣関係はみられないことに注意する。","なお，累加法による工程別実際総合原価計算においても，工程間の振替製品を予定原価又は正常原価で評価することにより，前工程の能率の良否の影響が自工程に混入するという問題を回避することができる。この場合，各工程で把握される振替差異は，パーシャル・プランの工程別標準総合原価計算を実施する場合に各工程で把握される標準原価差異に近似するが，一致はしない。前者は完成品の標準原価と実際原価の差異であるのに対し，後者は当月投入の標準原価と実際原価の差異だからである(図表４-34)。"],"f":"p1_4-26.webp","p":""},{"id":"4-27","b":"p1","c":4,"n":27,"t":"材料受入価格差異以外の原価差異の処理⑴","i":"A","y":"B","q":["材料受入価格差異以外の原価差異は，どのように処理すべきであるか。実際原価主義者と標準原価主義者の双方の立場から説明しなさい。"],"a":["実際原価主義者の立場からすれば，実際原価こそが外部報告目的に最良の真実の原価であるから，原価差異は，期末仕掛品，期末製品及び売上原価に追加配賦すべきことになる。","他方，標準原価主義者の立場からすれば，標準が科学的に設定されている限り，管理可能差異は回避すべき無駄(損失)であるから，製品原価性がなく，製品を通じて回収されるべきではない。したがって，非原価(営業外費用)とするか，期間原価とすべきことになる。"],"k":["真実の原価","追加配賦","管理可能差異","回避すべき無駄(損失)","製品原価性非原価(営業外費用)","期間原価"],"kg":[{"l":"","w":["真実の原価","追加配賦","管理可能差異","回避すべき無駄(損失)","製品原価性非原価(営業外費用)","期間原価"]}],"e":["外部報告目的との関連で，原価差異(標準原価差額)をどのように処理すべきかについては，実際原価主義者と標準原価主義者で見解が異なる。これは，真実の原価をどのように解釈するかという問題であり，信憑性のある実際原価こそが真実の原価と捉える実際原価主義者の立場からすれば，原価差異は全て追加配賦して実際原価への調整を図るべきということになるし，規範性のある標準原価こそが真実の原価と捉える標準原価主義者の立場からすれば，実際原価への調整は不要ということになる。","なお，標準原価主義者に共通する主張は「管理可能差異については製品原価性がなく，当該期間の収益から回収されるべきであって，製品を通じて回収されるべきではない」というものである。仮に，製品原価性を認めて期末棚卸資産に配賦すれば，当期の不能率を次期以降に繰り延べることになり，当期の業績と次期以降の業績が混合されて問題があると考えるわけである。そこで，管理可能差異は，これを当該期間の収益に対応させることになるが，その処理の方法としては，①非原価として営業外費用に計上するか，②期間原価とするかの２つが考えられる。さらに，②期間原価とする場合には，⒜標準原価で計算した売上原価に賦課する方法と，⒝標準売上原価控除後の売上総利益に賦課する方法の２つがあり，統一的な見解があるわけではない。","なお，「原価計算基準」では，材料受入価格差異以外の原価差異について，原則として当年度の売上原価に賦課することとしているが，この規定は，実際原価主義者と標準原価主義者の妥協の産物と捉えることができる。"],"f":"p1_4-27.webp","p":"p1_4-27_past.webp"},{"id":"4-28","b":"p1","c":4,"n":28,"t":"材料受入価格差異以外の原価差異の処理⑵","i":"A","y":"B","q":["我が国の「原価計算基準」によれば，材料受入価格差異以外の原価差異は，原則として当年度の売上原価に賦課することになっており，売上原価と期末棚卸資産に配賦するのは例外的な処理として扱われている。そこで，「原価計算基準」が原価差異を売上原価に賦課することとした理由を，標準原価計算制度の採用を前提として説明しなさい。"],"a":["標準原価計算制度において用いられる標準原価は現実的標準原価又は正常原価であり，理想標準原価ではない。したがって，標準が適切に設定されている限り，正常な状態のもとでは多額の原価差異は生じないと考えられる。この場合，原価差異を売上原価と期末棚卸資産に追加配賦するのが適切であるとしても，配賦すべき原価差異の総額が少額である以上，期末棚卸資産に追加配賦すべき金額は極めて少額なものとなり，重要性の原則により無視しうる。","以上より，材料受入価格差異以外の原価差異は，原則として当年度の売上原価に賦課するのである。"],"k":["理想標準原価","標準の設定","多額の原価差異","配賦すべき総額","少額"],"kg":[{"l":"","w":["理想標準原価","標準の設定","多額の原価差異","配賦すべき総額","少額"]}],"e":["「原価計算基準」によれば，標準原価計算制度における原価差異の処理は，「数量差異，作業時間差異，能率差異等であって異常な状態に基づくと認められるものは，これを非原価項目として処理する」ほかは，「すべて実際原価計算制度における処理の方法に準じて処理する」ことになっている。すなわち，「原価差異は，材料受入価格差異を除き，原則として当年度の売上原価に賦課する」ことになる。ただし，標準が不適当なため「比較的多額の原価差異が生ずる場合」には,当年度の売上原価と期末棚卸資産に配賦することが求められる(図表４-35)。","このような「原価計算基準」の規定は，実際原価主義者と標準原価主義者の妥協の産物と捉えることができる。実際原価主義者の立場からすれば，実際原価こそが真実の原価であり，原価差異はこれを全て売上原価と期末棚卸資産に追加配賦すべきことになるが，配賦すべき総額自体が少額であれば，期末棚卸資産に配賦すべき金額は極めて少額となるため(図表４-36)，売上原価に賦課する処理も容認しうる。一方，標準原価主義者の立場からすれば，標準原価が適切に設定されている限り原価差異(管理可能差異)は回避すべき無駄であり損失であるから，製品原価性を持たないということになるが，製品を通じてではなく，当該期間の収益から回収されるべきとする主張は，原価差異を売上原価に賦課する処理でも通るため，やはり容認しうるわけである。"],"f":"p1_4-28.webp","p":""},{"id":"4-29","b":"p1","c":4,"n":29,"t":"材料受入価格差異の処理","i":"B","y":"A","q":["我が国の「原価計算基準」によれば，材料受入価格差異以外の原価差異については，原則として当年度の売上原価に賦課することになっているが，材料受入価格差異については，別に処理することが求められている。そこで，材料受入価格差異に限り，別処理が求められる理由を説明しなさい。"],"a":["材料受入価格差異とは，購入材料に関する価格差異をいうが，購入材料は会計期末には期中に消費した材料と期末材料とに分かれるため，材料受入価格差異も消費材料価格差異と期末材料価格差異とに分解し，後者は期末材料の残高に加算して貸借対照表の棚卸資産の部に計上しなければならない。","以上より，材料受入価格差異の全額を期間費用とすることは認められず，これを当年度の材料の払出高と期末在高とに配賦する必要があるため，別処理が求められるのである。"],"k":["消費材料価格差異","期末材料価格差異","期間費用"],"kg":[{"l":"","w":["消費材料価格差異","期末材料価格差異","期間費用"]}],"e":["材料受入価格差異については，それが少額であるか多額であるかにかかわらず，常に当年度の材料の払出高と期末在高とに配賦しなければならない。購入材料の価格差異である以上，期末材料分の価格差異を含み，これを期間費用とする余地はないからである。","なお，材料受入価格差異のうち，消費価格差異に相当する部分の処理については，「原価計算基準」の規定が曖昧であるため，解釈が分かれるところである。ただし，過去の本試験における出題実績を考慮すれば，材料払出高を構成する売上原価，期末製品，期末仕掛品の標準消費量と，消費数量差異に厳密に配賦するのが通説的な処理ということになる(図表４-37)。なお，この場合，消費数量差異に対する配賦額は，オリジナルの数量差異と合算して処理を行う。つまり，それらが少額であれば売上原価に賦課することになるし，多額であれば期末棚卸資産にも追加配賦することになる。"],"f":"p1_4-29.webp","p":"p1_4-29_past.webp"},{"id":"5-1","b":"p1","c":5,"n":1,"t":"全部原価と部分原価","i":"B","y":"C","q":["原価は，集計される原価の範囲によって，全部原価と部分原価とに区別される。我が国の「原価計算基準」によれば，全部原価とは「一定の給付に対して生ずる全部の製造原価又はこれに販売費および一般管理費を加えて集計したもの」，部分原価とは「そのうち一部分のみを集計したもの」ということになっている。そこで，この定義の妥当性を検討しなさい。"],"a":["「原価計算基準」によれば，全部製造原価に販売費及び一般管理費を加算した総原価をもって全部原価と定義するとき，その一部分である全部製造原価は，部分原価として認識されることになる。","しかしながら，ここでの「全部・部分」とは，正しくは，「職能別原価の全部・部分」を意味する。すなわち，製造原価，販売費，一般管理費のそれぞれについて全部原価と部分原価という概念が存在するのであって，本来は，総原価のことを全部原価ということもなければ，総原価の一部分を構成する全部製造原価を部分原価ということもない。","以上より，「原価計算基準」における全部原価と部分原価の定義は妥当性を欠くといえる。"],"k":["全部製造原価","販売費及び一般管理費","総原価","職能別原価"],"kg":[{"l":"","w":["全部製造原価","販売費及び一般管理費","総原価","職能別原価"]}],"e":["「原価計算基準」の文言を額面的に解釈すれば，全部原価と部分原価の定義は図表５-１のようになる。つまり，「原価計算基準」によれば，全部製造原価に販売費及び一般管理費を加算した総原価をもって全部原価と定義するとき，その一部分である全部製造原価は，部分原価として認識されることになる。","しかしながら，ここでの全部というのは，職能別原価の全部，つまり，製造原価の全部，あるいは販売費の全部，一般管理費の全部という意味であり，部分原価とは，意思決定や業績管理の必要上，例えば直接費，変動費，管理可能費といった形で職能別原価の一部分のみを計算対象とする場合の当該原価を指す。その意味では，「原価計算基準」における全部原価と部分原価の定義は不正確であり，妥当性を欠くといわざるをえない(図表５-２)。","なお，職能別原価の一部分のみを集計する原価計算を部分原価計算といい，直接原価計算はその一例である。また，「原価計算基準」では，最も重要な部分原価として，直接原価計算でいうところの直接原価を挙げている。ただし，ここでの直接原価とは変動直接費及び変動間接費からなる変動費を意味するのであって，製品との関連における分類でいうところの直接費とは全く異なる概念であることに注意する。"],"f":"p1_5-1.webp","p":""},{"id":"5-2","b":"p1","c":5,"n":2,"t":"全部原価計算と直接原価計算の営業利益が相違する理由","i":"C","y":"A","q":["全部原価計算と直接原価計算の営業利益が相違する理由を説明しなさい。"],"a":["全部原価計算では固定加工費を製品原価として処理するのに対し，直接原価計算ではこれを期間原価として処理する。すなわち，全部原価計算では固定加工費を製品が販売された期の収益に対応させるのに対し，直接原価計算ではこれを発生した期の収益に直接対応させる。","以上より，固定加工費の処理の相違に関連して，これを期間費用とするタイミングが相違するため，両者の営業利益が相違するのである。"],"k":["固定加工費","製品原価","期間原価","期間費用","タイミング"],"kg":[{"l":"","w":["固定加工費","製品原価","期間原価","期間費用","タイミング"]}],"e":["製品原価と期間原価では，期間費用として収益に対応するタイミングが相違するが(図表５-３)，その範囲の区別は相対的であり，全部原価計算と直接原価計算では，固定加工費の取り扱いが異なる。そのため，生産量と販売量が異なる場合には，全部原価計算において棚卸資産に含まれる固定加工費の分だけ両者の期間費用が相違し，同額だけ営業利益も相違することになる。","以上の点を，全部原価計算における固定加工費の配賦図を用いて確認すると，>図表５-４のようになる。ただし，標準原価計算を採用しており，全部原価計算にMおいて，固定加工費の配賦差額は全て売上原価に賦課するものとする。","この場合，固定加工費について，全部原価計算では標準売上原価と配賦差額の合計が期間費用となるのに対し，直接原価計算では期間発生額(実際発生額)がそのまま期間費用となる。その結果，両者の期間費用は，生産量と販売量の差に製品単位当たりの標準固定加工費を乗じた分だけ相違し，同額だけ営業利益が相違するのである。ただし，全部原価計算において，固定加工費の配賦差額の一部又は全部を次期以降に繰り延べる場合には，当該金額もまた，営業利益相違の原因となることに注意する。","なお，固定加工費の配賦差額(操業度差異)は，固定加工費を製品単位当たりに集計するに当たり，正常配賦(予定配賦ないし標準配賦)を行う結果として発生するものである。つまり，固定加工費を期間原価として処理する直接原価計算においては，配賦差額(操業度差異)が生じる余地はないことに注意する。"],"f":"p1_5-2.webp","p":""},{"id":"5-3","b":"p1","c":5,"n":3,"t":"全部原価計算と直接原価計算の営業利益の関係","i":"C","y":"A","q":["生産と販売の相互関係に基づき，全部原価計算と直接原価計算の営業利益の関係を説明しなさい。ただし，標準原価計算を採用しており，全部原価計算において固定加工費の配賦差額は全て売上原価に賦課するものとする。"],"a":["生産量と販売量が等しい場合には，全部原価計算と直接原価計算の営業利益は等しくなるが，生産量が販売量よりも大きい(小さい)場合には，全部原価計算の方が直接原価計算よりも営業利益は大きくなる(小さくなる)。","なお，長期的には生産量と販売量が均衡するため，長期の営業利益については全部原価計算と直接原価計算で大差は生じない。"],"k":["生産量","販売量","長期の営業利益"],"kg":[{"l":"","w":["生産量","販売量","長期の営業利益"]}],"e":["いま，単一製品を製造販売し，標準原価計算を採用する企業について，以下の〔資料〕が与えられたものとする。〔資料〕","この場合，各期の全部原価計算と直接原価計算の営業利益を比較すれば，図表５-５のようになる。生産量＞販売量(第１期と第３期)であれば全部原価計算の営業利益＞直接原価計算の営業利益，生産量＝販売量(第２期)であれば全部原価計算の営業利益＝直接原価計算の営業利益，生産量＜販売量(第４期)であれば全部原価計算の営業利益＜直接原価計算の営業利益となることが確認できる。なお，４期間の営業利益の合計が両者で一致しているように，長期的には生産量と販売量が均衡するため，全部原価計算と直接原価計算の営業利益に大差が生じるのはあくまでも短期の営業利益においてであることに注意する。","ところで，固定加工費の処理の相違に起因して，直接原価計算の営業利益は販売量に応じて増減するのに対し，全部原価計算の営業利益は販売量が一定であっても生産量が増減すれば増減する(第１期～第３期)。すなわち，直接原価計算の営業利益は販売量のみの関数であるのに対し，全部原価計算の営業利益は生産量と販売量の関数であることから，利益管理の見地からすれば，直接原価計算の方が有効な損益計算手法であるといえる。","全部Ｃ／Ａ第１期第２期第３期第４期合計","売上高800,000800,000800,0001,200,0003,600,000","売上原価","標準原価560,000560,000560,000840,0002,520,000","配賦差額020,00010,00010,00040,000","売上原価計560,000580,000570,000850,0002,560,000","売上総利益240,000220,000230,000350,0001,040,000","販売管理費200,000200,000200,000200,000800,000","営業利益40,00020,00030,000150,000240,000","直接Ｃ／Ａ第１期第２期第３期第４期合計","売上高800,000800,000800,0001,200,0003,600,000","変動費480,000480,000480,000720,0002,160,000","貢献利益320,000320,000320,000480,0001,440,000","固定費","加工費100,000100,000100,000100,000400,000","販管費200,000200,000200,000200,000800,000","固定費計300,000300,000300,000300,0001,200,000","営業利益20,00020,00020,000180,000240,000"],"f":"p1_5-3.webp","p":""},{"id":"5-4","b":"p1","c":5,"n":4,"t":"全部原価計算の問題点","i":"C","y":"A","q":["生産・在庫管理の見地からすれば，全部原価計算よりも直接原価計算を採用するのが望ましいといえるが，その理由を説明しなさい。"],"a":["全部原価計算では固定加工費を製品原価として処理するため，在庫を積み増せば，その分だけ期間費用となる固定加工費が減少することになる。すなわち，全部原価計算を採用する場合には，販売量が一定であっても，生産量を増やすことで営業利益が増加するため，過剰生産の誘因が働くという問題がある。","一方，直接原価計算では固定加工費を期間原価として処理するため，在庫を積み増したところで，期間費用となる固定加工費は一定であり，営業利益は販売量の影響のみを受けて増減する。したがって，直接原価計算を採用する場合には，過剰生産の誘因は働かない。","以上より，生産・在庫管理の見地からすれば，全部原価計算よりも直接原価計算を採用するのが望ましいといえるのである。"],"k":["固定加工費","製品原価","期間原価","営業利益","過剰生産の誘因"],"kg":[{"l":"","w":["固定加工費","製品原価","期間原価","営業利益","過剰生産の誘因"]}],"e":["問題５-３の数値例において，第２期と第３期の販売量は同数であるが，生産量Mは第３期の方が100個多く，同量だけ期末在庫が増加している。この場合，全部原価計算では，固定加工費を製品原価として処理するため，増加した期末在庫100個に固定加工費が10,000円余計に吸収される分だけ，不利な配賦差額(操業度差異)が減少する。その結果，期間費用となる固定加工費も10,000円減少するため，販売量が一定であるにもかかわらず，営業利益は10,000円増加する(図表５-６)。このように，全部原価計算を採用する場合には，需要に関係なく生産量を増やすことによって，短期的に営業利益を増やすことができるため，在庫を積み増すlliiil誘因が働く結果，種々の逆機能が顕在化することになる。","このような全部原価計算の問題点に対しては，原価計算ないし管理会計の観点から，これまでに２つの方向での改善提案がなされてきた。１つは製品原価の範囲を狭くするという提案であり，直接原価計算や近年のスループット会計の提案に表れている。もう１つは，財務尺度だけでなく，在庫水準や納期厳守件数，保全スケジュールなどの非財務尺度をも業績評価基準に加えるという提案である。これは，企業の戦略目標を達成するために重要と考えられる要因についてのシグナルを経営管理者に与えようとするものであり，近年のバランスト・スコアカード(ＢＳＣ)の提案に表れている。"],"f":"p1_5-4.webp","p":""},{"id":"5-5","b":"p1","c":5,"n":5,"t":"直接原価計算の外部報告上の問題点","i":"C","y":"B","q":["現行の制度会計では，外部報告用の財務諸表の作成に際して全部原価計算の採用を義務付けており，直接原価計算の採用は認められていない。そこで，直接原価計算に基づく計算結果を外部報告用の財務諸表に使用する場合の，具体的な問題点を説明しなさい。"],"a":["直接原価計算では変動費と固定費を区分して計算するため，原価を変動費と固定費に区分することが必須となるが，企業外部からその妥当性を検証することはできない。したがって，これを外部報告用の財務諸表の作成に使用すれば，会計情報の検証可能性を確保できないという問題がある。","また，直接原価計算では固定費を全て期間原価として処理するため，全部原価計算と比べて損益の変動を大きく報告する傾向にある。したがって，とりわけ固定費の利用度の大きい企業においては，全部原価計算からの変更時の利害調整が困難であるという問題がある。"],"k":["固変区分","検証可能性","損益の変動","変更時の利害調整"],"kg":[{"l":"","w":["固変区分","検証可能性","損益の変動","変更時の利害調整"]}],"e":["外部報告用に直接原価計算が認められないということは，原価計算論的には，直接原価計算が原価計算制度として認められないということを意味する。ここで，原価計算制度とは「財務会計機構と有機的に結び付き常時継続的に行われる計算体系」であり，「財務会計機構との有機的結合」と「常時継続性」を要件とするが，直接原価計算はそれらを充足している。それでは，なぜ直接原価計算は原価計算制度として認められないのか。直接原価計算に基づく会計情報には本問で指摘したような外部報告上の問題点があるため，実質的な要件としての「社会的承認」が得られないのである(図表５-７)。","なお，現行制度会計上，直接原価計算を外部報告目的に使用することは認められていないが，1950年代半ばから約10年間に渡って，その是非が議論されたことがある。当時，直接原価計算が利益管理をはじめとする内部管理目的に有益な情報を提供できるということは既に周知の事実であったが，このことが一般に認められるようになると，直接原価計算支持者たちは，直接原価計算を外部報告目的にも使用できるのではないかと考え，さらに一歩進んで，全部原価計算よりも直接原価計算の方が外部報告上も理論的に正しい計算方式であるという主張を展開するに至った。この問題をめぐり，全部原価計算派と直接原価計算派の間で後に「直接原価計算論争」と呼ばれることになる激しい論争が展開されたわけであるが，両派の主張にはそれぞれ理論的な根拠があるため，幾つかの争点について結局のところ明確な優劣がつくことはなかった。そこで，全部原価計算派と直接原価計算派の調整を図る手段として考案されたのが固定費調整という方法であり，固定費調整型の損益計算書であった(図表５-８)。"],"f":"p1_5-5.webp","p":""},{"id":"5-6","b":"p1","c":5,"n":6,"t":"直接原価計算の利用パターン","i":"C","y":"B","q":["企業が直接原価計算を利用する場合には，２つのパターンがある。直接原価計算による損益計算ならびに製品原価情報が外部報告用の財務資料として認められないことを念頭におき，それぞれを説明しなさい。"],"a":["１つは，内部管理用の直接原価計算と外部報告用の全部原価計算を並行して実施するパターンである。すなわち，期中・期末ともに，直接原価と全部原価の双方による計算を並行して行うものである。","もう１つは，２つの原価計算を並行して実施するのではなく，期中は内部管理用に直接原価のみを計算するパターンである。この場合，会計期年度末には，直接原価計算による財務情報を全部原価計算による財務情報に変換すること(固定費調整)が必要となる。"],"k":["外部報告用","内部管理用","並行実施","固定費調整"],"kg":[{"l":"","w":["外部報告用","内部管理用","並行実施","固定費調整"]}],"e":["「原価計算基準」では，総合原価計算を採用する場合において，会計年度末に固定費調整(全部原価情報への組み換え)を行うことを前提として，直接原価計算を採用することを認めている。ただし，これは，「原価計算基準」設定当時の未成熟な技術環境を前提とする規定であることに注意しなければならない。コンピューター技術の発展により，現代企業は，従来のような「外部報告用の全部原価計算か内部管理用の直接原価計算か」という選択ではなく，複数の原価計算システムを保有することが可能となっている。そのため，内部管理用に直接原価計算を採用する場合には，これを外部報告用の全部原価計算と並行して実施するのがむしろ通常となっており，この場合にはそもそも固定費調整は不要ということになる(図表５-９)。","いずれのパターンを利用するかは当該企業の技術及び経済環境に依存するが，重要なことは，外部報告用に直接原価計算を利用することが認められない以上，全ての企業が何らかの形で全部原価を計算するシステムを保持しなければならないということである。","①内部管理用の直接原価計算と外部報告用の全部原価計算を並行して実施","②期中は内部管理用に直接原価計算のみを実施し，会計年度末に固定費調"],"f":"p1_5-6.webp","p":""},{"id":"5-7","b":"p1","c":5,"n":7,"t":"固定費の管理思考","i":"B","y":"B","q":["全部原価計算のもとでの伝統的な固定費の管理方法を示し，これに対する直接原価計算のもとでの固定費の管理思考について説明しなさい。"],"a":["全部原価計算においては，損益計算上は変動費と固定費を区別せず，職能別に原価を分類するのみであるため，固定費の期間発生額は明示されない。したがって，固定費の発生についての注意が欠落しがちであり，むしろその発生額を所与とした上で，操業水準を上げることによって製品単位あたりの固定費を引き下げるという利用的管理が中心であった。","この点，直接原価計算においては，変動費と固定費を区分して損益計算を行うため，固定費の期間発生額が明示される。したがって，固定費がなぜ発生するのかという思考が生まれ，発生原因に応じた管理の視点を提供する。"],"k":["職能別","変動費と固定費","固定費の期間発生額","利用的管理","発生源泉"],"kg":[{"l":"","w":["職能別","変動費と固定費","固定費の期間発生額","利用的管理","発生源泉"]}],"e":["原価は，操業度の増減に対する原価の発生態様から，変動費と固定費に分類される(図表５-10)。しかし，これを原価発生源泉(どこからなぜ発生するのか)という観点から見直すと，変動費はアクティビティ・コスト(業務活動原価)，固定費はキャパシティ・コスト(能力原価)であると認識しうる。すなわち，変動費は業務活動(生産・販売活動)を行うことによって発生する原価であるのに対し，固定費は業務活動とは無関係に，一定の生産・販売能力を維持するために発生する原価であるといえる。","ここで，伝統的な全部原価計算のもとでの問題点は，固定費を変動費と同じように操業単位当たりで管理していた点にある。固定費は操業度の増減にかかわらず一定額発生する以上，操業単位当たりの固定費は計算上の数値に過ぎず，これを引き下げたところで，発生総額の管理という観点からすれば，全く意味がないのである。固定費の管理を効果的に行うためには，発生額を所与とするのではなく，なぜ発生するのかという視点から固定費を分類し，発生額そのものの管理を発生原因に応じて行わなければならない。このような管理思考を生み出すためには，固定費の期間発生額を可視化する必要があり，直接原価計算の登場が固定費の管理思考に変化をもたらしたといえる。","なお，直接原価計算を採用すれば，固定費の効果的な管理が可能になるという考えはやや短絡的である。直接原価計算が変動費と固定費の分類を行うのはＣＶＰ関係を考察する際の鍵概念である貢献利益を算定するためであって，固定費の管理のためではない。固定費を製品原価に埋没させないことから，その期間発生額が明示され，結果として，これをキャパシティ・コストと捉えた管理意識を向上させるというように理解すべきである。"],"f":"p1_5-7.webp","p":""},{"id":"5-8","b":"p1","c":5,"n":8,"t":"キャパシティ・コストの管理","i":"B","y":"B","q":["固定費をその発生源泉からキャパシティ・コスト(capacitycosts)と捉えた場合，さらにそれは，コミッテド・コスト(committedcosts；拘束固定費)とマネジド・コスト(managedcosts；自由裁量固定費)に分類されるが，それぞれの管理方法について説明しなさい。"],"a":["コミッテド・コストとは，長期的な生産・販売能力に関する意思決定の結果として，耐用年数全期間の発生額が決定してしまう原価であり，短期的にはその発生を回避することができないという性質を有する。したがって，その管理は，投資段階と除却段階で合理的な意思決定を行うことに大半がかかっており，途中の期間は生産・販売能力を遊休にしないように努力する以外にない。","一方，マネジド・コストとは，資源の投入と効果の最適な関係が不明であるために，経営管理者が政策的にその支出額を決定する原価であり，短期的にその発生を回避しうるという性質を有する。したがって，毎期の予算によって管理することが可能であるが，過去の実績をベースとして増分方式で予算を設定すれば無駄な支出が生じやすいため，ゼロベース予算を採用するのが有効である。"],"k":["長期的な意思決定","回避不能","合理的な意思決定資源の投入と効果","政策的","支出額","回避可能","増分方式","ゼロベース予算"],"kg":[{"l":"","w":["長期的な意思決定","回避不能","合理的な意思決定資源の投入と効果","政策的","支出額","回避可能","増分方式","ゼロベース予算"]}],"e":["コミッテド・コスト(拘束固定費)とは，物的設備や基礎的組織の維持費であり，減価償却費，固定資産税，長期契約の賃借料，重要な職員の給料などに代表される。これらは投資意思決定の結果として発生すべき金額が総額で決定してしまうため，投資段階のイニシャル・コントロールと除却のタイミングを誤らないようにすることが重要となる。また，途中期間は操業度管理によらざるをえないが，その観点においては，設備の不具合によるチョコ停を小集団活動によって排除し，設備の総合効率を高めることも重要となる。","一方，マネジド・コスト(自由裁量固定費)とは，資源の投入と効果の最適な関係が不明であるために，経営管理者がそれぞれの方針でその支出額を年度予算で政策的に決定せざるをえない原価であり，広告宣伝費，研究開発費，従業員訓練費などに代表される。この種の固定費は，従来は過去の支出額をベースとして，景気が良くなれば10％増などというような形で予算を設定することが多かった。しかし，そのような増分方式では新規の予算設定のときだけ入念に審査が行われ，一度予算が認められると，その必要性が再検討されることなく予算が設定されてしまい，無駄な支出が生じやすいという点に問題があった。そこで，現代的には，資源の能率的・効果的再配分を行うために，ゼロベース予算を採用する企業が増えている。ゼロベース予算では，あらゆる活動があたかも新規採用であるかのようにその予算の正当性が入念に検討される。","具体例減価償却費，固定資産税広告宣伝費，研究開発費"],"f":"p1_5-8.webp","p":"p1_5-8_past.webp"},{"id":"5-9","b":"p1","c":5,"n":9,"t":"直接原価計算と原価管理の関係","i":"B","y":"B","q":["直接原価計算は，原価管理のための標準原価計算や責任会計と結合しやすいといわれるが，その理由を説明しなさい。"],"a":["標準原価計算による原価管理が行われる現場管理者レベルでは，変動費は管理可能費，固定費は管理不能費に近似する。また，変動費は物量標準を用いて製品単位当たりで管理するのに対し，固定費は責任区分別の予算を用いて総額で管理する。さらに，製造間接費の管理のためには変動予算の設定が有効であるが，そのためには変動費と固定費の分類が不可欠となる。","このように，直接原価計算において行われる変動費と固定費の分類が，標準原価計算による原価管理や責任会計の基礎を提供しうるため，それらと結合しやすいのである。"],"k":["管理可能費","管理不能費","物量標準","予算","変動予算","固変区分"],"kg":[{"l":"","w":["管理可能費","管理不能費","物量標準","予算","変動予算","固変区分"]}],"e":["直接原価計算は，ＣＶＰ関係を正規の会計記録の中で分析することを目的としMた損益計算手法であり，元来，原価管理用に工夫されたものではない。また，原価管理を効果的に行うためには責任会計との結合が必須となるが，責任会計において必要となるのは原価責任者にとっての管理可能費と管理不能費の分類であり，それは直接原価計算が行う変動費と固定費の分類に近似はするものの，両者が１対１で対応するわけではない(図表５-12)。管理可能性とは，①管理階層，②業績測定期間，③影響力の程度との関係で，極めて相対的な概念だからである。(図表５-13)。したがって，理論的には，直接原価計算それ自体が，原価管理やそれを効果的に実施するための責任会計に対して適切な情報を提供できるというわけではない。","ただし，既述の通り，現場管理者レベルでは変動費が管理可能費に，固定費が管理不能費に近似する傾向があることは確かであり，直接原価計算が，その他にも原価管理のための標準原価計算や責任会計と結合しやすい性質を持っていることもまた事実である。そこで，この性質を利用し，利益管理と原価管理の双方に役立つ情報を提供しうるように工夫されたのが直接標準原価計算である。"],"f":"p1_5-9.webp","p":""},{"id":"5-10","b":"p1","c":5,"n":10,"t":"直接原価計算と差額原価収益分析の関係","i":"B","y":"A","q":["直接原価計算は，業務執行上の意思決定のための差額原価収益分析に有用な情報を提供するといわれるが，その理由を全部原価計算から入手したデータを利用する場合と比較して説明しなさい。"],"a":["意思決定のための差額原価収益分析においては，差額原価と埋没原価の分類が重要となるが，それは，短期的には変動費と固定費の分類に近似する。","この点，全部原価計算では，損益計算上は変動費と固定費を区別せず，職能別に原価を分類するのみであるのに対し，直接原価計算では，変動費と固定費を区分して損益計算を行うため，差額原価と埋没原価の分類の基礎を提供する。","以上より，直接原価計算から入手したデータを利用する方が，全部原価計算から入手したデータを利用するよりも，迅速かつ正確に差額原価収益分析を行うことができるため，直接原価計算は差額原価収益分析に有用な情報を提供するといわれるのである。"],"k":["差額原価","埋没原価","短期","変動費","固定費","職能別"],"kg":[{"l":"","w":["差額原価","埋没原価","短期","変動費","固定費","職能別"]}],"e":["直接原価計算は，ＣＶＰ関係を正規の会計記録の中で分析することを目的としMて経常的に行われるものであり，元来，随時的な差額原価収益分析のために工夫されたものではない。また，差額原価収益分析において必要となるのは差額原価と埋没原価の分類であり，それは短期的には直接原価計算が行う変動費と固定費の分類に近似はするものの，両者が１対１で対応するわけではない(図表５-14)。したがって，理論的には，直接原価計算それ自体が差額原価収益分析に適切な情報を提供できるというわけではない。","ただし，既述の通り，短期的には，変動費は差額原価に，固定費は埋没原価に近似する傾向があることは確かであり，固定費を製品原価に埋没させる全部原価計算と比べれば，直接原価計算は，差額原価収益分析に対してはるかに有用な情報を提供しうるといえる。","なお，変動費と固定費の分類は短期を前提とするものであるから，その意味において，直接原価計算は，長期的な観点を要する戦略的意思決定においては殆ど有効でない。この点をもって，直接原価計算の限界とする論者もいる。"],"f":"p1_5-10.webp","p":""},{"id":"5-11","b":"p1","c":5,"n":11,"t":"短期利益計画に役立つ損益計算方式","i":"B","y":"B","q":["短期利益計画の策定に際しては，直接原価計算方式の損益計算が有効であるといわれるが，その理由を全部原価計算方式の損益計算を利用する場合と比較して説明しなさい。"],"a":["全部原価計算方式の損益計算では，原価を職能別に分類するのみであるため，特定の売上高に占める原価と利益の割合を示すことしかできず，営業量に比例して増減する貢献利益を算定することができない。そのため，営業量の変化が利益に与える影響を動態的に分析することができないという限界がある。","この点，直接原価計算方式の損益計算では，原価を営業量との関係で変動費と固定費とに分類するため，営業量に比例して増減する貢献利益を算定しうる。その結果，営業量の変化が貢献利益の変化を通じて営業利益にどのような影響を及ぼすのかを動態的に分析することが可能となるため，短期利益計画の策定に有効な情報を提供しうるのである。"],"k":["職能別","変動費と固定費","営業量の変化","貢献利益","営業利益"],"kg":[{"l":"","w":["職能別","変動費と固定費","営業量の変化","貢献利益","営業利益"]}],"e":["いま，ある企業について以下の〔資料〕が得られたものとする。〔資料〕","この場合，全部原価計算方式と直接原価計算方式の双方で当期及び来期の損益計算書を作成すれば，図表５-15のようになる。全部原価計算方式の損益計算では，変動費と固定費を区別しないため，各項目の構成比は特定の売上高のもとでのそれを示すに過ぎない。したがって，当期の損益計算書を見ただけでは，来期において売上高が20％増加した場合に，営業利益がどれだけ増加するのかを知ることができない。この点，直接原価計算方式の損益計算では，変動費と固定費を区別するため，売上高に比例して増減する貢献利益を算定することができる。したがって，当期の損益計算書を見るだけで，来期において売上高が20％増加すれば，貢献利益がいくらになるかを簡単に計算することができるし，経営レバレッジ係数を使用すれば，営業利益が120％増加するということも簡単に知ることができるのである。","売上高100,000100％120,000100％＋20％","売上原価60,00060％66,00055％＋10％","売上総利益40,00040％54,00045％＋35％","販売管理費30,00030％32,00026.7％＋6.7％","営業利益10,00010％22,00018.3％＋120％","売上高100,000100％120,000100％＋20％","変動費40,00040％48,00040％＋20％","貢献利益60,00060％72,00060％＋20％","固定費50,00050％50,00041.7％±0％","営業利益10,00010％22,00018.3％＋120％"],"f":"p1_5-11.webp","p":"p1_5-11_past.webp"},{"id":"5-12","b":"p1","c":5,"n":12,"t":"ＣＶＰ分析の一般的仮定","i":"A","y":"B","q":["ＣＶＰ分析の一般的仮定を列挙し，そのような仮定を設ける意味を説明しなさい。"],"a":["ＣＶＰ分析の一般的仮定は次の４つである。①販売価格は営業量に関係なく一定である。","②原価は変動費と固定費に分類され，変動費単価と固定費総額は営業量に関係","なく一定である。③複数製品を扱う場合のセールス・ミックスは営業量に関係なく一定である。④生産量と販売量は等しい。","このうち，①から③は，収益，費用，それらの差額としての営業利益を営業量の線形関数で表現するための仮定である。一方，④は，全部原価計算の採用を前提とする場合に，固定費の期間発生額と期間費用を等しくすることで，結果として営業利益を営業量の線形関数で表現するための仮定である。"],"k":["営業量","営業利益","線形関数","販売価格","変動費単価","固定費総額セールス・ミックス","全部原価計算","生産量","販売量"],"kg":[{"l":"","w":["営業量","営業利益","線形関数","販売価格","変動費単価","固定費総額セールス・ミックス","全部原価計算","生産量","販売量"]}],"e":["現実には，販売価格は需要の増減に大きく左右されるし，営業量が増加すれMば変動費単価は減少する傾向にある。また，そもそも全ての原価を変動費と固定費に分類できるわけではないし，全ての製品の売上高(販売量)が同じ割合で増減することはありえない。したがって，収益関数や費用関数，両者の差としての利益関数について線形を仮定することにはかなり無理があり，伝統的なＣＶＰ分析は，あくまでも簡便的な損益計算のシミュレーションを行っているのに過ぎないということを銘記しておくべきである。","なお，全部原価計算の採用を前提とする場合には，営業利益は生産量と販売量の双方の影響を受けるため，営業利益を定式化することが困難となる。そこで，伝統的なＣＶＰ分析においては，直接原価計算の採用を前提とするか，全部原価計算の採用を前提とする場合には，生産量＝販売量を仮定するのが通常である。直接原価計算の営業利益は販売量のみの関数であるため，その採用を前提とすれば営業利益を容易に１次関数で定式化することができるし，生産量と販売量が等しければ，全部原価計算と直接原価計算の営業利益は等しくなるため，全部原価計算の採用を前提とする場合であっても，結果として，その営業利益を販売量のみの関数として捉えることができるからである。","ただし，全部原価計算の採用を前提とする場合であっても，製品単位当たりの固定加工費を一定とし，固定加工費の配賦差額(予定操業度差異)の全てを売上原価に賦課するという仮定を設ければ，生産量＝販売量を仮定せずとも，簡単に損益分岐点を分析することができる(図表５-16)。したがって，全部原価計算の採用を前提とする場合に，必ずしも生産量＝販売量という仮定が設けられるわけではない。"],"f":"p1_5-12.webp","p":"p1_5-12_past.webp"},{"id":"5-13","b":"p1","c":5,"n":13,"t":"複数製品を扱う場合の損益分岐点分析","i":"B","y":"C","q":["複数製品を扱う場合には，単一製品を扱う場合と比べて損益分岐点を分析する意義が相対的に低下するといわれるが，その理由を説明しなさい。"],"a":["複数製品を扱う場合，それらのセールス・ミックスを一定と仮定すれば損益分岐点は１つであるが，現実には，全ての製品の売上高(販売量)が同じ割合で増減することはありえない。そこで，セールス・ミックスを一定と仮定しなければ，損益分岐点はある範囲内で様々な値をとる可能性があり，製品間の相互依存性を考慮すれば，その範囲はさらに広がることになる。","以上より，複数製品を扱う場合の損益分岐点は極めて曖昧な数値に過ぎないため，単一製品を扱う場合と比べて，これを分析する意義が相対的に低下するのである。"],"k":["セールス・ミックス","範囲","製品間の相互依存性","曖昧"],"kg":[{"l":"","w":["セールス・ミックス","範囲","製品間の相互依存性","曖昧"]}],"e":["複数製品を扱う場合には，セールス・ミックスを一定と仮定して損益分岐点を分析するのが通常であるが，現実には，全ての製品の売上高(販売量)が同じ割合で増減することはありえない。そこで，セールス・ミックスを一定と仮定せずに，損益分岐点を分析することがある。","この場合，損益分岐点(売上高)は，売上高の増加に対して最も大きな貢献利益>を実現するように販売した場合(貢献利益率の高い製品から順に販売した場合)をM最小値，売上高の増加に対して最も小さな貢献利益を実現するように販売した場合(貢献利益率の低い製品から順に販売した場合)を最大値として，その範囲内で様々な値をとる可能性がある(図表５-17)。また，現実には，ある製品の売上高の増加が他の製品の売上高の減少をもたらすというように，製品間には相互依存性が存在することから，これを分析上考慮すれば，損益分岐点の範囲はさらに広がることになる。","損益分岐点について一意的な解を求める必要はないとしても，それが広範囲に分布するとなれば，分析そのものの意義が減退することは言うまでもない。現実の企業は複数製品を扱うのが通常であるが，そのもとでの損益分岐点分析は，まさに簡便的なシミュレーションに過ぎず，実はそれほど大きな意義をもたないのである。"],"f":"p1_5-13.webp","p":""},{"id":"5-14","b":"p1","c":5,"n":14,"t":"固定費と経営リスク","i":"A","y":"B","q":["経営レバレッジの現象を定義し，そのような現象が何故生じるのかを理由を付して説明しなさい。"],"a":["経営レバレッジとは，営業量の変化に対して営業利益がより大きく変化する現象をいう。","ここで，営業量が増加すれば，変動費も同じ割合で増加するが，固定費は一定であるため，営業利益はより大きな割合で増加する。逆に，営業量が減少すれば，変動費も同じ割合で減少するが，固定費は一定であるため，営業利益はより大きな割合で減少する。","以上より，経営レバレッジの現象は，固定費の存在によって生じる。"],"k":["営業量の変化","営業利益の変化","固定費の存在"],"kg":[{"l":"","w":["営業量の変化","営業利益の変化","固定費の存在"]}],"e":["原価が全て変動費であれば，貢献利益と営業利益が等しくなるため，売上高の変化率と営業利益の変化率は等しくなる。ただし，企業経営においては固定費が不可欠であるため，営業量がある割合で変化すれば，それは固定費の存在によって増幅され，営業利益はより大きな割合で変化する。このような現象を経営レバレッジ(営業レバレッジ；operatingleverage)といい，経営レバレッジが大きい企業ほど，売上高の変動という不確実性が営業利益に与える影響が大きいため，その分，相対的に経営リスクが高いといえる。","ここで，経営レバレッジの大きさは経営レバレッジ係数と呼ばれ，それは図表５-18に示す式で測定される。この式から，他の条件を一定とすれば，原価構造に占める固定費の割合の大きい企業ほど，経営レバレッジ係数が大きくなることを確認することができる。","次に，経営レバレッジの現象をより深く理解するために，営業量と営業利益は同じであるが，原価構造の異なる２つの企業を仮定する(図表５-19)。Ｘ社は原価構造に占める固定費の割合が相対的に大きい企業であるのに対し，Ｙ社は固定費の割合が相対的に小さい企業である。この場合，両社の経営レバレッジ係数はＸ社が4,000,000÷500,000＝８，Ｙ社が1,000,000÷500,000＝２と算定される。つまり，売上高が現状から10％増減した場合，Ｘ社の営業利益は10％×８＝80％も増減するのに対し，Ｙ社のそれは10％×２＝20％にとどまる。固定費の利用度が高いＸ社の方が，相対的に経営リスクが高いということが理解できる。","売上高5,000,000100％5,000,000100％","変動費1,000,00020％4,000,00080％","貢献利益4,000,00080％1,000,00020％","固定費3,500,00070％500,00010％"],"f":"p1_5-14.webp","p":""},{"id":"5-15","b":"p1","c":5,"n":15,"t":"経営レバレッジと経営行動","i":"A","y":"B","q":["好況期と不況期のそれぞれにおいて，一般にどのような経営行動が採られるかを，経営レバレッジの現象を念頭に置いて説明しなさい。"],"a":["好況期においては，営業量が増加する可能性が高いため，経営レバレッジを大きくすることにより，営業利益をより大きく増加させることができる。したがって，設備投資によって生産量の増加に対応するとともに，省力化によって変動費の発生を抑える経営行動が採られるのが通常である。","一方，不況期においては，営業量が減少する可能性が高いため，経営レバレッジを小さくすることにより，売上高の減少によって損失に転落するリスクを低くすることができる。したがって，部品の外注化など，固定費を変動費化する経営行動が採られるのが通常である。"],"k":["営業量の増加(減少)","営業利益","生産能力","変動費を抑える","設備投資損失に転落するリスク","固定費の変動費化","部品の外注化"],"kg":[{"l":"","w":["営業量の増加(減少)","営業利益","生産能力","変動費を抑える","設備投資損失に転落するリスク","固定費の変動費化","部品の外注化"]}],"e":["一般に，好況期や製品市場の成長期においては，生産量の増加に対応できるように設備投資を行う一方，省力化によって変動費の発生を抑えるという選択が採られる。これは，あえて損益分岐点を引き上げ，売上高の成長による営業利益の増大効果を最大限に実現しようとする経営行動である。","一方，不況期や製品市場の成熟期ないし衰退期においては，減価償却費など固定費の発生を伴う高額な設備を保有することを避けて，外注加工など需要の変動に合わせて費用の発生額を増減させることができる手段に切り替える軽量化経営が行われるのが通常である。これは，固定費を変動費化することによって損益分岐点を引き下げ，売上高の減少による赤字リスクを出来る限り小さくしようとする経営行動である。","問題５-14のＸ社とＹ社を例にとって考えてみよう。図表５-20は，両社の貢献利益図表を示したものである。好況期においては，売上高が増加する可能性が高いため，経営レバレッジの大きいＸ社の方が，営業利益の増大効果をより多く享受しうる分だけ有利であるといえる。したがって，Ｙ社のような原価構造を有する企業は，積極的に設備投資を行って，経営レバレッジを大きくする経営行動を採ることになる。逆に，不況期においては，売上高が減少する可能性が高いため，経営レバレッジの小さいＹ社の方が，赤字リスクが小さいため，より安全であるといえる。したがって，Ｘ社のような原価構造を有する企業は，固定費を削減し，経営レバレッジを小さくする経営行動を採ることになる。"],"f":"p1_5-15.webp","p":"p1_5-15_past.webp"},{"id":"5-16","b":"p1","c":5,"n":16,"t":"ＩＥ法と実績データに基づく方法の相違","i":"B","y":"B","q":["原価予測の方法はＩＥ法(技術的予測法)と実績データに基づく方法に大別されるが，両者の相違を説明しなさい。"],"a":["ＩＥ法は，投入量と産出量の技術的な関係に基づき，因果関係を重視して発生すべき原価を予測する方法であるから，既存製品ばかりか新製品にも適用可能であり，直接材料費標準や直接労務費標準の設定に有効な方法であって，予測データは原価がいくら発生すべきかという規範値を示す。","この点，実績データに基づく方法は，過去の統計に基づいて原価を予測する方法であるから，実績データのない新製品に適用することは不可能であり，主として製造間接費の固変分解に利用される方法であって，予測データは実績データの平均値を示す。"],"k":["因果関係","新製品","直接費の予測","規範値","間接費の固変分解","平均値"],"kg":[{"l":"","w":["因果関係","新製品","直接費の予測","規範値","間接費の固変分解","平均値"]}],"e":["ＩＥ法は，動作研究や時間研究といった工学的な生産管理の手法により，製造工程に投入する原価要素と産出する製品との生産技術的な関係を推測し，因果関係を重視しながら原価態様を特定する方法をいう。過去のデータがない場合でも，不能率のない最適な状況における理論値として規範的に原価態様を予測できるので，既存製品ばかりか新製品にも適用可能であるし，標準原価計算における直接材料費標準や直接労務費標準の設定に応用できる。ただし，この方法の採用にはかなりの手間とコストを要する。","一方，実績データに基づく方法は，勘定科目精査法，スキャッター・チャート法，高低点法，最小自乗法にさらに分類される(図表５-21)。これらは，実績データに依拠して線形原価関数Ｙ＝ａ＋ｂＸ(ただし，Ｘ：営業量，Ｙ：原価発生額，ａ：固定費額，ｂ：変動費率)を導出する方法であるが，正常操業圏を基礎とする過去のデータに基づく以上，線形原価関数を構成する係数ａ(固定費額)と係数ｂ(変動費率)の妥当性は，正常操業圏の範囲内に限定される。"],"f":"p1_5-16.webp","p":""},{"id":"5-17","b":"p1","c":5,"n":17,"t":"実績データに基づく線形原価関数の妥当性","i":"B","y":"B","q":["実績データに基づく方法によって，線形原価関数Ｙ＝ａ＋ｂＸを推定する場合，係数ａの性質について説明しなさい。ただし，Ｘは営業量，Ｙは原価発生額，ａは固定費額，ｂは変動費率を意味する。"],"a":["実績データに基づく方法では，正常操業圏を基礎とする過去の観測値を使用して線形原価関数を推定する。したがって，推定される係数ａは，操業度がゼロの場合においても発生する絶対固定費ではなく，正常操業圏内における固定費の発生予定額を示す。"],"k":["正常操業圏","観測値","操業度ゼロ","絶対固定費"],"kg":[{"l":"","w":["正常操業圏","観測値","操業度ゼロ","絶対固定費"]}],"e":["原価予測を過去の実績データに依拠する場合，その実績データとは，通常は正常操業圏の範囲内における観測値である。したがって，推定された固定費額(ａ)や変動費率(ｂ)は，あくまでも正常操業圏の範囲内の予測値であり，線形原価関数の妥当性は，その範囲内に限定される(図表５-23)。","例えば，係数ａは単に原価直線の延長がＹ軸と交わる点を意味するに過ぎず，操業度ゼロの場合においても発生する絶対固定費を示すものではない。この点は，監督者給料等に代表される準固定費の存在を考慮すれば，容易に理解することができよう。また，正常操業圏の範囲内においては変動費率を一定とみなしうるが，その範囲外においてはこれも変化することに注意しなければならない。","いずれにしても，線形原価関数の妥当性が正常操業圏の範囲内に限定される以上，これを利用した原価予測の有効性もまた，正常操業圏の範囲内に限定されることになる。"],"f":"p1_5-17.webp","p":""},{"id":"5-18","b":"p1","c":5,"n":18,"t":"実績データに基づく線形原価関数の正確性","i":"B","y":"B","q":["実績データに基づく原価予測の方法のうち，高低点法，スキャッター・チャート法，最小自乗法の３つについて，線形原価関数の正確性という観点から優劣を検討しなさい。"],"a":["高低点法ではたった２つの観測値から線形原価関数を推定するのに対し，スキャッター・チャート法では全ての観測値からこれを推定する。したがって，線形原価関数の正確性という観点では，情報ロスがない分だけ，スキャッター・チャート法の方が優れている。","ただし，スキャッター・チャート法では傾向線を目分量で引くため，傾向線の引き方が恣意的になる可能性がある。そこで，これを統計学的に求める方法が最小自乗法であり，線形原価関数の正確性という観点では，最小自乗法が最も優れているといえる。"],"k":["観測値","情報ロス","傾向線","目分量","恣意的","統計学的"],"kg":[{"l":"","w":["観測値","情報ロス","傾向線","目分量","恣意的","統計学的"]}],"e":["高低点法では，たった２組のデータから全体の原価の推移を予測することから，情報ロスが極めて大きく，正確性に難がある。具体的には，原価が曲線的に推移している場合には予測誤差が大きくなるし，原価が直線的に推移している場合でも，最高点と最低点は異常値である可能性が高いので，やはり現実の原価態様(costbehavior)と乖離してしまうという問題がある(図表５-24)。","この点，スキャッター・チャート法では，外れ値を除く全てのデータをグラフ上にプロットして傾向線を引くため，情報ロスがない。したがって，線形原価関数の正確性という点においては，高低点法よりも優れている。ただし，傾向線自体は目分量で引くため，それが恣意的になる可能性は否定できない。そこで，スキャッター・グラフの傾向線を統計学的に求める意図で考案されたのが最小自乗法である。","なお，最小自乗法では，実績データの平均線(回帰直線)と各サンプルとの偏差の合計はゼロであり，偏差を自乗して合計すると最小になるという性質を利用するが，平均線を求めるための正規方程式の導出過程は次の通りである。","①各項にΣをつけた式を作成する(ａの係数は１だから)。","②各項にＸを掛けてΣをつけた式を作成する(ｂの係数はＸだから)。"],"f":"p1_5-18.webp","p":""},{"id":"6-1","b":"p2","c":6,"n":1,"t":"製造部門や販売部門を利益センターとして扱う意義","i":"A","y":"B","q":["責任会計において，製造部門は原価センター，販売部門は収益センターと定義するのが通常であるが，それらを利益センターと定義することもある。そこで，①製造部門や②販売部門を利益センターとして扱う意義をそれぞれ説明しなさい。また，その場合に必要となる工夫を管理会計の技法的問題に限定してそれぞれ説明しなさい。"],"a":["①製造部門の場合","製造部門を利益センターと定義することにより，利益動機からの製造活動を促し，原価低減のモチベーションをより強く喚起することができるという意義がある。この場合，製造部門において収益を擬制し，損益計算を可能とするために，内部振替価格制度を採用する工夫が必要となる。","②販売部門の場合","販売部門を利益センターと定義することにより，利益動機からの販売活動を促し，全社利益と整合的な販売活動を志向させることができるという意義がある。この場合，利益センターとしての販売部門の業績を純粋に評価するために，損益計算においては，製造原価について標準原価で計上する工夫が必要となる。"],"k":["利益動機","原価低減","収益を擬制","内部振替価格","全社利益","実際原価","管理不能","能率の良否の影響","標準原価"],"kg":[{"l":"①","w":["利益動機","原価低減","収益を擬制","内部振替価格"]},{"l":"②","w":["利益動機","全社利益","実際原価","管理不能","能率の良否の影響","標準原価"]}],"e":["予算管理は管理者の業績評価のために実施されるものであるから，それが有効に機能するためには，責任センターごとに当該管理者の予算目標と実績を管理可能性に基づいて集計する責任会計との結合が不可欠となる。責任会計において会計単位となる責任センターは，通常１人の管理者によって代表され，権限と責任の範囲によって，原価センター(コスト・センター)，収益センター(レヴェニュー・センター)，利益センター(プロフィット・センター)，投資センター(インベストメント・センター)に分類される(図表６-１)。","ここでは，生来的には原価センター(収益センター)に分類される製造部門(販売部門)を利益センターと定義する理由が問われているが，一言で言うならば，「製造部長や販売部長の利益意識を高め，会社全体での利益管理を徹底するため」ということになる。また，必要な管理会計技法上の工夫については，利益計算に必要な要素を考慮すればよい。原価しか発生しない製造部門においては売上高を擬制する必要があるし，売上高と販売費しか発生しない販売部門に対しては製造原価を集計する必要がある。そこで，内部振替価格や標準原価による振替(集計)という工夫が必要となるのである。","利益センター売上高－原価＝利益投資権限のない事業部","投資センター売上高－原価＝利益⇔投資額投資権限のある事業部"],"f":"p2_6-1.webp","p":"p2_6-1_past.webp"},{"id":"6-2","b":"p2","c":6,"n":2,"t":"予算の機能","i":"B","y":"B","q":["予算には，計画，統制，調整の３つの基本機能があるといわれるが，それぞれの意味を簡潔に説明しなさい。"],"a":["まず，計画機能とは，予算編成プロセスにおいて，全社的な目標や利益計画を予算として責任センター別に細分化し，各管理者が達成すべき目標を公式化する機能をいう。","次に，統制機能とは，予算統制プロセスにおいて，予算目標の達成を確保する機能をいい，予算執行前の事前統制，予算の執行過程における期中統制，予算執行後の事後統制からなる。","最後に，調整機能とは，予算編成及び予算統制のプロセスにおいて，全社的な諸活動を貨幣単位により調整する機能をいい，下位組織単位相互の水平的な調整と，企業全体の目標と各下位組織単位との垂直的な調整からなる。"],"k":["計画機能","細分化","公式化","統制機能","事前統制","期中統制","事後統制調整機能","水平的調整","垂直的調整","貨幣単位"],"kg":[{"l":"","w":["計画機能","細分化","公式化","統制機能","事前統制","期中統制","事後統制調整機能","水平的調整","垂直的調整","貨幣単位"]}],"e":["予算は，計画，統制，調整という経営管理目的を遂行するために有効な手段であり，その意味において，予算は計画，統制，調整を基本機能とする。","まず，予算の計画機能は，予算編成のプロセスに関連する。ここで，予算は，企業全体の目標や利益計画を組織の権限と責任の体系に沿って細分化し，下位組織単位の責任者の達成目標として公式化したものである。したがって，予算の計画機能は部門管理者の権限・責任構造の明確化・公式化と同義であり，予算は企業の各業務分野の諸活動に関する財務的なガイドラインを提示する。","次に，予算の統制機能は，予算統制のプロセスに関連する。予算統制のプロセスは予算執行前の事前統制(フィードフォワード・コントロール)，予算執行中の期中統制，予算執行後の事後統制(フィードバック・コントロール)からなり，予算は，予算目標の達成を確保するために，予算期間の全期間を通じて，組織構成員を指導，規制する機能を有する。","最後に，予算の調整機能は，予算編成と予算統制のいずれのプロセスにも関連する。ここでいう調整とは，製造部門や販売部門などの同一階層間の水平的調整と，役員，部長，課長といった組織階層を縦断する垂直的調整，貨幣単位による資金バランスの調整を意味し，それらを通じて全社目標との整合性が図られる。また，予算編成プロセスにおいては，調整は企業の目的を全部門，全組織構成員に対して伝達することを伴うことから，結果的にコミュニケーション機能を果たすことになる。","なお，調整がよくなければ効果的な計画は策定できないし，計画が悪ければ効果的な調整や統制は不可能である。したがって，予算の３機能は不可分の関係にあるといえる。ただし，企業組織の拡大に伴う分権化は，貨幣単位という統一的価値尺度に基づく「統合のための調整」を必要としたことから，企業予算に対して最初に求められた機能は調整機能であり，企業予算は基本的に調整機能を最重要とする。"],"f":"p2_6-2.webp","p":""},{"id":"6-3","b":"p2","c":6,"n":3,"t":"予算編成の方法","i":"A","y":"A","q":["予算編成の方法は，予算の主体的編成権をどこに置くかによって，トップダウン型予算(天下り型予算，賦課型予算)とボトムアップ型予算(積上げ型予算，参加型予算)とに大別されるが，それぞれを簡潔に定義した上で，そのメリット・デメリットを説明しなさい。"],"a":["トップダウン型予算とは，トップの意向を受けた予算担当部門が部門予算と総合予算を編成し，各部門にその執行を強制する集権的な予算編成の方法をいう。したがって，トップの予算編成方針や全社的な利益計画との整合性を有するというメリットがある反面，部門管理者の動機づけに問題が生じるというデメリットもある。","一方，ボトムアップ型予算とは，執行部門である各部門に予算編成の権限を委譲し，各部門から提出された部門予算を予算担当部門が積み上げて総合予算を編成し，トップがこれを承認・決定するという分権的な予算編成の方法をいう。したがって，部門管理者の動機づけや責任感の醸成に資するというメリットがある反面，トップの予算編成方針や全社的な利益計画との整合性を失う恐れがあるというデメリットもある。"],"k":["予算編成方針","利益計画","整合性","部門管理者","参加機会","動機づけ"],"kg":[{"l":"","w":["予算編成方針","利益計画","整合性","部門管理者","参加機会","動機づけ"]}],"e":["トップダウン型予算は，強力なトップ・マネジメントのリーダーシップのもと，業務改革を積極的に推し進める場合など，全社的な方向付けが重要な場面では効果を発揮する。しかし，予算担当部門が社長名で一方的に予算を決定し，現場にその執行を強制することから，部門管理者のやる気を阻害し，結果として予算本来の機能が損なわれる危険性がある。","一方，ボトムアップ型予算は，部門管理者のモチベーション管理の考え方を導入した予算編成の方法であり，各部門に自主的に目標を掲げさせることによって，その目標達成意欲を高めることを意図している。しかし，部門予算を積み上げたものが全社的な利益計画と整合性を有する保証はないし，少なくとも，総合予算として調整するには手間がかかるという問題がある。","以上のように，トップダウン型予算とボトムアップ型予算には一長一短があるため，我が国の予算管理の実務では，それぞれのメリットを活かすべく，両者の折衷型予算が広く採用されている。","折衷型予算は，最初に予算編成方針を各部門に示達することによってトップの意向を反映させつつ，その範囲内で部門予算の作成を認めることによって各部門の自主性も尊重するという点に特徴がある。したがって，その予算編成過程においては，トップの予算編成方針と部門予算案，あるいは部門相互間の調整が重要となり，予算担当部門に対する調整機能の役割期待が大きくなる。"],"f":"p2_6-3.webp","p":"p2_6-3_past.webp"},{"id":"6-4","b":"p2","c":6,"n":4,"t":"総合予算の体系","i":"A","y":"B","q":["一般に，企業予算といえば，損益予算を意味するのが通常であるが，企業の年次予算としての総合予算は，損益予算と資金予算からなる。そこで，なぜ，損益予算に加えて資金予算を編成するのかを説明しなさい。"],"a":["損益予算における収益・費用の見積は発生主義に基づいて行われ，現金主義に基づく収入・支出の見積と必ずしも一致しない。そこで，資金の過不足を事前に予測して計画的な資金繰りを行うために，資金予算を編成するのである。"],"k":["発生主義","収益・費用","現金主義","収入・支出","計画的な資金繰り"],"kg":[{"l":"","w":["発生主義","収益・費用","現金主義","収入・支出","計画的な資金繰り"]}],"e":["一般に，年次予算として策定される経常予算のことを総合予算といい，それは損益予算(業務予算)と資金予算(財務予算)から構成される。","このうち，損益予算とは，収益，費用ならびに棚卸資産の変動を含む次年度の業務計画を貨幣的に表現したものをいう。損益予算は，発生主義会計を前提として，収益予算(売上高予算など)と費用予算(売上原価予算，営業費予算など)から構成され，見積損益計算書に集約される(図表６-４)。","一方，資金予算とは，損益予算との関連で編成されるものであり，次年度における資金の調達源泉と資金の使途及び残高を示す計画をいう。これは，損益予算における発生主義に基づく収益・費用の見積と，現金主義に基づく収入・支出の見積とが必ずしも一致しないことから，資金の過不足を事前に予測して計画的な資金繰りを行うために作成されるものである。資金予算は現金収支予算，信用予算，運転資本予算などからなり，見積貸借対照表と見積キャッシュ・フロー計算書に集約される(図表６-４)。","定義資産の変動を含む次年度の業務計画をの使途及び残高を示す計画","作成目的目標利益の指示資金の過不足の予測，計画的な資金繰り","ここで，総合予算の体系を図示すれば，図表６-５のようになる。損益予算と資","金予算の関係の他に，総合予算の編成手続が売上高予算の編成からスタートする","ことに注意したい。つまり，売上高予算をどのような水準に設定するかにより，","製造予算，購買予算，さらには現金収支予算の水準が決定するのである。","なお，総合予算は，短期を前提として，経常的，反復的な業務活動を対象とす","る経常予算であり，長期を前提として，随時的，非反復的な投資活動を対象とす","る資本予算と概念上区別される。ただし，次年度の資本支出予算は，資金予算の","中に組み入れられるため，経常予算としての総合予算が，資本予算から全く独立","しているというわけではない。"],"f":"p2_6-4.webp","p":"p2_6-4_past.webp"},{"id":"6-5","b":"p2","c":6,"n":5,"t":"予算統制のプロセス","i":"B","y":"B","q":["予算編成に続く予算統制のプロセスでは，事前統制，期中統制，事後統制という統制の一般的なプロセスが実施される。そこで，それぞれのプロセスを簡潔に説明しなさい。"],"a":["まず，事前統制とは，予算の執行前に，各責任センターに予算目標を示達し，各管理者を動機づけるプロセスをいう。","次に，期中統制とは，予算の執行過程において，予算目標からの逸脱を制御するプロセスをいう。","最後に，事後統制とは，予算の執行後に責任センターごとに予算実績差異を算定して各管理者の業績を測定・評価するとともに，差異の原因を分析して是正措置を講じるプロセスをいう。","以上のように，予算統制のプロセスでは，事前，期中，事後と予算期間の全期間を通じて，予算目標の達成を確保するための努力が行われる。"],"k":["予算目標","動機づけ","逸脱の制御","原因分析","是正措置"],"kg":[{"l":"","w":["予算目標","動機づけ","逸脱の制御","原因分析","是正措置"]}],"e":["予算統制のプロセスは，予算執行前の事前統制(フィードフォワード・コントロール)，予算執行中の期中統制，予算執行後の事後統制(フィードバック・コントロール)からなる(図表６-６)。","まず，事前統制は，管理者の目標達成意欲を喚起するプロセスであり，動機づけのための活動であるといえる。したがって，予算目標の厳格度に注意を払う必要があり，動機づけという観点からすれば，参加型予算の採用が有効である。また，事前統制には，潜在的な不都合を予測して，これを未然に防止する矯正行動(予算の修正)も含まれる。","次に，期中統制は，予算目標からの逸脱を如何に制御するかを主要な課題とするプロセスである。そこでは，予算執行の状況を実績として把握し，これを目標値としての予算と比較することによって，目標からの逸脱の程度を判断し，必要な修正を行う。また，期中の条件変化によって計画としての予算の妥当性が損なわれている場合には，予算の修正を行うこともある。","最後に，事後統制は，予算と実績の差異を算定・分析することにより，予算執行責任者である各管理者の業績を測定・評価するとともに，必要な是正措置を講じるプロセスである。","これらの統制活動のうち，従来は，予算年度の終了を待って是正措置を講じるという事後統制が中心であった。しかし，そのようなシステムでは，不確実かつ変化の速い現代の企業環境を生き延びることはできない。そこで，近年では，統制活動の重点を事前統制や期中統制にシフトすることによって，問題点を事前ないし適時に解決することが求められている。"],"f":"p2_6-5.webp","p":""},{"id":"6-6","b":"p2","c":6,"n":6,"t":"予算実績差異の分析に変動予算を使用する意義","i":"B","y":"B","q":["予算実績差異の分析に変動予算を使用する意義を説明しなさい。なお，本問において，変動予算とは，実際販売数量のもとで生じるはずの収益や費用を示した業績測定用の予算をいう。"],"a":["計画予算と実績の会計数値は，固定費を除けば，いずれも価格要素と販売数量の積として計算されている。そこで，予算上の単価と実際販売数量の積としての変動予算を媒介項とすることにより，予算実績差異を数量面の差異(販売数量差異)と価格面の差異(価格・能率・予算差異)とに分解することが可能となり，差異の発生原因をより明確に示すことができるという意義がある。"],"k":["数量面の差異","価格面の差異","差異の発生原因予算実績差異計画予算変動予算実績価格・能率販売数量差異・予算差異予算単価予算単価実際単価貢献利益予算数量実際数量実際数量固定費予算額予算額実際額図表６-７変動予算を媒介項とする予算実績差異分析"],"kg":[{"l":"","w":["数量面の差異","価格面の差異","差異の発生原因予算実績差異計画予算変動予算実績価格・能率販売数量差異・予算差異予算単価予算単価実際単価貢献利益予算数量実際数量実際数量固定費予算額予算額実際額図表６-７変動予算を媒介項とする予算実績差異分析"]}],"e":["変動予算はいわゆる予算許容額に相当し，これを媒介項とすることにより，予算実績差異を予算上の単価を前提とした数量面の差異と，実際の販売数量を前提とした価格面(単価面)の差異とに分解することができる(図表６-７)。","いま，直接標準原価計算を採用し，単一製品を製造販売する企業について，当期の〔資料〕が次の通りであったものとする。〔資料〕","この場合，予算実績比較損益計算書を作成すれば，図表６-８のようになる。売上高，変動費といった項目別の差異が，さらに数量差異と価格差異といった要因別に分析されることが理解できよう。","なお，ここでは変動費は直接材料費のみからなると仮定しているため，実際生産・販売量を基礎とする変動費価格差異は，標準原価差異としての直接材料費差異に相当する。つまり，価格・能率・予算差異中の変動費価格差異(直接材料費差異)は，これをさらに価格差異と数量差異とに分析することができる(図表６-９)。","売上高10,000,0008,000,0008,400,000(2,000,000)400,000","変動費5,000,0004,000,0004,032,0001,000,000(32,000)","貢献利益5,000,0004,000,0004,368,000(1,000,000)368,000","固定費3,000,0003,000,0003,100,000―(100,000)","営業利益2,000,0001,000,0001,268,000(1,000,000)268,000"],"f":"p2_6-6.webp","p":""},{"id":"6-7","b":"p2","c":6,"n":7,"t":"直接原価計算方式の販売数量差異の分析方法","i":"B","y":"B","q":["直接原価計算方式で予算実績差異の分析を行う場合，販売数量差異の分析方法には２つの方法がある。そこで，それぞれの方法を簡潔に説明し，いずれの方法が望ましいかを検討しなさい。"],"a":["直接原価計算方式で予算実績差異の分析を行う場合，販売数量差異の分析方法には，総額法と差額法がある。総額法とは，販売数量差異を売上高と変動費で別別に評価する方法であり，差額法とは，販売数量差異を売上高から変動費を控除した貢献利益で直接評価する方法である。","ここで，販売数量の増減に伴う経済的影響は，売上高と変動費で常に逆の結果を示すことになる。したがって，これを区別して分析すること自体に意味はなく，むしろ，販売数量の変化が貢献利益に与えた影響を直接的に評価する方が合理的であるといえる。以上より，総額法よりも差額法による分析の方が望ましいと考えられる。"],"k":["総額法","差額法","売上高","変動費","貢献利益","有利・不利","逆の結果"],"kg":[{"l":"","w":["総額法","差額法","売上高","変動費","貢献利益","有利・不利","逆の結果"]}],"e":["問題６-６の数値例について，総額法と差額法による貢献利益差異の分析図をQ示せば，図表６-10のようになる。売上高が増加(減少)すれば変動費も必然的に増加(減少)するということを考慮すれば，両者を区別して分析することにはあまり意味がない。むしろ，販売数量の増減が売上高と変動費の増減を通じて貢献利益にどのような影響を与えたのかを直接評価する方が適切な分析といえる。"],"f":"p2_6-7.webp","p":""},{"id":"6-8","b":"p2","c":6,"n":8,"t":"セールス・ミックス差異の分析方法の検討","i":"C","y":"B","q":["複数種類の製品を扱う場合，販売数量差異は，セールス・ミックス差異と総販売数量差異に分析することができる。この場合，製品別のセールス・ミックス差異の分析は，各製品の予算貢献利益単価を用いて行うのが通常であるが，この伝統的分析法に対しては，分析結果の利用に限界があるとの批判がある。その意味を説明しなさい。"],"a":["伝統的な分析方法では，製品別のセールス・ミックス差異の分析に当たって，総販売数量差異分析の思考が混入している。すなわち，総販売数量差異の分析と同様に，各製品の予算販売数量よりも実際販売数量が多ければ有利，少なければ不利という分析を行うため，各製品の収益性の相違が考慮外となる結果，相対的に収益性の低い製品のセールス・ミックス差異の有利・不利の別が，現実の経済的影響と逆の方向を示すことになる。そのため，分析結果の利用に限界があるとの批判がある。"],"k":["総販売数量差異分析の思考","相対的に収益性の低い製品","現実の経済的影響"],"kg":[{"l":"","w":["総販売数量差異分析の思考","相対的に収益性の低い製品","現実の経済的影響"]}],"e":["いま，直接原価計算を採用し，製品ＸとＹを製造販売する企業について，当期の〔資料〕が次の通りであったものとする〔資料〕","この場合，伝統的方法により，製品別に当月の販売数量差異を差額法で分析すると，図表６-11のようになる。当月は相対的に収益性の高い製品Ｘのセールス・ミックスを抑える一方で，相対的に収益性(単位当たり貢献利益)の低い製品Ｙのセールス・ミックスを高める意思決定行動を採っており，このセールス・ミックスの変化は，貢献利益全体に対してマイナスの影響を与えたはずである。ところが，予算販売数量と実際販売数量の大小関係のみに着目する伝統的分析法によれば，各製品の収益性の相違が考慮外となるため，製品Ｙのセールス・ミックス差異は有利差異として算定されてしまう。つまり，現実の経済的影響と逆の方向を示すことになるのである。","そこで，製品別のセールス・ミックス差異の分析に当たって，各製品の加重平均貢献利益単価を媒介とする方法が提案される。この場合，製品別のセールス・ミックス差異は，各製品の実際販売数量と予算販売数量の差に，各製品の貢献利益単価と加重平均貢献利益単価の差を乗じることにより算定される。すなわち，各製品の収益性の相違を考慮した分析を行うことから，製品別のセールス・ミックス差異の分析結果は，現実の経済的影響を正しく示すことになる(図表６-12)。","それでは，伝統的分析法よりも，加重平均貢献利益単価を媒介とする方法の方が優れているといえるのだろうか。答えは否である。確かに，伝統的方法の分析結果には一部問題があるが，それをもって分析結果の利用に限界があるとする批判は，製品別のセールス・ミックス差異の分析結果の利用を前提としている。しかしながら，ある製品のセールス・ミックスを高めれば他の製品のセールス・ミックスが低下するという製品間の相互依存性を考慮すれば，大事なことは，セールス・ミックスの変化が全体として貢献利益にどのような影響を与えたかということであり，製品別のセールス・ミックス差異の分析結果には殆ど意味がない。すなわち，正しくは，製品別のセールス・ミックス差異ではなくセールス・ミックス差異の和を問題とすべきなのであって，２つの分析方法の相違が製品別のセールス・ミックス差異と総販売数量差異の分析結果においてのみ認められることからすれば，伝統的分析法に対する批判は，的外れなものと言わざるをえない(図表６-13)。","セールス・ミックス差異3,840,000(不利)－1,200","製品セールス・ミックス差異総販売数量差異合計","合計4,800,000(不利)10,400,000(有利)5,600,000(有利)","製品セールス・ミックス差異総販売数量差異合計","合計4,800,000(不利)10,400,000(有利)5,600,000(有利)"],"f":"p2_6-8.webp","p":""},{"id":"6-9","b":"p2","c":6,"n":9,"t":"市場占拠率差異と市場総需要量差異の分析","i":"B","y":"B","q":["予算実績差異の分析において，(総)販売数量差異は，市場との関連でこれを市場占拠率差異と市場総需要量差異とに分析されるが，そのような分析を行う理由を説明しなさい。"],"a":["市場総需要量の増減と販売数量の増減は密接な関係にあるため，市場総需要量が増加(減少)すれば，販売数量も増加(減少)する傾向にある。すなわち，販売数量差異の中には，管理不能な市場総需要量の増減の影響が含まれており，それをもって販売業績の良否を判断することはできない。","そこで，販売数量差異から市場総需要量差異を分離することによって，純粋な販売努力を表す市場占拠率の増減による差異を把握し，販売業績の評価に役立てるのである。"],"k":["市場総需要量","販売数量","管理不能","販売努力","販売業績の評価"],"kg":[{"l":"","w":["市場総需要量","販売数量","管理不能","販売努力","販売業績の評価"]}],"e":["いま，問題６-８の数値例において，予算の市場総需要量が50,000個(したがって，市場占拠率は10,000個÷50,000個＝20％)，実際の市場総需要量が80,000個(したがって，市場占拠率は12,000個÷80,000個＝15％)であったものとする。","この場合，総販売数量差異を分析すれば，図表６-14のようになる。総販売数量差異は，全体で見れば10,400,000円の有利差異であり，一見すると当期の販売業績は良好であったかのようにも思える。しかしながら，当期は市場総需要量が予算編成時点から60％も増加していることから，市場占拠率を維持することができたならば，当期の総販売数量は60％増の16,000個となったはずである。そこで，市場総需要量の増加の影響を市場総需要量差異として分離し，実際市場総需要量を前提として市場占拠率差異を分析すると，市場占拠率は５％(㌽)低下したため，20,800,000円の不利差異となる。つまり，販売業績はむしろ芳しくなかったと判断されるのであって，市場総需要量差異を分離しなければ，販売業績の良否を純粋に把握することができないということが理解できよう。","設問１販売課の活動が貢献利益に与えた影響を分析するために，製品Ｂの販","設問２設問１で算定した差異の金額を用いて，貢献利益への影響の観点から"],"f":"p2_6-9.webp","p":""},{"id":"6-10","b":"p2","c":6,"n":10,"t":"ローリング方式の予算編成","i":"B","y":"B","q":["ローリング方式の予算編成とはどのような方法であるか，また，これを採用することによってどのような効果が得られるかを説明しなさい。"],"a":["ローリング方式とは，各期末時点において，経過した期間の予算を計画から除去するとともに，同じ長さの期間について新しい予算額を策定し，これを漸次計画に追加することによって，一定期間ごとに転がし方式で予算を見直す方式をいう。この方式を採用することによって，当初の計画段階では予測できなかった環境変化を漸次予算に反映することが可能となるため，不確実性下において予算の妥当性を維持できるという効果が得られる。"],"k":["一定期間","除去","追加","見直し","環境変化","不確実性下","予算の妥当性"],"kg":[{"l":"","w":["一定期間","除去","追加","見直し","環境変化","不確実性下","予算の妥当性"]}],"e":["予算編成時点で前提とされていた条件が不変であれば，当初予算をそのまま予M算期間全体に渡って適用すればよい。しかし，現実には前提としていた条件は変化するため，予算の妥当性を維持するためには，条件変化に応じて当初予算を修正する必要がある。このような予算の修正を一定期間ごとに行う方式をローリング方式といい，修正後の予算をローリング予算という(図表６-15)。すなわち，ローリング方式とは，環境変化に適時に対応するための予算編成の方法であり，不確実性下の現代企業において広く浸透しているといわれる。","ところで，伝統的な予算管理システムでは，「計画と統制」という意識が強く，統制といえば事後統制(フィードバック・コントロール)が中心であった。これは，「計画の統制」という事前統制(フィードフォワード・コントロール)の意識が希薄であったことを意味する。環境変化の激しい不確実性の現代においては，当初予算の妥当性をチェックする事前統制機能の強化が不可欠であり，その一環としてローリング方式が利用されている。"],"f":"p2_6-10.webp","p":""},{"id":"6-11","b":"p2","c":6,"n":11,"t":"予算スラックの形成","i":"A","y":"B","q":["参加型の予算編成過程において，予算執行者である部門管理者が意図的に予測情報を歪曲することによって形成される「予算の水増し」を予算スラックという。そこで，予算スラックが形成される要因を説明し，これを二つに分類しなさい。"],"a":["予算スラックは，予算執行者である部門管理者が，予算目標を容易に達成可能なものとすることによって，自らの業績評価を有利にすることを意図して形成される。したがって，予算スラックは，収益の過少計上によって形成される収益スラックと，費用の過大計上によって形成される原価スラックとに分類される。"],"k":["業績評価","予算目標","容易に達成可能","収益の過少計上","費用の過大計上"],"kg":[{"l":"","w":["業績評価","予算目標","容易に達成可能","収益の過少計上","費用の過大計上"]}],"e":["予算スラックの形成は，参加型の予算編成過程における予算ゲームの象徴として知られている。ここで，予算スラックとは，ボトムアップ型(参加型)の予算編成過程において，予算執行者である部門管理者が意図的に予測情報を歪曲することによって形成される「予算の水増し」をいい，収益予算を容易に達成可能なレベルに低く設定したり，費用として許容される予算額を過大に見積もることによって形成される予算額の一部分をいう。予算スラックは収益スラックと原価スラックからなり，収益スラックとは最適な達成可能収益と予算として承認された収益(過少申告額)の差額を，原価スラックとは予算として承認された原価(過大申告額)と最低限必要な原価の差額を意味する(図表６-16)。","ここで，ある程度の予算スラックの形成は，予算によって管理する側においては容認されるものである。不確実性の高い環境下において不測の事態が生じた場合や，部門間の対立関係が生じた場合には，予算スラックが緩衝材の役目を果たすからである。ただし，予算で管理される予算執行者が，自らの業績評価を有利にするために形成する「過度の予算スラック」は，可能な限り排除されなければならない。それは，予算の統制基準(業績評価基準)としての役割を形骸化させ，予算管理制度そのものの存在意義を覆すことにもつながるからである。lliiill"],"f":"p2_6-11.webp","p":"p2_6-11_past.webp"},{"id":"6-12","b":"p2","c":6,"n":12,"t":"予算スラックを解消する方法","i":"A","y":"B","q":["予算編成方法の変更という観点から，「過度の予算スラック」を解消するための方策を検討しなさい。"],"a":["予算スラックは，ボトムアップ型の予算編成過程において形成されるものであるから，これを解消するためには，部門管理者に予算編成への参加機会を与えないトップダウン型に変更すればよい。しかし，この場合，部門管理者の動機づけという観点で問題がある。そこで，現実的には，トップダウン型とボトムアップ型の折衷型の予算編成に変更するのが望ましい。これにより，ボトムアップ型予算の動機づけ効果を損なわない範囲で，協議の過程で予算スラックを削減することが可能になると考えられる。"],"k":["ボトムアップ型","トップダウン型","参加機会","動機づけ","折衷型"],"kg":[{"l":"","w":["ボトムアップ型","トップダウン型","参加機会","動機づけ","折衷型"]}],"e":["予算スラックの温床が，ボトムアップ型(参加型)の予算編成過程にあることは言うまでもない。部門管理者に予算編成への参加機会を与えるということは，その目標達成意欲を高め，責任感を醸成するという順機能が期待される一方で，予測情報を歪曲し，予算スラックを自らの予算に取り込むという逆機能を誘発する可能性を同時に内包することになるからである。","予算スラックを解消するためには，理論上は，トップダウン型予算を採用すればよい。そのもとでは，部門管理者に予算編成への参加機会が与えられないため，いわゆる「過度の予算スラック」が形成される余地がないからである。しかし，予算への参加機会の喪失は，同時に，動機づけ効果の喪失をもたらすことになる。そこで，現実的には，トップダウン型とボトムアップ型の折衷型の予算編成が提案される。これによって，ボトムアップ型予算の順機能(動機づけ効果)を維持しつつ，予算担当部門と予算執行部門の協議の過程において，逆機能(予算スラックの形成)を削減することが可能になると考えられるからである(図表６-17)。"],"f":"p2_6-12.webp","p":""},{"id":"6-13","b":"p2","c":6,"n":13,"t":"予算目標の厳格度","i":"A","y":"B","q":["損益予算における予算目標の厳格度について，①計画・調整目的と②事前統制目的の２つの観点から，どのような水準に設定するのが望ましいかを説明し，③両者のコンフリクトを解消するための方策を提案しなさい。"],"a":["①計画・調整目的の観点","計画・調整目的の観点からすれば，予算目標は，実現の見込みが高い水準(期待水準)に設定するのが望ましい。なぜなら，達成が困難な水準に売上高予算が設定されると，そのような売上高予算に基づいて製造予算や購買予算，資金予算が編成されるため，実際売上高が予算目標を下回った場合には，製品の過剰生産，原材料の過剰仕入，売上代金の不足など，様々な問題が生じるからである。","②事前統制目的の観点","事前統制目的の観点からすれば，予算目標は，達成可能ではあるが，達成のためにはかなりの努力を要するような水準(ストレッチ水準)に設定するのが望ましい。なぜなら，事前統制の目的は予算によって管理される経営管理者や従業員を動機づける点にあり，実現可能水準に設定すれば，過度に厳しくて達成不可能な目標が設定された場合や，過度に容易な目標が設定された場合と比較して，より良い業績が達成される可能性が高いからである。","③コンフリクトを解消する方策","目的に応じて厳格度の異なる予算を二本立てで設定すればよい。具体的には，年次予算においては計画・調整目的を重視して予算目標を期待水準に設定し，月次予算においては事前統制目的を重視して実現可能水準に設定するといった具合である。"],"k":["資金予算","期待水準","動機づけ","ストレッチ水準","年次予算","月次予算"],"kg":[{"l":"","w":["資金予算","期待水準","動機づけ","ストレッチ水準","年次予算","月次予算"]}],"e":["計画・調整目的の観点において期待水準が望ましいとされるのは，一言で言えば資金予算の統制に不備が生じないようにするためである。例えば，厳しい売上高目標が設定されたとすると，これを基礎として製造予算，購買予算，資金予算が作成される結果として，実際売上高が予算売上高を下回った場合には，製品の過剰生産，原材料の過剰仕入，売上代金の不足などにより，資金不足に陥る危険性が生じるからである。","一方，事前統制目的の観点においてストレッチ水準が望ましいとされるのは，達成可能ではあるがかなり厳しいレベル(予算で管理される側に受容される範囲内で最も厳しいレベル)に目標を設定することにより，最も効果的な動機づけが可能となり，結果として最も良い業績が期待できると考えられるからである。ただし，事前統制段階の動機づけ目的で意図的にストレッチ水準に予算目標が設定されると，事後統制段階の予算実績差異は不利差異ばかりになる可能性が高い。したがって，業績評価の方法如何によっては，次期以降の部門管理者の動機付けをかえって損なう危険性があることに注意しなければならない。そこで，予算業績の評価に際しては，不利差異を全く否定するのではなく，予算目標の＋５％までの不利差異は不問に付すなど，不利差異を前提とした評価を行うことが求められる。","なお，企業予算は基本的には調整目的が最重要ではあるけれども，同時に統制目的の遂行も期待されており，このような予算の多機能性に起因する機能間コンフリクトは，予算目標の厳格度の問題として表面化する。そこで，実務では，このような問題を解決するために，計画・調整目的のための年次予算，統制目的のための月次予算という形で，二本立ての予算を設定することが多い。ただし，この場合，月次予算を12か月分合計したものが年次予算となるわけではないことに注意する(図表６-18)。"],"f":"p2_6-13.webp","p":""},{"id":"6-14","b":"p2","c":6,"n":14,"t":"脱予算経営","i":"B","y":"C","q":["近年，脱予算経営(BeyondBudgeting)という経営思想ないしマネジメント・モデルが台頭しているが，脱予算経営が主張する予算管理実務の問題点を３つ指摘しなさい。"],"a":["第１は，予算が使用されるまでに，予算編成に活用された仮定自体が無効になってしまうという点である。これは，環境変化の速い状況下では，予算年度に入った段階で当初の予測と現実との間にギャップが生じてしまい，目標としての妥当性が失われてしまうことを意味している。","第２は，予算管理が中央集権的な意思決定，強烈なコントロールを伴うという点である。これは，予算担当部門が強大な力を握り，組織内の自由な発想や環境変化に対応する柔軟性を阻害してしまうことを意味している。","第３は，予算が組織構成員の行動に悪影響を及ぼすという点である。これは，第２の問題点に起因して，いわゆる予算ゲームが誘発されてしまうことを意味している。"],"k":["環境変化","予算編成","無効","妥当性","予算担当部門","自由な発想","柔軟性予算ゲーム"],"kg":[{"l":"","w":["環境変化","予算編成","無効","妥当性","予算担当部門","自由な発想","柔軟性予算ゲーム"]}],"e":["脱予算経営(BeyondBudgeting)とは，1990年代の終わり頃から，主として北欧Mの企業をモデルケースとして，ヨーロッパから発信された経営思想ないしマネジメント・モデルであり，「予算が抱える問題点を克服して，戦略を成功裡に遂行ために，変化適応型組織となり，そのために権限移譲をすすめ，経営改革を推進すること」と定義できる。","脱予算経営では，予算管理実務の問題点として，主に本問で見た３つの指摘を行うが，これを要約すれば，予算編成に要する時間や費用が膨大であるにもかかわらず，その成果として測定された目標値が環境変化や予算ゲームによって歪められ，目標としての妥当性を持たない，というものであり，主として予算の計画段階が批判の対象となっている。","ここで，脱予算経営の主張は，上記の問題点を克服するために，変化適応型のマネジメントと分権化をすすめるという点にあり，主要な手段としては，「相対的業績目標の設定」と「ローリング予測」があげられる。相対的業績目標とは，同業他社など何らかの比較対象との関係で決定される目標値であり，市場の中で直接競争する企業との比較で売上高や利益を上回ることを目標とすることで，本問で指摘した第２と第３の問題点を克服することを意図している。また，ローリング予測は既出の内容であるが，これについては第１の問題点を克服することを意図している(図表６-19)。","①環境変化によって予算の妥当性が失われる→ローリング予測","②予算が圧力となって組織の柔軟性が失われる→相対的業績目標の設定","③予算が様々な対処行動(予算ゲーム)を誘発する→相対的業績目標の設定"],"f":"p2_6-14.webp","p":"p2_6-14_past.webp"},{"id":"7-1","b":"p2","c":7,"n":1,"t":"資金管理の目的","i":"A","y":"B","q":["資金管理を行う目的を２つあげて説明しなさい。"],"a":["第１の目的は，支払能力の維持である。すなわち，損益計算書上の利益には必ずしも資金的な裏付けがなく，損益計算書上では利益があがっていても，現金残高が不足して債務を支払うことができないという事態が起こりうる。このような事態を回避するために，現金主義に基づく資金管理が必要となる。","第２の目的は，資金収益性の維持である。すなわち，支払能力を高めるために過大な現金を保有すれば機会原価が発生するし，無計画なファイナンスは余分な利払いをもたらし，いずれも収益性を阻害する。そこで，適切な現金保有高やファイナンスのタイミングを把握し，支払能力と収益性とのバランスを確保するためにも，資金管理が必要となる。"],"k":["資金的裏付け","黒字倒産","現金主義","支払能力の維持現金保有","機会原価","ファイナンス","余分な利払","資金収益性の維持"],"kg":[{"l":"","w":["資金的裏付け","黒字倒産","現金主義","支払能力の維持現金保有","機会原価","ファイナンス","余分な利払","資金収益性の維持"]}],"e":["企業が倒産する原因は，損益計算書上赤字が出ているからではない。倒産に至る企業の多くが赤字企業であることは確かであるが，真の原因は，現金残高の不足による債務不履行にある。したがって，企業経営においては，発生主義ベースの損益管理だけでなく，債務を約定どおりに支払うための現金主義ベースの資金管理も必須ということになる。","一方で，安全性を重視し，支払能力の維持・向上を追求すれば，過大な手元資金(現金資金)を保有する結果として，保有残高について積極的アプローチを採用する場合と比べて機会原価が発生することとなり，資金収益性を阻害する。また，無計画なファイナンスは余分な利息を発生させ，計画的にそれを行った場合と比べて機会損失の発生をもたらし，やはり同様に資金収益性を阻害する。したがって，支払能力を維持する一方で，適切な現金保有高やファイナンスのタイミングを把握し，資金収益性を維持することもまた，資金管理に課せられたもう１つの重要な役割であるといえる。","以上から明らかな通り，資金管理の目的は，支払能力の維持・向上のみにあるわけではない。真の目的は，短期的にはトレードオフの関係にある①支払能力の維持・向上，②資金収益性の維持・向上という２つの目的を，調和的に達成するという点に求めることができるのである(図表７-１)。"],"f":"p2_7-1.webp","p":""},{"id":"7-2","b":"p2","c":7,"n":2,"t":"キャッシュ・コンバージョン・サイクルの管理","i":"A","y":"B","q":["仕入債務を支払ってから売上債権を回収するまでの期間をキャッシュ・コンバージョン・サイクルという。そこで，キャッシュ・コンバージョン・サイクルは短い方が望ましいか，長い方が望ましいかを理由を付して説明し，望ましい状態にするための基本的な方策を示しなさい。"],"a":["キャッシュ・コンバージョン・サイクルの間は未だ入金がないため，手元資金がない場合には，諸経費を支払うために短期借入等による資金調達が必要となり，支払利息が発生する。また，手元資金がある場合でも，キャッシュ・コンバージョン・サイクルの間は棚卸資産や売上債権の形で資金が拘束される結果として，機会原価が発生する。したがって，キャッシュ・コンバージョン・サイクルは短い方が望ましい。","そこで，キャッシュ・コンバージョン・サイクルを短縮するための方策としては，①在庫圧縮による棚卸資産回転期間の短縮，②回収条件の厳格化による売上債権回転期間の短縮，③仕入先との交渉による仕入債務回転期間の延長が考えられる"],"k":["手元資金","短期借入","支払利息","資金拘束","機会原価"],"kg":[{"l":"","w":["手元資金","短期借入","支払利息","資金拘束","機会原価"]}],"e":["棚卸資産の仕入から売上代金の回収までの期間(棚卸資産回転期間＋売上債権回転期間)をオペレーティング・サイクル，仕入代金の支払から売上代金の回収までの期間(棚卸資産回転期間＋売上債権回転期間－仕入債務回転期間)をキャッシュ・コンバージョン・サイクルという(図表７-２)。","ここで，キャッシュ・コンバージョン・サイクルが長期化すれば，その分だけ資金繰りが悪化するとともに，棚卸資産への投入資金や未回収資金について機会原価が発生する。そのため，短期の資金管理の焦点は，キャッシュ・コンバージョン・サイクルを短縮するとともに，手元資金がない場合には，短期的なファイナンスのタイミングを適切に把握する点にあるといえる。そこで，キャッシュ・コンバージョン・サイクル短縮の方策としては，在庫の圧縮や売上債権の回収条件を厳しくすることによってオペレーティング・サイクルを短縮するというアプローチと，仕入先との交渉によって仕入債務の回転期間を延ばすというアプローチの２つに大別される。","なお，キャッシュ・コンバージョン・サイクルは通常プラスであるが，オペレーティング・サイクルの方が仕入債務回転期間よりも短いケースにおいてはマイナスになる(図表７-３)。このようなマイナスのキャッシュ・コンバージョン・サイクルが計算される例としては，具体的には，総合スーパーなどのように，掛仕入れで現金販売を行っており，仕入業者に対する強い立場を利用して，買掛金の支払いを商品販売後とするようなケースなどが考えられる。"],"f":"p2_7-2.webp","p":"p2_7-2_past.webp"},{"id":"7-3","b":"p2","c":7,"n":3,"t":"オペレーティング・サイクルと収益性の関係","i":"B","y":"B","q":["資金管理は，支払能力の向上と資金収益性の向上を目的としており，オペレーティング・サイクルの短縮は，キャッシュ・コンバージョン・サイクルの短縮を通じて支払能力の向上に資するだけでなく，収益性の向上にも資するといわれるが，その理由を説明しなさい。ただし，売上高利益率は一定とする。"],"a":["棚卸資産回転期間や売上債権回転期間を短縮すれば，棚卸資産回転率や売上債権回転率が向上する結果として資本回転率が向上し，売上高利益率を一定とすれば，両者の積としての資本利益率が向上する。","したがって，棚卸資産回転期間と売上債権回転期間からなるオペレーティング・サイクルの短縮は，支払能力の向上だけでなく，収益性の向上にも資するといえるのである。"],"k":["棚卸資産回転期間(率)","売上債権回転期間(率)","資本回転率","資本利益率"],"kg":[{"l":"","w":["棚卸資産回転期間(率)","売上債権回転期間(率)","資本回転率","資本利益率"]}],"e":["オペレーティング・サイクルの短縮は，キャッシュ・コンバージョン・サイクルの短縮を通じて資金繰りを好転させるが，それに加えて資金収益性の向上にも資するといわれる。ただし，それは，売上高利益率を一定と仮定した場合であり，現実には，オペレーティング・サイクルの短縮は必ずしも収益性の向上にはつながらない。","例えば，オペレーティング・サイクルを短縮するためには，売上債権回転期間を短縮する必要があるが，回収条件を厳しくすれば，売上高は減少するのが通常である。なぜなら，回収条件を厳しくすれば，販売先はより支払猶予期間の長い仕入先に変更する傾向があるし，売上高の中には，支払猶予期間の対価も含まれているからである。この場合，固定費の存在に起因して売上高の増減率＜営業利益の増減率であるから，売上高が減少すれば，売上高利益率は低下するのが通常であり，オペレーティング・サイクルの短縮は，かえって収益性を阻害することになる。","以上より，資金管理においては，単にオペレーティング・サイクルやキャッシュ・コンバージョン・サイクルの短縮のみを追求するのではなく，支払能力と資金収益性のトレードオフ関係に留意しつつ，両者のバランスを確保するという視点が求められるのである。"],"f":"p2_7-3.webp","p":""},{"id":"7-4","b":"p2","c":7,"n":4,"t":"取引先のキャッシュ・コンバージョン・サイクルの解釈","i":"B","y":"B","q":["取引先のキャッシュ・コンバージョン・サイクルが長期化している場合，一般に，どのように解釈すべきであるか。具体的に理由を付して説明しなさい。"],"a":["キャッシュ・コンバージョン・サイクルの長期化は，①棚卸資産回転期間の長期化，②売上債権回転期間の長期化，③仕入債務回転期間の短期化によって生じる。この点，①は売上減少による在庫増を，②は不良債権の発生による資金回収の困難性を，③は企業間信用の低下による代金回収条件の厳格化の可能性をそれぞれ示唆していると考えられる。","以上より，取引先のキャッシュ・コンバージョン・サイクルが長期化している場合には，資金繰りが繁忙であり，その信用について警戒信号がともったと解釈すべきである。"],"k":["売上減少による在庫増","不良債権の発生","代金回収条件の厳格化"],"kg":[{"l":"","w":["売上減少による在庫増","不良債権の発生","代金回収条件の厳格化"]}],"e":["キャッシュ・コンバージョン・サイクルの長期化は，①棚卸資産回転期間の長期化，②売上債権回転期間の長期化，③仕入債務回転期間の短期化のいずれか又はそれらの複合によって生じる(図表７-４)。ここで，①と②は取引先の資金繰りの悪化を示唆すると見てよいが，③については検討の余地がある。なぜなら，資>金繰りが悪化した企業は，仕入先に対して支払猶予を求めるのが通常であり，そMの場合には，仕入債務回転期間は長期化し，結果としてキャッシュ・コンバージョン・サイクルの短期化につながるからである。すなわち，仕入債務回転期間については，短期化していても，長期化していても注意が必要であり，取引先の資金繰りの悪化を推測する場合には，売上債権回転期間とあわせて分析を行う必要がある。その意味では，本問の解答としては①と②を中心に行えばよいといえる。"],"f":"p2_7-4.webp","p":""},{"id":"7-5","b":"p2","c":7,"n":5,"t":"回転差資金","i":"B","y":"B","q":["仕入債務回転期間と売上債権回転期間の開始時期を揃えた場合に，両者の差から生じる資金を回転差資金という。そこで，回転差資金の解釈について，２つに分けて説明しなさい。"],"a":["仕入債務回転期間は支払猶予期間，売上債権回転期間は入金待ちの未回収期間であるといえる。したがって，両者の開始時期を揃えてみたときに，仕入債務回転期間の方が長い場合には，運用可能な資金が生じていると解釈することができる。一方，売上債権回転期間の方が長い場合には，機会原価を生じさせる資金が生じていると解釈することができる。"],"k":["支払猶予期間","未回収期間","運用可能","機会原価"],"kg":[{"l":"","w":["支払猶予期間","未回収期間","運用可能","機会原価"]}],"e":["仕入債務回転期間(買掛金回転期間)と売上債権回転期間(売掛金回転期間)の差から生じる資金を回転差資金という。これは，経常的な状態では仕入と販売が混在しているので，仕入債務と売上債権の回転期間の開始時期を揃えてみたときに，両者の回転期間の差から，どれほどの運用可能な資金(又は機会原価を発生させる資金)が生じているかを示すものである(図表７-５)。","例えば，１日当たり売上高が100万円であり，棚卸資産の原価率が80％，売上債権回転期間が30日，仕入債務回転期間が45日であるとすると，回転差資金は次のように計算される。","１日当たり売上高＠100×原価率80％×仕入債務回転期間45日＝１日当たり売上高＠100M＝仕入債務平均残高3,600－売上債権平均残高3,000＝回転差資金600","ここで，下線部は，80万円の資金を45日運用できると解釈することもできれば，100万円の資金を36日運用できると解釈することもできる。後者の解釈によれば，100万円の資金を回転差の６日運用できるということを意味しており，運用可能な600万円の資金を回転差によって得られたと解釈することができる(図表７-６)。"],"f":"p2_7-5.webp","p":""},{"id":"7-6","b":"p2","c":7,"n":6,"t":"運転資金の管理","i":"A","y":"B","q":["売上高の増加が資金繰りに与える影響について，キャッシュ・コンバージョン・サイクルがプラスの場合とマイナスの場合とに分けて説明しなさい。"],"a":["通常はキャッシュ・コンバージョン・サイクルがプラスであり，仕入代金の支払が売上代金の回収に先行するため，売上高の増加は追加的な運転資金の需要をもたらす。","一方，キャッシュ・コンバージョン・サイクルがマイナスの場合には，売上代金の回収が仕入代金の支払に先行するため，売上高の増加はそのまま資金余裕の増加をもたらす。"],"k":["仕入代金の支払","売上代金の回収","資金需要","資金余裕"],"kg":[{"l":"","w":["仕入代金の支払","売上代金の回収","資金需要","資金余裕"]}],"e":["一般に，「棚卸資産＋売上債権－仕入債務」で計算される金額を運転資金ないしM所要運転資金という。通常はキャッシュ・コンバージョン・サイクルがプラスであり，運転資金もプラスの金額が計算されるが，棚卸資産と売上債権は入金待ちの状態，仕入債務は支払猶予の状態であるから，両者の差額分だけ，支払が先行することを意味する。したがって，企業が営業活動を行うためには，まずこの運転資金を準備する必要がある。逆に言えば，最初にこの運転資金を準備しさえすれば，売上高や回転期間が一定である限り資金は回ることになるが，少なくとも売上高は一定でない。そこで，売上高が増加する場合には，その分だけ棚卸資産，売上債権，仕入債務が増加し，差額分だけ支払が先行する結果として，新たな運転資金の需要が生じることになる(図表７-７)。","この点，キャッシュ・コンバージョン・サイクルがマイナスであり，売上代金の入金が仕入代金の支払に先行する場合には，売上高の増加はそのまま資金余裕の増加をもたらすことになる(図表７-８)。"],"f":"p2_7-6.webp","p":"p2_7-6_past.webp"},{"id":"7-7","b":"p2","c":7,"n":7,"t":"現金資金の管理","i":"B","y":"B","q":["現金や当座預金などの要求払預金からなる現金資金の管理においては，その保有残高について保守的アプローチと積極的アプローチがあるが，それぞれの特徴を説明しなさい。"],"a":["保守的アプローチとは，資金ショートに陥るリスクがゼロになるように，十分な量の現金資金を保有するアプローチである。このアプローチは，支払能力の維持という目的を優先したものであり，安全性に優れている。しかしながら，収益性の高い他の投資機会に資金を充てた場合と比べて機会原価が発生し，企業全体の収益性が低下するという問題がある。","一方，積極的アプローチは，現金資金の保有残高を最小限に抑え，収益性の高い他の投資機会に資金を充てようとするアプローチである。このアプローチは，収益性の向上という目的を優先したものであり，企業全体の収益性の向上に資する。しかしながら，十分な現金資金を保有しないために，支払能力が低下するという問題がある。"],"k":["支払能力","収益性","他の投資機会"],"kg":[{"l":"","w":["支払能力","収益性","他の投資機会"]}],"e":["資金管理の分野では，現金預金を単なる回収余剰と見るのではなく，支払準備のための一種の資金の運用形態と見る。したがって，現金資金という表現を使用することがあり，その適正な保有残高が問題となる。","ここで，資金管理は，支払能力の維持・向上と資金収益性の維持・向上の双方を目的としているが，これら２つの目的は短期的にはトレードオフの関係にあるため，目的間の調整が必要となる。すなわち，保守的アプローチによれば，支払能力は高水準に維持できるものの収益性に問題があるし，積極的アプローチによれば，収益性は高くなるものの支払能力は低下するのであって，理論的には両者の中間的アプローチが妥当ということになる(図表７-９)。より具体的には，支払能力を維持できる範囲内で，現金資金の保有残高を出来るだけ最小化するのが望ましいということになる。","なお，現金資金の管理には，保有残高(ストック)という側面での管理と，現金収支(キャッシュ・フロー)という側面での管理の２種類があり，ここでは主としてストック面での管理について検討している。一方で，キャッシュ・フロー管理の観点からすれば，現金収入や現金支出のタイミングを予測することが重要となり，企業は，計画的な資金繰りを行うために，比較的短いスパンでの資金繰り表を作成することになる。"],"f":"p2_7-7.webp","p":""},{"id":"7-8","b":"p2","c":7,"n":8,"t":"資金計算書の作成方法","i":"C","y":"B","q":["資金計算書の作成方法には直接法と間接法の２つがあるが，それぞれを簡潔に説明しなさい。また，キャッシュ・フロー計算書，資金移動表，資金運用表，資金繰り表のそれぞれが，直接法と間接法のいずれの方法によって作成されるかを，理由を付して説明しなさい。"],"a":["直接法とは，現金勘定の出入りをベースに作成する方法をいい，間接法とは，貸借対照表，損益計算書の情報をベースに作成する方法をいう。","ここで，キャッシュ・フロー計算書と資金繰り表は企業自らが内部資料を利用して作成するものであるのに対し，資金運用表と資金移動表は，金融機関などの外部者が，融資判断などのために財務諸表を利用して作成するものである。したがって，キャッシュ・フロー計算書と資金繰り表は直接法によって，資金運用表と資金移動表は間接法によって作成される。"],"k":["現金勘定","貸借対照表","損益計算書","内部資料"],"kg":[{"l":"","w":["現金勘定","貸借対照表","損益計算書","内部資料"]}],"e":["資金計算書の作成方法には直接法と間接法があり，いずれが採用されるかは，作成主体が大きく関連する。すなわち，キャッシュ・フロー計算書や資金繰り表のように，作成主体が企業自身であれば内部資料の利用が可能であり，直接法の採用が可能となるが，資金移動表や資金運用表のように，作成主体が外部者であれば，内部資料を利用することはできないため，必然的に間接法が採用されることになる(図表７-10)。なお，間接法を採用する場合には，キャッシュ・フローを収入と支出の総額で表示することができず，キャッシュ・フローの増減要因を理解しづらいという限界がある。","ただし，資金繰り表の作成目的は，現金預金の最大化ではなく，短期的に必要なファイナンスのタイミングを適切に把握するという点にある。したがって，いつどのような原因(活動)によって現金収支が生じるのかを知る必要があり，その意味においても，直接法が採用されるのは当然のことといえる。","なお，指向時点と対象期間という点に着目すれば，４つの資金計算書は，資金繰り表とその他の３つの資金計算書という括りで分類することができる。すなわち，キャッシュ・フロー計算書，資金移動表，資金運用表は，通常半年又は１年を対象期間として事後的に作成されるものであるため，キャッシュ・フローのタイミングや季節的な資金の流れを把握できず，計画的な資金繰りには役立たない，資金の調達と運用の因果関係(特定源泉から調達された資金が特定目的に運用されること)を表示できないという共通の限界がある。","資金概念現預金及び同等物現預金運転資金使用可能な現預金"],"f":"p2_7-8.webp","p":"p2_7-8_past.webp"},{"id":"7-9","b":"p2","c":7,"n":9,"t":"資金移動表・資金運用表とキャッシュ・フロー計算書の関係","i":"C","y":"C","q":["資金移動表及び資金運用表とキャッシュ・フロー計算書の関係について，キャッシュ・フロー計算書における営業活動によるキャッシュ・フローに相当する金額の表示方法という観点から説明しなさい。"],"a":["キャッシュ・フロー計算書における営業活動によるキャッシュ・フローに相当する金額について，資金移動表は，経常収支の区分においてその収支を総額で表示するのに対し，資金運用表は，固定資金と運転資金の区分においてストックの変化に基づき収支を純額で表示する。したがって，資金移動表は直接法によるキャッシュ・フロー計算書に，資金運用表は間接法によるキャッシュ・
