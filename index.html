ることが多い。ただし，現実の投資案の経済命数は長期に及ぶのが通常であり，そのような長期の投資意思決定を前提とすれば，単年度のＲＩに基づく業績測定では限界が生じることになる。投資期間の初期は減価償却が進んでいないため，資本コストの負担が大きくなり，正味現在価値がプラスの有利な投資案であっても，単年度のＲＩがマイナスとなる可能性があるからである。","そこで，厳密な目標一致の観点からすれば，複数期間(投資期間)ベースのＲＩに基づいて，業績を測定するのが望ましいということになる。投資案の各年度のＲＩの現在価値総額は正味現在価値に一致するという関係にあるため，複数期間(投資期間)ベースのＲＩを業績測定に用いることで，正味現在価値の正負と整合的な投資判断を促すことができるのである。","なお，投資案の各年度のＲＩの現在価値総額が正味現在価値に一致するのは，各年度のＲＩの計算において，初期投資額を減価償却費及び資本コストとして各年度のキャッシュ・フローに負担させているからである(図表12-10)。"],"f":"p2_12-7.webp","p":"p2_12-7_past.webp"},{"id":"12-8","b":"p2","c":12,"n":8,"t":"事業部制の業績測定の２つの側面","i":"A","y":"B","q":["事業部制の業績測定には事業部長の業績測定と事業部自体の業績測定という２つの側面があるが，それらを明確に区別する場合，業績測定の目的や業績測定尺度の利益ベース及び投資ベースがどのように相違するのかを説明しなさい。"],"a":["事業部長の業績測定は，その分権的な意思決定が全社目標と整合性を有するようにコントロールすることを目的とする。したがって，各種の会計処理においては，事業部長が不公平感や不満足感を持たないように，当該事業部長にとっての管理可能性に則って業績測定尺度を計算する。具体的には，利益ベースは管理可能営業利益，投資ベースは管理可能投資額となる。","一方，事業部自体の業績測定には，事業部への資源配分や事業部の存廃など，本社の意思決定に資する投資案の収益性情報を提供することを目的とする。したがって，したがって，各種の会計処理においては，事業部長にとっての管理可能性を考慮する必要はなく，当該事業部に対する追跡可能性に則って業績測定尺度を計算する。具体的には，利益ベースは税引後事業部営業利益，投資ベースは事業部投下資本となる。"],"k":["目標整合性の確保","管理可能性","収益性情報の提供","追跡可能性"],"kg":[{"l":"","w":["目標整合性の確保","管理可能性","収益性情報の提供","追跡可能性"]}],"e":["伝統的な事業部制の業績測定においては，事業部長の業績測定と事業部自体のM業績測定を明確に区別すべきであるといわれる。前者は事業部長の意思決定のコントロールを目的とし，上位者から下位者への影響システムとしての側面が強調されるのに対し，後者は本社の意思決定に資する収益性情報の提供を目的とし，下位者から上位者への情報システムの側面が強調されるからである。","この場合，事業部長の業績測定は，管理可能性原則に則って，管理可能営業利益と管理可能投資額との比較において行われる。したがって，事業部長の業績測定尺度としては図表12-11に示す２つが考えられるが，事業部長の投資意思決定について目標整合性を確保するべく，残余利益(ＲＩ)を使用するのが望ましいといわれる。","一方，事業部自体の業績測定は，事業部長にとっての管理可能性にかかわらず，当該事業部に合理的に跡付け可能な投資額と利益との比較において行われる。したがって，事業部自体の業績測定尺度としては図表12-12に示す２つが考えられるが，規模の相違を考慮した業績測定を重視するならば投資利益率(ＲＯＩ)，規模の相違にかかわらず企業価値への貢献度を重視するならば残余利益(ＲＩ)が望ましいということになる。","なお，近年のＥＶＡを利用した事業部制の業績測定においては，事業部長の業績測定と事業部自体の業績測定を区別せずに，企業価値への貢献度を重視するという特徴がある。","管理可能営業利益事業部売上高－事業部変動費－管理可能事業部固定費","残余利益管理可能営業利益－管理可能投資額×資本コスト率","税引後事業部営業利益管理可能営業利益－管理不能事業部固定費－本社費配賦額－社内税金","投下資本利益率税引後事業部営業利益÷事業部投下資本","残余利益税引後事業部営業利益－事業部投下資本×資本コスト率","業績測定方法当該事業部の予算と実績の比較他事業部又は他企業との比較","会計処理原則事業部長にとっての管理可能性当該事業部に対する追跡可能性","望ましい業績測定尺度残余利益投下資本利益率(残余利益)"],"f":"p2_12-8.webp","p":""},{"id":"12-9","b":"p2","c":12,"n":9,"t":"本社費を配賦する理由","i":"A","y":"A","q":["事業部制の実務においては，本社費を各事業部に配賦するのが通常であるが，その理由を３つあげなさい。"],"a":["第１の理由は，各事業部に本社費回収の必要性を認識させるためである。","第２の理由は，各事業部に本社費の発生に対する牽制機能を持たせるためである。","第３の理由は，各事業部の業績測定を独立の会社のそれに近付けるためである。"],"k":["本社費回収の必要性","牽制機能","業績測定","独立の会社"],"kg":[{"l":"","w":["本社費回収の必要性","牽制機能","業績測定","独立の会社"]}],"e":["管理可能性原則を重視する伝統的な管理会計理論においては，管理不能な本社費が各事業部に配賦すべきでないと考えられてきた。しかしながら，事業部制の実務においては，むしろ本社費を配賦するのが通常であり，本問ではその理由を問うている。","ここで，事業部制の実務における本社費配賦の論理は，主として，「全社的な利益とは本社費控除後の利益であって，それは各事業部の利益によってのみ補填しうる」という考えに基づいているといえる。すなわち，長期的な利益目標の一部としてこれを明示することによって，本社費回収の必要性を意識付けることに狙いがあると考えられる。また，解答で示した通り，本社費の発生に対する牽制機能や，事業部の業績測定をより独立の会社に近付けることなどを意図していると見ることもできる。","なお，多くの企業では，本社費を何らかの基準で一括的に各事業部に配賦してきたが，近年はこれを改善する動向がみられる。事業内容の多様化・複雑化により，近年，企業の本社費は増大傾向にあり，従来型の稚拙な配賦方法をとれば，各事業部の業績測定に不備が生じるためである。そこで，本社費配賦の改善動向として，活動基準原価計算(ＡＢＣ)の思考を導入する試みがみられる。ＡＢＣによれば，活動及び資源の消費状況に応じて本社費を各事業部に割り当てることで，より精緻な計算を実現できる(図表12-14)。その結果，事業部利益の計算において，従来よりも公平性と納得性を確保することができるのである。"],"f":"p2_12-9.webp","p":"p2_12-9_past.webp"},{"id":"12-10","b":"p2","c":12,"n":10,"t":"ＥＶＡ を改善する方策","i":"B","y":"B","q":["ＥＶＡとＲＯＩＣの関係を説明した上で，ＥＶＡを改善する方策を，多角化企業を想定して３つ示しなさい。"],"a":["ＥＶＡは，ＲＯＩＣとＷＡＣＣの差に，投下資本を乗じることで算定される。したがって，ＲＯＩＣがＷＡＣＣを上回ればＥＶＡはプラスとなり，ＲＯＩＣがＷＡＣＣを下回ればＥＶＡはマイナスとなる。","そこで，ＥＶＡを改善する方策としては，①ＲＯＩＣがＷＡＣＣを上回る事業に投資する，②資本効率の改善と資本構成の見直しにより，ＥＶＡスプレッドを拡大する，③ＲＯＩＣがＷＡＣＣを下回る事業から撤退する，の３つが考えられる。"],"k":["事業への投資","資本効率の改善","資本構成の見直し","事業からの撤退"],"kg":[{"l":"","w":["事業への投資","資本効率の改善","資本構成の見直し","事業からの撤退"]}],"e":["ＥＶＡ(EconomicValueAdded：経済的付加価値)とは，営業利益から資本の利用に対する費用を控除したものであり，株主価値重視を基本思考とする一種の残余利益である。すなわち，資本コスト(率)を上回る利益(率)を獲得することによってはじめて株主に価値を付加したと考える経営指標であり，90年代以降，米国企業を中心に広く浸透した。それは，投資利益率という業績測定尺度に対する反省と，企業価値ないし株主価値重視の経営への転換を意味し，アメリカン・スタンダードの流入によって，日本企業にもＥＶＡを導入する企業が相次いだ。","ＥＶＡは，簡便的には，税引後営業利益(netoperatingprofitaftertaxes：ＮＯＰＡＴ)から，投下資本に加重平均資本コスト率(weightedaveragecostofcapital：ＷＡＣＣ)を乗じて計算した資本コストを控除することによって計算される(図表12-15)。","なお，近年，コーポレートガバナンス・コードにおいて自社の資本コストを把握することの重要性が指摘される中で，ＲＯＩＣ(returnoninvestedcapital：投下資本利益率)を経営指標として利用する企業が増加している。具体的には，ＲＯＩＣとＷＡＣＣを比較することで，自社の資本コストを営業活動で賄えているかを見るのである(図表12-16)。この点，ＥＶＡの特徴は，ＲＯＩＣとＷＡＣＣの比較を計算構造上内包するという点にある。"],"f":"p2_12-10.webp","p":""},{"id":"12-11","b":"p2","c":12,"n":11,"t":"ＥＶＡⓇによる業績測定の特徴⑴","i":"B","y":"B","q":["ＥＶＡを投資センターの業績測定尺度として利用する場合のメリットを説明しなさい。"],"a":["ＥＶＡの増減は企業価値の増減と連動していることから，これに対する各事業単位の貢献度を測定することができるというメリットがある。","また，ＥＶＡによる業績評価結果を報酬制度とリンクさせることによって，管理者及び従業員の利害と株主の利害を一致させ，全ての従業員がオーナーのように考えて行動することを動機付けることができるというメリットがある。"],"k":["企業価値","株主価値","報酬制度","利害の一致"],"kg":[{"l":"","w":["企業価値","株主価値","報酬制度","利害の一致"]}],"e":["企業価値と投下資本簿価との差額を市場付加価値(MarketValueAdded；ＭＶＡ)といい，負債の時価と簿価が等しいと仮定すれば，その実際値は株式時価総額と株主資本簿価との差額により算定される。一方，ＭＶＡの理論値は，将来のＥＶＡの現在価値総額をもって算定される(図表12-17)。すなわち，ＥＶＡが企業の１年間の業績を示すフローの概念であるとすれば，ＭＶＡはその累積額としてのストックの概念に相当し，将来のＥＶＡが増減すれば，市場付加価値も増減するというように，両者の間には高い相関関係が存在する。ＥＶＡによる業績測定，評価が株主価値重視の経営に資するという主張の論拠は，その増減がＭＶＡの増減を通じて，企業価値ないし株主価値の増減に連動しているという点に求められる。"],"f":"p2_12-11.webp","p":""},{"id":"12-12","b":"p2","c":12,"n":12,"t":"ＥＶＡ による業績測定の特徴⑵","i":"B","y":"B","q":["ＥＶＡによる事業部制の業績測定の特徴を，伝統的な事業部制の業績測定との比較において説明しなさい。"],"a":["伝統的な事業部制の業績測定では，事業部長の業績測定と事業部自体の業績測定を明確に区別するが，ＥＶＡによる事業部制の業績測定では，両者を区別しない。すなわち，伝統的な事業部制の業績測定が管理可能性原則に基づく事業部長の業績測定を重視していたのに対し，ＥＶＡによる事業部制の業績測定では，当該事業部の企業価値や株主価値への貢献度の測定を重視しているという点に特徴がある。"],"k":["事業部長の業績測定","事業部自体の業績測定","管理可能性原則","企業価値"],"kg":[{"l":"","w":["事業部長の業績測定","事業部自体の業績測定","管理可能性原則","企業価値"]}],"e":["伝統的な事業部制の業績測定において，事業部長の業績測定に使用される残余利益は，管理可能性原則に則って，税引前の管理可能営業利益と管理可能投資額を用いて計算される。この点，ＥＶＡは，税引後事業部営業利益から事業部投下資本に対する資本コストを控除することによって算定され，利益ベースや投資ベースについて事業部長にとっての管理可能性は考慮されていない。むしろ，本社から見れば投資案に相当する各事業部が，企業価値や株主価値に対してどれだけ貢献しているかという点を評価することに重点が置かれており，その意味では，伝統的な事業部制の業績測定でいうところの事業部自体の業績測定が主体となっているといえる。","以上の事実は，ＥＶＡを用いた株主価値重視の経営のもとでは，伝統的なマネジメント・コントロールや責任会計上のルールが二次的なものとして取り扱われていることを意味する。したがって，これを現実に事業部長の業績測定，評価及び報酬の算定に用いる場合には，管理可能性に基づいて何らかの修正を施したり，ＥＶＡの計算方法について事業部長の十分な理解を求めるなどの慎重な対応が必要となる。","なお，伝統的な残余利益を用いた事業部長の業績測定とＥＶＡによる業績測定の相違としては，資本コスト率の相違に関連して，資本市場の評価が業績測定に反映されるか否かという点も挙げられる(図表12-18)。"],"f":"p2_12-12.webp","p":""},{"id":"12-13","b":"p2","c":12,"n":13,"t":"社内金利制度と社内資本金制度","i":"B","y":"B","q":["社内金利制度とは，事業部投下資本に対して社内金利を課し，これを事業部損益計算書に反映させるシステムをいい，社内資本金制度を採用しないタイプ（米国型；残余利益方式)と社内資本金制度を採用するタイプ(日本型)に大別される。そこで，２つのタイプの相違点について説明しなさい。"],"a":["社内資本金制度を採用しない米国型の社内金利制度では，事業部ごとに貸借対照表を作成しないで，事業部資産(事業部投下資本)に一律に加重平均資本コスト率を適用する。","一方，社内資本金制度を採用する日本型の社内金利制度では，事業部ごとに貸借対照表を作成し，貸方側の各資本源泉にそれぞれ異なる金利を選択して適用する。","このように，事業部貸借対照表を作成するか否かに関連して，金利を課す投資ベースや金利の内容及び適用方法において両者は相違する。"],"k":["事業部貸借対照表","投資ベース","加重平均資本コスト率","異なる金利"],"kg":[{"l":"","w":["事業部貸借対照表","投資ベース","加重平均資本コスト率","異なる金利"]}],"e":["社内金利制度とは，事業部投下資本に対して社内金利を課し，これを事業部損益計算書に反映することによって，投資センターに資本の利用に対する金利意識を徹底させるためのシステムである。一方，社内資本金制度とは，事業部ごとに貸借対照表を作成し，その貸方側に社内借入金・社内資本金・留保利益などの項目を設定する日本特有の管理会計技法をいう。","社内金利制度は，事業部ごとに貸借対照表を作成するか(社内資本金制度を採用するか)否かによって，２つのタイプに分類される。このうち，米国型の残余利益方式の特徴は，事業部資産(正確には，事業部総資産－流動負債)に対して一律に加重平均資本コスト率を課し，これを事業部利益から控除した残余利益(ＲＩ)ないし経済付加価値(ＥＶＡ)を業績測定尺度として重視する点にある。つまり，米国型の投資センター方式の事業部制の管理会計システムを指すと解してよい。一方，日本型の社内資本金制度を採用する方式の特徴は，事業部ごとに貸借対照表を作成し，貸方側の各資本源泉に異なる金利を選択適用するという点にある(図表12-19)。","なお，我が国の社内金利制度は，当初は，事業部を投資センターとして管理することではなく，事業部サイドでの運転資金の管理を徹底する意図で導入され，その後に社内資本金制度が導入されたという経緯がある。","投資ベース事業部資産(事業部投下資本)貸方側の各資本源泉","金利の適用ＷＡＣＣを一律に適用異なる金利を選択適用"],"f":"p2_12-13.webp","p":""},{"id":"12-14","b":"p2","c":12,"n":14,"t":"社内資本金制度の機能","i":"B","y":"B","q":["社内資本金制度の機能について，将来の分社化を視野に入れて説明しなさい。"],"a":["社内資本金制度の特徴は，社内借入金に金利を課すことによって借入金の早期返済を促すとともに，累積損益としての留保利益を計上することによって長期的な利益責任を問う点にある。すなわち，調達源泉別のファンド・マネジメントについて疑似的な責任を問うものであるから，将来の分社化に向けてのシミュレーション機能を有している。"],"k":["社内借入金","借入金の早期返済","留保利益","長期的な利益責任"],"kg":[{"l":"","w":["社内借入金","借入金の早期返済","留保利益","長期的な利益責任"]}],"e":["社内資本金制度の特徴は，事業部ごとに貸借対照表を作成し，その貸方側の資金管理について疑似的な責任を問うという点にある。つまり，あたかも独立の企業であるかのように擬制して業績測定を行うため，将来の分社化に向けてのシミュレーション機能を期待することができる。","ところで，社内資本金制度を採用するタイプの社内金利制度においては，貸方側の各資本源泉に異なる金利(資本コスト率)を選択して適用するが，それは，金利を課す対象を自由に選択できることを意味する。この点，社内金利の適用のパターンとしては，図表12-20に示す３つのパターンがあるが，実態調査によれば，社内借入金や社内資本金には金利を課すものの，留保利益には金利を課さない企業が多いとされる。この場合，事業部投下資本の全てに金利を課すことにはならないため，残余利益やＥＶＡなどの業績測定尺度を別建てで計算，利用する企業もある。これは，事業部の心理に配慮しながら，投下資本に対する金利意識を徹底する意図があるものと推測される。","②社内借入金に加えて社内資本金にも金利を課すパターン","③社内借入金と社内資本金に加えて留保利益にも金利を課すパターン","について資本コストを計上しているが，経理担当者の中には「社内借入金，社","内資本金を廃止して，各事業部の投下資本(無利子負債を除いた総資本)に対し","て一律20％の資本コストを課すべきである」と提案する者もいた。この提案は，","事業部長の投資行動に対してどのような影響があるかを説明しなさい。","いる。しかし，事業部純利益の20％を配当見合として本社に上納する方法の方","がよいのではないか」と勧めた。これに対して財務部長は，「社内資本金に社","内資本金コストを課した方が事業部長を意識づける上で効果があるのだ」と力","説した。この効果とはどのような意味だろうか。その含意を書きなさい。"],"f":"p2_12-14.webp","p":""},{"id":"12-15","b":"p2","c":12,"n":15,"t":"多角化企業における業績測定上の留意点","i":"B","y":"B","q":["Ａ社は多角化企業であり，リスクの異なる幾つかの事業を展開している。Ａ社の会社全体の加重平均資本コスト率は８％であるが，対面業界のリスクを考慮した場合，数ある事業部のうち，Ｘ事業部の資本コスト率は５％，Ｙ事業部の資本コスト率は11％と計算される。いま，Ｘ事業部では期待利益率６％の投資案を，Ｙ事業部では期待利益率10％の投資案をそれぞれ検討している。","以上を前提として，多角化企業における投資センターの業績測定に当たって，全社的な加重平均資本コスト率を一律に適用することの問題点を説明しなさい。"],"a":["Ｘ事業部の投資案の期待利益率は６％，対面業界のリスクを考慮した資本コスト率は５％であるから，本来はこの投資案を実行すべきである。また，Ｙ事業部の投資案の期待利益率は10％，対面業界のリスクを考慮した資本コスト率は11％であるから，本来はこの投資案を実行すべきでない。ところが，全社的な加重平均資本コスト率８％を一律に適用すれば，Ｘ事業部の投資案は見送られ，Ｙ事業部の投資案は実行される可能性が高い。","以上のように，多角化企業における投資センターの業績測定に当たって，全社的な加重平均資本コスト率を一律に適用すれば，リスクの相違を無視した誤った資本配分を導く恐れがあるという問題がある。"],"k":["対面業界","リスクの相違","誤った資本配分"],"kg":[{"l":"","w":["対面業界","リスクの相違","誤った資本配分"]}],"e":["補足データ：⑴Ａ社は無借金経営であり，加重平均資本コストは株主資本コストに等しい。⑵株主資本コストの計算には資本資産評価モデル(ＣＡＰＭ)を使用している。","ＣＡＰＭによる株主資本コスト：Ｒｆ＋β(Ｅ(Ｒｍ)－Ｒｆ)⑶安全証券の利子率(Ｒｆ)は２％，Ａ社株式のシステマティック・リスク(β)は１，市場ポートフォリオの期待利益率(Ｅ(Ｒｍ))は８％である。⑷対面業界のリスク係数(β)はＸ事業部が0.5，Ｙ事業部が1.5である。","上記補足データを踏まえて，問題の状況を図示すれば図表12-21のようになる。","なお，本問は各事業部の投資決定行動に与える影響を考慮したものであるが，同じことは本社の投資決定行動についてもいえる。すなわち，本問のＸ事業部の現在の投資利益率が７％であったとすると，対面業界のリスクを考慮した資本コスト率はクリアしているものの，会社全体の加重資本コスト率は下回っているため，これを一律に適用すれば，そのＥＶＡ(残余利益)はマイナスとなる。ただし，それをもってＸ事業部がＡ社の企業価値を破壊しているとはいえないのであって，本社がＸ事業部の縮小や撤退といった意思決定を行うとすれば，それは誤りということになる。","以上より，事業部ごとに対面業界のリスクが異なる場合には，会社全体の加重平均資本コスト率を一律に適用するのではなく，各事業のリスクの相違を反映した差別的資本コスト率を適用するのが望ましいということになる。"],"f":"p2_12-15.webp","p":""},{"id":"12-16","b":"p2","c":12,"n":16,"t":"内部振替価格の設定目的","i":"B","y":"A","q":["事業部間で中間製品等の振替取引がある場合に，内部振替価格を設定する目的を２つあげて説明しなさい。"],"a":["１つは業績測定目的である。すなわち，内部振替高は供給事業部の収益及び受入事業部の費用を構成することから，利益センターとしての各事業部の業績を適切に測定するために，振替価格を設定する。","もう１つは目標整合性目的である。すなわち，事業部長には業務執行活動に関する意思決定権限が委譲されていることから，振替取引にかかわる分権的な意思決定について目標整合性を確保するために，振替価格を設定する。"],"k":["利益センター","業績測定","分権的決定","目標整合性"],"kg":[{"l":"","w":["利益センター","業績測定","分権的決定","目標整合性"]}],"e":["ここでは，内部振替価格の設定目的に加えて，設定基準についても整理してMおく。振替価格の設定基準は，振替製品の市場価格を利用する市価基準と振替製品の原価を利用する原価基準に大別される。このうち，市価基準には，市場価格そのものを使用する単純市価基準と，内部取引において回避可能な販売費を控除する市価差引基準とがある。一方，原価基準には，原価そのもので振り替える狭義の原価基準と，これに一定の利益(マークアップ)を加算する原価プラス基準(原価加算基準)がある。さらに，原価基準におけるコストベースには，全部原価(総原価)・差額原価(変動費)という集計する原価の範囲に基づく区別と，実際原価・標準原価という区別がある(図表12-22)。","なお，後述するように，振替製品に外部市場が存在し，その市価を利用することに合理性が認められるケースにおいては，市価基準の振替価格を用いることによって適切な業績測定が可能であり，目標整合性も確保しうる。しかし，振替製品に外部市場が存在しないか，存在しても市価の利用に合理性が認められないようなケースにおいては，業績測定目的と目標整合性目的の双方に役立つ万能の振替価格の設定基準は存在しない。したがって，そのようなケースにおいては，目的に応じて適切な振替価格の設定基準が異なることになる(図表12-23)。","価(差額原価プラス基準)＋マークアップ(貢献利益)","基全部原価基準振替価格＝振替製品の単位当たり総原価"],"f":"p2_12-16.webp","p":""},{"id":"12-17","b":"p2","c":12,"n":17,"t":"市価基準の振替価格の適用","i":"B","y":"B","q":["事業部間で中間製品等の振替取引があり，振替製品について外部市場が存在する場合，市価基準の振替価格を用いることに合理性が認められるのはどのようなケースか。具体的に説明しなさい。"],"a":["市価基準の振替価格を用いることに合理性が認められるのは，内部振替が外部販売に影響を及ぼすようなケース，すなわち，外部市場の需要が豊富にあり，供給事業部が完全操業状態にあるようなケースである。","このようなケースでは，供給事業部が内部振替を選択すれば，その分だけ外部販売の機会を失うことになる。したがって，内部振替と外部販売を同等に扱うのが業績測定の観点から適切であるし，内部振替に伴う差額原価が振替製品の市価に等しくなるため，目標整合性も確保することができるからである。"],"k":["外部販売の機会","業績測定","目標整合性","差額原価"],"kg":[{"l":"","w":["外部販売の機会","業績測定","目標整合性","差額原価"]}],"e":["市価を利用することに合理性が認められるならば，これを振替価格として用いることが業績測定の観点からも目標整合性の観点からも最も望ましい。問題は，どのような状況をもってその適用の合理性が認められるか，である。外部市場が不完全競争である等の理由を除けば，市況に基づく供給事業部の操業状態との関連で次のようにまとめられる。","ここで，①と②の相違は，供給事業部が内部振替を選択することによって，外部販売の機会を喪失するか否かという点にある。①のケースでは，内部振替を行えばその分だけ外部販売の機会を失うため，振替製品の価値は市価(または市価マイナス回避可能販売諸経費→市価差引基準の振替価格)に等しい。一方，②のケースでは，内部振替を行ったところで外部販売には影響しないのであって，振替製品の価値を市価で評価するのは理論的におかしいということになる。","なお，市価基準の振替価格の適用は，内部取引と外部取引を同一視する(いわば，外部中間製品市場経由で振替が行われる)ことを意味するから，関係事業部に忌避権(外部取引と内部取引の選択権)を認めることが前提となる。この場合，内部取引の選択が価格的に有利であったとしても，相手事業部が忌避権を行使して外部取引を選択するならば，当該事業部も外部取引を選択せざるをえない。したがって，忌避権を認めることによって，取引価格をその時点の市価に自動的に誘導することが可能となる(図表12-24・図表12-25)。"],"f":"p2_12-17.webp","p":""},{"id":"12-18","b":"p2","c":12,"n":18,"t":"原価基準の振替価格の適用⑴","i":"A","y":"B","q":["事業部間の中間製品等の振替取引について，原価基準の振替価格を適用する場合，振替価格はどのような水準に設定するのが望ましいか。①業績測定と②受入事業部の目標整合性の観点から説明しなさい。ただし，コストベースに実際原価と標準原価のいずれを使用するかという点について触れる必要はない。"],"a":["業績測定の観点からすれば，振替取引にかかわる会社全体の差額利益を関係事業部に公平に配分する必要がある。したがって，供給事業部の原価に一定のマークアップを加算して振替価格を設定するのが望ましい。","一方，受入事業部の分権的決定について目標整合性を確保するためには，振替取引にかかわる受入事業部の差額利益と会社全体の差額利益とを一致させればよい。したがって，供給事業部の差額原価を振替価格として設定するのが望ましい。"],"k":["差額利益","公平に配分","原価プラス基準","一致","差額原価基準"],"kg":[{"l":"","w":["差額利益","公平に配分","原価プラス基準","一致","差額原価基準"]}],"e":["簡単な数値例を用いて，原価基準の振替価格の適用について検討する。いま，Ｘ事業部とＹ事業部からなるＡ社について，以下の〔資料〕が得られたものとする。〔資料〕","以上を前提とすると，このオファーを受けた場合には，会社全体の営業利益は{＠12,000－(＠5,000＋＠4,000＋＠1,000)}×100個＝200,000円だけ増加する。したがって，全社的にはこのオファーに応じるべきということになるが，その決定を行うのはＹ事業部である。また，Ｙ事業部がオファーを受ける場合には，Ｘ事業部がＹ事業部に製品Ｘを“販売”することになるため，振替価格の設定が問題となる。各事業部の業績測定上の公平性に配慮しつつ，Ｙ事業部の分権的決定について目標整合性を確保するためには，製品Ｘの振替価格はどのような水準に設定すればよいだろうか。","まず，受入側のＹ事業部の分権的決定について目標整合性を確保するためには，差額原価基準により，製品Ｘの振替価格を＠5,000円に設定するのが最も望ましい。これにより，オファーを受けることによるＹ事業部の差額利益と会社全体の差額利益が一致するからである(図表12-26)。ただし，この場合，供給側のＸ事業部で差額利益がゼロとなるため，業績測定上の公平性を確保することはできず，そのモチベーションを維持することは困難となる。やはり，業績測定の観点からすれば，会社全体の差額利益を関係事業部に公平に配分する必要がある。","そこで，差額利益がプラスでありさえすれば，Ｙ事業部がオファーに応じると仮定すると，振替価格は，＠5,000円から＠7,000円の範囲に設定するということになろう。すなわち，各事業部の業績測定上の公平性に配慮しつつ，受入事業部の分権的決定について目標整合性を確保するためには，中間製品の振替価格は，供給事業部の差額原価を下限とし，最終製品の販売収入から受入事業部の差額原価を控除した額を上限とする範囲に設定すればよい(図表12-27)。","なお，原価基準の振替価格を適用する場合には，業績測定と目標整合性の双方の目的に役立つ万能の振替価格の設定基準は存在しない。そこで，供給事業部では原価プラス基準の振替価格を用いて業績測定上の公平性を確保する一方で，受入事業部では差額原価基準の振替価格で受け入れて目標整合性の確保に役立てるという方法もある(二重価格基準ないし二重価格法)。","外部売上高―＠12,000×100個1,200,000","内部振替高＠5,000×100個＠5,000×100個―","変動費＠5,000×100個＠5,000×100個1,000,000","差額利益0200,000200,000","外部売上高―12,00012,000","内部振替高ＴＴ―","変動費5,0005,00010,000","差額利益Ｔ－5,0007,000－Ｔ2,000"],"f":"p2_12-18.webp","p":""},{"id":"12-19","b":"p2","c":12,"n":19,"t":"原価基準の振替価格の適用⑵","i":"A","y":"A","q":["事業部間の中間製品等の振替取引について，原価基準の振替価格を適用する場合，振替価格のコストベースとして実際原価と標準原価のいずれが望ましいかを，理由を付して説明しなさい。"],"a":["実際原価をコストベースとすれば，受入事業部において管理不能な供給事業部の能率の良否の影響が内部振替高に混入してしまうし，原価プラス基準の振替価格を適用する場合には供給事業部について常に一定の利益を保証することになり，業績測定上の公平性の観点から問題がある。","この点，標準原価をコストベースとすれば，供給事業部の不能率が受入事業部に転嫁されることはないし，供給事業部に対して実際原価を標準原価以下に引き下げることを促すことになるから，原価改善にも資する。","以上より，振替価格のコストベースとしては，実際原価よりも標準原価が望ましい。"],"k":["管理不能","能率の良否の影響","原価プラス基準","利益を保証","原価改善"],"kg":[{"l":"","w":["管理不能","能率の良否の影響","原価プラス基準","利益を保証","原価改善"]}],"e":["一般に，振替価格のコストベースとしては，実際原価ではなく標準原価を使用すべきであるといわれる。実際原価を使用すれば，管理不能な供給事業部の能率の良否の影響が受入事業部に混入してしまうし，原価プラス基準のもとでは供給>事業部のモラルハザードを誘発する危険性があるからである。M","ただし，頻繁に製品仕様の変更が行われたり，製造技術が急速に進歩するような環境のもとでは，標準原価は機動的な価格決定の資料とはなり得ない。したがって，そのようなケースにおいては，実際原価をコストベースとする方がむしろ望ましいとする考えもある。"],"f":"p2_12-19.webp","p":"p2_12-19_past.webp"},{"id":"12-20","b":"p2","c":12,"n":20,"t":"原価基準の振替価格の適用⑶","i":"B","y":"B","q":["事業部間の中間製品等の振替取引について，供給事業部の全部標準原価プラス基準の振替価格を利用する場合，業績測定に当たって留意すべき点を説明しなさい。ただし，供給事業部の実際生産量が予定生産量を下回る状況を想定して論述すること。"],"a":["供給事業部の全部標準原価プラス基準の振替価格を利用する場合，振替価格の設定に当たっては，単位当たりの固定費を計算するために，一定の生産量を予定する必要がある。","ここで，供給事業部の実際生産量が予定生産量を下回る場合には，不利な操業度差異が発生する結果として単位当たりの固定費負担が増加するため，その実際営業利益にマイナスの影響を与えることになる。しかしながら，実際生産量が予定生産量を下回る主たる原因は，販売活動を担う最終製品事業部(販売事業部)にある。したがって，操業度差異の一部を最終製品事業部に配分しなければ，業績測定上の公平性を欠くことに留意すべきである。"],"k":["単位当たり総原価","生産量","操業度差異","最終製品事業部","業績測定上の公平性"],"kg":[{"l":"","w":["単位当たり総原価","生産量","操業度差異","最終製品事業部","業績測定上の公平性"]}],"e":["供給事業部の全部標準原価プラスマークアップで振替価格を設定する場合，振替価格の設定自体は全部原価計算ベースで行うため，実際生産量が予定生産量を下回る状況では，供給事業部において不利な操業度差異が発生する。ただし，事業部別の事後損益計算を直接原価計算によって行う場合には，この操業度差異は表面に現れずに全て供給事業部に帰属し，その業績にマイナスの影響を与えることになる(図表12-28)。結果的に，供給事業部で事前に予定された振替製品単位当たりの固定費や振替価格が過少なものとなってしまい，総額としての固定費の回収に支障が生じることになる。","しかし，供給事業部の実際生産量が予定生産量を下回る原因は，実際販売量の減少にあるのが通常であり，その主たる責任は最終製品事業部にあると考えられる。したがって，業績測定上の公平性を確保するために，操業度差異の一部を最終製品事業部にも負担させるという工夫が必要になる。"],"f":"p2_12-20.webp","p":"p2_12-20_past.webp"},{"id":"12-21","b":"p2","c":12,"n":21,"t":"内部振替価格の決定方式と本社の役割","i":"B","y":"B","q":["内部振替価格の決定方式を２つに大別し，それぞれのケースにおける本社の役割について理由を付して説明しなさい。"],"a":["内部振替価格の決定方式は，本社決定方式と交渉価格方式の２つに大別される。","このうち，本社決定方式においては，本社自体が振替価格の決定権を留保していることから，本社は集権的に振替価格を決定する役割を担う。","一方，交渉価格方式においては，関係事業部に振替価格の決定権が委譲されていることから，その決定問題は基本的には当事者間の交渉に委ねられることになる。しかし，振替価格をどのような水準に設定するかという問題について，供給事業部と受入事業部には完全な対立関係が生じるため，これを当事者間の交渉のみに委ねた場合，全社目標との不整合が生じる恐れがある。したがって，本社は関係事業部を調整し，目標整合性を確保する役割を担う。"],"k":["本社決定方式","交渉価格方式","対立関係","調整"],"kg":[{"l":"","w":["本社決定方式","交渉価格方式","対立関係","調整"]}],"e":["本社決定方式(本部決定方式)と交渉価格方式のいずれが採用されるかは，事業部に対する権限委譲の程度に関連する。ただし，分権的な交渉価格方式を採る場合であっても，振替価格に関する全ての決定問題が当事者間に丸投げされるというわけではない。振替価格は供給事業部からすれば高ければ高いほどよく，受入事業部からすれば低ければ低いほどよいのであって，両者の間には完全な対立関係が生じるからである。したがって，本社による調整が不可欠となり，実質的には三者交渉となる。","なお，ここで重要なことは，分権化は集権化を伴うということであり，分権化が進めば進むほど，もう一方では，部分最適を回避するための本社による調整機能がより重視されることになる。"],"f":"p2_12-21.webp","p":""},{"id":"12-22","b":"p2","c":12,"n":22,"t":"シェアードサービス","i":"B","y":"B","q":["近年，経理や人事などの間接業務の肥大化が問題となっており，1990年代以降の連結経営の浸透にしたがって，シェアードサービスを導入する企業が増加している。シェアードサービスとはどのようなマネジメント手法であるかを説明しなさい。"],"a":["シェアードサービスとは，グループ経営の視点から，社内または企業グループ内で分散して行われている経理や人事などの間接業務を，ある本社部門または子会社に集中し，それが本当に必要な業務であるのか，効率的なプロセスで行われているのか，という視点から業務の見直しを行い，さらに業務を標準化して処理を行うことによって，コスト削減と業務の外販による利益獲得を目的とするマネジメント手法である。"],"k":["間接業務","集中","見直し","標準化","コスト削減"],"kg":[{"l":"","w":["間接業務","集中","見直し","標準化","コスト削減"]}],"e":["間接業務を集中してシェアードサービスを実施する場所をシェアードサービスセンター(SharedServiceCenter；ＳＳＣ)というが，ＳＳＣの基本形態としては図表12-29に示す３つがある。>","このうち，①本社部門方式のＳＳＣ(図表12-30)では，社内の事業部向けのサMービスには取引価格を設定しないのが通常であるし，別法人となる子会社向けのサービスについてもコスト回収目的で取引価格を設定することが多い。したがって，コスト・センターとして管理されるのが通常であり，徹底的な業務改善の誘因が働かないという限界がある。","一方，子会社方式のＳＳＣ(図表12-31)では，独立法人として財務諸表を作成す","ることによってその業績が明確となるし，業務には必ず取引価格が設定されるた","め，コスト低減と業務品質の向上についてＳＳＣの従業員の意識改革が期待でき","る。ただし，会社の存続のために利益を獲得する必要があり，そのためにコスト","を削減しつつ業務品質も向上せねばならず，トレードオフ関係にある両者を両立","させることが求められる。"],"f":"p2_12-22.webp","p":"p2_12-22_past.webp"},{"id":"12-23","b":"p2","c":12,"n":23,"t":"移転価格の設定","i":"B","y":"A","q":["多国籍企業においては，本国と外国との間で商品・製品等の移転取引が生じるが，グループ経営の観点からすれば，多国間の移転価格はどのように設定するのが望ましいといえるか。各国間の税率の違いを念頭に説明しなさい。"],"a":["各国間には税率の違いがあるため，多国籍企業においては，グループ全体で租税負担額が最小となるように移転価格を設定するのが望ましいといえる。","この場合，高税率の国の所得をできるだけ低く抑える工夫が必要であるから，高税率の国から低税率の国への移転取引に関しては，移転価格を低く設定するのが望ましく，逆に，低税率の国から高税率の国への移転取引に関しては，移転価格を高く設定するのが望ましいといえる。"],"k":["税率","グループ全体","租税負担額","最小","移転価格"],"kg":[{"l":"","w":["税率","グループ全体","租税負担額","最小","移転価格"]}],"e":["多国籍企業においては，各国間で税率に違いがあるため，移転価格の操作によってグループ全体として租税負担額を極小化しようとするインセンティブを有する。この場合，高税率(低税率)の国の課税所得をできるだけ少なく(多く)計上する工夫が必要であり，高税率(低税率)の国から低税率(高税率)の国への移転価格は，低く(高く)設定するのが望ましいということになる(図表12-32)。","ただし，各国は，このような多国籍企業の行動に対処し，自国の課税権を確保するために，移転価格税制を創設している。この税制は，自国の法人と国外関連企業間との取引価格が独立企業間価格(arm'slengthprice)から乖離していることにより自国法人の所得が減少していると認められる場合には，当該取引が独立企業間価格で行われたものとみなして課税所得金額を再計算するものであり，移転価格の操作による国際的租税回避への対策税制であるといえる。"],"f":"p2_12-23.webp","p":"p2_12-23_past.webp"},{"id":"12-24","b":"p2","c":12,"n":24,"t":"ＥＢＩＴＤＡの特徴","i":"B","y":"B","q":["ＥＢＩＴＤＡは，多国籍企業や経済環境の異なる企業間の比較に有効な指標であるといわれる。その理由を３つあげなさい。"],"a":["第１の理由は，利払前の利益であることから，各国の金利の相違による利益への影響を排除することができるためである。","第２の理由は，税引前の利益であることから，各国の税率の相違による利益への影響を排除することができるためである。","第３の理由は，償却前の利益であることから，各国の会計基準や減価償却方法の相違による利益への影響を排除することができるためである。"],"k":["利払前","税引前","償却前","金利","税率","会計基準","減価償却方法"],"kg":[{"l":"","w":["利払前","税引前","償却前","金利","税率","会計基準","減価償却方法"]}],"e":["ＥＢＩＴＤＡ(earningsbeforeinterest，taxes，depreciationandamortization)とは，利払前，税引前，償却前の利益であり，簡便的には「営業利益＋減価償却費」として計算される。この指標を用いることで，各国間の金利，税率，減価償却方法の相違の影響を排除しうるため，多国籍企業や経済環境の異なる企業間の比較に有効な指標であるといわれる。","また，ＥＢＩＴＤＡは，マーケット・アプローチの企業価値評価においても，ＥＶ／ＥＢＩＴＤＡ倍率として使用される。ＥＶ／ＥＢＩＴＤＡ倍率とは，ＥＢＩＴＤＡに対するマーケットベースの企業価値ないし事業価値の大きさをいい，lliiill簡易買収率ともいわれる(図表12-33)。","なお，ＥＢＩＴＤＡは，過剰な設備投資をマイナス要因として捉えることができないという限界があり，2002年に経営破綻した米ワールドコムの不正に活用されたことも影響して，積極的に活用された2000年前後と比較して，指標としての評価は急速に低下したといわれる。"],"f":"p2_12-24.webp","p":"p2_12-24_past.webp"}];
const CH={1:"費目別計算・製造間接費",2:"部門別計算・個別原価計算",3:"総合原価計算",4:"標準原価計算",5:"直接原価計算・短期利益計画",6:"予算管理",7:"資金管理とキャッシュ・フロー管理",8:"差額原価収益分析",9:"設備投資の経済性計算",10:"原価管理",11:"ABC/ABM",12:"分権化組織とグループ経営"};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).normalize("NFKC").replace(/[\s　]+/g,"").replace(/[，、,]/g,"").toLowerCase();
let st={mode:"write",chaps:new Set(),imps:new Set(),stat:"all",ord:"seq",queue:[],pos:0,prog:{write:{},cloze:{},flash:{}},search:"",drafts:{},test:null,review:null,when:{write:{},cloze:{},flash:{}},days:{},hist:{write:{},cloze:{},flash:{}},tests:[]};
let savedSess=null;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.prog){st.prog.write=s.prog.write||{};st.prog.cloze=s.prog.cloze||{};st.prog.flash=s.prog.flash||{};if(s.drafts&&typeof s.drafts==="object")st.drafts=s.drafts;if(s.when&&typeof s.when==="object"){st.when.write=s.when.write||{};st.when.cloze=s.when.cloze||{};st.when.flash=s.when.flash||{}}if(s.days&&typeof s.days==="object")st.days=s.days;
if(s.hist&&typeof s.hist==="object"){st.hist.write=s.hist.write||{};st.hist.cloze=s.hist.cloze||{};st.hist.flash=s.hist.flash||{}}
["write","cloze","flash"].forEach(m=>{if(!Object.keys(st.hist[m]).length){Object.keys(st.prog[m]).forEach(id=>{const w=st.when[m][id];st.hist[m][id]=[{g:st.prog[m][id],d:(w&&w.d)?w.d:""}]})}});
if(Array.isArray(s.tests))st.tests=s.tests.filter(x=>x&&typeof x==="object").slice(-20);if(s.sess&&typeof s.sess==="object")savedSess=s.sess;}}catch(e){}
let saveWarned=false;
function save(){try{const sess=((st.test&&st.test.active)||(st.review&&st.review.active))?null:{mode:st.mode,chaps:[...st.chaps],imps:[...st.imps],stat:st.stat,ord:st.ord,search:st.search,queue:st.queue.slice(),pos:st.pos,cur:st.queue[st.pos]||null};localStorage.setItem(KEY,JSON.stringify({prog:st.prog,drafts:st.drafts,when:st.when,days:st.days,hist:st.hist,tests:st.tests,sess}));const w=$("#savewarn");if(w)w.textContent=""}catch(e){const w=$("#savewarn");if(w)w.textContent="⚠ 成績を保存できませんでした（ブラウザの保存容量不足の可能性があります）。バックアップへの書き出しをおすすめします。";saveWarned=true}}
const byId=Object.fromEntries(DATA.map(d=>[d.id,d]));
const isHd=p=>/^[①-⑳][^。]{0,50}$/.test(p);
function kwRe(ks){const a=[...ks].sort((x,y)=>y.length-x.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return a.length?new RegExp("("+a.join("|")+")","g"):null}

/* ---------- queue ---------- */
function prog(id){return st.prog[st.mode==="list"?"write":st.mode][id]||""}
function buildQueue(){
  if(st.test&&st.test.active){st.queue=st.test.ids.slice();if(st.pos>=st.queue.length)st.pos=Math.max(0,st.queue.length-1);$("#fcount").textContent="対象 "+st.queue.length+"問";return}
  if(st.review&&st.review.active){st.queue=st.review.ids.slice();if(st.pos>=st.queue.length)st.pos=Math.max(0,st.queue.length-1);$("#fcount").textContent="対象 "+st.queue.length+"問";return}
  const m=st.mode==="list"?"write":st.mode;
  let q=DATA.filter(d=>(!st.chaps.size||st.chaps.has(d.c))&&(!st.imps.size||st.imps.has(d.i)));
  q=q.filter(d=>{const g=st.prog[m][d.id]||"";return st.stat==="all"||(st.stat==="unseen"&&!g)||(st.stat==="review"&&(g==="t"||g==="x"))||(st.stat==="done"&&g==="o")});
  if(st.ord==="rand"){for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]]}}
  st.queue=q.map(d=>d.id);st.pos=0;
  $("#fcount").textContent="対象 "+q.length+"問";
}
function meter(){
  const m=st.mode==="list"?"write":st.mode;let o=0,t=0,x=0;
  DATA.forEach(d=>{const g=st.prog[m][d.id];if(g==="o")o++;else if(g==="t")t++;else if(g==="x")x++});
  const n=DATA.length;
  $("#meter").innerHTML=`<i class="m-o" style="width:${o/n*100}%"></i><i class="m-t" style="width:${t/n*100}%"></i><i class="m-x" style="width:${x/n*100}%"></i>`;
  $("#stat").textContent=`○${o}  △${t}  ×${x}  未${n-o-t-x}`;
  renderBoard(m);renderHist();
}
function renderHist(){
  const h=$("#histbar");if(!h)return;
  const days=st.days||{};const t=todayStr();
  const todayN=days[t]?Object.keys(days[t]).length:0;
  let streak=0;let cur=t;if(!(days[cur]&&Object.keys(days[cur]).length))cur=addDays(t,-1);
  while(days[cur]&&Object.keys(days[cur]).length){streak++;cur=addDays(cur,-1)}
  const totalDays=Object.keys(days).filter(k=>days[k]&&Object.keys(days[k]).length).length;
  h.textContent=totalDays?`学習記録：今日 ${todayN}問 ・ 連続 ${streak}日 ・ 解答した日 ${totalDays}日`:"";
}
function renderTestHist(){const el=$("#testhist");if(!el)return;const last=st.tests&&st.tests[st.tests.length-1];el.textContent=last?`ミニテスト前回（${last.d.slice(5).replace("-","/")}・${last.mode==="write"?"記述":last.mode==="cloze"?"語句":"カード"} ${last.n}問）：○${last.o} △${last.tt} ×${last.x}${last.u?` 未${last.u}`:""} ・ 実施${st.tests.length}回`:""}
function renderBoard(m){
  const g=$("#bgrid");if(!g)return;
  let h="";
  Object.keys(CH).forEach(c=>{
    const ds=DATA.filter(d=>d.c===+c);const n=ds.length;let o=0,tt=0,x=0;
    ds.forEach(d=>{const v=st.prog[m][d.id];if(v==="o")o++;else if(v==="t")tt++;else if(v==="x")x++});
    const done=o+tt+x;
    const cnt=m2=>{let a=0,b=0,c2=0;ds.forEach(d=>{const v=st.prog[m2][d.id];if(v==="o")a++;else if(v==="t")b++;else if(v==="x")c2++});return `○${a} △${b} ×${c2}`};
    h+=`<button class="brow" data-c="${c}"><span class="bc">第${c}章 ${esc(CH[c])}</span><span class="bp">○${o} △${tt} ×${x} 未${n-done}（解答済み ${n?Math.round(done/n*100):0}%）</span><span class="bpall">記述 ${cnt("write")} ・ 語句 ${cnt("cloze")} ・ カード ${cnt("flash")}</span><span class="bbar"><i class="m-o" style="width:${n?o/n*100:0}%"></i><i class="m-t" style="width:${n?tt/n*100:0}%"></i><i class="m-x" style="width:${n?x/n*100:0}%"></i></span></button>`;
  });

}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){const[a,b,c]=s.split("-").map(Number);const d=new Date(a,b-1,c+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function noteGrade(m,id,g){const t=todayStr();st.when[m][id]={g,d:t};const h=(st.hist[m][id]=st.hist[m][id]||[]);h.push({g,d:t});if(h.length>8)h.splice(0,h.length-8);(st.days[t]=st.days[t]||{})[(m==="write"?"w":m==="cloze"?"c":"f")+":"+id]=1}
function setGrade(id,g){const m=st.mode==="list"?"write":st.mode;if(st.prog[m][id]===g){const h=st.hist[m][id]||[];h.pop();if(h.length){const last=h[h.length-1];st.prog[m][id]=last.g;if(last.d)st.when[m][id]={g:last.g,d:last.d};else delete st.when[m][id]}else{delete st.prog[m][id];delete st.when[m][id];delete st.hist[m][id]}}else{st.prog[m][id]=g;noteGrade(m,id,g)}save();meter();renderTestbar();renderReviewbar();}

/* ---------- cloze mode ---------- */
function clozeModel(d){
  const re=kwRe(d.k);const order=[];const segs=[];
  d.a.forEach(p=>{
    const parts=re?p.split(re):[p];const row=[];
    parts.forEach((s,i)=>{ if(i%2===1){let idx=order.indexOf(s);let first=false;if(idx<0){order.push(s);idx=order.length-1;first=true}row.push({k:idx,first,len:s.length})}else if(s)row.push({s})});
    segs.push({hd:isHd(p),row});
  });
  const rest=d.k.filter(k=>!order.includes(k));
  return {order,segs,rest};
}
function renderCloze(d){
  const M=clozeModel(d);const circ=i=>i<20?String.fromCharCode(0x2460+i):"("+(i+1)+")";

    if(c.s!==undefined)return esc(c.s);
    const w=M.order[c.k];
    return c.first?`<span class="bl" data-k="${c.k}"><span class="no">${circ(c.k)}</span><input type="text" id="b${c.k}" size="${Math.max(3,Math.min(c.len+1,24))}" autocomplete="off" aria-label="空欄${c.k+1}"></span>`:`<span class="rf" data-r="${c.k}">${circ(c.k)}</span>`;
  }).join("")+`</p>`).join("");
  const ex=M.rest.length?`<div class="sec"><h3>解答文に出てこないキーワード(${M.rest.length}個・順不同)</h3><div class="extras">${M.rest.map((r,i)=>`<span class="bl" data-e="${i}"><input type="text" id="e${i}" size="14" autocomplete="off" aria-label="追加キーワード${i+1}"></span>`).join("")}</div></div>`:"";
  $("#main").innerHTML=`<div class="card">${head(d)}${qbox(d)}
  <div class="sec"><h3>模範解答の穴埋め(空欄 ${M.order.length}${M.rest.length?" + 追加 "+M.rest.length:""})</h3><div class="cloze">${body}</div>${ex}
  <p class="hint">キーワードが空欄になっています。同じ番号の語は2回目以降「${circ(0)}」の記号で示します。Enterで判定します。</p></div>
  <div class="actions"><button class="btn primary" id="chk">判定する</button><button class="btn" id="rev">答えを見る</button><button class="btn" id="rst">やり直す</button></div>
  <div id="res"></div><div id="reveal"></div></div>${nav()}`;
  bindNav();
  const inputs=[...document.querySelectorAll(".cloze input,.extras input")];
  inputs.forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();$("#chk").click()}}));
  const reveal=()=>{
    if($("#reveal").innerHTML)return;

  };
  $("#chk").onclick=()=>{
    let ok=0;const total=M.order.length+M.rest.length;
    M.order.forEach((w,k)=>{const b=document.querySelector(`.bl[data-k="${k}"]`);const v=$("#b"+k).value;const good=norm(v)===norm(w);b.classList.toggle("ok",good);b.classList.toggle("ng",!good&&v!=="");if(good)ok++;
      const old=b.querySelector(".ans");if(old)old.remove();if(!good&&v!==""){const a=document.createElement("span");a.className="ans";a.textContent="→"+w;b.appendChild(a)}});
    const pool=[...M.rest];
    M.rest.forEach((_,i)=>{const b=document.querySelector(`.bl[data-e="${i}"]`);const v=norm($("#e"+i).value);const j=pool.findIndex(w=>norm(w)===v);const good=v!==""&&j>=0;if(good){pool.splice(j,1);ok++}b.classList.toggle("ok",good);b.classList.toggle("ng",!good&&v!=="")});
    const r=total?ok/total:1;

    reveal();
    if(!st.prog.cloze[d.id]){st.prog.cloze[d.id]=r===1?"o":r>=.5?"t":"x";noteGrade("cloze",d.id,st.prog.cloze[d.id]);save();meter();renderTestbar();renderReviewbar();document.querySelectorAll(".grade .btn").forEach(x=>x.setAttribute("aria-pressed",String(prog(d.id)===x.dataset.g)))}

/* ---------- main ---------- */
function dueList(m){
  const t=todayStr();const out=[];
  DATA.forEach(d=>{const g=st.prog[m][d.id];if(!g)return;const h=(st.hist[m]&&st.hist[m][d.id])||[];const last=h[h.length-1];let due;
    if(last&&last.d){let n=1;if(last.g==="t")n=3;else if(last.g==="o"){let s=0;for(let i=h.length-1;i>=0;i--){if(h[i].g==="o")s++;else break}n=s>=3?30:s===2?14:7}due=addDays(last.d,n)}
    else{const w=st.when[m][d.id];due=(!w||!w.d)?t:addDays(w.d,g==="x"?1:g==="t"?3:7)}
    if(due<=t)out.push({id:d.id,due})});
  out.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  return out.map(o=>o.id);
}
function startReview(m){
  const ids=dueList(m);if(!ids.length)return;

}

function renderTestbar(){

function showTestResult(){

  const rows=T.ids.map(id=>{const d=byId[id];const gv=st.prog[T.mode][id]||"";if(gv==="o")o++;else if(gv==="t")tt++;else if(gv==="x")x++;else u++;
    return `<button class="sumrow" data-id="${id}"><span class="no">${esc(id)}</span><span class="t">${esc(d.t)}</span><span class="dot ${gv}">${gv?{o:"○",t:"△",x:"×"}[gv]:"未"}</span></button>`}).join("");
  if(!T.recorded){T.recorded=true;st.tests.push({d:todayStr(),mode:T.mode,n:T.ids.length,o,tt,x,u});if(st.tests.length>20)st.tests.splice(0,st.tests.length-20);save();renderTestHist()}

  document.querySelectorAll(".sumrow").forEach(b=>b.onclick=()=>{const id=b.dataset.id;st.test=null;setMode(T.mode);st.chaps=new Set();st.imps=new Set();st.stat="all";st.ord="seq";syncFilters();buildQueue();st.pos=st.queue.indexOf(id);render();scrollTop()});
  $("#tagain").onclick=()=>startTest();
  $("#tback").onclick=()=>{st.test=null;buildQueue();render();scrollTop()};

function startTest(){
  st.review=null;
  const scope=DATA.filter(d=>(!st.chaps.size||st.chaps.has(d.c))&&(!st.imps.size||st.imps.has(d.i)));
  if(!scope.length){alert("対象の問題がありません。絞り込みを変更してください。");return}
  const pool=scope.slice();const ids=[];
  const n=Math.min(10,pool.length);
  const m0=["write","cloze","flash"].includes(st.mode)?st.mode:"write";const dueSet=new Set(dueList(m0));
  const wgt=d=>{let w=1;const g=st.prog[m0][d.id];if(!g)w+=3;else if(g==="x")w+=4;else if(g==="t")w+=3;if(dueSet.has(d.id))w+=3;if(d.i==="A")w+=2;else if(d.i==="B")w+=1;return w};
  for(let i=0;i<n;i++){let tot=0;pool.forEach(d=>tot+=wgt(d));let r=Math.random()*tot,idx=0;for(let j=0;j<pool.length;j++){r-=wgt(pool[j]);if(r<=0){idx=j;break}}ids.push(pool.splice(idx,1)[0].id)}
  const mode=["write","cloze","flash"].includes(st.mode)?st.mode:"write";
  st.test={active:true,ids,mode};setMode(mode);st.queue=ids.slice();st.pos=0;render();scrollTop();
}
function render(){

  const id=st.queue[st.pos];
  if(!id){$("#main").innerHTML=`<div class="card empty">この条件に合う問題がありません。絞り込みを変更してください。</div>`;return}
  const d=byId[id];
  st.mode==="write"?renderWrite(d):st.mode==="flash"?renderFlash(d):renderCloze(d);
  save();
}
function setMode(m){st.mode=m;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.m===m)))}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{st.test=null;st.review=null;setMode(t.dataset.m);buildQueue();render();});
function syncFilters(){
  document.querySelectorAll("#fchap .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.c==="all"?!st.chaps.size:st.chaps.has(+c.dataset.c))));
  document.querySelectorAll("#fimp .chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.i==="all"?!st.imps.size:st.imps.has(c.dataset.i))));
  $("#fstat").value=st.stat;$("#ford").value=st.ord;
}
function initFilters(){
  $("#fchap").innerHTML=`<button class="chip" data-c="all">全章</button>`+Object.keys(CH).map(c=>`<button class="chip" data-c="${c}" title="${esc(CH[c])}">第${c}章</button>`).join("");
  $("#fimp").innerHTML=`<button class="chip" data-i="all">全て</button>`+["A","B","C"].map(i=>`<button class="chip" data-i="${i}">${i}</button>`).join("");
  document.querySelectorAll("#fchap .chip").forEach(c=>c.onclick=()=>{const v=c.dataset.c;if(v==="all")st.chaps.clear();else{const n=+v;st.chaps.has(n)?st.chaps.delete(n):st.chaps.add(n)}syncFilters();buildQueue();render()});
  document.querySelectorAll("#fimp .chip").forEach(c=>c.onclick=()=>{const v=c.dataset.i;if(v==="all")st.imps.clear();else st.imps.has(v)?st.imps.delete(v):st.imps.add(v);syncFilters();buildQueue();render()});
  $("#fstat").onchange=e=>{st.stat=e.target.value;buildQueue();render()};
  $("#ford").onchange=e=>{st.ord=e.target.value;buildQueue();render()};
}

/* ---------- image zoom ---------- */
function openZoom(src){
  const o=document.createElement("div");o.id="lb";o.setAttribute("role","dialog");o.setAttribute("aria-label","画像の拡大表示");
  o.innerHTML=`<div class="lbbar"><span>ドラッグで移動</span><span style="display:flex;gap:6px"><button class="btn" id="lbw">全体を表示</button> <button class="btn" id="lbx">閉じる</button></span></div><div class="lbscroll"><img alt="" src="${src}"></div>`;
  document.body.appendChild(o);
  const img=o.querySelector("img");let fit=false;
  const close=()=>{o.remove();document.removeEventListener("keydown",key)};
  const key=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",key);
  o.querySelector("#lbx").onclick=close;
  o.querySelector("#lbw").onclick=()=>{fit=!fit;img.style.width=fit?"calc(100vw - 16px)":"";o.querySelector("#lbw").textContent=fit?"大きく表示":"全体を表示"};
  o.querySelector(".lbscroll").onclick=e=>{if(e.target===e.currentTarget)close()};
}
document.addEventListener("click",e=>{const i=e.target.closest(".flow img,.past img");if(!i)return;if(!i.getAttribute("src")){loadImgs();return}openZoom(i.src)});
$("#shuf").onclick=()=>{st.ord="rand";syncFilters();buildQueue();render();scrollTop()};
$("#test").onclick=()=>startTest();
$("#exp").onclick=()=>{
  const payload={app:"kanri-ichimon",version:2,exportedAt:new Date().toISOString(),prog:st.prog,drafts:st.drafts,when:st.when,days:st.days,hist:st.hist,tests:st.tests};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:"application/json"}));a.download="kanri-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
const impf=$("#impf");
$("#imp").onclick=()=>impf.click();
impf.onchange=()=>{
  const f=impf.files&&impf.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(String(r.result));
    if(!s||typeof s.prog!=="object"||!s.prog){alert("読み込めませんでした：成績データの形式が違うようです。");return}
    const clean={write:{},cloze:{},flash:{}};
    ["write","cloze","flash"].forEach(m=>{const src=s.prog[m]||{};Object.keys(src).forEach(id=>{if(byId[id]&&["o","t","x"].includes(src[id]))clean[m][id]=src[id]})});
    const dc={};if(s.drafts&&typeof s.drafts==="object")Object.keys(s.drafts).forEach(id=>{if(byId[id]&&typeof s.drafts[id]==="string")dc[id]=s.drafts[id].slice(0,20000)});
    const cleanWhen={write:{},cloze:{},flash:{}};if(s.when&&typeof s.when==="object")["write","cloze","flash"].forEach(m=>{const src=s.when[m]||{};Object.keys(src).forEach(id=>{const v=src[id];if(byId[id]&&v&&["o","t","x"].includes(v.g)&&/^\d{4}-\d{2}-\d{2}$/.test(v.d||""))cleanWhen[m][id]={g:v.g,d:v.d}})});
    const cleanDays={};if(s.days&&typeof s.days==="object")Object.keys(s.days).forEach(dy=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(dy))return;const src=s.days[dy]||{};const o={};Object.keys(src).forEach(k=>{const mm=k.match(/^([wcf]):(.+)$/);if(mm&&byId[mm[2]])o[k]=1});if(Object.keys(o).length)cleanDays[dy]=o});
    const cleanHist={write:{},cloze:{},flash:{}};
    if(s.hist&&typeof s.hist==="object")["write","cloze","flash"].forEach(m=>{const src=s.hist[m]||{};Object.keys(src).forEach(id=>{if(!byId[id]||!Array.isArray(src[id]))return;const arr=src[id].filter(e=>e&&["o","t","x"].includes(e.g)).map(e=>({g:e.g,d:/^\d{4}-\d{2}-\d{2}$/.test(e.d||"")?e.d:""})).slice(-8);if(arr.length)cleanHist[m][id]=arr})});
    ["write","cloze","flash"].forEach(m=>{Object.keys(clean[m]).forEach(id=>{if(!cleanHist[m][id]){const w=cleanWhen[m][id];cleanHist[m][id]=[{g:clean[m][id],d:w?w.d:""}]}})});
    const cleanTests=Array.isArray(s.tests)?s.tests.filter(x=>x&&["write","cloze","flash"].includes(x.mode)&&/^\d{4}-\d{2}-\d{2}$/.test(x.d||"")).slice(-20):[];
    const cnt=Object.keys(clean.write).length+Object.keys(clean.cloze).length+Object.keys(clean.flash).length;
    if(!confirm(`成績 ${cnt}件を読み込んで、今の成績に上書きします。よろしいですか？`))return;
    st.prog=clean;st.drafts=dc;st.when=cleanWhen;st.days=cleanDays;st.hist=cleanHist;st.tests=cleanTests;st.test=null;st.review=null;save();buildQueue();render();renderTestHist();alert("読み込みました。");
  }catch(e){alert("読み込めませんでした：ファイルが壊れているようです。")}};
  r.readAsText(f);impf.value="";
};
$("#total").textContent=DATA.length;renderTestHist();
initFilters();
if(savedSess){
  if(["write","cloze","flash","list"].includes(savedSess.mode))st.mode=savedSess.mode;
  if(Array.isArray(savedSess.chaps))st.chaps=new Set(savedSess.chaps.filter(c=>CH[c]));
  if(Array.isArray(savedSess.imps))st.imps=new Set(savedSess.imps.filter(i=>["A","B","C"].includes(i)));
  if(["all","unseen","review","done"].includes(savedSess.stat))st.stat=savedSess.stat;
  if(["seq","rand"].includes(savedSess.ord))st.ord=savedSess.ord;
  if(typeof savedSess.search==="string")st.search=savedSess.search;
  setMode(st.mode);syncFilters();
  const q=savedSess.queue;
  if(Array.isArray(q)&&q.length&&q.every(id=>byId[id])){st.queue=q.slice();st.pos=Math.min(Math.max(0,savedSess.pos|0),q.length-1);$("#fcount").textContent="対象 "+q.length+"問"}
  else{buildQueue();if(savedSess.cur&&st.queue.includes(savedSess.cur))st.pos=st.queue.indexOf(savedSess.cur)}
  render();
}else{syncFilters();buildQueue();render();}
</script>

</body></html>
