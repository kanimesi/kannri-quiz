<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>管理会計論 論文対策集 一問一答</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<style>
/* Layout: sticky mode bar on top, filter drawer, one large question card at a time (reading width ~760px). */
:root{
  --bg:#fdf3e7; --surface:#ffffff; --surface2:#ffedd5; --ink:#2b2118; --muted:#7d6a58; --line:#eedcbd;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#ffedd5;
  --mark:#ffe1a1; --blank:#fff6d6; --blank-line:#d97706;
  --ok:#1b7a4b; --ok-soft:#dff3e8; --warn:#9a6700; --warn-soft:#fff1d0; --bad:#b0362e; --bad-soft:#fbe3e0;
  --f-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif;
  --f-doc:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif CJK JP","Yu Mincho",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d130a; --surface:#2b1d10; --surface2:#3d2b16; --ink:#f7ead7; --muted:#c9ab8d; --line:#4e3a24;
  --accent:#fb923c; --accent-ink:#2b1703; --accent-soft:#472a0d;
  --mark:#6e4a10; --blank:#3a3314; --blank-line:#d97706;
  --ok:#59c58c; --ok-soft:#173526; --warn:#e0b44f; --warn-soft:#3b2f10; --bad:#f08077; --bad-soft:#42201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d130a; --surface:#2b1d10; --surface2:#3d2b16; --ink:#f7ead7; --muted:#c9ab8d; --line:#4e3a24;
  --accent:#fb923c; --accent-ink:#2b1703; --accent-soft:#472a0d;
  --mark:#6e4a10; --blank:#3a3314; --blank-line:#d97706;
  --ok:#59c58c; --ok-soft:#173526; --warn:#e0b44f; --warn-soft:#3b2f10; --bad:#f08077; --bad-soft:#42201d; color-scheme:dark}
.brow .bpall{grid-column:1/-1;display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#savewarn{color:var(--bad);font-weight:700;font-size:13px;margin-top:6px}
#savewarn:empty{display:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto}
header.top{z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
header.top{position:sticky;top:env(safe-area-inset-top,0px)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}@media (max-width:699px){.brand h1{font-size:16px}.tab{padding:5px 10px;font-size:13px}.tab .sub{display:none}}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-doc);font-size:19px;margin:0;letter-spacing:.02em}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:8px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .sub{display:block;font-weight:400;font-size:11px;opacity:.8;line-height:1.3}
.bar{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.meter{flex:1 1 180px;min-width:140px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.m-o{background:var(--ok)} .m-t{background:var(--blank-line)} .m-x{background:var(--bad)}
.stat{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;color:var(--accent);padding:2px 4px;font-weight:700;font-size:13px}
details.filters{margin-top:8px}
details.filters>summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);list-style:none}
details.filters>summary::-webkit-details-marker{display:none}
.fgrid{display:grid;gap:10px;margin-top:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow .lab{font-size:12px;color:var(--muted);width:56px;flex:none}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:12.5px;line-height:1.6}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
main{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 20px}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pid{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.badge{border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:11.5px;line-height:1.6}
.badge.hi{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}
h2.ptitle{font-family:var(--f-doc);font-size:20px;line-height:1.5;margin:6px 0 12px;text-wrap:balance}
.qtext{font-family:var(--f-doc);font-size:16.5px;line-height:1.95;background:var(--surface2);border-radius:8px;padding:12px 14px}
.qtext p,.doc p{margin:0 0 .6em}.qtext p:last-child,.doc p:last-child{margin:0}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 6px;letter-spacing:.04em}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-doc);font-size:15.5px;line-height:1.8}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 16px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.sec{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.sec h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--accent)}
.doc{font-family:var(--f-doc);font-size:16px;line-height:1.95}
.doc .hd{font-weight:700;margin-top:.9em}
.doc p{text-indent:1em}.doc p.hd{text-indent:0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.kwchips{display:flex;flex-wrap:wrap;gap:6px}
.kc{border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:14px;background:var(--surface2)}
.kc.hit{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.kc.miss{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.kg{margin:0 0 6px;font-size:12px;color:var(--muted)}
.flow img,.past img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
details.sec>summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);letter-spacing:.06em}
.grade{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.grade .btn[data-g="o"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.grade .btn[data-g="t"][aria-pressed="true"]{background:var(--blank-line);border-color:var(--blank-line);color:#1b1500}
.grade .btn[data-g="x"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;align-items:center}
.nav .pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* cloze */
.cloze{font-family:var(--f-doc);font-size:16px;line-height:2.5}
.cloze p{margin:0 0 .5em;text-indent:1em}.cloze p.hd{text-indent:0;font-weight:700}
.bl{display:inline-flex;align-items:baseline;gap:2px;margin:0 2px;vertical-align:baseline}
.bl .no{font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--blank-line)}
.bl input{font-family:var(--f-doc);font-size:15px;border:0;border-bottom:2px solid var(--blank-line);background:var(--blank);padding:0 4px;text-align:center;border-radius:3px 3px 0 0;min-width:3em;max-width:100%}
.bl.ok input{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bl.ng input{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bl .ans{font-family:var(--f-doc);font-size:14px;color:var(--ok);font-weight:700}
.rf{font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--blank-line);border-bottom:2px dotted var(--blank-line);padding:0 3px;margin:0 2px}
.extras{display:grid;gap:8px;margin-top:6px}
.extras .bl input{min-width:9em}
.result{margin-top:12px;padding:10px 14px;border-radius:8px;font-weight:700;background:var(--surface2)}
.result.good{background:var(--ok-soft);color:var(--ok)} .result.mid{background:var(--warn-soft);color:var(--warn)} .result.low{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
/* list */
.search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lchap{margin:18px 0 6px;font-family:var(--f-doc);font-size:16px;font-weight:700}
.lrow{display:grid;grid-template-columns:3.6em 1fr auto auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:5px}
.lrow:hover{border-color:var(--accent)}
.lrow .t{min-width:0;overflow-wrap:anywhere;font-size:14px}
.lrow .no{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.dot{display:inline-block;width:1.7em;text-align:center;border-radius:4px;font-size:11px;font-weight:700;line-height:1.6;background:var(--surface2);color:var(--muted)}
.dot.o{background:var(--ok-soft);color:var(--ok)}.dot.t{background:var(--warn-soft);color:var(--warn)}.dot.x{background:var(--bad-soft);color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.8}
@media (max-width:520px){.card{padding:14px 12px 16px}.lrow{grid-template-columns:3.2em 1fr auto}.lrow .d2{display:none}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}

@media (max-width:600px){
  body{font-size:16px;padding-block:0 8px}
  header.top{padding:8px 0 6px}
  .brand small{display:none}.brand h1{font-size:16.5px}
  .tabs{flex-wrap:nowrap;gap:5px;margin-top:6px}
  .tab{flex:1 1 0;padding:7px 4px;text-align:center;font-size:14px;min-width:0}
  .tab .sub{display:none}
  .bar{margin-top:6px;gap:6px 8px}.meter{flex:1 1 100%}.stat{flex:1}#shuf{min-height:36px!important;padding:4px 14px!important}
  .chip{padding:5px 13px;font-size:14px}
  .frow .lab{width:100%}
  select{font-size:16px;padding:6px 8px}
  textarea,.bl input,.search{font-size:16px}
  .qtext{font-size:16px;padding:10px 12px}
  h2.ptitle{font-size:18.5px}
  .doc,.cloze{font-size:16px}
  .btn{padding:10px 16px;min-height:44px}
  .grade .btn{flex:1 1 30%;padding:10px 6px}
  .actions .btn{flex:1 1 auto}
  .nav{position:sticky;bottom:0;z-index:4;background:var(--bg);margin:12px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
  .nav .btn{min-width:96px}
  main{margin-top:12px}
  .lrow{padding:10px}
}
.zoomable{cursor:zoom-in}
.zhint{font-size:12px;color:var(--muted);margin:6px 0 0}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.92);display:flex;flex-direction:column}
#lb .lbbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;padding-top:calc(10px + env(safe-area-inset-top,0px));color:#f7ead7;font-size:13px}
#lb .lbbar .btn{background:#f7ead7;color:#1d130a;border-color:#f7ead7;min-height:40px;padding:6px 12px;white-space:nowrap}
#lb .lbscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 8px calc(16px + env(safe-area-inset-bottom,0px))}
#lb img{display:block;width:min(860px,max(640px,calc(100vw - 16px)));max-width:none;height:auto;background:#fff;border-radius:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:5px;cursor:pointer}
.brow:hover{border-color:var(--accent)}
.brow .bc{font-weight:700;font-size:13.5px}
.brow .bp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brow .bbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface2);display:flex;overflow:hidden}
.brow .bbar i{display:block;height:100%}
#testbar,#reviewbar{margin-top:10px}
.testcard{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.sumrow{display:grid;grid-template-columns:3.6em 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:5px;cursor:pointer}
</style>

<div class="wrap">
<header class="top">
  <div class="brand"><h1>管理会計論 論文対策集 一問一答</h1><small>理論①②・全<span id="total"></span>問</small></div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-m="write" aria-selected="true">記述問題<span class="sub">答案を書いて照合</span></button>
    <button class="tab" role="tab" data-m="flash" aria-selected="false">カード<span class="sub">タップで答えを表示</span></button>
    <button class="tab" role="tab" data-m="cloze" aria-selected="false">語句問題<span class="sub">解答文の穴埋め</span></button>
    <button class="tab" role="tab" data-m="list" aria-selected="false">一覧・検索<span class="sub">全問題を確認</span></button>
  </div>
  <div class="bar"><div class="meter" id="meter" aria-hidden="true"></div><span class="stat" id="stat"></span><button class="btn" id="shuf" style="padding:3px 12px;font-size:13px">シャッフル</button><button class="btn" id="test" style="padding:3px 12px;font-size:13px">ミニテスト</button></div>
  <div class="stat" id="histbar" style="margin-top:6px"></div>
  <div id="savewarn" role="alert"></div><div class="stat" id="testhist" style="margin-top:2px"></div>
  <details class="filters" id="filters"><summary>出題範囲を絞り込む(<span id="fcount"></span>)</summary>
    <div class="fgrid">
      <div class="frow"><span class="lab">章</span><span id="fchap" class="frow"></span></div>
      <div class="frow"><span class="lab">重要度</span><span id="fimp" class="frow"></span></div>
      <div class="frow"><span class="lab">状態</span>
        <select id="fstat" aria-label="状態"><option value="all">すべて</option><option value="unseen">未回答</option><option value="review">要復習(△・×)</option><option value="done">○のみ</option></select>
        <span class="lab" style="width:auto;margin-left:8px">順序</span>
        <select id="ford" aria-label="順序"><option value="seq">問題番号順</option><option value="rand">ランダム</option></select>
      </div>
    </div>
  </details>
  <details class="filters" id="board"><summary>章ごとの進捗</summary><div class="fgrid"><p class="hint" style="margin:0">各章に記述／語句／カードの成績を併記しています（上の段とバーは今のモード）。章をタップすると、その章だけに絞り込みます。</p><div id="bgrid"></div></div></details>
  <div id="testbar"></div>
  <div id="reviewbar"></div>
</header>
<main id="main"></main>
<p class="foot">出典:管理会計論 論文対策集−理論①②(2026年目標)。問題文・解答・キーワード・ロジカルフローを収録し、解説は本文のみ、図表・表は省略しています。成績はこのブラウザに保存されます。<br><button class="linkbtn" id="exp">成績を書き出す（バックアップ）</button>／<button class="linkbtn" id="imp">成績を読み込む</button><input type="file" id="impf" accept="application/json,.json" hidden></p>

<script>
let IMGS=null,imgsLoading=false;
function loadImgs(){if(IMGS||imgsLoading)return;imgsLoading=true;const s=document.createElement("script");s.src="imgs.js";s.onload=()=>{IMGS=window.IMGS||{};imgsLoading=false;applyImgs()};s.onerror=()=>{imgsLoading=false};document.head.appendChild(s)}
function applyImgs(){if(!IMGS)return;document.querySelectorAll("img[data-f]").forEach(im=>{const v=IMGS[im.dataset.f];if(v&&!im.getAttribute("src")){im.src=v;const z=im.closest(".flow,.past")?.querySelector(".zhint");if(z)z.textContent="画像をタップすると拡大します"}})}
const DATA=[{"id":"1-1","b":"p1","c":1,"n":1,"t":"購入原価に算入する材料副費の範囲","i":"C","y":"A","q":["材料副費を２つに分類し，材料の購入原価に算入する材料副費の範囲について，我が国の「原価計算基準」に準拠して説明しなさい。"],"a":["材料副費は，企業外部で発生する引取費用(外部材料副費)と，企業内部で発生する内部材料副費とに分類される。","我が国の「原価計算基準」によれば，材料副費のうち，引取費用は必ず購入原価に算入するが，内部材料副費の一部又は全部については，購入原価への不算入が認められる。"],"k":["購入代価","引取費用","内部材料副費"],"kg":[{"l":"","w":["購入代価","引取費用","内部材料副費"]}],"e":["材料の購入原価の構成要素としては，材料正味の値段である購入代価(＝送り状記載価額：材料主費)の他に，付随費用としての材料副費があり，材料副費はさらに，材料が納入されるまでに企業外部で発生する引取費用と，材料が納入されてから出庫可能な状態となるまでに企業内部で発生する内部材料副費からなる(図表１-１)。","伝統的な理論では，材料を出庫可能な状態にするまでに要した材料関係の原価は，これを全て購入原価に算入すべきであるとされてきた。しかしながら，「原価計算基準」では，内部材料副費については，購入原価に算入することが困難なものや，購入原価よりもむしろ消費原価(材料費)に算入すべきものが含まれているという認識のもとに，その一部又は全部を購入原価に算入しない処理を認めている(図表１-２)。","なお，購入原価に算入する材料副費の一部又は全部は，予定配賦率をもって計算することが認められている。","選択中間購入原価＝購入代価＋引取費用＋内部副費の一部"],"f":"p1_1-1.webp","p":""},{"id":"1-2","b":"p1","c":1,"n":2,"t":"購入原価に算入しない材料副費の処理","i":"C","y":"B","q":["材料の購入原価に内部材料副費を含めないことが認められる理由を２つあげ，それぞれに対応して認められる原価計算上の処理を，我が国の「原価計算基準」に準拠して説明しなさい。"],"a":["第１の理由は，内部材料副費の中には，材料倉庫の減価償却費のように，特定材料に合理的に跡付けることが困難な費用が含まれており，それらを購入原価に算入すれば，計算が恣意的となって問題があるからである。そこで，購入原価に算入しない材料副費について，間接経費に属する項目として処理することが認められている。","第２の理由は，内部材料副費の中には，整理費，手入費，保管費などのように，材料検収後(入庫後)に発生する費用が含まれており，それらは購入材料よりもむしろ出庫材料に関連する性質のものだからである。そこで，購入原価に算入しない材料副費について，材料費に配賦するという処理が認められている。"],"k":["特定材料","恣意的","間接経費","検収後(入庫後)","出庫材料","材料費"],"kg":[{"l":"","w":["特定材料","恣意的","間接経費","検収後(入庫後)","出庫材料","材料費"]}],"e":["内部材料副費を間接経費として処理するのは，特定材料に跡付けることが困難Mである以上，工場全体のコスト(製造間接費)として認識するのが妥当であるとの考えに基づくものである。この場合，内部材料副費は，他の製造間接費とともに，直接作業時間等の配賦基準を用いて製品に配賦されることになる。","一方，内部材料副費を材料費に配賦するのは，全ての材料副費を購入原価に算入すれば，未発生の材料副費(内部副費中の倉庫部費)を手持材料の原価に算入することになって望ましくないという考えに基づくものである(図表１-３)。この場合，内部材料副費は，把握された直接材料費または間接材料費に対して一定の予定率を乗じて配賦額を計算し，仕掛品または製造間接費勘定に集計されることになる。"],"f":"p1_1-2.webp","p":""},{"id":"1-3","b":"p1","c":1,"n":3,"t":"継続記録法のメリット","i":"B","y":"A","q":["材料の実際消費量の計算方法には継続記録法と棚卸計算法があるが，継続記録法のメリットについて，棚卸計算法と比較して説明しなさい。"],"a":["棚卸計算法では，払出記録を行わず，受入記録と期末における実地棚卸を行うのみであるのに対し，継続記録法では，材料を払い出すごとに出庫票に基づいて払出記録を行い，絶えず帳簿残高を明らかにする。その結果，実地棚卸によって明らかになった実際残高との比較において棚卸減耗を把握し，保管担当者の責任を問うことにより，棚卸計算法では不可能な材料の会計管理が可能になるというメリットがある。"],"k":["払出記録","帳簿残高","実地棚卸","棚卸減耗","会計管理"],"kg":[{"l":"","w":["払出記録","帳簿残高","実地棚卸","棚卸減耗","会計管理"]}],"e":["「原価計算基準」では，材料費の計算方法について，直接材料か間接材料かではなく，金額的重要性に基づいて区別する立場を採っている。つまり，金額的重要性が高く，出入記録(受払記録)を行う材料(主要材料，買入部品，補助材料)に関する原価は，実際消費量に消費価格を乗じて計算するのに対し，金額的重要性が低い材料(工場消耗品，消耗工具器具備品等)については，出入記録(受払記録)そのものが省略されるため，原則として当該原価計算期間における買入額をもって材料消費額を計算することになる。","ここで，実際消費量に消費価格を乗じて材料費を計算する場合，実際消費量の計算方法には継続記録法と棚卸計算法がある。このうち，継続記録法が出庫票に基づいて材料消費量を把握し，絶えず帳簿残高を明らかにする方法であるのに対し，棚卸計算法では「月初有高＋当月購入高－月末実際有高」によって材料消費量を把握する。したがって，棚卸計算法によれば，継続記録法と比べて記帳事務が簡略化される反面，把握される材料消費量は，実際消費量というよりも推定消費量に過ぎず，盗難材料や棚卸減耗分の材料も実際消費量としてカウントされてしまうことになる(図表１-４)。そこで，正確な実際消費量の把握や材料の会計管理という観点からすれば，原則として継続記録法を適用すべきであり，棚卸計算法の適用は，継続記録法の適用が困難なもの又はその必要のないものに限定される。","なお，解答では指摘していないが，棚卸計算法に対する継続記録法のメリットとしては，払出の目的・用途別の測定が可能であるという点も挙げられる。"],"f":"p1_1-3.webp","p":"p1_1-3_past.webp"},{"id":"1-4","b":"p1","c":1,"n":4,"t":"個別法の適用","i":"C","y":"C","q":["材料の実際消費価格の計算方法のうち，最も正確な方法として個別法がある。現代の技術環境を踏まえて，個別法の適用可能性と適用対象について検討しなさい。"],"a":["個別法の適用は，従来は手数の点で困難とされてきたが，ＩＴ技術の発展を受けて，近年はその適用可能性が高まっているといえる。","ただし，補助材料を含む多種多様な材料の全てに個別法を適用することは費用対効果の観点から問題があるし，出庫担当者がたまたま手に触れた材料の価格が材料費を決定することから，価格変動下では偶然性が原価計算に混入してしまう。","以上より，個別法の適用対象は，重要かつ価格変動のあまりない材料に限定すべきであるといえる。"],"k":["ＩＴ技術","費用対効果","価格変動","偶然性"],"kg":[{"l":"","w":["ＩＴ技術","費用対効果","価格変動","偶然性"]}],"e":["「原価計算基準」によれば，材料の消費価格は，原則として購入原価(実際購入原価)をもって計算するとされているが，同種材料の購入原価が異なる場合，実際消費価格の計算方法としては，先入先出法と平均法(移動平均法・総平均法)の他に個別法がある(図表１-５)。","このうち，個別法は，仮定計算を伴わないという点で最も正確な方法といえるが，従来は手数の点でほとんど適用不可能であるとされてきた。しかしながら，ＩＴ技術の発展を受け，現在ではバーコードやＩＣチップの利用などによって個別法を適用できる環境が整ってきており，その適用可能性は高まっている。ただし，費用対効果を考慮すれば，個別法の適用は引当材料に限定されるべきであるし，価格変動下では，偶然性を排除するために平均法を適用すべきである。したがって，従来と比べて個別法の適用可能性は高まってはいるものの，その適用対象はあくまでも限定的に捉えられるべきであるといえる。","なお，解答では指摘していないが，個別法の適用による問題点としては，意図的に高価(安価)な材料を出庫することによって，出庫担当者が原価を恣意的に操作する可能性があるという点も挙げられる。"],"f":"p1_1-4.webp","p":""},{"id":"1-5","b":"p1","c":1,"n":5,"t":"費目別計算における予定価格等の適用","i":"B","y":"A","q":["実際原価の費目別計算において，予定価格等を適用することによるメリットと留意点を説明しなさい。"],"a":["メリットは，第１に実際価格の計算を待たずに実際原価の計算が可能であり，製品原価の計算が迅速化されること，第２に実際原価の計算から実際価格の偶然的な変動の影響を排除することが可能であり，製品原価の比較可能性が確保されることである。","一方，留意点は，適用期間における実際価格にできる限り近似させ，価格差異をなるべく僅少にするように予定価格等を定めることである。"],"k":["実際価格","計算の迅速化","偶然的変動","比較可能性の確保","価格差異","僅少"],"kg":[{"l":"","w":["実際価格","計算の迅速化","偶然的変動","比較可能性の確保","価格差異","僅少"]}],"e":["実際原価とは，厳密には実際の取得価格をもって計算した原価の実際発生額をいうが，予定価格等をもって計算しても，消費量が実際であればそれは実際原価の計算であり，理論上は予定価格等を使用する方が望ましいとされる。実際価格を使用すれば，実際価格の計算を待つ結果として製品原価の計算が遅延するし，月々の偶然的な価格変動の影響が製品原価に混入し，その比較可能性が阻害されてしまうからである。","以下の図表１-６は，実際個別原価計算を採用する工場を例にとり，製品原価の比較可能性の観点から，実際価格を用いた場合と予定価格を用いた場合の計算を比較したものである。ここで，＃10と＃20は同量の直接材料を消費しているため，予定価格を使用すれば，それらの直接材料費も等しくなる。このように，偶然的な価格変動の影響を排除し，消費量の多寡のみを示すのが望ましい原価資料である。しかし，実際価格を使用すれば，価格が高騰した６月に着手した＃20の方が直接材料費は高く計算され，あたかも＃20の方が材料を浪費したかのような誤解を与えてしまう。つまり，製品原価の比較可能性が阻害されてしまうのである。","なお，費目別計算において予定価格等を適用する場合には，価格差異をなるべく僅少にすることが求められる。「原価計算基準」が実際原価計算制度における原価差異について，「予定価格等が不適当なため，比較的多額の原価差異が生ずる場合」を例外的ケースとして扱うのは，この価格差異僅少化のルールを前提としている。","実際価格を使用した場合６月分120,000600,000","予定価格を使用した場合６月分100,000500,000"],"f":"p1_1-5.webp","p":"p1_1-5_past.webp"},{"id":"1-6","b":"p1","c":1,"n":6,"t":"予定消費価格と予定受入価格の比較","i":"B","y":"B","q":["我が国の「原価計算基準」によれば，材料の購入原価は，原則として実際の購入原価とするが，必要ある場合には，予定価格等をもって計算することができるとしている。そこで，材料の購入原価を予定価格等をもって計算する場合，消費価格を予定価格等をもって計算する場合と比較して，追加されるメリットを２つあげなさい。"],"a":["第１に，材料元帳は数量記録のみで足りるため，消費価格を予定価格等をもって計算する場合と比べて，記帳を簡略化できる。","第２に，購入材料に関する価格差異をその都度把握するため，消費価格を予定価格等をもって計算する場合と比べて，購買管理に資する情報を提供できる。"],"k":["材料元帳","数量記録","記帳の簡略化","購入材料","価格差異","購買管理"],"kg":[{"l":"","w":["材料元帳","数量記録","記帳の簡略化","購入材料","価格差異","購買管理"]}],"e":["予定消費価格を使用することにより，材料費計算の迅速化が可能となるが，材料元帳において実際消費価格の計算が必要となるため，記帳事務の簡略化を図ることはできない。また，予定消費価格を使用する場合に把握されるのは出庫材料の価格差異であり，これを事後的に一括して算定したところで，購買管理に役立つ情報を入手することはできない。","この点，予定受入価格を使用すれば，材料の受払は全て予定価格で行われるため，材料元帳は数量記録のみで足り，記帳事務が著しく簡略化される。また，購入材料の価格差異をその都度把握するため，仕入先の変更などの購買管理に資する情報をタイムリーに提供することができる。つまり，消費時点で予定価格等を使用するよりも，購入時点で予定価格等を使用する方がより多くのメリットが得られるため，後者の方がより望ましいといえる(図表１-７)。","なお，予定消費価格を使用する場合には，棚卸減耗は実際価格で評価するのが通常であるが，予定受入価格を使用する場合には，棚卸減耗費も予定価格で評価することになる(図表１-７)。","価格差異の内容出庫材料(消費価格差異)購入材料(受入価格差異)【予定消費価格のメリット】","①製品原価の計算の迅速化(実際価格の計算を待たずに計算が可能)","②製品原価の比較可能性の確保(偶然的な価格変動の影響を排除可能)【予定受入価格の追加メリット】>","②購買管理に資する情報提供(購入材料の価格差異をその都度把握)"],"f":"p1_1-6.webp","p":"p1_1-6_past.webp"},{"id":"1-7","b":"p1","c":1,"n":7,"t":"望ましい消費賃率","i":"C","y":"B","q":["直接工の消費賃率は，個別賃率，職種別平均賃率，工場全体の平均賃率(総平均賃率)の３つに分類されるが，原価計算上いずれの消費賃率が最も望ましいかを，理由を付して説明しなさい。"],"a":["個別賃率によれば厳密な計算が可能となるが，計算が極めて煩雑であるし，作業を行う工員によって製品原価が変動することから，原価計算に偶然性が混入してしまうという問題がある。この点，総平均賃率によれば計算は簡略化されるが，職種別の賃率の相違を製品原価に正しく反映することができないため，やはり問題がある。","以上より，経済性や製品原価の比較可能性及び正確性という観点から，職種別平均賃率が最も望ましいといえる。"],"k":["経済性","偶然性","比較可能性","職種別の賃率の相違","正確性"],"kg":[{"l":"","w":["経済性","偶然性","比較可能性","職種別の賃率の相違","正確性"]}],"e":["以下の図表１-８は，実際個別原価計算を採用する工場を例にとり，個別賃率，職種別平均賃率，総平均賃率による計算を比較したものである。ただし，各職種において，工員の熟練度に差異はないものと仮定する。","まず，個別賃率の問題点は，＃10と＃20の計算結果から理解することができる。これらの製品は，各職種の作業を全く同じだけ受けているため，本来であれば，同額の直接労務費が計上されるべきである。ところが，個別賃率によれば，相対的に高賃率の工員(Ｂ及びＤ)が作業を担当した＃20の方が直接労務費は高く計算されてしまい，誰が作業を担当するかという偶然性が製品原価の計算に混入してしまうのである。","次に，総平均賃率の問題点は，＃30と＃40の計算結果から理解することができる。これらの製品は，工場全体で見れば全く同じだけの作業時間を消費しているが，＃30が相対的に高賃率の組立作業が中心であるのに対し，＃40は相対的に低賃率の切削作業が中心であり，本来であれば，＃30の方が直接労務費は高く計算されるべきである。ところが，総平均賃率によれば，工場内の作業を全て同質的に扱う結果，＃30と＃40の直接労務費は同額となり，職種別の賃率の相違を製品原価に正しく反映することができないのである。","個別賃率300,000360,000792,000528,000","総平均賃率330,000330,000660,000660,000","職種別平均賃率330,000330,000792,000528,000"],"f":"p1_1-7.webp","p":""},{"id":"1-8","b":"p1","c":1,"n":8,"t":"定時外作業手当の会計処理","i":"B","y":"B","q":["直接工の定時外作業手当を別建てで処理する場合，これを直接労務費として処理するか，間接労務費として処理するかが問題となるが，それぞれどのような場合に当該処理を採用するのが適切であるのかを説明しなさい。"],"a":["定時外作業を予定しておらず，定時外作業手当を予算計上していない工場において，発注者の要望等により，特定製品について例外的に定時外作業を行う場合がある。このようなケースにおいては，定時外作業の原因は特定製品にあることから，定時外作業手当は当該製品の直接労務費として処理すべきである。","他方，定時外作業を行うのが通常であり，どの製品にも定時外作業を行う可能性がある場合において，定時外作業手当を特定製品に負担させれば，原価計算に偶然性が混入するため，望ましくない。したがって，このようなケースにおいては，定時外作業手当は間接労務費としてとして処理し，製造プロセス全体のコストとして認識するのが適切である。"],"k":["定時外作業を行った原因","特定製品","偶然性"],"kg":[{"l":"","w":["定時外作業を行った原因","特定製品","偶然性"]}],"e":["定時外作業手当(超過勤務手当ないし残業手当)は，通常は加給金の一部として消費賃率を構成するため，その場合には，定時外作業手当を直接労務費とするか間接労務費とするかは問題とならない。必然的に，直接作業時間を乗じた分は直接労務費となり，間接作業時間と手待時間を乗じた分は間接労務費となるからである。したがって，定時外作業手当の会計処理の問題は，これを消費賃率の計算に含めないで，別建てで処理しているということが前提となる(図表１-９)。","ここで，定時外作業手当を直接労務費とすべきか間接労務費とすべきかという議論は，個別原価計算における仕損費の処理(直接経費処理・間接経費処理)と同じ理屈で捉えることができる。すなわち，特定製品の製造に起因するならば直接費として処理すべきであるし，他の製品においても発生の可能性があるのであれば，製品原価の比較可能性を確保する観点から，製造プロセス全体のコスト(間接費)として処理すべきなのである。","なお，定時外作業手当の実際額を間接労務費として処理する場合には，前提として，製造間接費予算の中に定時外作業手当の予定額を計上することになる。これにより，予定配賦率の一部を定時外作業手当が構成し，各製品に対して配賦基準数値(作業時間)単位当たりで均等にこれを負担させることになるため，比較可能性の高い製品原価を算定することが可能となるのである(図表１-10)。","消費賃率に含める場合どの製品にもあり問題とならない"],"f":"p1_1-8.webp","p":""},{"id":"1-9","b":"p1","c":1,"n":9,"t":"製造間接費の配賦基準の選択","i":"B","y":"B","q":["製造間接費の配賦基準の選択に当たっての判断基準について，⑴価値移転的原価計算の場合と⑵価値回収的原価計算の場合に分けて説明しなさい。"],"a":["⑴価値移転的原価計算の場合","価値移転的原価計算においては，因果関係を重視した原価計算が行われる。そこで，製造間接費の配賦基準の選択に当たっては，第１に，製造間接費の発生と比例関係にあること，第２に，配賦基準数値を経済的に測定できること，が判断基準となる。⑵価値回収的原価計算の場合","価値回収的原価計算においては，原価の負担能力に応じた計算が行われる。そこで，製造間接費の配賦基準の選択に当たっては，第１に，原価の負担能力と比例関係にあること，第２に，配賦基準数値を経済的に測定できること，が判断基準となる。"],"k":["比例性(相関性)","配賦基準数値の測定","経済性"],"kg":[{"l":"","w":["比例性(相関性)","配賦基準数値の測定","経済性"]}],"e":["製造間接費の配賦基準の選択は，⑴価値移転又は⑵価値回収の観点から行われる。⑴価値移転の観点からは，①製造間接費の発生と比例性(相関性)のある配賦基準が選択され，⑵価値回収の観点からは，①原価負担能力と比例性のある配賦基準が選択される。また，配賦基準数値の測定には手間とコストがかかるため，それらを②経済的に測定できるかという点も，配賦基準の選択に当たっての重要な判断基準となる。加えて，解答では当然のこととして省略したが，配賦基準数値を配賦対象において③共通的に測定できるかという点も，判断基準の１つと見ることができる。","なお，製造間接費に限らず，原価を配賦する際の配賦基準選択のための基準として，(ア)因果基準，(イ)便益基準，(ウ)負担能力基準を挙げる場合がある。(ア)と(イ)は価値移転的原価計算における基準であり，(ウ)は価値回収的原価計算における基準と見ることができる(図表１-11)。"],"f":"p1_1-9.webp","p":"p1_1-9_past.webp"},{"id":"1-10","b":"p1","c":1,"n":10,"t":"製造間接費実際配賦の問題点","i":"A","y":"A","q":["製造間接費の製品別配賦において，実際配賦率を用いて計算することの問題点を２つ指摘しなさい。"],"a":["第１に，製造間接費の多くは固定費からなるため，実際配賦率を用いて計算すれば，月々の実際操業度の増減の影響を受けて配賦率が大きく変動し，製品原価の比較可能性が阻害されてしまうという問題がある。","第２に，製造間接費は種々雑多な費目からなるため，実際発生額の集計にはかなりの手間と時間を要し，実際配賦率を用いて計算すれば，製品原価の計算が著しく遅延してしまうという問題がある。"],"k":["固定費","実際操業度","比較可能性","種々雑多","実際発生額","計算が遅延"],"kg":[{"l":"","w":["固定費","実際操業度","比較可能性","種々雑多","実際発生額","計算が遅延"]}],"e":["「原価計算基準」によれば，費目別計算において，材料費，労務費及び経費のいずれの計算においても予定価格等の適用は認められているが，原則的には実際価格による計算が求められる。ただし，個別原価計算における製造間接費の計算に限っては，予定配賦率による計算が原則とされる。実際配賦率を用いれば，製造間接費の２つの性質に対応して，大きな２つの弊害が生じてしまうためである。","以下の図表１-12は，実際単純個別原価計算を採用する工場を例にとり，製品原価の比較可能性の観点から，実際配賦率を用いた計算と予定配賦率を用いた計算(配賦基準は直接作業時間)を比較したものである。ただし，簡略化のため，製造間接費は全て固定費であるものとする。","ここで，＃10と＃20の直接作業時間は全く同じであるため，本来であれば，予定配賦率による計算が示す通り，製造間接費の配賦額も同額となるべきである。ところが，実際配賦率を用いれば，操業度の低下によって配賦率(固定費率)が高騰するため，６月に着手した＃20の方が配賦額は大きくなり，製品原価の比較可能性が阻害されてしまうのである。","なお，予定配賦率の算定は，月間ではなく年間の予算データに基づいて行うのが望ましいとされる。月間の予算データによれば，実際配賦率を用いる場合と同様に，季節的な操業水準の変動や暦日差異の影響が予定配賦率の計算に混入し，結果として製品原価の比較可能性を阻害することになるからである。","実際配賦率を使用した場合６月分400,0002,000,000","予定配賦率を使用した場合６月分300,0001,500,000"],"f":"p1_1-10.webp","p":"p1_1-10_past.webp"},{"id":"1-11","b":"p1","c":1,"n":11,"t":"製造間接費正常配賦の理論","i":"B","y":"C","q":["製造間接費正常配賦の理論の内容と論拠を説明しなさい。"],"a":["製造間接費正常配賦の理論とは，外部報告目的の期間損益計算や価格決定のための製品原価は，製造間接費に関する限り，実際配賦ではなく正常配賦により計算すべきである，とする理論である。","その論拠は，製造間接費中に多く含まれる固定費の本質は生産能力の維持費であり，その発生額の大きさは生産能力の規模に依存するという点に求められる。すなわち，固定製造間接費は月々変動する実際生産量よりも，むしろ生産能力の規模を規定する正常生産量と結びついて発生するため，正常生産量の製品に均等に配賦する方が，因果関係を重視した理論的に正しい計算といえるからである。"],"k":["固定費","生産能力の維持費","生産能力の規模","正常生産量"],"kg":[{"l":"","w":["固定費","生産能力の維持費","生産能力の規模","正常生産量"]}],"e":["正常配賦の理論とは，大部分が固定費から成る製造間接費の発生を「通常どれほどの操業をするのか」という正常生産量と結び付けて捉え，これに対して製造間接費を均等に配賦することによって，外部報告目的の期間損益計算や価格決定のために適切な製品原価の算定が可能になるというものである。正常配賦(予定配賦)を行うとすれば，正常配賦率(予定配賦率)を算定する必要があり，基準操業度の選択が問題となる。","ここで重要なことは，正常配賦の理論とは，「全部原価計算において固定製造間接費を製品単位当たりに集計するための論理」に過ぎず，そのもとでは，固定費の原価態様(コスト・ビヘイビア)が一切無視されているという点である。すなわち，正常配賦額(予定配賦額)とは，全ての製造間接費を便宜的に変動費と擬制した製品原価計算用の金額に過ぎず，これと実際発生額とを比較したところで，原価管理活動の良否を判断することはできないのである。原価管理のためには，実際操業度において生じるはずの予算許容額(変動予算)と実際発生額とを比較すべきなのであって，製造間接費を製品別に集計することと，製造間接費という原価を管理することとは，全くの別問題として明確に区別しなければならない。>","なお，製品原価計算用の製造間接費(正常配賦額ないし予定配賦額)と原価管理M用の製造間接費(予算許容額)との差が操業度差異であり，それは製品原価の計算と原価管理という２つの原価計算目的の橋渡し役を担っている解釈することができる(図表１-13)。"],"f":"p1_1-11.webp","p":""},{"id":"1-12","b":"p1","c":1,"n":12,"t":"基準操業度の選択","i":"B","y":"B","q":["現代企業において，基準操業度として実際的生産能力，平均操業度，期待実際操業度のうちいずれを選択するのが望ましいかを，①期間損益計算と②価格決定のそれぞれの観点から説明しなさい。"],"a":["①期間損益計算の観点","慢性的な不働能力を抱え，不確実性にさらされている現代企業において，フル操業や長期安定的な操業を仮定すれば，配賦率が実態と乖離して製品原価の計算に歪みが生じるため，望ましくない。したがって，次年度の予測に基づく期待実際操業度が適切な基準操業度であるといえる。","②価格決定の観点","長期的に安定した価格を決定するためには平均操業度がよいとされる。しかし，今日の厳しい競争環境では，平均操業度や期待実際操業度を選択すれば，配賦率が高くなる結果として製品原価や価格も高くなり，さらに販売量が減少するという悪循環に陥る可能性が高い。したがって，競争下の価格決定のためには，配賦率が最小となる実際的生産能力を選択するのがよい。"],"k":["不働能力","不確実性","フル操業","長期安定操業","配賦率","厳しい競争環境"],"kg":[{"l":"","w":["不働能力","不確実性","フル操業","長期安定操業","配賦率","厳しい競争環境"]}],"e":["現代の企業環境を考慮すれば，①期間損益計算の観点からすると期待実際操業度(予算操業度)が，②価格決定の観点からすると実際的生産能力が基準操業度としてそれぞれ望ましいとされる。それでは結局，基準操業度としては，いずれを選択すべきか。常時継続的に計算を行う原価計算制度においては，期待実際操業度を選択するのがよいと考えられる。価格決定のための原価計算は，特殊原価調査の形で随時的に行えばよいからである(図表１-14)。","ところで，基準操業度として何を選択するかによって，正常配賦率(予定配賦率)中の固定費率，正常配賦額(予定配賦額)，操業度差異は変化する。ただし，製造間接費の管理標準として変動予算を使用する限りは，予算差異は変化しない(図表１-15)。つまり，原価管理の観点からすれば，基準操業度の選択は問題とならないことに注意する。","なお，基準操業度として何を選択するかによって，正常配賦(予定配賦)の副産物である操業度差異の意味や，その理論的な会計処理も異なることになる。"],"f":"p1_1-12.webp","p":""},{"id":"1-13","b":"p1","c":1,"n":13,"t":"製造間接費予算の種類","i":"B","y":"B","q":["製造間接費の発生予定額を製造間接費予算といい，それは固定予算と変動予算に大別されるが，両者の相違を説明しなさい。"],"a":["固定予算とは，予算期間において予期される一定の操業度に基づいて算定した予算をいい，基準操業度における製造間接費の発生予定額を意味する。","他方，変動予算とは，予算期間において予期される範囲内における種々の操業度に対応して算定した予算をいい，実際操業度における製造間接費の発生予定額を意味する。","すなわち，固定予算が予定配賦率算定の基礎となる予算であるのに対し，変動予算は製造間接費の管理標準となる予算であるという点で相違する。"],"k":["発生予定額","基準操業度","予定配賦率","実際操業度","管理標準"],"kg":[{"l":"","w":["発生予定額","基準操業度","予定配賦率","実際操業度","管理標準"]}],"e":["基準操業度が選択されると，予定配賦率を算定するために，基準操業度における製造間接費の発生予定額を算定する必要がある。また，製造間接費を管理するためには，管理標準としての実際操業度における製造間接費の発生予定額を算定する必要がある。このような製造間接費の発生予定額を製造間接費予算といい，前者を固定予算，後者を変動予算という。","また，変動予算の算定方法には公式法と実査法がある。公式法とは，製造間接費の各費目を変動費と固定費に分解できることを前提として，正常操業圏の範囲内における製造間接費の発生を一次関数で直線的に予定し，その公式に当てはめて変動予算を算定する方法をいう(図表１-16)。一方，実査法とは，基準操業度を中心として予期される範囲内の種々の操業度を一定間隔に設け，各操業度における製造間接費の各費目の発生額を個別的に実査することにより，複数の製造間接費予算を多桁式で算定列記する方法をいう(図表１-17)。固定費予算(ａ)"],"f":"p1_1-13.webp","p":""},{"id":"1-14","b":"p1","c":1,"n":14,"t":"固定予算の問題点","i":"A","y":"B","q":["固定予算を製造間接費の管理標準として使用することの問題点を説明しなさい。"],"a":["固定予算とは基準操業度における発生予定額であるから，これを製造間接費の管理標準として使用すれば，基準操業度として何を選択するかによって予算差異が変化してしまう。また，変動費の増減を無視するため，実際操業度が基準操業度から乖離する状況では，管理標準としての妥当性が低下してしまう。","以上より，固定予算を製造間接費の管理標準として使用すれば，原価管理活動の良否を正しく判断できないという問題がある。"],"k":["基準操業度","予算差異","変動費","実際操業度","乖離","原価管理活動の良否"],"kg":[{"l":"","w":["基準操業度","予算差異","変動費","実際操業度","乖離","原価管理活動の良否"]}],"e":["固定予算は，本来は予定配賦率を算定するための予算であるから，これを製造間接費の管理標準として使用することには問題がある。","第１の問題点は，基準操業度の選択に関連する。予定配賦率を算定するためには基準操業度を選択する必要があるが，基準操業度として何を選択するかによって固定予算の金額は異なる。例えば，基準操業度として実際的生産能力を選択した場合の固定予算は，期待実際操業度を選択した場合のそれと比べて，変動費が増加する分だけ大きくなる。したがって，固定予算を製造間接費の管理標準として使用すれば，基準操業度の選択という「製造間接費の管理」とは本来無関係であるはずの問題が予算差異に影響し，原価管理活動の良否を正しく判断することができないのである(図表１-18)。","第２の問題点は，実際操業度が基準操業度から乖離する状況において顕在化す>る。例えば，実際操業度が基準操業度を下回る場合には，変動費資源の投入は基M準操業度と比べて少なく済むはずであり，その分だけ固定予算の管理標準としての妥当性が低下するのである(図表１-19)。ただし，実際操業度が基準操業度に一致ないし近似する場合には，変動予算が固定予算に一致ないし近似することになる。したがって，その限りにおいては，固定予算を管理標準として使用することにも妥当性が認められる。","なお，製造間接費の管理標準として変動予算を使用する場合であっても，費目","別に予算差異を分析しなければ，やはり原価管理活動の良否を正しく判断するこ","とはできない。全体としての予算差異は，様々な費目の有利差異と不利差異が相","殺された結果に過ぎないからである。"],"f":"p1_1-14.webp","p":"p1_1-14_past.webp"},{"id":"1-15","b":"p1","c":1,"n":15,"t":"公式法変動予算の限界","i":"B","y":"B","q":["製造間接費の管理に公式法変動予算を使用する場合の限界について説明しなさい。"],"a":["公式法変動予算では，製造間接費の発生を一次関数で直線的に予定するが，そのような仮定が妥当するのは正常操業圏の範囲内においてであり，正常操業圏の範囲外においては，変動費率や固定費額に変化が生じうる。したがって，実際操業度が正常操業圏の範囲外で推移する場合には，公式で算定した予算額の管理標準としての妥当性が低下し，原価管理活動の良否を正しく判断できないという限界がある。"],"k":["一次関数","正常操業圏","公式","管理標準","原価管理活動の良否"],"kg":[{"l":"","w":["一次関数","正常操業圏","公式","管理標準","原価管理活動の良否"]}],"e":["公式法と実査法の相違は，変動予算の算定に当たって，製造間接費の発生を一次関数で直線的に予定するのか，各操業度において個別的に実査した予算に依拠するのかという点にある。ここで，正常操業圏の範囲内においては，製造間接費の発生を一次関数で直線的に予定することにも合理性は認められる。しかし，正常操業圏の範囲外においては，一部の製造間接費が直線的に推移しない分だけ，公式法による変動予算は製造間接費発生の実態から乖離することになる。したがって，実際操業度が正常操業圏の範囲外にあり，製造間接費が直線的に推移しない場合には，公式法による変動予算では原価管理活動の良否を正しく判断できないという限界がある(図表１-20)。","ただし，正常操業圏の範囲内で安定した操業を行っており，製造間接費が直線的に推移する場合には，公式法による変動予算が実査法による変動予算に近似することになる。したがって，そのようなケースにおいては，公式法で足りると考えられる。固定費予算(ａ)実査法変動予算"],"f":"p1_1-15.webp","p":""},{"id":"1-16","b":"p1","c":1,"n":16,"t":"操業度差異の計算方法","i":"B","y":"B","q":["製造間接費の操業度差異の計算方法について，固定予算を用いる場合と変動予算を用いる場合のいずれが理論的に妥当であるかを説明しなさい。"],"a":["操業度差異は，実際操業度と基準操業度との差に基づいて計算されるが，固定予算を用いる場合には変動費率を含む予定配賦率で操業度差異を評価するのに対し，変動予算を用いる場合にはこれを固定費率で評価する。","この点，変動費資源は実際操業度に応じて投入されるため，変動費から操業度差異は生じないと考えられる。他方，固定費資源は，基準操業度に見合う分だけ既に投入されてしまっているため，実際操業度が基準操業度を下回れば，その分だけ操業度差異が生じるはずである。","以上より，操業度差異の計算方法としては，変動予算を用いる場合の方が理論的に妥当であるといえる。"],"k":["変動費資源","実際操業度","固定費資源","基準操業度"],"kg":[{"l":"","w":["変動費資源","実際操業度","固定費資源","基準操業度"]}],"e":["変動費資源は実際操業度に応じて投入される。すなわち，支出額と消費額が一致するため，実際操業度が基準操業度から乖離したとしても，それを原因として差異は生じないと考えられる。一方，固定費資源は基準操業度に見合う分だけ投入済みであるため，実際操業度が基準操業度から乖離する状況では，支出額と消費額が一致せず，配賦漏れとしての操業度差異が生じる。したがって，操業度差異の計算方法としては，変動予算を用いる場合の方が理論的に妥当であるといえる(図表１-21)。","なお，変動予算を用いる場合の操業度差異の計算方法が理論的に妥当であるといっても，それは全部原価計算における固定製造間接費の正常配賦(予定配賦)に引きずられた方法に過ぎないのであって，そのような方法で計算された操業度差異の金額自体に意味はなく，経営管理には殆ど役立たないことに注意する。"],"f":"p1_1-16.webp","p":""},{"id":"1-17","b":"p1","c":1,"n":17,"t":"操業度差異分析の検討","i":"B","y":"B","q":["伝統的な固定費率による操業度差異分析が経営管理に役立たない理由を説明し，経営管理に役立つ操業度差異分析の方法を提案しなさい。"],"a":["固定費率とは，全部原価計算において，固定製造間接費を製品原価に算入するための人為的な変動費化の手段に過ぎない。すなわち，本来，固定製造間接費は生産能力の利用度とは無関係に一定額発生するのであって，固定費率を用いて生産能力の未利用分を評価したところで，生産能力の未利用に伴う損失を示すことはできない。したがって，伝統的な固定費率による操業度差異分析は，経営管理には役立たないのである。","ここで，生産能力の未利用に伴う損失は，生産能力を十分に利用していれば得られたはずの利益を意味するから，操業度差異分析を経営管理に役立てるためには，機会原価による評価を行うのが適切である。具体的には，製品単位当たりの貢献利益で生産能力の未利用分を評価すればよい。"],"k":["全部原価計算","生産能力の未利用に伴う損失","機会原価","貢献利益"],"kg":[{"l":"","w":["全部原価計算","生産能力の未利用に伴う損失","機会原価","貢献利益"]}],"e":["固定費率とは，固定製造間接費の発生態様を無視した計算上の数値に過ぎず，固定製造間接費は生産能力の利用度とは無関係に一定額発生することに注意しなければならない。つまり，固定費率の使用は，あくまでも外部報告目的の期間損益計算(全部原価計算)に主眼があるのであって，これを用いた操業度差異の分析は，正常配賦の理論に引きずられた方法に過ぎない。伝統的な操業度差異は，正常配賦額(予定配賦額)の副産物に過ぎないのである(図表１-22)。","操業度差異を経営管理に役立てるためには，これを生産能力の未利用に伴う損失として把握する必要がある。そのためには，全部原価計算や支出原価といった期間損益計算用の計算思考から脱却しなければならない。","そこで，機会原価による操業度差異分析が提案される。生産能力を遊休にしたということは，これを十分に利用していれば得られたはずの利益の喪失を意味するからである。一般に，遊休能力の代替的用途は自社製品の生産・販売であるから，その機会原価の概算値は，自社製品の貢献利益により測定される。なお，この貢献利益を用いた操業度差異の分析は，もはや全部原価計算の領域を超え，直接標準原価計算システムにおける予算実績差異分析の問題となる。"],"f":"p1_1-17.webp","p":""},{"id":"1-18","b":"p1","c":1,"n":18,"t":"有利な操業度差異の解釈","i":"A","y":"C","q":["基準操業度として実際的生産能力を採用する場合，有利な操業度差異は生じるか。年間と月間のそれぞれの分析について検討しなさい。"],"a":["基準操業度として実際的生産能力を採用する場合，生産能力を超えて稼働することは不可能であるため，年間の分析においては，有利な操業度差異が生じる余地はない。","ただし，１か月は１年のちょうど12分の１ではないため，当月の稼働可能日数に基づく実際的生産能力が，年間の実際的生産能力を月別に等分したものよりも大きくなることはある。したがって，基準操業度として実際的生産能力を採用する場合であっても，月間の分析では，有利な操業度差異(暦日差異)が生じることがある。"],"k":["生産能力","12分の１","暦日差異"],"kg":[{"l":"","w":["生産能力","12分の１","暦日差異"]}],"e":["基準操業度として実際的生産能力を採用する場合，生産能力を超えて稼働することは不可能であるため，年間を通して見れば，実際操業度が基準操業度を上回ることはない。ただし，年間予算を月別に等分して月間予算とする場合には，各月において，実際操業度が基準操業度を上回ることがある。これは，各月が１年のちょうど12分の１ではないために生じる差異であり，このような操業度差異を「暦日差異」という。基準操業度に実際的生産能力を採る場合に限らず，有利な操業度差異の解釈として便利であるため，常に念頭に置くようにしたい。"],"f":"p1_1-18.webp","p":"p1_1-18_past.webp"},{"id":"1-19","b":"p1","c":1,"n":19,"t":"操業度差異の理論的会計処理","i":"B","y":"B","q":["基準操業度として①実際的生産能力，②平均操業度，③期待実際操業度を採用する場合のそれぞれについて，操業度差異の理論的会計処理を理由を付して説明しなさい。"],"a":["①実際的生産能力を採用する場合","実際的生産能力は，フル操業が常態の場合に採用されるものであるから，操業度差異が生じるのは異常な状態であると考えられる。したがって，操業度差異が生じたならば，これを非原価項目として処理すべきである。","②平均操業度を採用する場合","平均操業度は長期的な生産と販売の均衡を念頭に設定されるものであるから，これを採用する場合の操業度差異は，平均算定期間において借方差額と貸方差額が相殺されることが期待されている。したがって，操業度差異は当該年度においては会計処理を行わず，翌年度以降に繰り延べるべきである。","③期待実際操業度を採用する場合","期待実際操業度は，次年度の販売予測に基づいて設定されるものであるから，販売予測が適切である限り，少額の操業度差異しか出ないのが通常である。したがって，原則として当年度の売上原価に賦課するが，多額の操業度差異が生じた場合には，販売予測の誤りから生じた固定製造間接費の配賦漏れと捉え，期末の棚卸資産にも追加配賦すべきである。"],"k":["異常","非原価","平均算定期間","相殺","繰延","販売予測","少額","多額"],"kg":[{"l":"","w":["異常","非原価","平均算定期間","相殺","繰延","販売予測","少額","多額"]}],"e":["固定製造間接費の正常配賦(予定配賦)のためには基準操業度の選択が必要であり，基準操業度として何を選択するかによって，操業度差異の理論的会計処理は異なる。ただし，「原価計算基準」では期待実際操業度の採用を原則としていることから，操業度差異は原則として当年度の売上原価に賦課し，多額の場合は売上原価と期末における棚卸資産に配賦することが求められる(図表１-23)。","なお，基準操業度として実際的生産能力が採用されるケースとしては，フル操業が常態である場合と次年度の販売予測に基づく期待実際操業度が実際的生産能力に等しいと考えられる場合の２つがあるが，操業度差異を非原価として処理すべきであるのは，あくまでも前者のケースにおいてであることに注意する。後者のケースであれば，販売予測の不確実性からして操業度差異が生じる可能性も十分にあり，操業度差異は原価性を有すると考えられるからである。"],"f":"p1_1-19.webp","p":"p1_1-19_past.webp"},{"id":"2-1","b":"p1","c":2,"n":1,"t":"総括配賦法の問題点","i":"A","y":"B","q":["製造間接費を工場全体の総括配賦率を用いて計算する方法(総括配賦法)の問題点を説明しなさい。"],"a":["総括配賦法によれば，工場全体の作業を同質的に扱うことになるため，各部門における資源の消費状況を製造間接費の配賦計算に正確に反映することができない。また，工場全体を配賦単位とするため，各部門の製造間接費の発生と比例性(相関性)のある適切な配賦基準を選択することができない。以上の結果，製造間接費の配賦計算が不正確なものになるという問題がある。"],"k":["同質的","資源の消費状況","配賦単位","配賦基準"],"kg":[{"l":"","w":["同質的","資源の消費状況","配賦単位","配賦基準"]}],"e":["以下の図表２-１は，実際個別原価計算を採用する工場を例にとり，総括配賦法を用いた場合の計算と部門別配賦法を用いた場合の計算を比較したものである。","ここで，当工場の製造間接費の大半は第１製造部門において発生するため，本来であれば，第１製造部門の作業を受けた製品がより多くの製造間接費を負担すべきである。ところが，総括配賦法によれば，第１製造部門の作業と第２製造部門の作業を同質的に扱うため，＃10と＃20が負担する製造間接費は全く同じ金額になってしまう。これは明らかにおかしい。＃10は第１製造部門の作業を全く受けていないにもかかわらず，その製造間接費の一部を負担することになるからである。このように，総括配賦法のもとでは，どの部門で作業を受けたのかを配賦計算に正確に反映することができないため，計算結果が現実の資源の消費状況から乖離してしまうという問題がある。したがって，製造間接費の配賦は総括配賦法ではなく部門別配賦法によるべきであり，「原価計算基準」においても，原則として，部門間接費として配賦することを求めている。","ただし，総括配賦法から部門別配賦法に変更したところで，配賦基準の選択が不適切であれば，配賦額は必ずしも改善されない。したがって，製造間接費の配賦額を改善するためには，配賦単位と配賦基準の双方をセットで勘案しなければならないことに注意する。"],"f":"p1_2-1.webp","p":""},{"id":"2-2","b":"p1","c":2,"n":2,"t":"原価部門の設定","i":"A","y":"B","q":["原価部門は，これをいかなる見地から設定すべきであるか。部門別計算の目的との関連で説明しなさい。また，原価部門の設定に当たって，その他に留意すべき事項があるとすればそれは何か。"],"a":["部門別計算の目的は，正確な製品原価の計算と機能別，責任区分別の原価管理である。","まず，正確な製品原価の計算の観点からすれば，製品製造の流れに沿って，基本的に異なる業務活動を職種別に区分して原価部門を設定するのがよい。","他方，原価管理の観点からすれば，工場の組織図にしたがい，職制上の権限と責任に即して原価部門を設定するのがよい。","ただし，あまりに多くの原価部門を設定すれば経済性を害するため，費用対効果を考慮して原価部門の数を決定することに留意すべきである。"],"k":["正確な製品原価の計算","資源の消費状況","製品製造の流れ原価管理","責任会計","組織図","費用対効果","原価部門の数"],"kg":[{"l":"","w":["正確な製品原価の計算","資源の消費状況","製品製造の流れ原価管理","責任会計","組織図","費用対効果","原価部門の数"]}],"e":["部門別計算の第１の目的は，「正確な製品原価の計算」である。この見地からすれば，製品がどの場所を通過し，その場所でどれだけの資源を消費したのかを把握する必要がある。したがって，原価部門は製品製造の流れに沿って設定するのがよいということになる。","部門別計算の第２の目的は，「原価管理」である。この見地からすれば，より良い原価業績を引き出すために，原価業績について責任を問う必要がある。したがliiiillって，工場の組織図にしたがい，職制上の権限と責任に即して原価部門を設定するのがよいということになる。","なお，原価計算が合理的な経済活動のための計算システムである以上，上記の目的は必要なレベルで達成できればよい。したがって，原価部門を過度に細分化して設定することが，必ずしも良いシステムとはいえないことに注意する。"],"f":"p1_2-2.webp","p":"p1_2-2_past.webp"},{"id":"2-3","b":"p1","c":2,"n":3,"t":"部門別計算の手続","i":"B","y":"A","q":["部門別個別原価計算の採用を前提として，製造間接費の部門別計算の手続きを３つに分けて説明しなさい。"],"a":["まず，製造間接費を各原価部門に集計し，部門費を計算する。その際，部門個","別費は各原価部門に賦課し，部門共通費は適当な配賦基準を用いて各原価部門に","配賦する。","次に，補助部門費を，直接配賦法，階梯式配賦法，相互配賦法等にしたがい，","適当な配賦基準を用いて各製造部門に配賦し，製造部門費を計算する。","最後に，製造部門費を，適当な配賦基準を用いて各製造指図書に配賦する。","材料費＃10","直接材料費直接材料費","間接材料費直接労務費","直接経費","労務費第１製造部門第１部門費","直接労務費部門個別費第２部門費","①③","間接労務費部門共通費製造部門費","補助部門費＃20","②","経費直接材料費","直接経費第２製造部門直接労務費","間接経費部門個別費直接経費","①③","部門共通費製造部門費第１部門費","補助部門費第２部門費","②","補助部門","部門個別費","①補助部門費","部門共通費","①製造間接費の原価部門への集計(第１次集計)","部門別計算②補助部門費の製造部門への配賦(第２次集計)","③製造部門費の製品への配賦","図表２-３部門別計算の３つの計算段階","(ⅰ)製造間接費予算の原価部門への集計","部門個別費の賦課＋部門共通費の配賦",">","(ⅱ)補助部門費予算の製造部門への配賦","M","①製造部門費の単一基準配賦法／複数基準配賦法期首","予定配賦率の算定","予定配賦率","直接配賦法／階梯式配賦法／相互配賦法","予定配賦率＝製造部門費予算÷基準操業度期中②製造部門費の製品別配賦予定配賦率×実際操業度","(ⅰ)製造間接費実際発生額の原価部門への集計","部門個別費の賦課＋部門共通費の配賦","(ⅱ)補助部門費の製造部門への配賦","③製造部門費の","実際発生額の算定単一基準配賦法／複数基準配賦法","実際配賦率／予定配賦率期末","直接配賦法／階梯式配賦法／相互配賦法","総差異＝予定配賦額－実際発生額","④製造部門費の予算差異＝予算許容額－実際発生額","配賦差異の算定・分析操業度差異＝予定配賦額－予算許容額","固定予算／変動予算","図表２-４部門別計算の手続(製造部門費を予定配賦する場合)","(ⅰ)製造間接費実際発生額の原価部門への集計","部門個別費の賦課＋部門共通費の配賦","(ⅱ)補助部門費の製造部門への配賦","①製造部門費の単一基準配賦法／複数基準配賦法期末実際配賦率の算定","実際配賦率","直接配賦法／階梯式配賦法／相互配賦法","実際配賦率＝製造部門費実際発生額÷実際操業度","②製造部門費の製品別配賦実際配賦率×実際操業度","図表２-５部門別計算の手続(製造部門費を実際配賦する場合)"],"k":["部門個別費","部門共通費","補助部門費","製造部門費","直接配賦法","階梯式配賦法","相互配賦法"],"kg":[],"e":[],"f":"p1_2-3.webp","p":""},{"id":"2-4","b":"p1","c":2,"n":4,"t":"製造部門に集計する原価要素の範囲","i":"B","y":"A","q":["我が国の「原価計算基準」によれば，部門に集計する原価要素の範囲は，製品原価の正確な計算及び原価管理の必要によって，これを定めることになっている。そこで，①個別原価計算と②総合原価計算のそれぞれについて，原価計算目的との関連で，製造部門に集計する原価要素の範囲を説明しなさい。"],"a":["①個別原価計算","製品原価の正確な計算の見地からすれば，製造間接費のみを製造部門に集計すれば足りるが，原価管理の見地から，直接労務費をも製造部門に集計することがある②総合原価計算","製品原価の正確な計算の見地からすれば，全ての製造原価要素を工程に集計する必要があるが，原価管理の見地から，加工費のみを工程に集計することがある。"],"k":["直接費","指図書","間接費","直接労務費","責任原価","全原価要素","加工費"],"kg":[{"l":"","w":["直接費","指図書","間接費","直接労務費","責任原価","全原価要素","加工費"]}],"e":["個別原価計算においては，通常は製造間接費のみを部門別計算の対象とする。指図書単位で製品別計算を行う(つまり，製造部門が仕掛品勘定となるわけではない)以上，正確な製品原価の計算という見地からすれば，各指図書に賦課できる直接材料費や直接労務費をあえて製造部門経由で集計する必要がないからである。すなわち，個別原価計算において直接労務費を製造部門に集計することがあるのは，あくまでも原価管理ないし責任会計の見地によるものであることに注意しなければならない。","一方，総合原価計算においては，原則として全ての製造原価要素を工程に集計する。工程単位で製品別計算を行う(つまり，工程自体が仕掛品勘定となる)以上，直接材料費や直接労務費も工程に集計する必要があるからである。ただし，「原料がすべて最初の工程の始点で投入され，その後の工程では，単にこれを加工するにすぎない場合」には，加工費のみを工程に集計することがある。","なお，総合原価計算においても，工程別計算を採用する場合には，個別原価計算と同様に，製造間接費の部門別計算は行われている。ただし，工程別単純総合原価計算を採用する場合には，各工程に集計された製造間接費を複数の原価計算対象に分けることなく，そのまま当該工程の仕掛品勘定に振り替えるのみであるため，部門別計算と製品別計算を区別する意味があまりない。したがって，工程別単純総合原価計算を採用する計算問題では，製造間接費の部門別計算は製品別計算に内包され，各工程の直接材料費と加工費(直接労務費＋製造間接費)がデータとして与えられることの方が多い(図表２-６)。"],"f":"p1_2-4.webp","p":""},{"id":"2-5","b":"p1","c":2,"n":5,"t":"第１次集計の新動向","i":"B","y":"B","q":["近年は，正確な製品原価計算から原価管理へと部門別計算の目的の重点が移行している。これに関連して，部門費の第１次集計において大きな変化がみられるという。この変化の内容について簡潔に説明しなさい。"],"a":["部門費の第１次集計において，部門個別費と部門共通費の分類をなくし，全て部門個別費として把握する傾向がみられる。ある原価を部門共通費として捉えると，原価の発生に関する責任の所在が曖昧なものとなり，原価管理上望ましくない。そこで，部門個別費として捉えることで原価責任を明確化し，原価の増大を抑止するのである。"],"k":["部門個別費","部門共通費","責任の所在","原価責任の明確化"],"kg":[{"l":"","w":["部門個別費","部門共通費","責任の所在","原価責任の明確化"]}],"e":["ある原価を部門共通費として捉えると，これに対しては全ての管理者が無責任になるため，原価管理の観点から部門個別費として捉える必要が生ずる。部門共通費とは，当該部門において発生したことを(経済的に)認識不可能な原価要素であるから，これを個別費化するには，①経済性を無視して集計するか，②管理可能性を基準として最も適切と思われる部門に集計するか，③新たに架空の部門を設定するかしかない(図表２-７)。②と③は製品原価計算の正確性を害するが，原価管理を重視するのであるから問題ない。あるいは，製品原価計算用の部門別計算と，原価管理用の部門別計算を並行させると考えればよい。"],"f":"p1_2-5.webp","p":"p1_2-5_past.webp"},{"id":"2-6","b":"p1","c":2,"n":6,"t":"補助部門費を製造部門に配賦する理由","i":"B","y":"B","q":["部門別計算において，補助部門費を製造部門に配賦する理由を２つあげて説明しなさい。"],"a":["第１の理由は，合理的な製品原価の計算の見地である。すなわち，補助部門は製造部門に対して補助的関係にあり，製品が通過することはないため，補助部門費を製造部門に配賦するための合理的な基準は得られても，製品に直接配賦するための合理的な基準は得られないのが通常である。つまり，補助部門費は製造部門経由で製品に集計するのが合理的であるため，これを製造部門に配賦するのである。","第２の理由は，責任会計の見地である。すなわち，補助部門費は，製造部門による用役消費の結果として発生するため，補助部門費の中には製造部門の責任原価が含まれている。そこで，製造部門の責任原価を漏れなく把握するために，補助部門費を製造部門に配賦するのである。"],"k":["合理的な製品原価の計算","製品","通過","配賦基準","責任会計","責任原価"],"kg":[{"l":"","w":["合理的な製品原価の計算","製品","通過","配賦基準","責任会計","責任原価"]}],"e":["本問は，補助部門費を製造部門に配賦することを前提としてその理由を問うものであるから，補助部門費の配賦自体が必要かつ合理的であるという認識のもとに論述を行えばよい。","しかしながら，現代的には，設計部門や検査部門などのように，製造部門ではなくむしろ製品に対して直接用役を提供していると考えられる補助部門の費用が増加しており，これを製造部門経由で製品に集計すれば，かえって計算が不正確になるという問題がある。また，製造部門に対して用役を提供する補助部門の費用であっても，その中には，固定的な動力供給や定期的なメンテナンスなど，製造部門の操業度とは無関係に行われる活動の費用が含まれており，これを製造部門経由で製品に集計すれば，操業度基準の配賦計算を通じて，計算結果に歪みが生じてしまうという問題がある。","すなわち，補助部門費を製造部門経由で製品に集計するのが合理的とする考えは，伝統的な部門別原価計算を前提とするものであり，上記の問題点を改善するべく登場した活動基準原価計算(ＡＢＣ)のもとでは，補助部門費の配賦自体が排除され，補助部門費は直接製品に集計されることに注意する。"],"f":"p1_2-6.webp","p":""},{"id":"2-7","b":"p1","c":2,"n":7,"t":"直接配賦法と相互配賦法の選択","i":"B","y":"B","q":["補助部門費の配賦方法として，最も簡便的な方法として直接配賦法，最も正確かつ理論的な方法として相互配賦法がある。直接配賦法と相互配賦法の選択が問題となる条件を指摘し，その条件下における両方法の選択基準について説明しなさい。"],"a":["直接配賦法と相互配賦法の選択が問題となるのは，補助部門間の用役授受の事実を測定するシステムを持つケースにおいてである。","この場合，両方法の選択に当たっては，補助部門間の用役授受の事実の測定に要する手間とコストと，より正確な相互配賦法を実施することで得られる追加的情報の価値を比較する。その結果，前者が後者を上回るのであれば直接配賦法を，逆の場合には相互配賦法を選択すべきである。"],"k":["補助部門間の用役授受の事実","費用対効果"],"kg":[{"l":"","w":["補助部門間の用役授受の事実","費用対効果"]}],"e":["補助部門を複数設定しており，補助部門間に用役授受の事実が認められる場合，配賦計算上これをどの程度考慮するかにより，補助部門費の配賦方法は，直接配賦法，階梯式配賦法，相互配賦法に大別される(図表２-９)。","このうち，相互配賦法の適用に当たっては，従来は計算に手間がかかるという問題があったため，直接配賦法や階梯式配賦法といった簡便法の適用にも合理性が認められた。しかしながら，現代的には，表計算ソフトにデータを入力しさえすれば，後はコンピューターが自動的に計算を行ってくれるため，計算に手間がかかるという問題は完全に克服されている。したがって，入力するデータの存在を所与とすれば，最も正確かつ理論的な相互配賦法(連続配賦法)を適用すべきということになる。","ただし，計算に手間がかからないことと計算に必要なデータを容易に入手できることとは別問題であり，そもそも補助部門間の用役授受の事実を測定するシステムがなければ直接配賦法によらざるをえないし，システムがあったとしても，経済合理的に入手できるとは限らない。すなわち，補助部門間の用役授受の事実の測定に要するコストと，相互配賦法の採用によって配賦額を改善することで得られる追加的情報の価値とを比較し，前者が後者を上回る(つまり，直接配賦法と相互配賦法で計算結果に大差がない)のであれば，直接配賦法で足りるということになる。","なお，本問の議論からすれば，現代的には直接配賦法と相互配賦法の二者択一の問題となり，階梯式配賦法の存在意義は殆どないことに注意する。","階梯式配賦法上位部門から下位部門への用役提供のみ考慮する"],"f":"p1_2-7.webp","p":""},{"id":"2-8","b":"p1","c":2,"n":8,"t":"複数基準配賦法の内容と論拠","i":"A","y":"A","q":["補助部門費の配賦方法としての複数基準配賦法とは，どのような配賦方法であるか。その内容と論拠を説明しなさい。"],"a":["複数基準配賦法とは，補助部門費を変動費と固定費とに区別し，変動費は関係消費部門の用役消費量を基準として配賦し，固定費は関係消費部門の用役消費能力を基準として配賦する方法である。","その論拠は，補助部門の変動費は関係消費部門の用役消費に応じて発生するが，固定費は当該補助部門の用役提供能力を維持するために発生し，用役提供能力の規模は関係消費部門の用役消費能力の規模に依存すると考えられるからである。"],"k":["関係消費部門","用役消費量","用役提供能力","用役消費能力"],"kg":[{"l":"","w":["関係消費部門","用役消費量","用役提供能力","用役消費能力"]}],"e":["単一基準配賦法では，補助部門費は変動費と固定費の区別なく，全て関係消費部門の用役消費量を基準として配賦する。これは，本来は当該補助部門の用役提供能力を維持するために発生する固定費を，あたかも関係消費部門の用役消費に応じて発生するかのように計算すること意味する。これに対して，複数基準配賦法の特徴は，補助部門費を変動費と固定費とに区別し，それぞれの発生原因に応じて配賦基準を選択するという点にある。その意味では，単一基準配賦法と比べて，より因果関係を重視した配賦方法であるといえる。","ただし，複数基準配賦法は，補助部門固定費を製造部門に配賦することを前提としており，それは，固定製造間接費を製品原価として処理する全部原価計算の採用を前提とする方法であることに注意を要する。すなわち，固定製造間接費を期間原価として処理する直接原価計算のもとでは，補助部門固定費を配賦する必要もないため，単一基準配賦法と複数基準配賦法の区別自体が存在しないということになる(図表２-10)。","なお，複数基準配賦法の論拠は，補助部門固定費が関係部門の用役消費能力と結び付いて発生するという点にあるが，この考え方を貫徹するならば，全ての関係部門の用役消費能力に基づいて補助部門固定費を配賦すべきであり，その一部または全部を無視することは，本来の趣旨に反する計算と言わざるを得ない。つまり，複数基準配賦法のもとでは，直接配賦法や階梯式配賦法などの簡便法を採用することは妥当でなく，理論的には相互配賦法を採用すべきことになる。","単一基準配賦法関係消費部門の用役消費量関係消費部門の用役消費量","複数基準配賦法関係消費部門の用役消費量関係消費部門の用役消費能力"],"f":"p1_2-8.webp","p":"p1_2-8_past.webp"},{"id":"2-9","b":"p1","c":2,"n":9,"t":"補助部門費の配賦と責任会計","i":"A","y":"B","q":["補助部門費を単一基準配賦法と実際配賦率を用いて計算することの問題点を３つ指摘し，それぞれの改善策を説明しなさい。"],"a":["第１の問題点は，特定の関係消費部門に対する配賦額が，管理不能な他の関係消費部門の用役消費量の多寡によって左右されてしまうことである。この点を改善するためには，複数基準配賦法を採用し，固定費については関係消費部門の用役消費能力を基準に配賦すればよい。","第２の問題点は，特定の関係消費部門に対する配賦額の中に，当該部門において管理不能な補助部門における原価管理活動の良否の影響(予算差異)が混入してしまうことである。この点を改善するためには，複数基準配賦法のもとで予定配賦率を採用し，変動費については予定配賦率に実際用役消費量を掛けて計算するとともに，固定費については予算額を用役消費能力を基準に配賦すればよい。","第３の問題点は，特定の関係消費部門に対する配賦額の中に，当該部門において管理不能な補助部門における用役提供活動の能率の良否の影響(能率差異)が混入してしまうことである。この点を改善するためには，標準原価計算を採用し，変動費の配賦において，予定配賦率(標準配賦率)に実際用役消費量ではなく標準用役消費量を掛ければよい。"],"k":["管理不能","用役消費量の多寡","原価管理活動の良否","用役提供活動の能率の良否","複数基準配賦法","予定配賦率","標準原価計算","標準用役消費量"],"kg":[{"l":"","w":["管理不能","用役消費量の多寡","原価管理活動の良否","用役提供活動の能率の良否","複数基準配賦法","予定配賦率","標準原価計算","標準用役消費量"]}],"e":["責任会計上望ましい補助部門費の配賦方法について，考えられる配賦方法の組合せと「単一基準＋実際配賦」の問題点の改善状況をまとめれば，図表２-11のようになる。","ここで重要なことは，実際原価計算の領域にとどまるか否かによって，補助部門変動費に関しては，理論上望ましい配賦方法の結論が変わってくるということである。つまり，実際原価計算の領域にとどまる場合には，予定配賦率に実際用役消費量を掛けて計算するのがベストということになるが，実際原価計算の領域を超えて，標準原価計算の採用までも視野に入れるならば，予定配賦率(標準配賦率)に標準用役消費量を掛けて計算するのがベストということになる。"],"f":"p1_2-9.webp","p":"p1_2-9_past.webp"},{"id":"2-10","b":"p1","c":2,"n":10,"t":"製造部門費と補助部門費の予定配賦の相違","i":"A","y":"C","q":["製造間接費の部門別計算において，製造部門費と補助部門費とでは予定配賦を行う見地が相違するが，どのように相違するのかを説明しなさい。"],"a":["製造部門費の配賦先は製品であるから，その予定配賦は製品原価の計算に関連して行われる。すなわち，月々の実際操業度の変動の影響を排除して製品原価の比較可能性を確保するとともに，製品原価の計算を迅速化するために，製造部門費の予定配賦を行うのである。","他方，補助部門費の配賦先は責任センターとしての製造部門であるから，その予定配賦は責任会計の見地から行われる。すなわち，製造部門において管理不能な補助部門における原価管理活動の良否の影響を配賦額から排除するために，補助部門費の予定配賦を行うのである。"],"k":["製品","製品原価","比較可能性","計算の迅速化","製造部門","責任会計","管理不能","原価管理活動の良否の影響"],"kg":[{"l":"","w":["製品","製品原価","比較可能性","計算の迅速化","製造部門","責任会計","管理不能","原価管理活動の良否の影響"]}],"e":["同じ予定配賦を行う場合であっても，⑴製造部門費と⑵補助部門費では配賦先が異なることに注意しなければならない。すなわち，⑴製造部門費の配賦先は製品であるから，その予定配賦は製品原価の計算に関連して行われるのに対し，⑵補助部門費の配賦先は責任センター(コスト・センターないし原価センター)としての製造部門であるから，その予定配賦は責任会計の見地から行われるということになる(図表２-12)。","つまり，製造部門費の予定配賦のメリットが問われた場合に，「製造部門における原価管理活動の良否の影響を排除できる」と解答したり，補助部門費の予定配賦のメリットが問われた場合に，「製品原価の比較可能性を確保できる」「製品原価の計算を迅速化できる」などと解答したりすることは，明らかに的外れということである。"],"f":"p1_2-10.webp","p":""},{"id":"2-11","b":"p1","c":2,"n":11,"t":"仕損費の計算","i":"B","y":"B","q":["我が国の「原価計算基準」によれば，個別原価計算においては原則として仕損費を計算するが，総合原価計算においてはこれを計算しないことになっている。個別原価計算と総合原価計算の特徴を踏まえ，その理由を説明しなさい。"],"a":["個別原価計算は，注文品を個別的に生産するような生産形態において，製造指図書別に製造原価を集計することによって，厳密に製品原価を算出しようとする計算方法である。したがって，仕損費についても発生原因となった製造指図書や部門を明らかにして，厳密にこれを跡付ける必要があり，原則として仕損費の計算を必要とする。","一方，総合原価計算は，標準製品を量産するような生産形態において，期間生産量に当該期間の総製造費用を対応させることによって，簡便的に生産量単位当たりの平均原価を算出しようとする計算方法である。したがって，仕損費についても期間生産量に自動的に負担させれば足り，あえて仕損費を計算する必要がないのである。"],"k":["製造指図書別","厳密","期間生産量","簡便的"],"kg":[{"l":"","w":["製造指図書別","厳密","期間生産量","簡便的"]}],"e":["個別原価計算は最も厳密な製品別計算の方法であるから，仕損費についても厳密な処理が求められる。そこで，発生原因となった製造指図書や製造部門に賦課するために，仕損費を計算する必要があるのである。ただし，軽微な仕損については，仕損費を計上しないことも認められている(図表２-13)。","一方，総合原価計算は個別原価計算の簡便法であるから，仕損費についても簡便的な処理が認められる。すなわち，仕損費は度外視法によって完成品と月末仕掛品に自動的に負担させれば足りるため，仕損費をあえて分離する必要がないのである。ただし，正確な製品原価の計算や原価管理の見地から非度外視法を採用する場合には，仕損費を分離して計算することになる。","補修可能指図書を発行する補修指図書に集計された製造原価","な仕損指図書を発行しない補修に要する製造原価の見積額","仕損費の処理指図書または部門に賦課期間生産量に自動的に負担","減損費の処理問題とならない期間生産量に自動的に負担"],"f":"p1_2-11.webp","p":"p1_2-11_past.webp"},{"id":"2-12","b":"p1","c":2,"n":12,"t":"個別原価計算における仕損費の処理","i":"B","y":"B","q":["個別原価計算における仕損費の処理方法には，直接経費処理と間接経費処理がある。そこで，それぞれどのような場合に当該処理を採用するのが適切であるのかを，部門別計算の実施を前提として説明しなさい。"],"a":["仕損の発生原因が特定の指図書の仕様の厳しさ等にある場合には，仕損費は当該指図書に賦課するのが適切である(直接経費処理)。","他方，仕損の発生原因が特定の部門の作業の複雑性等にあり，他の指図書でも発生する可能性がある場合には，仕損費を特定の指図書に賦課すれば，原価計算に偶然性が混入するため，望ましくない。したがって，このようなケースにおいては，仕損費は発生部門に賦課するのが適切である(間接経費処理)。"],"k":["仕損の発生原因","仕様の厳しさ","指図書","作業の複雑性","部門","偶然性","賦課"],"kg":[{"l":"","w":["仕損の発生原因","仕様の厳しさ","指図書","作業の複雑性","部門","偶然性","賦課"]}],"e":["個別原価計算において，仕損費を直接費とすべきか間接費とすべきかという議論は，定時外作業手当を直接労務費とすべきか間接労務費とすべきかという議論と同じ理屈で捉えることができる。すなわち，特定製品の仕様の厳しさ等に起因するならば直接費として処理すべきであるし，他の製品においても発生の可能性があるのであれば，製品原価の比較可能性を確保する観点から，製造プロセス全体のコスト(間接費)として処理すべきなのである(図表２-15)。","なお，間接経費処理を採用する場合には，製造間接費予算の中に仕損費の予定額を計上することが前提条件となる。これにより，予定配賦率の一部を仕損費が構成し，各製品に対して配賦基準数値(作業時間)単位当たりで均等に仕損費を負担させることになるため，比較可能性の高い製品原価を算定することが可能となる(図表２-16)。また，仕損費の実際額を発生部門に賦課することにより，仕損発生にかかわる原価責任を明確にできるという原価管理上のメリットもある(図表２-16)。"],"f":"p1_2-12.webp","p":"p1_2-12_past.webp"},{"id":"2-13","b":"p1","c":2,"n":13,"t":"ハイブリッド・コスティング","i":"B","y":"B","q":["製品別計算の基本形態は個別原価計算と単純総合原価計算であるが，現実の原価計算システムにおいては，必ずしもそのいずれかが採用されるというわけではない。そこで，現実に実施される製品別計算のシステムの特徴について説明しなさい。"],"a":["受注生産経営を行い個別原価計算を採用する企業も，経済合理性を追求する限り，何らかの方法で製造活動を標準化し始めるため，総合原価計算を導入する必要が生じる。","他方，見込生産経営を行い単純総合原価計算を採用する企業も，顧客ニーズの多様化に対応すべく，多様な製品を供給するようになるため，等級別ないし組別総合原価計算や，最終的には個別原価計算を導入する必要が生じる。","以上より，現実に実施される製品別計算のシステムは，個別原価計算と総合原価計算の混合形態ないし中間形態となる。"],"k":["経済合理性","混合形態","顧客ニーズ","製品種類","等級別","組別","中間形態"],"kg":[{"l":"","w":["経済合理性","混合形態","顧客ニーズ","製品種類","等級別","組別","中間形態"]}],"e":["製品別計算の基本形態は個別原価計算と単純総合原価計算であり，注文品を個別的に生産する場合には個別原価計算が，標準製品を連続生産する場合には単純総合原価計算が適合すると説明される。ただし，現実の製造現場はそのように単純ではなく，多様な製品が生産されると同時に，可能な限り標準化が図られ，全ての製品が同質的であるとか，異質的であるといった状況は存在しないのが通常である。したがって，企業が採用する製品別計算のシステムは，個別原価計算と単純総合原価計算の二者択一というわけではなく，むしろ各種製品別計算の混合形態ないし中間形態となるのが通常であり，このうち混合形態の原価計算システムを「ハイブリッド・コスティング」という(図表２-17)。","なお，「原価計算基準」では，個別原価計算と単純総合原価計算を製品別計算の形態の両極に置き，その中間形態として組別総合原価計算と等級別総合原価計算を並列させている(図表２-18)。"],"f":"p1_2-13.webp","p":""},{"id":"3-1","b":"p1","c":3,"n":1,"t":"原価配分法の選択","i":"C","y":"B","q":["総合原価計算における完成品と月末仕掛品への原価配分の方法には，平均法と先入先出法があるが，それぞれのメリットを指摘し，原価計算目的との関連で両者の適用方法について提案しなさい。"],"a":["平均法は，月初仕掛品原価と当月製造費用の平均単価を用いて完成品と月末仕掛品を評価する方法であるから，そのメリットは，価格や能率の偶然的な変動を均した製品原価を算定しうるという点にある。","他方，先入先出法は，月初仕掛品原価と当月製造費用を明確に区別し，当月製造費用の単位原価を用いて月末仕掛品を評価する方法であるから，そのメリットは，前月と当月の作業能率を明確に区別しうるという点にある。","以上より，期間損益計算目的には平均法が適合し，原価管理目的には先入先出法が適合するといえる。そこで，原価計算制度上は期間損益計算目的を重視して平均法を採用し，原価管理用の参考資料として先入先出法による単位原価情報を原価計算表に記載すればよい。"],"k":["偶然的変動","期間損益計算","作業能率","原価管理"],"kg":[{"l":"","w":["偶然的変動","期間損益計算","作業能率","原価管理"]}],"e":["総合原価計算においては，一期間の製造費用を期間生産量に集計し，これを期間生産量を構成する完成品と月末仕掛品とに配分する。ただし，通常の生産工程においては月初仕掛品が存在し，月初仕掛品原価と当月製造費用とでは単位原価が異なることから，「如何なる単位原価を用いて完成品と月末仕掛品を評価するか」が問題となり，平均法や先入先出法といった原価配分の仮定が必要となる。","ここで，原価配分の方法は，現代的には平均法と先入先出法の二者択一となるが，期間損益計算や価格決定のための棚卸資産評価を重視するならば平均法，原価管理を重視するならば先入先出法(とりわけ，月初仕掛完成分と当月着手完成分とに分けて完成品原価を直接計算する純粋先入先出法)という選択になる。期間損益計算や価格決定のためには，単位原価の変動を均した棚卸資産評価を行うのが適切であるし，原価管理の観点からすれば，むしろ単位原価の変動に着目する以上，月初仕掛品原価と当月製造費用を明確に区別する必要があるからである。","ただし，純粋先入先出法が原価管理に資するといっても，現実問題としては限界があることに注意しなければならない。純粋先入先出法によれば，確かに，月初仕掛完成分と当月着手完成分とに分けて単位原価を把握しうるが，仕損・減損が生じる場合には，それらが「当月投入分のみから発生した」という非現実的な仮定を設けざるをえず，その情報の信頼性には疑問が生じるし，偶然的原価としての実際原価同士を期間比較したところで，各月の純粋な能率の良否を知ることはできないからである。","なお，ここでは原価計算目的との関連で平均法と先入先出法の選択を検討したが，両者の選択は，現実の製造環境に照らして行われるべきである。例えば，月々の価格や賃率に大きな変動がないのであれば平均法を採用する積極的理由はないし，材料の投入から製品の完成までのサイクルタイムが短い(したがって，月初仕掛品が月末仕掛品となることはない)工場であれば，先入先出法の採用が実態に即しているといえよう。","最後に，「原価計算基準」における原価配分の方法を図表３-１にまとめておく。平均法と先入先出法の他に，簡便法として，直接材料費のみで期末仕掛品を計算する方法，予定原価又は正常原価をもって期末仕掛品を評価する方法，当期製造費用をもってそのまま完成品総合原価とする方法が認められている。"],"f":"p1_3-1.webp","p":""},{"id":"3-2","b":"p1","c":3,"n":2,"t":"無評価法の妥当性","i":"C","y":"C","q":["我が国の「原価計算基準」によれば，ある条件のもとでは，当期製造費用をもって完成品総合原価とする方法(無評価法)の適用が認められているが，その前提条件を示しなさい。また，製品原価の計算の正確性という観点から，無評価法の妥当性を検討しなさい。"],"a":["無評価法の適用は，期末仕掛品の数量が毎期ほぼ等しい場合に認められる。これは，数量が等しければ原価も等しくなるという仮定に依拠したものである。しかし，仕掛品の数量や加工費進捗度が一定であったとしても，原価財の価格が変動すれば原価は異なるはずであり，そのような状況において当期製造費用をもってそのまま完成品総合原価とすれば，製品原価の計算の正確性を著しく損なうことになる。","以上より，原価財の価格が極めて安定的である場合を除き，無評価法を適用することは妥当でないと考えられる。"],"k":["期末仕掛品の数量","原価財の価格","安定的"],"kg":[{"l":"","w":["期末仕掛品の数量","原価財の価格","安定的"]}],"e":["期末仕掛品の数量が毎期ほぼ等しい場合には，総合原価の計算上これを無視し，当期製造費用をもってそのまま完成品総合原価とすることが認められている。ただし，この無評価法は，数量が等しければ原価も等しくなるというかなり乱暴な仮定に依拠しており，製品原価の計算の正確性という観点からすれば，その適用は，原価財の価格が極めて安定的である場合など，かなり限定的に捉えられるべきである。ただし，期末仕掛品の数量が毎期ほぼ等しい場合に，費目別計算において予定価格や予定賃率を用いているのであれば，実際価格や実際賃率の変動の影響を製品原価の計算から排除できるため，期末仕掛品を評価する必要性は限りなく小さくなるといえる。したがって，その場合には，無評価法の妥当性を認めることができよう。","なお，無評価法は，期首仕掛品原価をそのまま期末仕掛品原価とする方法であるから，後入先出法の簡便法と見ることもできる(図表３-２)。"],"f":"p1_3-2.webp","p":""},{"id":"3-3","b":"p1","c":3,"n":3,"t":"非度外視法と原価計算基準の関係","i":"C","y":"C","q":["我が国の「原価計算基準」が規定する総合原価計算における仕損(減損)の処理方法と非度外視法との整合性を検討しなさい。"],"a":["我が国の「原価計算基準」によれば，「仕損の費用は，原則として，特別に仕損費の費目を設けることをしないで，これをその期の完成品と期末仕掛品とに負担させる」とあり，額面的に解釈すれば，度外視法を前提とした規定であることは明らかである。","しかし，「仕損費の費目を設けることをしない」という部分は，仕損費勘定を設定しないという意味で，仕損費の分離計算を否定するものではないとも解釈できるし，「完成品と期末仕掛品とに負担させる」という部分も単なる例示であり，負担関係の考慮を否定するものではないとも解釈できる。したがって，統一的な見解はないが，「原価計算基準」の規定は非度外視法をも許容する内容であると考えられる。"],"k":["仕損費勘定","分離計算","例示","負担関係"],"kg":[{"l":"","w":["仕損費勘定","分離計算","例示","負担関係"]}],"e":["総合原価計算における仕損・減損の処理について，「原価計算基準」の規定が度外視法を想定していることは明らかであり，額面的な文言解釈により，非度外視法との整合性を否定する見解もある。しかし，そもそも「原価計算基準」は個々の企業の原価計算手続を画一的に規定するものではないし，「原価計算基準」が想定する主たる原価計算目的が正確な製品原価の計算と原価管理にあることを考慮すれば，あえて非度外視法を否定する積極的な意義は見出し難い。そこで，解答では，非度外視法と「原価計算基準」の整合性を認める見解を採用している。","なお，本来，度外視法とは，狭義には，仕損・減損がはじめからなかったものとして，それらの費用を自動的に期間生産量(完成品と月末仕掛品)に負担させる方法をいう。一方で，受験原価計算上，度外視法といえば，簡便法(終点発生の場合に限り完成品のみの負担とし，その他のケースは自動的に両者負担とする方法)又は進捗度加味法(月末仕掛品の加工費進捗度と仕損・減損の発生時点の加工費進捗度を比較し，前者が後者よりも大きい場合は自動的に両者負担とし，逆の場合には完成品のみの負担とする方法)を指すのが通常であるが，いずれにおいても常に仕損・減損を度外視するわけではない。つまり，これらの方法は，「分離計算しない(非度外視法ではない)」という意味で度外視法と称されている(図表３-３)。"],"f":"p1_3-3.webp","p":"p1_3-3_past.webp"},{"id":"3-4","b":"p1","c":3,"n":4,"t":"度外視法と非度外視法の計算結果が相違する理由","i":"B","y":"A","q":["総合原価計算において，仕損費や減損費を完成品と月末仕掛品の両者に負担させる場合，度外視法と非度外視法で計算結果が相違する理由を，①仕損が定点で発生する場合と，②減損が工程を通じて平均的に発生する場合のそれぞれについて説明しなさい。ただし，②において，減損率は安定していないものとする。"],"a":["①仕損が定点で発生する場合","度外視法と非度外視法の計算結果が相違する原因は，仕損費を構成する加工費の負担のさせ方にある。すなわち，度外視法では加工費の計算区分の中で自動的に負担計算を行う結果，加工換算量比でこれを配分することになるのに対し，非度外視法では直接材料費と同様に実在量比でこれを配分するため，両者の計算結果が相違するのである。","②減損が工程を通じて平均的に発生する場合","度外視法と非度外視法の計算結果が相違する原因は，減損費を構成する直接材料費の負担のさせ方にある。すなわち，度外視法では直接材料費の計算区分の中で自動的に負担計算を行う結果，実在量比でこれを配分することになるのに対し，非度外視法では加工費と同様に加工換算量比でこれを配分するため，両者の計算結果が相違するのである。"],"k":["仕損費中の加工費","減損費中の直接材料費","実在量比","加工換算量比"],"kg":[{"l":"(共通)","w":["仕損費中の加工費","減損費中の直接材料費","実在量比","加工換算量比"]}],"e":["度外視法においては，仕損や減損がはじめからなかったものとして計算を行うため，その発生態様を考慮することができない。すなわち，定点発生であれ平均発生であれ，仕損費(減損費)を構成する直接材料費は実在量比で，加工費は加工換算量比で配分されることになる。","この点，非度外視法においては，仕損費(減損費)を分離した上で，その負担割合を考慮する。すなわち，①定点発生の場合には「完成品と月末仕掛品が負担すべき仕損費(減損費)は実在量単位当たりで等しい」と考え，②平均発生の場合には「完成品と月末仕掛品が負担すべき減損費は加工換算量単位当たりで等しい」と考える。その結果，①定点発生の場合には仕損費を構成する加工費の負担のさせ方が，②平均発生の場合には減損費を構成する直接材料費の負担のさせ方が，両者で相違することになるのである(図表３-４)。"],"f":"p1_3-4.webp","p":"p1_3-4_past.webp"},{"id":"3-5","b":"p1","c":3,"n":5,"t":"仕損・減損の発生態様と原価配分法の関係","i":"B","y":"B","q":["総合原価計算において，①仕損が定点で発生する場合(ただし，仕損の発生時点の加工費進捗度＜月初仕掛品の加工費進捗度)と②減損が工程を通じて平均的に発生する場合のそれぞれについて，仕損費・減損費の正確な計算という観点から，原価配分法として先入先出法と平均法のいずれが適合するのかを，それぞれの原価配分法に内在する仮定を踏まえた上で説明しなさい。"],"a":["仕損費や減損費の計算に当たって，先入先出法を採用する場合には当月投入分のみから仕損・減損が発生したと仮定するのに対し，平均法を採用する場合には月初仕掛品と当月投入分の双方から仕損・減損が発生したと仮定する。","ここで，①のケースでは，月初仕掛品は前月において既に仕損の発生時点を通過済みであり，当月において月初仕掛品から仕損が生じる余地はない。他方，②のケースでは，工程の全域で減損が発生している以上，当月において月初仕掛品からも減損が生じていることは明らかである。","以上より，①のケースでは先入先出法が，②のケースでは平均法が原価配分法として適合する。"],"k":["月初仕掛品","当月投入分","仕損(減損)が生じる余地"],"kg":[{"l":"","w":["月初仕掛品","当月投入分","仕損(減損)が生じる余地"]}],"e":["先入先出法とは月末仕掛品の評価法であり，仕損費・減損費の評価法ではない。したがって，先入先出法と非度外視法のもとで仕損費・減損費を計算するためには，その発生に関する明示的な仮定が別途必要となる。そこで，仕損・減損は当月投入分のみから発生すると仮定し，月末仕掛品と同様に，当月投入の単位原価でこれを計算するのが通常である。","一方，平均法もまた月末仕掛品の評価法であり，仕損費・減損費の評価法ではない。ただし，平均法を採用する場合には，月初仕掛品と当月投入分の区別がなされないため，必然的に両者の平均単価で仕損費・減損費を計算することになる。これは，平均法と非度外視法による計算のもとでは，月初仕掛品と当月投入分の双方から仕損・減損が発生すると暗黙裡に仮定していることを意味する。","このように，先入先出法と平均法では仕損・減損の発生に関する仮定が異なるため，いずれの原価配分法が適合するかは，「月初仕掛品からも仕損・減損が発生するか」という点に依存することになる(図表３-５・図表３-６)。"],"f":"p1_3-5.webp","p":""},{"id":"3-6","b":"p1","c":3,"n":6,"t":"非度外視法を採用する意義","i":"A","y":"B","q":["総合原価計算において，仕損費の計算処理に非度外視法を採用する意義について，正確な製品原価の計算と原価管理の観点から説明しなさい。"],"a":["正確な製品原価の計算の観点からすれば，非度外視法を採用する意義は殆どないといってよい。なぜなら，非度外視法によって仕損費の正確な負担計算が可能になるとしても，そもそも正常仕損費は少額である以上，度外視法と非度外視法の計算結果には大差がなく，仕損の発生状況の把握に要する手間とコストは，非度外視法の採用による追加的情報の価値を上回るのが通常だからである。","一方，原価管理の観点からすれば，非度外視法を採用する意義は大いにある。なぜなら，仕損の発生に対する問題意識や仕損を削減しようというモチベーションは，仕損費を明示することによってはじめて喚起することができると考えられるからである。"],"k":["計算結果","費用対効果","仕損削減","モチベーション","仕損費を明示"],"kg":[{"l":"","w":["計算結果","費用対効果","仕損削減","モチベーション","仕損費を明示"]}],"e":["非度外視法を採用することによるメリットとしては，一般に，①仕損・減損の発生時点や発生態様を考慮した正確な負担計算が可能であるという点(正確な製品原価の計算)と，②仕損費という写像を媒介として，仕損削減のモチベーションを喚起できるという点(原価管理)が挙げられる。","ただし，そもそも正常仕損費が少額であること，完成品と比べて月末仕掛品の数量が圧倒的に少ないことを考慮すれば，仕損費の負担計算の精度が完成品原価等に与える影響は微々たるものであるため，非度外視法を採用する意義は，実質的には，②原価管理の観点においてのみ認められるといえる。別言すれば，非度外視法の最大の特徴は，度外視しない(仕損費を明示する)点にあるといえる(図表３-７)。"],"f":"p1_3-6.webp","p":"p1_3-6_past.webp"},{"id":"3-7","b":"p1","c":3,"n":7,"t":"正常仕損と異常仕損の関係","i":"B","y":"A","q":["総合原価計算において，同一工程において正常仕損と異常仕損が発生しており，異常仕損の発生時点の加工費進捗度が正常仕損のそれ以上である場合，異常仕損品に正常仕損費を負担させる処理と，異常仕損品には正常仕損費を負担させない処理の双方が考えられるが，それぞれの論拠を説明しなさい。また，いずれの処理が妥当であるかについて意見を述べなさい。"],"a":["負担させる処理の論拠は，異常仕損品も正常仕損の発生原因となっていることから，異常仕損品にも正常仕損費を負担させることによって，因果関係を重視したより正確な計算が可能になる，というものである。他方，負担させない処理の論拠は，正常仕損費はあくまでも良品を製造するために不可避的に発生するコストであるため，不良品である異常仕損品には負担させるべきでない，というものである。","ここで，異常仕損品にも正常仕損費を負担させることによって，因果関係を重視したより正確な計算が可能になるとしても，正常仕損費は少額であるため，負担させない処理を採用した場合と計算結果に大差がない。その意味では，因果関係を重視することに大きな意義は見出し難く，むしろ正常性概念を重視する負担させない処理が妥当であると考える。"],"k":["因果関係","良品","不可避的","計算結果"],"kg":[{"l":"","w":["因果関係","良品","不可避的","計算結果"]}],"e":["まず，本問の議論は，異常仕損品も正常仕損(正常減損)の発生原因となっていることが前提であることに注意する。異常仕損の発生時点の加工費進捗度＜正常仕損の発生時点の加工費進捗度であれば，異常仕損品は正常仕損の発生原因ではない以上，進捗度を考慮する限りは，異常仕損品に正常仕損費を負担させる余地はないからである(図表３-８)。","また，正常仕損費(正常減損費)を狭義の度外視法又は簡便法の度外視法によって処理する場合には，正常仕損(正常減損)がはじめから無かったものとして計算を行うため，異常仕損品は正常仕損費(正常仕損費)を自動的に負担すると考えるのが通常である。したがって，本問の議論は，非度外視法や進捗度加味度外視法を前提としたものであると考えてよい(図表３-８)。","ここで，異常仕損品にも正常仕損費(正常減損費)を負担させるべきとする考え方は，価値移転的原価計算としての側面ないし原価発生原因を重視したものである。一方，負担させるべきでないとする考え方は，「正常な原価は正常な営業活動によって回収すべき」という正常性概念を重視したものである。いずれの処理が妥当であるかについては統一的な見解はないが，原価発生原因を重視しても計算結果に殆ど差がないことを考慮すれば，負担させない処理の論拠の方が説得力があるといえるだろう。","なお，異常仕損の発生原因としては，短期的に経営管理者にとって管理可能な原因(たとえば，工具の不慣れ，過失，監督の怠慢，材料の不良，整備不良による機械の故障など)と，管理不能な原因(たとえば，地震，台風などの天災など)がある。計算した異常仕損費は，前者の管理可能な原因(経常的原因)に基づく場合は営業外費用，後者の管理不能な原因(偶発的原因)に基づく場合には特別損失に計上すべきである。","正常仕損≦異常仕損負担させる負担させるor負担させない"],"f":"p1_3-7.webp","p":"p1_3-7_past.webp"},{"id":"3-8","b":"p1","c":3,"n":8,"t":"正常仕損量の計算方法","i":"C","y":"B","q":["正常仕損と異常仕損を区別する場合の基準には，量的異常性と質的異常性があり，前者に関連して，同一の発生点における正常仕損量の計算方法には，さらに２つの方法がある。そこで，その２つの計算方法について説明し，いずれが妥当であるかについて意見を述べなさい。"],"a":["第１の方法は，検査点に到達した数量の一定割合を正常仕損量とする方法であり，第２の方法は，検査点を通過した数量(良品)の一定割合を正常仕損量とする方法である。","正常仕損量の計算に与える影響を考慮すれば，第２の方法が妥当と考えられる。なぜなら，第１の方法によれば，実際仕損量の多寡が正常仕損量の計算に反映されてしまい，仕損が多く発生すれば正常仕損として計算される数量が多くなってしまうという問題があるからである。"],"k":["検査点到達量","検査点通過量","実際仕損量の多寡","正常仕損量"],"kg":[{"l":"","w":["検査点到達量","検査点通過量","実際仕損量の多寡","正常仕損量"]}],"e":["いま，工程終点で仕損品をラインオフしており，正常仕損率を投入量に対して10％(良品に対して1/9)と仮定する。また，当月投入量は1,100個であり，完成品は900個，仕損品は200個であったとする。仕掛品は存在しない。この場合，検査点に到達した数量の一定割合を超えるものを異常仕損とする方法によれば，正常仕損量は1,100個×10％＝110個，異常仕損量は200個－110個＝90個となる。一方，検査点を通過した数量(良品)の一定割合を超えるものを異常仕損とする方法によれば，正常仕損量は900個×1/9＝100個，異常仕損量は200個－100個＝100個となる(図表３-９)。","いずれの計算方法が妥当であるかは明らかだろう。第１の計算方法によれば，仮に，完成品が900個のままで仕損品が300個であったとすると，良品の数量が一定であるにもかかわらず，正常仕損量は1,200個×10％＝120個と増加してしまう(図表３-９)。一定の良品を生産するために許容されるべき正常仕損量は，実際仕損量の多寡とは無関係に決定されるべきものであり，その意味において，第２の計算方法に妥当性が認められるのである。","ただし，実際原価計算においては，製品単位原価は事後的に求められるものであり，製品(良品)に対して正常仕損率を設定することは通常ない。したがって，実際原価計算を前提とする計算問題においては，第１の計算方法の方がむしろ出題可能性は高いといえる。"],"f":"p1_3-8.webp","p":""},{"id":"3-9","b":"p1","c":3,"n":9,"t":"検査点の増設が原価に与える影響","i":"B","y":"B","q":["仕損品が工程の前半に集中して発生しており，現在は，これを工程終点の検査点でラインオフしているものとする。この場合，検査点を生産ラインの上流に増設することによって原価節約が可能となるが，その理由を説明しなさい。ただし，検査点の増設に係るコストは考慮外とする。"],"a":["仕損品は実体があるため，ラインオフされるまでは，他の良品と同じように加工が行われてしまう。そこで，検査点を生産ラインの上流に増設することにより，仕損品を発生後より速やかにラインオフすることが可能となる。その結果，従来行われていた無駄な変動費資源の投入を回避できるため，原価節約が可能となるのである。"],"k":["実体","ラインオフ","変動費資源","回避可能","原価節約"],"kg":[{"l":"","w":["実体","ラインオフ","変動費資源","回避可能","原価節約"]}],"e":["原価管理の観点からすれば，まずは仕損の発生量を最小限に抑えることが重要となるが，仕損が発生したならば，出来るだけ速やかに仕損品をラインオフすることが次に重要となる。インプット(原材料)の滅失である減損と異なり，仕損品は実体のあるアウトプットであるため，発生後速やかにラインオフしなければ，無駄な変動費資源が投入される結果として，原価が増大してしまうからである(図表３-10)。","なお，ここでは検査点の増設に係るコストを考慮外としたが，現実には，これと原価節約額とを比較することによって，検査点増設の可否を決定することになる。ただし，原価節約額は仕損費の減少額としてではなく，差額原価によって測定しなければならない。全部原価計算を前提とする限り，仕損費の中には固定費が含まれており，それは検査点を増設するか否かにかかわらず一定額発生する埋没原価だからである。"],"f":"p1_3-9.webp","p":""},{"id":"3-10","b":"p1","c":3,"n":10,"t":"累加法と非累加法の計算結果が相違する理由","i":"C","y":"B","q":["工程別総合原価計算において，累加法と非累加法の計算結果が相違する理由を説明しなさい。"],"a":["累加法では自工程と後工程の月初仕掛品原価を区別して工程ごとに原価配分を実施するのに対し，非累加法ではこれを区別せずに工程費ごとに原価配分を実施する。すなわち，累加法と非累加法では，各工程の月初仕掛品原価の取扱いが相違するため，月初仕掛品が存在する場合には，計算結果が相違するのである。"],"k":["自工程","後工程","月初仕掛品原価","工程費"],"kg":[{"l":"","w":["自工程","後工程","月初仕掛品原価","工程費"]}],"e":["工程別総合原価計算の方法には，累加法と非累加法がある。ここで，第１工程Mと第２工程からなる工程別単純総合原価計算を実施しているものとして，両者の原価配分構造を比較すれば，図表３-11のようになる。累加法では，第１工程の月初仕掛品中の第１工程費(Ａ)と第２工程の月初仕掛品中の第１工程費(Ｂ)を明確に区別し，工程という場所ごとに原価配分を実施する。この点，非累加法では，第１工程の月初仕掛品中の第１工程費(Ａ)と第２工程の月初仕掛品中の第１工程費(Ｂ)を区別せずに，工程費という括りで全工程を単一工程とみなして原価配分を実施する。その結果，累加法と非累加法では原価配分に使用する単位原価に相違が生じるため，計算結果が相違するのである。","ただし，最終工程費の計算については，累加法と非累加法で差異はない。両者の計算結果が相違する原因は，自工程と後工程の月初仕掛品原価を区別するか否かという点にあるが，最終工程費についてはそもそも後工程の月初仕掛品原価が存在しないからである。また，各工程に月初仕掛品が存在しない場合や，標準原価計算を採用する場合には，そもそも原価配分の仮定自体が不要となるため，累加法と非累加法の計算結果は必ず一致することになる。","なお，「原価計算基準」では累加法のみを規定しており，非累加法に関する記述は一切ない。そこで，「原価計算基準」との整合性に配慮し，累加法と計算結果>が一致するように工夫した非累加法(改正計算方式)もある。M"],"f":"p1_3-10.webp","p":""},{"id":"3-11","b":"p1","c":3,"n":11,"t":"累加法と先入先出法の関係","i":"C","y":"B","q":["累加法による工程別総合原価計算においては，一般に，先入先出法の論理に即した計算を行うことができないといわれるが，その理由を説明しなさい。"],"a":["工程別総合計算において先入先出法の論理を貫徹するためには，各工程の月初仕掛品は全て最終完成品になったものとし，各工程の月末仕掛品は当月投入分のみから構成されるように原価配分を実施する必要がある。","しかしながら，累加法によれば，前工程費の計算に当たって，前工程の月初仕掛完成分と当月着手完成分とを区別せずに，その平均単価を使用するのが通常である。その結果，前工程の月初仕掛品原価の一部が後工程の月末仕掛品原価を構成することになるため，先入先出法の論理に即した計算を行うことができないといわれるのである。"],"k":["前工程費","月初仕掛完成分","当月着手完成分","前工程の月初仕掛品原価後工程の月末仕掛品原価"],"kg":[{"l":"","w":["前工程費","月初仕掛完成分","当月着手完成分","前工程の月初仕掛品原価後工程の月末仕掛品原価"]}],"e":["累加法による工程別総合原価計算において先入先出法の論理を貫徹するためには，工程別に純粋先入先出法を厳密に適用する必要がある。すなわち，前工程費の計算に当たって，前工程の月初仕掛完成分と当月着手完成分を明確に区別し，当月着手完成分の単位原価を用いて後工程の月末仕掛品原価を算定しなければならない(図表３-12)。しかしながら，このような計算は工程の数が増えれば相当複雑なものとなるため，たとえ純粋先入先出法を採用する場合であっても，修正先入先出法を採用する場合と同様に，前工程の月初仕掛完成分と当月着手完成分の平均単価を用いて前工程費の計算を行うのが通常である。その結果，前工程の月初仕掛品原価の一部が後工程の月末仕掛品原価を構成することとなり，原価配分に平均法の思考が一部混入してしまうのである(図表３-13)。","なお，工程別総合計算の方法として非累加法を採用する場合には，先入先出法","の論理に即した計算が可能となる。非累加法では，自工程と後工程の月初仕掛","品原価を区別せず，全工程を単一工程とみなして原価配分を行うため，各工程の","月初仕掛品原価は全て最終完成品原価を構成し，各工程の月末仕掛品原価は全て","当月投入分の単位原価を用いて計算することになるからである(図表３-14)。"],"f":"p1_3-11.webp","p":""},{"id":"3-12","b":"p1","c":3,"n":12,"t":"非累加法と平均法の関係","i":"C","y":"B","q":["非累加法による工程別総合原価計算において，完成品と月末仕掛品への原価配分に平均法を使用することには問題があるが，その理由を説明しなさい。"],"a":["非累加法では，自工程と後工程の月初仕掛品原価を区別せずに工程費ごとに原価配分を実施する。そのため，原価配分法として平均法を使用する場合には，各工程の月初仕掛品原価と当月製造費用の平均単価を用いて各工程の月末仕掛品を評価することになる。その結果，後工程の月初仕掛品原価の一部が前工程の月末仕掛品原価に混入するため，原価計算の正確性という観点で問題があるのである。"],"k":["平均単価","後工程の月初仕掛品原価","前工程の月末仕掛品原価","正確性"],"kg":[{"l":"","w":["平均単価","後工程の月初仕掛品原価","前工程の月末仕掛品原価","正確性"]}],"e":["いま，第１工程と第２工程からなる工程別総合原価計算において，非累加法と平均法の組合せを採用しているものとする。この場合，第１工程費の計算においては，自工程と後工程の月初仕掛品原価を区別することなく，第１工程と第２工程の月初仕掛品中の第１工程費と当月投入の第１工程費の平均単価を使用して，各工程の月末仕掛品中の第１工程費を計算することになる。その結果，計算上，第１工程の月末仕掛品原価の中に，後工程である第２工程の月初仕掛品原価の一部が混入することになる(図表３-15)。","総合原価計算が多くの仮定のもとに成立していることは確かであり，非累加法や平均法もそれらの仮定の一つである。ただし，未だ到達していない工程の費用を負担させるような計算は，現実のモノの流れと著しく乖離しており，仮定計算といえども問題がある。以上より，非累加法による工程別総合原価計算を実施するのであれば，完成品と月末仕掛品への原価配分には先入先出法を使用すべきであり，平均法を使用するのは明らかに不適切であるといえる。"],"f":"p1_3-12.webp","p":""},{"id":"3-13","b":"p1","c":3,"n":13,"t":"累加法の問題点と改善策","i":"A","y":"A","q":["工程別総合原価計算において累加法を採用する場合の問題点を，製品原価の計算と責任会計のそれぞれの見地から説明しなさい。また，問題点の改善策を実際原価計算と累加法の枠内で提案しなさい。"],"a":["累加法では，各工程の完成品を次工程に振り替える際に，当該工程の完成品原価をもって振り替える。したがって，製品原価の計算の見地からすれば，自工程の計算に当たって前工程の計算の終了を待つ必要があるため，製品原価の計算が遅延するという問題がある。また，責任会計の見地からすれば，管理不能な前工程の能率の良否の影響が自工程に混入するため，原価業績を純粋に把握することができないという問題がある。","これらの問題点を累加法の枠内で改善するためには，工程間の振替製品を予定原価又は正常原価で評価すればよい。"],"k":["完成品原価","前工程の計算の終了","計算が遅延","管理不能前工程の能率の良否の影響","原価業績","実際原価","予定原価","正常原価"],"kg":[{"l":"","w":["完成品原価","前工程の計算の終了","計算が遅延","管理不能前工程の能率の良否の影響","原価業績","実際原価","予定原価","正常原価"]}],"e":["累加法による計算に問題が生じるのは，工程間で完成品原価の振替を行うからであるが，より突き詰めれば，それを実際原価で行うからであるといえる。実際原価を振り替えるからこそ後工程の計算が遅延し，原価業績も混濁されてしまうのである。したがって，工程間の完成品原価の振替を実際原価ではなく標準原価(予定原価又は正常原価×完成品数量)で行うことにより，実際原価計算と累加法の枠内で問題点を解決することが可能となる(図表３-16)。","この点，予定原価又は正常原価を用いたところで，完成品の実際数量を掛ける以上，前工程の能率の良否の影響が混入するのではないかという誤解がある。ここでの「能率の良否」とは「あるべき消費量や作業時間と，実際の消費量や作業時間との乖離度」と換言しうるが，それは，製品単位当たりの消費量や作業時間を固定することで排除できる。つまり，完成品数量を予定原価又は正常原価で評価することで，前工程の能率の良否の影響を振替原価から完全に排除することができるのであって，完成品の実際数量(個数)それ自体に能率の良否が影響するわけではないことに注意する。","なお，標準原価計算(工程別標準総合原価計算)のもとでは，累加法においても工程間の完成品原価の振替は必ず標準原価で行われるため，自工程の計算に当たって前工程の計算を待つ必要はないし，前工程の能率の良否の影響が自工程に混入する余地もない。すなわち，累加法による計算に問題が生じるのは，あくまでも実際原価計算を採用する場合においてであることに注意する。"],"f":"p1_3-13.webp","p":"p1_3-13_past.webp"},{"id":"3-14","b":"p1","c":3,"n":14,"t":"非累加法のメリット","i":"B","y":"A","q":["工程別総合原価計算において，非累加法を採用することによる経営管理上のメリットを２つ指摘しなさい。"],"a":["第１に，非累加法では，原価構成を工程費別に識別することから，生産上の諸条件の変化が最終完成品原価に与える影響を比較的容易に見積もることが可能であり，原価見積への有用性が高いというメリットがある。","第２に，非累加法では，各工程費を独立区分計算することから，各工程には管理可能な自工程費のみが集計される結果として，原価業績を純粋に把握することができるというメリットがある。"],"k":["原価構成","工程費別","原価見積","独立区分計算","自工程費","原価業績"],"kg":[{"l":"","w":["原価構成","工程費別","原価見積","独立区分計算","自工程費","原価業績"]}],"e":["非累加法では，累加法のように工程間の原価振替が行われないため，管理不能な前工程の能率の良否の影響が自工程に混入するといった問題は生来的に生じない。したがって，累加法との比較において，原価業績を純粋に把握できるという点がメリットとして強調される傾向にある。ただし，累加法においても工程間の原価振替に当たって予定原価又は正常原価を使用すれば問題点は解決しうるし，標準原価計算(工程別標準総合原価計算)を採用する場合には，工程間の原価振替は必ず標準原価で行われるため，前工程の能率の良否の影響が自工程に混入する余地はない。したがって，非累加法の最大のメリットは，原価見積への有用性に求められるべきである。","ここで，非累加法が原価見積に有用であるのは，最終完成品の原価構成を工程費別，原価要素別に識別しうるからである。例えば，３工程から成る工程別総合原価計算を実施していたものとして，累加法と非累加法の原価データを比較すると図表３-17のようになる。累加法によれば，最終完成品の原価構成は前工程費と最終工程費(第３工程費)という大まかなデータしか得られないが，非累加法によれば，第１工程費，第２工程費，第３工程費，さらにはそれぞれの原価要素別の内訳といった詳細なデータを入手しうる。その結果，第１工程の原料価格の高騰，第２工程の作業能率の改善といった生産上の諸条件の変化が，最終完成品原価にどれだけの影響を及ぼすのかということを，累加法と比べて容易に見積もることができるのである。","なお，非累加法による計算は理解がしづらい上に，多くの企業が採用する標準原価計算のもとでは，累加法と非累加法に勘定記入以外の差異はない。したがって，経常的な原価計算に非累加法を採用する企業は皆無に等しいといわれており，その現代的な存在意義としては，標準原価計算への移行段階や量産前の原価計画段階における原価見積用の特殊原価調査としてのそれに求められる。"],"f":"p1_3-14.webp","p":"p1_3-14_past.webp"},{"id":"3-15","b":"p1","c":3,"n":15,"t":"工程別総合原価計算の迅速化を図る方法","i":"C","y":"C","q":["工程別総合原価計算の迅速化を図る方法を，実際原価計算の枠内で我が国の「原価計算基準」に準拠して２つ列挙し，どちらの方法がより計算を迅速化しうるかを検討しなさい。"],"a":["第１の方法は，各工程の月末仕掛品を予定原価又は正常原価で評価する方法であり，第２の方法は，工程間の振替製品を予定原価又は正常原価で評価する方法である。","ここで，第１の方法では，各工程の完成品は実際原価で評価するため，実際原価の集計を待たなければ次工程の計算に移ることができないのに対し，第２の方法ではこれを待たずに次工程の計算に移ることができる。したがって，第２の方法の方が，工程別総合原価計算をより迅速化しうるといえる。"],"k":["月末仕掛品","振替製品","予定原価","正常原価","実際原価の集計","次工程の計算"],"kg":[{"l":"","w":["月末仕掛品","振替製品","予定原価","正常原価","実際原価の集計","次工程の計算"]}],"e":["実際原価計算の枠内で工程別総合原価計算の迅速化を図るためには，各工程の月末仕掛品と工程間の振替製品のいずれかを予定原価又は正常原価で評価する他ない。そこで，どちらの方法がより計算を迅速化しうるかという点が問題となるが，これについては，次工程の計算に移行しうるタイミングを比較すればよい。第１の方法では，①月末仕掛品原価の算定，②実際原価の集計，③次工程振替原価の算定という流れになるが，第２の方法では，①次工程振替原価の算定，②実際原価の集計，③月末仕掛品原価と振替差異の算定という流れになる(図表３-18)。したがって，第２の方法の方がより早く次工程の計算に移ることができるのである。","なお，本問では２つの方法の優劣を問うているが，いずれか一方を採用するのみでは，製品原価の計算の迅速化を十分に図ることはできない。月末仕掛品のみを予定原価又は正常原価で評価したところで，各工程の完成品原価の算定には実際原価の集計を待たなければならないし，工程間の振替製品のみを予定原価又は正常原価で評価したところで，実際原価計算の領域にとどまる限りは最終工程の完成品を予定原価又は正常原価で評価することはできないのであって，依然として実際原価の製品別集計を要することに変わりはないからである。","それでは，本当の意味で製品原価の計算の迅速化を図るためには，どうすればよいのか。結論としては，２つの方法を併用すればよい。各工程の月末仕掛品と完成品の双方を予定原価又は正常原価で評価するのである。この場合，実際原価の製品別集計は不要となるため，計算・記帳手続は著しく簡略化・迅速化されることになる。ただし，それはもはや実際原価計算の領域を超え，標準原価計算の採用を意味することに注意する。"],"f":"p1_3-15.webp","p":""},{"id":"3-16","b":"p1","c":3,"n":16,"t":"加工費法の適用要件","i":"B","y":"B","q":["加工費工程別総合原価計算(加工費法)を適用するための要件を２つ指摘しなさい。"],"a":["加工費工程別総合原価計算(加工費法)では，原料費について工程別計算を省略するため，その進捗度や減損費の負担関係を考慮することができない。したがって，これを適用するためには第１に，原料が全て最初の工程の始点で投入され，その後の工程では，単にこれを加工するに過ぎないこと，第２に，歩留率が高いか，減損の発生状況が毎月ほぼ一定であることが要件として求められる。"],"k":["進捗度","負担関係","最初の工程の始点","歩留率","減損の発生状況"],"kg":[{"l":"","w":["進捗度","負担関係","最初の工程の始点","歩留率","減損の発生状況"]}],"e":["加工費工程別総合原価計算(以下，加工費法)とは，全原価要素工程別総合原価計算の簡便法であり，これを正確に定義するならば，「原料費については工程別計算を省略して一括的に原価配分を行い，加工費については累加法又は非累加法で工程別計算を行う方法」ということになる(図表３-19)。","加工費法の適用は，「原価計算基準」によれば，「原料が最初の工程の始点ですべて投入され，その後の工程では，単にこれを加工するに過ぎない場合」に認められる。そのような状況においては，各工程の仕掛品について原料費の進捗度は全て１となるため，面倒な工程別計算を省略し，単一工程とみなして簡便的な計算を実施することに合理性が認められるからである。","ただし，原料が最初の工程の始点で全て投入される場合であっても，減損が大量に発生していたり，その発生状況が月々で大きく変動するような場合には，もはや加工費法の適用は認められないと解釈すべきである。原料費について工程別計算を省略するということは，原料費について減損費の負担関係を考慮できないということであり，上記のような状況においては，全原価要素工程別総合原価計算を実施した場合と，計算結果が相当程度相違すると考えられるからである。したがって，加工費法の適用に当たっては，「歩留率が高いか，減損の発生状況が毎月ほぼ一定である」ということが，実質的な要件として求められるといえる。","なお，原価管理の見地において，加工費法は，原料価格の変動が激しい業種において適合するといわれる。そのような業種においては，原料費は購買活動の良否によって左右されるため，原価管理の中心は加工費にある。そこで，原料費と加工費を明確に区別した上で，加工費のみを責任センターとしての工程別に集計し，原価管理の焦点を明確にするのが効果的と考えられるからである。"],"f":"p1_3-16.webp","p":"p1_3-16_past.webp"},{"id":"3-17","b":"p1","c":3,"n":17,"t":"個別原価計算と組別総合原価計算の比較","i":"A","y":"A","q":["個別原価計算と組別総合原価計算の類似点と相違点を説明しなさい。"],"a":["個別原価計算と組別総合原価計算は，いずれも製造原価を(組)直接費と(組)間接費とに分類し，前者は各製造指図書ないし各組製品に賦課し，後者は各製造指図書ないし各組製品に配賦するというように，原価の集計方法が類似する。","ただし，個別原価計算では製造指図書別に原価を集計するのに対し，組別総合原価計算では各組製品の期間生産量に原価を集計するのであって，両者は原価の集計単位が相違する。"],"k":["(組)直接費","(組)間接費","賦課","配賦","製造指図書","期間生産量"],"kg":[{"l":"","w":["(組)直接費","(組)間接費","賦課","配賦","製造指図書","期間生産量"]}],"e":["組別総合原価計算は，個別原価計算に最も近い総合原価計算の形態であり，製品との関連における分類(直接費と間接費)を基礎として，複数の原価計算対象に原価を集計するという点で個別原価計算に類似する。ただし，総合原価計算の一形態である以上，個別原価計算のように製造指図書自体を原価集計単位とするわけではない。標準製品を量産する場合には，同じ種類で同じ期間に生産された製品である限り，製造原価を製造指図書別に区別して把握する意義は殆どないからである。そこで，組別総合原価計算を採用する場合には，当該期間に発行された継続製造指図書に基づいて各組製品の期間生産量を把握し，これを原価集計単位として各組製品の平均原価を計算することになる。","また，個別原価計算と組別総合原価計算の相違は，製造指図書の機能という観点からも説明することができる。例えば，ある工場において，製品ＡとＢの２種類の製品を製造しており，製品Ａの製造指図書番号は200番台，製品Ｂの製造指図書番号は300番台であるものとしよう(図表３-20)。この場合，個別原価計算と組別総合原価計算のいずれにおいても，(組)直接費の識別と集計に製造指図書が利用される。すなわち，出庫票や作業時間票に製造指図書番号の記載があれば(組)直接費であり，これを拠り所として(組)直接費を集計するのである。ただし，個別原価計算においては＃201，＃202といった製造指図書別に直接費を集計するのに対し，組別総合原価計算においては製品Ａ(＃201～＃203)と製品Ｂ(＃301～＃303)という括りで製品全体に組直接費を集計する。つまり，組別総合原価計算における原価集計単位は，あくまでも各組製品の期間生産量であり，それらを構成する個々の製造指図書自体に原価集計単位としての機能はないことに注意する。","なお，個別原価計算を採用する場合には，製造指図書別に直接材料消費量や直","接作業時間を測定する必要があるが，組別総合原価計算を採用する場合には，製","品別のそれが分かれば足りる。したがって，個別原価計算と組別総合原価計算の","選択に際しては，製造指図書別の直接材料消費量や直接作業時間の測定に要する","手間とコストと，個別原価計算を実施することによって得られる追加的情報の","価値を比較し，前者が大きければ組別総合原価計算を，後者が大きければ個別原","価計算を選択すべきことになる。"],"f":"p1_3-17.webp","p":"p1_3-17_past.webp"},{"id":"3-18","b":"p1","c":3,"n":18,"t":"等級別総合原価計算の方法","i":"B","y":"A","q":["総合原価計算の形態における等級別総合原価計算の位置付けを明らかにし，その計算方法を２つに大別して説明しなさい。"],"a":["等級別総合原価計算は，単純総合原価計算と組別総合原価計算の中間に位置する総合原価計算の形態であり，その計算方法は，計算の簡便性を重視した単純総合原価計算に近い方法(第１法)と，計算の正確性を重視した組別総合原価計算に近い方法(第２法)の２つに大別される。","第１法は，完成品総合原価を結合原価とする方法であり，アウトプット(製品)の性質に基づいて設定した等価係数が使用される。他方，第２法は，当月製造費用を結合原価とする方法であり，インプット(投入要素)に関連ある数値に基づいて設定した等価係数が使用される。"],"k":["単純総合原価計算","組別総合原価計算","簡便性","正確性","完成品総合原価当月製造費用","結合原価","等価係数","アウトプット基準","インプット基準"],"kg":[{"l":"","w":["単純総合原価計算","組別総合原価計算","簡便性","正確性","完成品総合原価当月製造費用","結合原価","等価係数","アウトプット基準","インプット基準"]}],"e":["等級別総合原価計算は単純総合原価計算と組別総合原価計算の中間に位置するMことから，その計算方法もそれぞれに近い方法に大別され，「原価計算基準」では両者の選択適用を認めている。","このうち単純総合原価計算に近い方法とは，一般に完成品原価按分法と称される方法であり，重量，長さ，面積等，アウトプット(製品)の性質に基づく等価係数が使用されるという点に特徴がある。一方，組別総合原価計算に近い方法とは，一般に当月製造費用按分法と称される方法であり，標準材料消費量，標準作業時間等，インプット(投入要素)に関連ある数値に基づく等価係数が使用されるという点に特徴がある。この点，製品原価は利用資源の原価であるから，因果関係を基礎とする限り，等価係数はインプット基準で設定するのが望ましい。そこで，「原価計算基準」では，単純総合原価計算に近い方法を採用する場合でも，原価要素(群)別にインプット基準で算定した等価係数を総括して，その総括的等価係数を用いることができるとしており，これが両者の中間に位置するいわゆる総合原価按分法(プール計算法)であると解されている(図表３-21)。","なお，等価係数とは，原価のかかり具合の異なる製品の生産量を共通の原価計算単位に換算するための係数をいい，生産量に等価係数を乗じた積数の比を意味する「等価比率」と混同しないように注意する。","等価係数のアウトプット段階アウトプット段階インプット段階","適用段階(原価配分実施後)(原価配分と並行)(原価配分実施前)"],"f":"p1_3-18.webp","p":"p1_3-18_past.webp"},{"id":"3-19","b":"p1","c":3,"n":19,"t":"組別総合原価計算と等級別総合原価計算の選択","i":"A","y":"B","q":["複数種類の製品を連続生産する場合において，組別総合原価計算と等級別総合原価計算の選択が問題となる条件を指摘し，その条件下における両原価計算の選択基準について説明しなさい。"],"a":["組別総合原価計算と等級別総合原価計算の選択が問題となるのは，より正確な組別総合原価計算を適用可能な条件下においてである。すなわち，組別総合原価計算を実施するためには，製品別の直接材料費消費量や直接作業時間を測定する必要があるため，それらの測定が可能であれば，両原価計算の選択が問題となる。","両原価計算の選択に当たっては，製品別の直接材料消費量や直接作業時間の測定にかかる手間とコストと，組別総合原価計算を実施することによって得られる追加的情報の価値を比較する。その結果，前者が後者を上回るのであれば等級別総合原価計算を，逆の場合には組別総合原価計算を選択すべきである。"],"k":["製品別の直接材料消費量","製品別の直接作業時間","費用対効果"],"kg":[{"l":"","w":["製品別の直接材料消費量","製品別の直接作業時間","費用対効果"]}],"e":["等級別総合原価計算においては，直接費であっても等価係数に基づいて各等級M製品全体に配賦するのに対し，組別総合原価計算にあっては，直接費は各組製品全体に賦課する(図表３-22)。したがって，組別総合原価計算を実施するためには，製品別の直接材料消費量や直接作業時間の測定が必須となり，それらを測定可能な場合において，組別総合原価計算と等級別総合原価計算の選択が問題となる。","いずれの原価計算を選択すべきかは，費用対効果の問題である。例えば，等価係数がインプット基準で合理的に設定されており，簡便的な等級別総合原価計算によったとしてもより厳密な組別総合原価計算を実施した場合と計算結果が殆ど変わらないような場合には，わざわざ手間とコストをかけて製品別の直接材料消費量や直接作業時間を測定することに大きな意義は見出し難い。したがって，そのようなケースにおいては，等級別総合原価計算で足りるということになろう。","なお，等級別総合原価計算が適用されるような生産形態においては，一般に，手間とコストをかけさえすれば組別総合原価計算を適用しうるとされる。ただし，直接材料の投入が製品別に行われていないケースや，複数種類の製品を１個流しで生産しているケースのように，製品別の直接材料消費量や直接作業時間の測定が不可能(困難)なケースもある。したがって，そのようなケースにおいては，そもそも組別総合原価計算を適用することは不可能(困難)であり，等級別総合原価計算との選択も問題とならないことに注意する。"],"f":"p1_3-19.webp","p":"p1_3-19_past.webp"},{"id":"3-20","b":"p1","c":3,"n":20,"t":"結合生産物の原価計算方法の相違","i":"B","y":"B","q":["同一工程において，同一原料から複数種類の製品が同時必然的に産出される場合，この生産形態を結合生産という。そこで，結合生産工程から異種製品が生じるパターンを２つ指摘し，それぞれの原価計算方法の相違について「原価計算基準」に準拠して説明しなさい。"],"a":["結合生産工程から異種製品が生じるパターンの１つは，異種製品が相互に重要な売却価値を持つ場合(連産品)であり，もう１つは，異種製品の相対的な売却価値の優劣が明白な場合(主産物・副産物)である。","ここで，連産品(主産物)と副産物の区別は相対的ではあるが，連産品については連結原価を按分して各連産品の原価を直接算定するのに対し，副産物についてはその評価額を連結原価から控除して残りを主産物の原価とする。すなわち，２つのパターンの原価計算方法は，結合生産物の売却価値の重要性に応じて，直接的か間接的かという点で相違する。"],"k":["売却価値","連産品","副産物","直接的","間接的"],"kg":[{"l":"","w":["売却価値","連産品","副産物","直接的","間接的"]}],"e":["主産物としての連産品と副産物の区別は相対的な売却価値に基づくものであり，固定的でないことにまず注意すべきである。経済状況や技術の発展によって，副産物として処理していたものが主産物(連産品)となったり，主産物(連産品)として処理していたものが副産物となったりもするからである。","ここで，原価計算は合理的な経済活動のための計算システムであるから，売却価値の異なる生産物に対して適用される計算方法は自ずと異なる。売却価値が相対的に高く，主産物(連産品)と判断された場合には，当該生産物に原価を集計する必要が生じることになる。一方，売却価値が相対的に低く，副産物と判断された場合には，当該生産物に直接的に原価を集計するほどの重要性はなく，その評>価額を主産物の総合原価から控除すれば足りることになる。M","なお，副産物の評価とは，分離点における副産物原価の推定作業であり，外部に売却するのであれば見積売却価額から販売費及び一般管理費や通常の利益の見積額を控除するのに対し，連産品の正味実現可能価額(ＮＲＶ)の計算は，分離点における売上高の推定作業であり，販売費及び一般管理費や通常の利益の見積額を控除することはしないことに注意する(図表３-23)。","消費加工の上節約されるべき物品の見積購入価額－加工費見積額"],"f":"p1_3-20.webp","p":"p1_3-20_past.webp"},{"id":"3-21","b":"p1","c":3,"n":21,"t":"連産品の計算の特徴と妥当性","i":"B","y":"A","q":["連産品の計算において，各連産品の連結原価の按分に当たっては，その価格(正常市価)を等価係数として使用するのが一般的である。そこで，このような計算の特徴及び妥当性について，現行の原則的な原価計算との比較において説明しなさい。"],"a":["現行の原則的な原価計算とは，財や用役の価値が製品に移転する道筋を，因果関係を重視してできるだけ正確に描いていこうとする価値移転的原価計算である。この点，価格を等価係数とする連産品の計算は，売価の高い製品に相対的に多くの原価を負担させようとする価値回収的原価計算であるという点に特徴がある。","このような計算は，現行の原則的な原価計算の考え方に反するものであり，本来妥当ではない。しかしながら，同時必然的に産出される連産品の製造原価を正確に計算することは元来不可能であるから，財務諸表作成の便宜上，例外的に認められるのである。"],"k":["価値移転的原価計算","価値回収的原価計算","同時必然的","財務諸表作成"],"kg":[{"l":"","w":["価値移転的原価計算","価値回収的原価計算","同時必然的","財務諸表作成"]}],"e":["原価計算は，価値移転的計算として実施されるべきであるが，結合生産物としての連産品の場合には，財や用役の価値の移転過程を正確に捕捉することは元来不可能である。ただし，期末において連産品が棚卸資産として残存する場合には，売上原価及び棚卸資産価額を確定するために，何らかの基準で連結原価を按分しなければならない。そこで，例外的に，価値回収的原価計算の適用が認められるのである。","ここで，製品の価格(正常市価)を等価係数として連結原価を按分すれば，各連産品の売上総利益率は一致する傾向にある。したがって，その場合には，製品の収益性を判定するための原価情報を提供するという重要な原価計算目的の１つを達成することができない。しかしながら，因果関係に基づいて算定された製品原価でなければ，個々の製品の収益性を合理的に判定することはできないのであって，同時必然的に産出される連産品については，個々の製品ではなく全体で収益性を見るのが妥当といえる。すなわち，連産品の収益性はむしろ等しくあるべきであり，その意味においては，市価法による連結原価の按分にも合理性が認められるということになる。","なお，連結原価の按分方法には，市価法の他に物量法がある(図表３-26)。これは，各連産品の生産量を基準として連結原価を按分する方法であり，各連産品の産出比が技術的に固定しているような場合に使用される。ただし，この方法は，各連産品の単位原価が全て等しいと仮定した方法に過ぎず，価値移転的原価計算の原則に正面から反するものであり，正確な計算とは全くいえないことに注意する。","市価法(正常市価基準)の比で連結原価を按分する方法"],"f":"p1_3-21.webp","p":"p1_3-21_past.webp"},{"id":"3-22","b":"p1","c":3,"n":22,"t":"連産品の計算と等級別総合原価計算の比較","i":"A","y":"A","q":["連産品の計算と等級別総合原価計算の類似点と相違点を説明しなさい。"],"a":["連産品の計算と等級別総合原価計算は，複数種類の製品の共通原価を等価係数を使用して按分するという点において類似する。","しかしながら，連産品は，同時必然的に産出されることから，価値移転的原価計算の適用が不可能であるのに対し，等級製品は個別的に生産されることから，手間とコストをかければ，一般に組別総合原価計算を適用しうる。すなわち，連産品の計算では，原価発生原因に基づく等価係数の設定が不可能であるため，例外的に正常市価などの原価負担能力に基づく等価係数を用いざるをえないが，等級別総合原価計算の場合には，価値移転的原価計算の枠内で原価発生原因に基づく合理的な等価係数の設定が可能であるという点において相違する。"],"k":["等価係数","共通原価","同時必然的","個別的","原価負担能力","原価発生原因価値回収的原価計算","価値移転的原価計算"],"kg":[{"l":"","w":["等価係数","共通原価","同時必然的","個別的","原価負担能力","原価発生原因価値回収的原価計算","価値移転的原価計算"]}],"e":["組製品と等級製品の区別は曖昧であるが，等級製品と連産品は，個別的に生産が可能であるかという点において，明確に区別される。別言すれば，組別総合原価計算の適用可能性による区別である。等級製品については，一般に，手間とコストをかけさえすれば組別総合原価計算の適用が可能であり，等級別総合原価計算と組別総合原価計算の選択の問題が生じるのに対し，結合生産物としての連産品の場合には，そもそも投入と産出の因果関係を捕捉すること自体が不可能なのであって，組別総合原価計算を適用する余地はないのである。したがって，連産品の計算と等級別総合原価計算は，等価係数を使用するという点では類似するものの，等価係数の性質は決定的に相違する(図表３-27)。","なお，連産品の計算においては，製品の価格を等価係数として使用するのが一般的であるが，価格はアウトプット(製品)の性質の１つと見ることができる。したがって，単純総合原価計算に近いタイプの等級別総合原価計算(いわゆる完成品原価按分法)と連産品の計算は，アウトプット基準の等価係数を使用するという点において共通するといえる。"],"f":"p1_3-22.webp","p":"p1_3-22_past.webp"},{"id":"4-1","b":"p1","c":4,"n":1,"t":"見積原価計算と標準原価計算","i":"B","y":"B","q":["見積原価計算と標準原価計算の共通点と相違点を説明しなさい。"],"a":["見積原価計算と標準原価計算は，いずれも事前に予定した原価で製品の原価を計算するという点で共通する。","ただし，見積原価計算では経験や勘といった非科学的方法に基づいて原価を予定するのに対し，標準原価計算では時間研究や動作研究といった科学的方法によって原価を予定するという点で相違する。"],"k":["予定","非科学的方法","経験や勘","科学的方法","動作研究や時間研究"],"kg":[{"l":"","w":["予定","非科学的方法","経験や勘","科学的方法","動作研究や時間研究"]}],"e":["原価は，製造を行った後に算定するか，製造を行う前に予定するかにより，実際原価と予定原価に分類され，予定原価はさらに，予定の仕方が科学的であるか否かにより，標準原価と見積原価に分類される。また，これに照応して，原価計算は実際原価計算と予定原価計算に分類され，予定原価計算は見積原価計算と標準原価計算に分類される(図表４-１)。","ここで，見積原価計算と標準原価計算は，いずれも製品単位当たりの原価を原価見積ないし原価標準として予定し，これに基づいて製品の原価を見積原価ないし標準原価として計算した上で，原価計算期末に実際原価との差異を見積原価差額ないし標準原価差額として計算，把握するという点で共通する。ただし，見積原価は実際原価を勘で予定した原価(willcost)であるのに対し，標準原価は科学的方法により設定した達成すべき目標としての規範原価(shouldcost)であり，これに照応して両原価計算の目的は相違する。すなわち，見積原価計算の主目的は価格決定や期間損益計算(棚卸資産評価)の基礎資料となる原価見積の正確性を検証する点にあり，見積原価差額は期末に売上原価や製品に追加配賦される一方で，原価見積の修正資料として利用されるのに対し，標準原価計算の主目的は原価管理にあり，標準原価差額はその原因分析を通じて原価能率を増進するための基礎資料として利用され，同時に原価管理者の業績を審査する資料とされるのである。","なお，ここでの見積原価計算は丼勘定方式の商的工業会計の欠陥を克服するた","めに工夫された原価計算であり，見積原価を実際原価に一致させることを主眼と","するいわば「実際原価志向的見積原価計算」をいうが，実際原価計算から標準原","価計算に移行する前段階として採用される「標準原価志向的見積原価計算」もあ","る。両者の計算手続に大きな差異はないが，標準原価志向的見積原価計算におい","ては，見積原価差額を原価管理用の資料として利用するという点において相違す","る。以上に関連して，原価計算の歴史的発展をまとめれば，図表４-２のように","なる。"],"f":"p1_4-1.webp","p":"p1_4-1_past.webp"},{"id":"4-2","b":"p1","c":4,"n":2,"t":"標準原価計算と原価管理","i":"A","y":"B","q":["標準原価計算が原価管理に有用な情報を提供できる理由について，実際原価計算との比較において説明しなさい。"],"a":["実際原価計算では，過去の実際原価を基準値として，これを各期の実際原価と比較することによって原価管理に役立てようとする。しかし，実際原価には，原価財の価格，作業能率，操業度等の変動による偶然性が混入するため，基準値としての規範性に欠ける。したがって，そのような偶然的原価同士を比
